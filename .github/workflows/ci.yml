name: ci

on:
  push:
    branches: [main]
  pull_request:

# Deny by default at the workflow level, then grant the minimum per job. A job
# with no `permissions:` block of its own inherits this empty set and gets a
# GITHUB_TOKEN that can do nothing.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Codegen uses BSR remote plugins anonymously. There is deliberately no
  # BUF_TOKEN secret in this repo: an anonymous generate is rate-limited but
  # sufficient (one request per plugin per pass, twelve per `just gen`), and a token
  # would be a credential in CI that buys nothing.
  BUF_TOKEN: ""

# One job, run sequentially on a single runner. This repo shares a 3000
# minute/month Actions budget, so CI spins up exactly one runner per event.
# What used to be three jobs collapsed here:
#   - gen-check + build-and-test now share one checkout and one mise install
#     instead of paying for two;
#   - the 5-target ci-runner cross-compile matrix (5 more runners on every
#     push) was REMOVED: it duplicated publish.yml's `release-binaries`, which
#     already builds every target on a release tag. `just build` compiles the
#     ci-runner for the host here, so a plain build break is still caught on
#     every PR; a platform-specific build-tag mistake surfaces at release.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install: true
          cache: true

      # ---- gen-check: the committed generated code is exactly what buf
      # produces from the vendored snapshot at the pinned plugin versions.
      # Does NOT verify .proto against o11y-api (private; a cross-repo token
      # would cost more than the check is worth) — re-vendoring is a manual,
      # reviewed act and the .proto diff is visible in the PR that moves
      # PROTO_PIN.
      - name: PROTO_PIN is a well-formed commit sha
        run: |
          pin="$(grep -v '^#' PROTO_PIN | tr -d '[:space:]')"
          if [[ ! "$pin" =~ ^[0-9a-f]{8,40}$ ]]; then
            echo "PROTO_PIN does not contain a commit sha: '$pin'" >&2
            exit 1
          fi
          echo "PROTO_PIN=$pin"

      - name: The vendored snapshot compiles
        run: buf build -o /dev/null

      - name: Every import resolves locally or to a well-known type
        run: |
          bad=0
          while IFS= read -r imp; do
            case "$imp" in
              google/protobuf/*) ;;
              o11y_one/*) [[ -f "proto/$imp" ]] || { echo "MISSING: $imp" >&2; bad=1; } ;;
              *) echo "UNRESOLVED: $imp — add the module to buf.yaml deps" >&2; bad=1 ;;
            esac
          done < <(grep -rho '^import "[^"]*"' proto/o11y_one | sed 's/^import "//; s/"$//' | sort -u)
          exit "$bad"

      - name: Committed generated code matches `just gen`
        run: just gen-check

      - name: Published artifacts carry only the agentic closure
        run: just surface-check

      # ---- build + test all packages on the host toolchain.
      # --frozen-lockfile / --locked: CI never resolves. A manifest/lockfile
      # disagreement is a PR fix, not something to paper over on a runner.
      - name: Install (TypeScript)
        run: pnpm install --frozen-lockfile

      - name: Install (Python)
        run: uv sync --all-packages --locked

      # Build before lint: sdk-ts typechecks against @o11y-one/api-agentic's
      # built dist/*.d.ts, which does not exist on a fresh checkout.
      - name: Build
        run: just build

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Every artifact ships only what it should
        run: just pack-check
