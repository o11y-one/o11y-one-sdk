name: publish

# Tag-triggered. Nothing publishes from a branch, a manual dispatch, or a PR.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One tag publishes four packages at the same version: @o11y-one/api-agentic
# and @o11y-one/sdk to npm, o11y-one-api-agentic and o11y-one to PyPI, plus the
# signed ci-runner binaries. The four move together because they are generated
# from one proto snapshot; letting them drift apart would mean a matrix of
# compatible versions nobody wants to maintain. Only the agentic closure is
# vendored and generated here (see docs/proto-subsetting.md).
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  BUF_TOKEN: ""

jobs:
  # ---------------------------------------------------------------------------
  # Gate. Everything downstream `needs:` this, so a broken tag publishes nothing.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install: true
          cache: true

      - id: version
        name: Derive version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Manifest versions match the tag
        run: |
          version="${{ steps.version.outputs.version }}"
          fail=0
          check() {
            if [[ "$2" != "$version" ]]; then
              echo "$1 declares $2, tag says $version" >&2
              fail=1
            fi
          }
          check packages/gen-ts-agentic/package.json  "$(node -p 'require("./packages/gen-ts-agentic/package.json").version')"
          check packages/sdk-ts/package.json          "$(node -p 'require("./packages/sdk-ts/package.json").version')"
          check packages/gen-py-agentic/pyproject.toml "$(uv version --package o11y-one-api-agentic --short)"
          check packages/sdk-py/pyproject.toml         "$(uv version --package o11y-one --short)"
          exit "$fail"

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - name: Generated code is current
        run: just gen-check
      - name: Published artifacts carry only the agentic closure
        run: just surface-check
      - run: just build # before lint: sdk-ts typechecks against a built dist
      - run: just lint
      - run: just test
      - name: Every artifact ships only what it should
        run: just pack-check

  # ---------------------------------------------------------------------------
  # npm, via OIDC trusted publishing, STAGED.
  #
  # There is no NPM_TOKEN in this repository. The registry exchanges the job's
  # OIDC token for a short-lived credential, which means: no long-lived secret to
  # leak, no secret to rotate, and a provenance attestation (--provenance) that
  # ties the tarball to this workflow file at this commit. Consumers can verify
  # it with `npm audit signatures`.
  #
  # The job STAGES each version rather than publishing it: nothing becomes
  # installable until a maintainer runs `npm stage approve` with their 2FA.
  # That is the proof-of-presence npm wants on every publish, moved out of CI
  # to the one place a human is anyway, and it is the only action a trusted
  # publisher connection allows by default. Approve the dependency first:
  # `@o11y-one/api-agentic`, then `@o11y-one/sdk` (docs/publishing-setup.md).
  #
  # Prerequisite, done once in the npm UI for @o11y-one/api-agentic and
  # @o11y-one/sdk: configure trusted publishing for o11y-one/o11y-one-sdk with
  # workflow `publish.yml` and environment `release`.
  # ---------------------------------------------------------------------------
  # One job per package, in dependency order, so a rerun of the failed jobs
  # never re-stages a version that already went through (npm refuses a
  # version that is already staged).
  stage-npm-api-agentic:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # protected: requires a reviewer, restricted to tags
    permissions:
      contents: read
      id-token: write # ONLY here and in the other publish jobs. Never in ci.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A rerun, or a tag moved onto a fixed workflow, must not touch a version
      # that already went out. `npm view` sees published versions only; a
      # version that is merely staged still conflicts, and the fix there is
      # `npm stage reject` before the rerun.
      - name: Already on npm?
        id: done
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@o11y-one/api-agentic@$VERSION" version >/dev/null 2>&1; then
            echo "@o11y-one/api-agentic@$VERSION is already published; nothing to stage"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.done.outputs.done != 'true'
        with:
          version: 2026.9.1
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile
        if: steps.done.outputs.done != 'true'
      - run: just build-ts
        if: steps.done.outputs.done != 'true'

      # pnpm packs (it rewrites the workspace dependency to the real version;
      # npm would ship `workspace:*` verbatim), npm stages: pnpm has no staging
      # command, and the npm bundled with the pinned Node does the OIDC
      # exchange and the provenance attestation itself.
      - name: Pack
        if: steps.done.outputs.done != 'true'
        working-directory: packages/gen-ts-agentic
        run: pnpm pack --pack-destination "$RUNNER_TEMP/npm"

      - name: Stage @o11y-one/api-agentic
        if: steps.done.outputs.done != 'true'
        run: npm stage publish "$RUNNER_TEMP"/npm/o11y-one-api-agentic-*.tgz --provenance --access public

  stage-npm-sdk:
    needs: [verify, stage-npm-api-agentic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # protected: requires a reviewer, restricted to tags
    permissions:
      contents: read
      id-token: write # ONLY here and in the other publish jobs. Never in ci.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Already on npm?
        id: done
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@o11y-one/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@o11y-one/sdk@$VERSION is already published; nothing to stage"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.done.outputs.done != 'true'
        with:
          version: 2026.9.1
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile
        if: steps.done.outputs.done != 'true'
      - run: just build-ts
        if: steps.done.outputs.done != 'true'

      # pnpm packs (it rewrites the workspace dependency to the real version;
      # npm would ship `workspace:*` verbatim), npm stages: pnpm has no staging
      # command, and the npm bundled with the pinned Node does the OIDC
      # exchange and the provenance attestation itself.
      - name: Pack
        if: steps.done.outputs.done != 'true'
        working-directory: packages/sdk-ts
        run: pnpm pack --pack-destination "$RUNNER_TEMP/npm"

      - name: Stage @o11y-one/sdk
        if: steps.done.outputs.done != 'true'
        run: npm stage publish "$RUNNER_TEMP"/npm/o11y-one-sdk-*.tgz --provenance --access public

      - name: What happens next
        if: steps.done.outputs.done != 'true'
        run: |
          echo "Both versions are STAGED, not published. A maintainer approves them in order:"
          echo "  npm stage list @o11y-one/api-agentic && npm stage approve <stage-id>"
          echo "  npm stage list @o11y-one/sdk         && npm stage approve <stage-id>"

  # ---------------------------------------------------------------------------
  # PyPI, via Trusted Publishers. Same story: no PYPI_TOKEN in this repository.
  #
  # Prerequisite, done once per project in the PyPI UI: add a trusted publisher
  # for owner o11y-one, repository o11y-one-sdk, workflow publish.yml,
  # environment release.
  # ---------------------------------------------------------------------------
  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same idea for PyPI: skip only when BOTH projects already carry the
      # version; a half-published state is left to fail loudly.
      - name: Already on PyPI?
        id: done
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ok=0
          for project in o11y-one o11y-one-api-agentic; do
            curl -fsS -o /dev/null "https://pypi.org/pypi/$project/$VERSION/json" && ok=$((ok + 1)) || true
          done
          if [[ "$ok" -eq 2 ]]; then
            echo "o11y-one and o11y-one-api-agentic $VERSION are already on PyPI; nothing to upload"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.done.outputs.done != 'true'
        with:
          version: 2026.9.1
          install: true
          cache: true

      - run: uv sync --all-packages --locked
        if: steps.done.outputs.done != 'true'
      - run: just build-py
        if: steps.done.outputs.done != 'true'

      - name: Publish to PyPI
        if: steps.done.outputs.done != 'true'
        run: uv publish --trusted-publishing always dist/*

  # ---------------------------------------------------------------------------
  # ci-runner binaries: cross-compiled, checksummed, and signed keylessly with
  # cosign.
  #
  # Keyless matters here. The binary is meant to be curl'd into other people's
  # pipelines, so the interesting question is not "did someone with a key sign
  # this" but "was this built by this workflow, from this repo, at this tag".
  # A cosign keyless signature answers exactly that and there is no signing key
  # to store, rotate, or lose.
  #
  # Verify:
  #   cosign verify-blob o11y-eval-linux-amd64 \
  #     --bundle o11y-eval-linux-amd64.cosign.bundle \
  #     --certificate-identity-regexp '^https://github.com/o11y-one/o11y-one-sdk/\.github/workflows/publish\.yml@' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  # ---------------------------------------------------------------------------
  release-binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # to create the GitHub release and upload assets
      id-token: write # for cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release that exists is never rebuilt: its checksums and signatures
      # are what consumers already verified against.
      - name: Already released?
        id: done
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it untouched"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.done.outputs.done != 'true'
        with:
          version: 2026.9.1
          install: true
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.done.outputs.done != 'true'

      - name: Cross-compile
        if: steps.done.outputs.done != 'true'
        working-directory: tools/ci-runner
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist-bin
          # -trimpath and a fixed ldflags string keep the build reproducible:
          # no absolute paths from the runner leak into the binary.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="../../dist-bin/o11y-eval-${goos}-${goarch}"
            [[ "$goos" == windows ]] && out="${out}.exe"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
            echo "built $out"
          done

      - name: Checksums
        if: steps.done.outputs.done != 'true'
        working-directory: dist-bin
        run: sha256sum o11y-eval-* > SHA256SUMS

      - name: Sign each binary and the checksum file
        if: steps.done.outputs.done != 'true'
        working-directory: dist-bin
        run: |
          set -euo pipefail
          for f in o11y-eval-* SHA256SUMS; do
            cosign sign-blob --yes "$f" --bundle "${f}.cosign.bundle"
          done

      # gh is preinstalled on GitHub-hosted runners. Using it instead of a
      # third-party release action removes one more supply-chain dependency
      # from the job that has `contents: write`.
      - name: Create the release
        if: steps.done.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist-bin/*
