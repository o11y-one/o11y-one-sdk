[project]
name = "o11y-one"
version = "0.2.0"
description = "Hand-written Python client for the O11y One API: transport construction, credential injection, and the O11y One error taxonomy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "O11y One" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

dependencies = [
  "o11y-one-api-agentic",
  "connect-python>=0.9.0,<1",
  "httpx>=0.28",
]

[project.optional-dependencies]
# OpenEnv v0.8.0 (625f5e72), exactly: LoopEnvClient overrides its client's
# WebSocket connect, and Loop's /loop/v1/openenv/ws matches that release's wire.
openenv = ["openenv==0.8.0"]
# TRL 1.15 (v1.15.0, dae7b6a): o11y_one.sdk.loop.trl is GRPOTrainer's environment_factory,
# which needs transformers 5.2 or later. torch is TRL's own dependency, named here only so
# the lock takes it from PyTorch's CPU index on Linux (tool.uv.sources), as CI runs it.
trl = ["trl>=1.15,<1.16", "transformers>=5.2", "torch"]

[project.urls]
Homepage = "https://o11y.one"
Source = "https://github.com/o11y-one/o11y-one-sdk"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# o11y_one is a PEP 420 namespace shared with o11y-one-api-agentic; this
# distribution owns exactly o11y_one/sdk. No src/o11y_one/__init__.py, ever —
# adding one would shadow the generated o11y_one.agentic, o11y_one.common
# packages.
packages = ["src/o11y_one"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.uv.sources]
# Inside the workspace, resolve the generated package from the sibling member
# rather than PyPI, so the SDK always builds against the generated code from
# THIS commit. Published wheels carry the plain `o11y-one-api-agentic`
# requirement. The agentic SDK depends on the per-domain subset distribution
# (agentic + common only), not the whole o11y-one-api — see
# docs/proto-subsetting.md.
o11y-one-api-agentic = { workspace = true }
# The adapters CI runs on CPU: Linux takes PyTorch's CPU wheels, never its CUDA ones. A
# user's own install resolves torch as it always would; sources never reach the wheel.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
