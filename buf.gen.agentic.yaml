version: v2

# Per-domain SUBSET generation for the agentic SDK.
#
# The whole tree is generated by buf.gen.yaml (all 11 domains → gen-ts, gen-py,
# gen/go) for consumers like o11y-web that may need any domain. This template is
# the second pass: it regenerates ONLY the agentic import closure into the
# scoped packages @o11y-one/api-agentic and o11y-one-api-agentic, which the
# agentic SDKs depend on so their published footprint carries agentic + common
# and nothing else.
#
# It is invoked by tools/generate.sh with an explicit --path allowlist:
#
#     buf generate --template buf.gen.agentic.yaml \
#       --path proto/o11y_one/agentic --path proto/o11y_one/common
#
# The --path list IS the closure, computed by chasing `import` lines from the
# agentic protos (see docs/proto-subsetting.md). agentic/v1 imports only
# itself, o11y_one/common/v1/common.proto, and google well-known types;
# common.proto imports nothing. If the agentic protos ever grow an import into a
# new domain, the import audit in sync-proto.sh still passes (the domain is in
# the whole tree), but this subset would generate code referencing an ungenerated
# module — so a new domain in the closure must be added to the --path list in
# generate.sh in the same change.
#
# No Go plugin here on purpose: Go compiles only what is imported, so the
# ci-runner binary already links agentic + common alone from the single gen/go
# module (verified in docs/proto-subsetting.md). There is nothing to subset.
#
# Plugin versions MUST stay in lockstep with buf.gen.yaml — the subset is meant
# to be byte-identical to the corresponding files in the whole tree. Bump both
# together.

clean: false

managed:
  enabled: true
  override:
    # Kept identical to buf.gen.yaml for parity. It only affects the Go plugin,
    # which is absent here, so it is a no-op for es/python — present so the two
    # templates read the same.
    - file_option: go_package_prefix
      value: github.com/o11y-one/o11y-one-sdk/gen/go

plugins:
  # --- TypeScript ---------------------------------------------------------
  - remote: buf.build/bufbuild/es:v2.14.0
    out: packages/gen-ts-agentic/src
    opt:
      - target=ts
      - import_extension=js

  # --- Python -------------------------------------------------------------
  - remote: buf.build/protocolbuffers/python:v36.1
    out: packages/gen-py-agentic/src
  - remote: buf.build/protocolbuffers/pyi:v36.1
    out: packages/gen-py-agentic/src
  - remote: buf.build/connectrpc/python:v0.9.0
    out: packages/gen-py-agentic/src
