version: v2

# The only generation template. The vendored snapshot is the agentic import
# closure (agentic + common) and nothing else, and this generates it into
# @o11y-one/api-agentic, o11y-one-api-agentic and the public Go module gen/go.
# `just surface-check` fails if the snapshot or an artifact ever carries more.
#
# It is invoked by tools/generate.sh with an explicit --path allowlist
# (AGENTIC_CLOSURE_PATHS, see docs/proto-subsetting.md). agentic/v1 imports only
# itself, o11y_one/common/v1/common.proto, and google well-known types;
# common.proto imports nothing. If the agentic protos ever grow an import into a
# new domain, sync-proto.sh's import audit fails because the domain is not
# vendored; add it to AGENTIC_CLOSURE_PATHS in generate.sh, in the same change,
# after deciding it really belongs in the published surface.

clean: false

managed:
  enabled: true
  override:
    # The public Go module.
    - file_option: go_package_prefix
      value: github.com/o11y-one/o11y-one-sdk/gen/go

plugins:
  # --- TypeScript ---------------------------------------------------------
  - remote: buf.build/bufbuild/es:v2.14.0
    out: packages/gen-ts-agentic/src
    opt:
      - target=ts
      - import_extension=js

  # --- Go -----------------------------------------------------------------
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt:
      - paths=source_relative

  # --- Python -------------------------------------------------------------
  - remote: buf.build/protocolbuffers/python:v36.1
    out: packages/gen-py-agentic/src
  - remote: buf.build/protocolbuffers/pyi:v36.1
    out: packages/gen-py-agentic/src
  - remote: buf.build/connectrpc/python:v0.9.0
    out: packages/gen-py-agentic/src
