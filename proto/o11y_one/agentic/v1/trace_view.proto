syntax = "proto3";

// Agentic Reliability V2 trace-viewer read models — wave 32 (lane D).
//
// Same package as agentic.proto, evaluation.proto and artifact.proto by design
// (lock ruling L1-4): prost emits one Rust module per package, so
// `proto::agentic::*` stays one flat namespace and `proto/src/lib.rs` needs no
// change. A separate FILE keeps `buf breaking` (FILE mode, `proto/buf.yaml`)
// from letting this surface destabilise either neighbour's breaking surface —
// which matters more than usual here, because a second lane is appending to
// evaluation.proto in the same tree.
//
// WHY THIS FILE RATHER THAN agentic.proto
//
//   The trace viewer must speak two things it does not own: typed absence
//   (`MetricAvailabilityV1`) and the verbatim provider-usage record
//   (`ProviderUsageRecordV1`). Both are defined in evaluation.proto, and
//   evaluation.proto already imports agentic.proto — so defining these messages
//   in agentic.proto would need the reverse import and a package cycle. This
//   file imports evaluation.proto, exactly as artifact.proto does, and reuses
//   those value objects rather than twinning them (rule R5).
//
// WHY THIS SERVICE RATHER THAN AgenticEvaluationService
//
//   There is no span table in Postgres. Span rows live in `otel_traces` Parquet
//   segments plus a realtime tier, reachable only through
//   `UnifiedTelemetryQueryEngine` — which `AgenticEvaluationGrpcService` does
//   not hold. A read model over spans is a query-engine read model or it is
//   nothing, so the service that serves it is the one that holds the engine.
//
// THE CONTRACT THIS FILE IMPLEMENTS
//
//   Design handoff `backend-handoff-post-design-run.pdf` p.3, "Trace viewer
//   (12 · P4B — THE LARGEST CONTRACT)", five levels: (1) a step-level summary,
//   (2) operation groups per step, (3) raw spans paged on demand, (4) per-span
//   verbatim usage reusing the eval side's contract, (5) a SERVER-computed
//   critical path and needs-attention set so "Highlight errors" is a filter
//   rather than a client scan. All five land here, folded into two RPCs so that
//   one screen costs two bounded span scans rather than five.
package o11y_one.agentic.v1;

import "google/protobuf/timestamp.proto";
import "o11y_one/agentic/v1/evaluation.proto";
// Wave 41 lane A. The agent-run identity plane lives in its own file for the
// same reason this one does: a CONVERSATION contract and a TRACE contract move
// on different schedules, and `buf breaking` runs in FILE mode.
import "o11y_one/agentic/v1/agent_run.proto";
// Wave 41 lane C: `ArtifactLinkV1`, the four artifact enums, the resolver
// posture, `EvidenceAnchorV1`, and the `LinkExternalArtifact` pair that
// `artifact.proto` minted and left for the increment that wires the surface.
import "o11y_one/agentic/v1/artifact.proto";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

// The design's five kinds, plus OTHER.
//
// OTHER is not a parse failure and not a sentinel: it means this build
// classified the span and it is none of the five. A closed enum of exactly the
// five would force every queue, worker and internal span into a category it
// does not belong to, which is the conflation this track exists to prevent.
//
// Precedence is FIRST MATCH WINS in the order TOOL, RETRIEVAL, LLM, DB, HTTP,
// OTHER, and it is stated because a span can satisfy two rules at once: an
// LLM-categorised span that names a tool is a TOOL call, because grouping it
// under LLM would hide the tool's own collapse count and p95 — the exact fact
// level 2 exists to show.
enum TraceOperationKindV1 {
  TRACE_OPERATION_KIND_V1_UNSPECIFIED = 0;
  TRACE_OPERATION_KIND_V1_LLM = 1;
  TRACE_OPERATION_KIND_V1_TOOL = 2;
  TRACE_OPERATION_KIND_V1_DB = 3;
  TRACE_OPERATION_KIND_V1_HTTP = 4;
  TRACE_OPERATION_KIND_V1_RETRIEVAL = 5;
  TRACE_OPERATION_KIND_V1_OTHER = 6;
}

// The span's own status. UNSET is OpenTelemetry's default and is a different
// fact from OK: a span nobody set a status on has not been reported successful.
enum TraceSpanStatusV1 {
  TRACE_SPAN_STATUS_V1_UNSPECIFIED = 0;
  TRACE_SPAN_STATUS_V1_UNSET = 1;
  TRACE_SPAN_STATUS_V1_OK = 2;
  TRACE_SPAN_STATUS_V1_ERROR = 3;
}

// Why a span is in the needs-attention set. The design names exactly these
// three — "errors, warns, slow outliers".
enum TraceAttentionKindV1 {
  TRACE_ATTENTION_KIND_V1_UNSPECIFIED = 0;
  TRACE_ATTENTION_KIND_V1_ERROR = 1;
  // A span that recorded an exception event and did NOT fail. This is exactly
  // the thing a person wants to see and no error filter shows.
  TRACE_ATTENTION_KIND_V1_WARN = 2;
  TRACE_ATTENTION_KIND_V1_SLOW_OUTLIER = 3;
}

// How a span failed, in the lake's own vocabulary (wave 35, lane B).
//
// These are not new names. They are `transformation`'s `ErrorCategory` — the
// thirteen arms of `transformation/src/classifier/error.rs`, written into the
// `error_category` column at ingest by the classifier every span already goes
// through. Restating them here as an enum rather than passing the column's
// string through is what lets a client switch on a fault kind instead of
// matching prose, and the ordering below is that file's own.
//
// The column is NULL for a span that did not fail, so a value here is always a
// statement about a failure — with one exception, which is
// `UNCLASSIFIED`: a span that failed and whose category the classifier could
// not write. That is a different fact from `UNKNOWN`, which is the classifier
// saying "I looked and none of the twelve fit", and collapsing the two would
// hide how much of a trace's failure the classifier is actually reading.
enum TraceFaultCategoryV1 {
  TRACE_FAULT_CATEGORY_V1_UNSPECIFIED = 0;
  TRACE_FAULT_CATEGORY_V1_TIMEOUT = 1;
  TRACE_FAULT_CATEGORY_V1_AUTH = 2;
  TRACE_FAULT_CATEGORY_V1_RATE_LIMIT = 3;
  TRACE_FAULT_CATEGORY_V1_NOT_FOUND = 4;
  TRACE_FAULT_CATEGORY_V1_BAD_REQUEST = 5;
  TRACE_FAULT_CATEGORY_V1_CONFLICT = 6;
  TRACE_FAULT_CATEGORY_V1_UNAVAILABLE = 7;
  TRACE_FAULT_CATEGORY_V1_DATA_LOSS = 8;
  TRACE_FAULT_CATEGORY_V1_SERVER_ERROR = 9;
  TRACE_FAULT_CATEGORY_V1_NETWORK = 10;
  TRACE_FAULT_CATEGORY_V1_CLIENT_ERROR = 11;
  TRACE_FAULT_CATEGORY_V1_APPLICATION = 12;
  TRACE_FAULT_CATEGORY_V1_UNKNOWN = 13;
  // The span failed and carried no category. Never merged into UNKNOWN.
  TRACE_FAULT_CATEGORY_V1_UNCLASSIFIED = 14;
}

// Where a span's money came from. Two provenances, and neither is a bill.
//
// The operator's ruling of 2026-08-28: *"If client instrumented cost, use that,
// else, use the stock provider rate"*. Both halves are on the wire as their own
// value, because a number a customer's own code stated and a number this build
// computed off a published list price are different evidence, and a client that
// cannot tell them apart cannot say which one it is rendering.
enum TraceSpanCostProvenanceV1 {
  TRACE_SPAN_COST_PROVENANCE_V1_UNSPECIFIED = 0;
  // The span's own `gen_ai.usage.cost` attribute, surfaced VERBATIM. Never
  // recomputed, never reconciled against the tokens beside it: a client that
  // instrumented its own cost has stated a fact, and a server that "corrects"
  // it has replaced evidence with arithmetic.
  TRACE_SPAN_COST_PROVENANCE_V1_CLIENT_STATED = 1;
  // The span's observed tokens priced at the rate registry's CURRENT list row
  // for the model the span itself named. An estimate, explicitly — the client
  // renders it as "estimated from the provider's pricing list, as of <date>",
  // where the date is `TraceSpanRateBasisV1.rate_checked_at`. It is not a bill,
  // it is not what the provider charged, and it enters no ledger.
  TRACE_SPAN_COST_PROVENANCE_V1_LIST_RATE_ESTIMATE = 2;
}

// What a trace read can refuse with, and why each one is its own kind. A caller
// told only "invalid argument" cannot act; each of these names a different next
// step, and none of them is "we returned a partial answer".
enum TraceReadRefusalKindV1 {
  TRACE_READ_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  // The window held no spans for this trace id. Distinct from the cap breach
  // below: "we looked and found none" is not "we looked and found too many".
  TRACE_READ_REFUSAL_KIND_V1_TRACE_NOT_FOUND = 1;
  // More spans than `TraceSpanPopulationBoundaryV1.max_spans`. Refused WHOLE:
  // a critical path computed over the first 10,000 spans of a 40,000-span
  // trace is not a partial critical path, it is a WRONG one, and a client
  // cannot tell.
  TRACE_READ_REFUSAL_KIND_V1_SPAN_POPULATION_EXCEEDS_CAP = 2;
  // Spans were found, but every one of them has a parent inside the population
  // — the trace's root started before the requested window.
  TRACE_READ_REFUSAL_KIND_V1_TRACE_ROOT_NOT_IN_POPULATION = 3;
  // The requested window ends before the oldest instant the span plane will
  // answer for. Distinct from `TRACE_NOT_FOUND` on purpose, and the distinction
  // is the whole typed-absence invariant: "we looked and found none" and "we do
  // not look that far back" are different facts, and only one of them is about
  // the caller's trace.
  TRACE_READ_REFUSAL_KIND_V1_WINDOW_OUTSIDE_RETAINED_LOOKBACK = 4;
}

// ---------------------------------------------------------------------------
// Value objects
// ---------------------------------------------------------------------------

// The population this surface reads, declared rather than described.
//
// `DECISION:960` gave the Operations tab a frozen list of dimensions it refuses
// to break down by, and `EVALUATION_OPERATION_DIMENSION_V1_TELEMETRY_SPAN` is
// the seventh. That is not a row predicate — the Operations tab does not filter
// telemetry spans out of a costing query, it declines to offer a telemetry-span
// breakdown at all. This surface answers exactly that refused dimension, and it
// carries the SAME enum value rather than a second spelling of the word, so
// that the two surfaces cannot drift into disagreeing about their shared edge.
message TraceSpanPopulationBoundaryV1 {
  EvaluationOperationDimensionV1 dimension = 1;
  // `trace_scoped_telemetry_spans_only`. A constant rather than a literal at
  // the construction site, so a second scope cannot appear by typo.
  string scope_code = 2;
  // The hard cap. Published so a client can plan against it rather than
  // discover it by being refused.
  uint32 max_spans = 3;
}

// The window actually read, and whether it is the window that was asked for.
//
// The §4 invariant is "clamped windows say so in-band". `ListSessions` clamps
// to 720h silently and the only record of it is a fixture case name; this
// surface publishes the clamp, because a client rendering "no spans" must be
// able to tell "your window was narrowed" from "there is nothing there".
message TraceWindowV1 {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  bool clamped = 3;
  // Set only when `clamped` is true.
  optional string clamp_reason_code = 4;
}

message TraceReadRefusalV1 {
  TraceReadRefusalKindV1 kind = 1;
  // A typed slug rather than prose, because a client renders or groups by it.
  string reason_code = 2;
  string detail = 3;
  RecoveryActionV1 recovery_action = 4;
  // On a cap breach this is honestly `cap + 1` and means "at least this many":
  // the scan deliberately stopped counting, and a fabricated exact total would
  // be a number nobody measured.
  uint32 observed_span_count = 5;
  uint32 cap = 6;
}

// How many spans failed with one category.
message TraceFaultCategoryCountV1 {
  TraceFaultCategoryV1 category = 1;
  uint32 span_count = 2;
}

// How many spans reported one status. Over the WHOLE member set, not only the
// failures — a step whose spans are 40 OK and 2 UNSET is telling a reader
// something an error count cannot.
message TraceFaultStatusCountV1 {
  TraceSpanStatusV1 status = 1;
  uint32 span_count = 2;
}

// The composition of a failure count (wave 35, lane B).
//
// Rides both `TraceStepSummaryV1` and `TraceOperationGroupV1`: a fault
// breakdown per turn and per operation group is the same arithmetic over a
// different member set, and two messages would be two places for that rule to
// drift.
//
// It deliberately does NOT restate `failure_count` — that number is already on
// both parents, and a breakdown carrying its own copy is one edit away from
// disagreeing with the count printed beside it. Everything here is the
// composition OF that count, plus the two exception facts a boolean per span
// could not aggregate.
//
// There is no `timeout_count` field either. A timeout is
// `category_counts[TIMEOUT]`, and minting a second spelling of one fact on one
// message is how two renderings of one screen come to disagree.
message TraceFaultBreakdownV1 {
  // Spans that recorded at least one exception event, failing or not.
  uint32 exception_event_span_count = 1;
  // The SUM of the spans' `exception_count` columns — how many exceptions were
  // recorded, not how many spans recorded one. A span that threw four times is
  // four here and one above.
  uint32 exception_event_count = 2;
  // NOT_OBSERVED with `span_plane_states_no_exception_count` when NO member
  // carried the column at all. Distinct from every member carrying zero, which
  // is an honest zero and reports AVAILABLE.
  MetricAvailabilityV1 exception_event_count_availability = 3;
  // Spans that recorded an exception and did NOT fail — the WARN attention
  // kind, counted here so the step strip and the needs-attention set agree by
  // construction rather than by coincidence.
  uint32 warned_span_count = 4;
  // Over the FAILING members only, descending by count then by enum value.
  // Sums to the `failure_count` on the parent message; a failing span whose
  // category column is null counts as `UNCLASSIFIED`.
  repeated TraceFaultCategoryCountV1 category_counts = 5;
  // Over ALL members, ascending by enum value. Sums to the member count.
  repeated TraceFaultStatusCountV1 status_counts = 6;
  // Failing members over all members, in basis points.
  //
  // Read this convention carefully, because it is NOT the one
  // `wall_time_share_basis_points` uses. That share deliberately does not
  // normalise to 10000, so that concurrency stays visible. This one is a true
  // fraction of its own population and is always in [0, 10000].
  optional uint32 fault_share_basis_points = 7;
  // NOT_OBSERVED with `population_carries_no_spans` when the member set is
  // empty. An empty population has no fault share; it does not have a zero one.
  MetricAvailabilityV1 fault_share_availability = 8;
}

// The first thing that went wrong in a turn.
//
// The failing member with the earliest start, span id ascending as the
// tiebreak — the same order this whole surface pages by, so "first" means the
// same thing here as it does everywhere else.
message TraceFirstFailureV1 {
  string span_id = 1;
  string span_name = 2;
  TraceFaultCategoryV1 category = 3;
  google.protobuf.Timestamp started_at = 4;
  int64 duration_micros = 5;
  optional string error_type = 6;
  optional string error_message = 7;
}

// The list row an estimate was priced from, and the date it was read.
//
// This message exists so the client's tooltip can say a true sentence:
// *"estimated from the provider's pricing list, as of <rate_checked_at>"*. A
// cost with no rate identity beside it is a number nobody can check.
//
// What it deliberately does NOT carry is a provider. `ProviderUsageRecordV1` on
// the span beside it sets `provider = UNSPECIFIED` on purpose (NN5): a span
// names its provider, when it names one at all, in free text, and mapping that
// onto this build's closed enum would put a provider-attributed fact on the
// wire the provider never stated. The estimate does not need one — the SPAN
// states its own model id, and that string is matched to a registry row by
// EXACT model id. The rate identity is a row, not an attribution.
message TraceSpanRateBasisV1 {
  // The model id the span itself stated (response model first — the model that
  // served is the model billed), matched to a registry row by exact equality.
  string model_id = 1;
  // The registry's version and table-wide review date.
  string registry_version = 2;
  string registry_effective_date = 3;
  // THIS ROW's own as-of date — when these numbers were last read off the
  // provider's page. Per-row rather than table-wide, which is the whole point
  // of increment E1-5: a table-wide date claims every row was reviewed on one
  // day. THIS is the date the tooltip renders.
  string rate_checked_at = 4;
  // The age at which the registry calls itself stale, in days.
  //
  // The THRESHOLD and no verdict, and that is the same ruling `capability.rs`
  // made for the rate-freshness posture (increment E1-6, narrowed by wave 25):
  // a staleness state is `observed_at - effective_date`, which changes every
  // midnight, and this message rides responses the fixture corpus asserts byte
  // for byte. A verdict here would turn the corpus red on one future calendar
  // day with no code change. So this publishes the compiled-in facts — which
  // table, which row, when a human last re-read it, and the rule's threshold —
  // and lets the client, which has its own clock, apply the rule. The eval
  // side's frozen verdict still lives where a verdict belongs: on
  // `EvaluationPricingSourceV1`, computed at the single instant a pricing pass
  // reads, and sealed into an immutable manifest.
  uint32 staleness_threshold_days = 5;
  // The two dimensions this estimate actually priced. Absent means the row
  // publishes no price for that dimension, never a zero price.
  optional int64 input_micros_per_million_tokens = 6;
  optional int64 output_micros_per_million_tokens = 7;
  // The same accounting block the span's usage record carries, and it says the
  // same thing: `provider_accounting_unknown`. It is the field that explains
  // the dimension notes below — with no provider named, this build cannot know
  // whether the span's input tokens already contain its cache tokens, and the
  // two providers it ships answer that question OPPOSITELY.
  EvaluationTokenAccountingV1 token_accounting = 8;
  // One note per dimension this estimate declined to price, with the reason.
  // An estimate that names what it left out is arguable; one that silently
  // double-counts a cache is not. Reuses the eval side's note type rather than
  // twinning it.
  repeated EvaluationRateDimensionNoteV1 dimension_notes = 9;
}

// Level 4b. One span's cost, with its provenance stated (wave 35, lane B).
//
// HARD BOUNDARY, stated on the wire because it is the property that makes this
// message safe to ship: this number is DISPLAY PLANE ONLY. It enters no
// economics ledger, no projection, no invoice surface and no run manifest; it
// is never summed with evaluation economics; and it is never what the provider
// billed. The eval side's costs are frozen into immutable manifests and
// reserved against budgets. This one is read off a telemetry span at render
// time and is gone when the window closes.
message TraceSpanCostV1 {
  TraceSpanCostProvenanceV1 provenance = 1;
  // Integer micros, in the currency named beside it. Absent whenever the
  // availability is not AVAILABLE — a cost this build could not determine is
  // absent, never zero.
  optional CostAmountV1 amount = 2;
  // The span's own spelling of its cost attribute, byte for byte, whenever the
  // span carried one — INCLUDING when it did not parse as a number. The
  // verbatim string is evidence; the micros beside it are a scale of that
  // evidence, and if the two ever disagree the string is the one that is true.
  optional string client_stated_amount_verbatim = 3;
  // Set only for LIST_RATE_ESTIMATE.
  optional TraceSpanRateBasisV1 rate_basis = 4;
  // Why there is no amount, when there is none. One of:
  // `span_states_no_cost_and_no_token_usage`,
  // `span_states_no_input_output_token_split`, `span_states_no_model_id`,
  // `no_list_rate_for_span_model`, `span_cost_attribute_is_not_a_number`,
  // `residual_attributes_not_presented_by_plane`.
  MetricAvailabilityV1 availability = 5;
  // Whether the currency of this amount is a stated fact.
  //
  // `gen_ai.usage.cost` is a bare number: OTel gives it no currency companion
  // and this build recognises none. So a CLIENT_STATED amount reports
  // NOT_OBSERVED with `span_states_cost_without_currency` and an empty
  // `currency_code`, rather than being stamped "USD" by a server that was never
  // told. A LIST_RATE_ESTIMATE reports AVAILABLE: the registry denominates its
  // own rows.
  MetricAvailabilityV1 currency_availability = 6;
}

// A group's cost, and what it is made of.
//
// Rides `TraceOperationGroupV1` and nothing else. A group is the same operation
// against the same target ×N, which is the one place a sum answers a question a
// person actually asks. There is deliberately NO step-level and NO trace-level
// total: a trace-wide money total is a bill-shaped object, and a bill-shaped
// object on a telemetry read model is how a display-plane estimate ends up
// quoted at somebody. A client that wants one can add these up in front of a
// person who can see what they are adding.
message TraceSpanCostRollupV1 {
  // Present only when at least one member carries an amount. Never a zero
  // standing in for "nothing here was costed".
  optional CostAmountV1 total = 1;
  // NOT_OBSERVED with `no_span_in_group_carries_cost` when no member had one.
  // AVAILABLE with reason `rollup_mixes_unstated_currency` when the total
  // includes a client-stated member whose currency the span never stated — in
  // which case `total.currency_code` is empty, because the sum is denominated
  // in at least one currency nobody named.
  MetricAvailabilityV1 availability = 2;
  uint32 client_stated_span_count = 3;
  uint32 list_rate_estimate_span_count = 4;
  uint32 uncosted_span_count = 5;
  // True when the total adds a stated number to an estimated one. Such a total
  // is a different kind of number from either of its parts and must not render
  // as though it were one of them.
  bool mixes_stated_and_estimated = 6;
}

// One member of a group that is slower than its group's p95.
message TraceSpanOutlierV1 {
  string span_id = 1;
  string span_name = 2;
  int64 duration_micros = 3;
}

// Level 2. Operations of one kind against one target, collapsed.
message TraceOperationGroupV1 {
  TraceOperationKindV1 kind = 1;
  // The most specific identifier the span carries for its kind: the tool name
  // or MCP method for TOOL, the response then request model for LLM,
  // `db.system.name` for DB, `http.route` then `url.path` for HTTP, the service
  // name then the span name otherwise. Never empty — an empty group key would
  // collapse unlike operations into one row.
  string target = 2;
  // The design's "×N collapse count".
  uint32 collapsed_count = 3;
  uint32 failure_count = 4;
  // The design's "Σ duration": the SUM of member durations, which for
  // concurrent members exceeds wall time. Named `total_duration` and not
  // `wall_time` for exactly that reason.
  int64 total_duration_micros = 5;
  // Nearest rank: sort ascending, take index `ceil(0.95 * n) - 1`.
  //
  // Absent for a group smaller than `min_group_size_for_percentile`, because a
  // p95 over four samples is the maximum wearing a percentile's name — and the
  // maximum of a one-member group is that member, which would make every single
  // call an "outlier".
  optional int64 p95_duration_micros = 6;
  MetricAvailabilityV1 p95_availability = 7;
  // Members strictly slower than p95, slowest first, capped. Empty whenever
  // p95 is absent.
  repeated TraceSpanOutlierV1 outliers = 8;
  // How many further outliers the cap dropped. A full outlier list is never
  // read as a complete one.
  uint32 omitted_outlier_count = 9;

  // Wave 35. The composition of `failure_count` above: which categories, which
  // statuses, how many exceptions.
  TraceFaultBreakdownV1 faults = 10;
  // Wave 35. What these ×N calls cost, and how that number was arrived at.
  TraceSpanCostRollupV1 cost = 11;
}

// Level 1. One agent turn.
//
// A step is a span carrying `gen_ai.agent.name` no ancestor of which carries
// one; every other span attributes to its nearest such ancestor. There is no
// `invoke_agent` operation-name convention in this build, so keying on one
// would be keying on something nothing emits.
message TraceStepSummaryV1 {
  // The turn's own span id. A step IS a span; it does not get a synthetic id.
  string step_id = 1;
  string step_name = 2;
  optional string agent_name = 3;
  optional string agent_id = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  int64 wall_time_micros = 7;
  // Basis points of the trace's wall time, so two clients render the same
  // number. Shares deliberately DO NOT sum to 10000 when steps overlap or when
  // spans are unattributed: a normalised share would hide concurrency, which is
  // the fact a waterfall exists to show.
  optional uint32 wall_time_share_basis_points = 8;
  MetricAvailabilityV1 wall_time_share_availability = 9;
  // Spans attributed to this step, excluding the step span itself.
  uint32 operation_count = 10;
  // Failing spans attributed to this step, INCLUDING the step span itself if it
  // failed — a turn that failed is a failure of that turn.
  uint32 failure_count = 11;
  repeated TraceOperationGroupV1 operation_groups = 12;
  uint32 omitted_operation_group_count = 13;

  // Wave 35. The composition of `failure_count` above, over this turn's spans
  // INCLUDING the turn's own span — the same member set the count uses, for the
  // same reason: a turn that failed is a failure of that turn.
  TraceFaultBreakdownV1 faults = 14;
  // Wave 35. The earliest failure in this turn. Absent when the turn had none —
  // absent, not a zero-valued pointer at a span that did not fail.
  optional TraceFirstFailureV1 first_failure = 15;
}

message TraceCriticalPathStepV1 {
  string span_id = 1;
  string span_name = 2;
  TraceOperationKindV1 kind = 3;
  int64 duration_micros = 4;
  // Duration minus the UNION of the children's intervals, so a span with two
  // concurrent children is not charged twice. This is the number that says
  // which link is spending time rather than merely containing it.
  int64 self_duration_micros = 5;
  uint32 depth = 6;
  optional string step_id = 7;
}

// Level 5a. The chain that determines the trace's wall time.
message TraceCriticalPathV1 {
  repeated TraceCriticalPathStepV1 steps = 1;
  // The ROOT's duration, not the sum of the chain — a sum would double-count
  // every nesting level.
  int64 total_duration_micros = 2;
  MetricAvailabilityV1 availability = 3;
  // Which definition produced this path. A client that renders "the critical
  // path" without knowing the definition cannot compare two builds, and a later
  // change of definition should be a fixture diff a reviewer sees.
  //
  // `latest_finishing_child_chain_v1`: from the root, repeatedly descend to the
  // child whose end time is latest; ties by longer duration, then by span id
  // ascending, so the answer is deterministic.
  string method_code = 4;
}

message TraceAttentionItemV1 {
  string span_id = 1;
  string span_name = 2;
  TraceAttentionKindV1 kind = 3;
  string reason_code = 4;
  optional string detail = 5;
  int64 duration_micros = 6;
  optional string step_id = 7;
}

// Level 5b. What "Highlight errors" filters over, computed here so it is not a
// client scan.
message TraceNeedsAttentionSetV1 {
  // Sorted ERROR, then WARN, then SLOW_OUTLIER; within a kind by duration
  // descending, then span id.
  repeated TraceAttentionItemV1 items = 1;
  // The three counts are over the WHOLE population, not over the capped list
  // above, so a client that renders "1,204 errors" while showing 200 of them is
  // telling the truth on both numbers.
  uint32 error_count = 2;
  uint32 warn_count = 3;
  uint32 slow_outlier_count = 4;
  uint32 omitted_item_count = 5;
}

message AgentTraceHeaderV1 {
  string trace_id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp ended_at = 3;
  int64 wall_time_micros = 4;
  uint32 span_count = 5;
  uint32 step_count = 6;
  // Spans with no agent-turn ancestor. Never silently folded into a
  // neighbouring step.
  uint32 unattributed_span_count = 7;
  // AVAILABLE when at least one agent turn was found — including when the
  // count of anything under it is honestly zero. NOT_OBSERVED with
  // `trace_carries_no_agent_turn_spans` when the trace's spans carry no
  // `gen_ai.agent.name` at all, which is a different fact from a trace whose
  // turns did nothing.
  MetricAvailabilityV1 step_availability = 8;
}

// A span's input and output as this build actually holds them: storage
// references, not bodies.
//
// Present so the absence is legible rather than implied. Turning one of these
// into a payload is the Phase 5 "Extraction Preview" plane — redaction before
// preview, dedupe fingerprints, leakage signals — and the capability
// `trace_span_content_hydration` says it is UNAVAILABLE.
message TraceSpanContentRefV1 {
  // `input`, `output`, `tool_arguments`, `tool_result`, `retrieval_documents`,
  // `reasoning`.
  string content_class = 1;
  string storage_uri = 2;
}

// Level 3. One raw span row.
message TraceSpanV1 {
  string span_id = 1;
  optional string parent_span_id = 2;
  // The agent turn this span attributes to. Absent for an unattributed span.
  optional string step_id = 3;
  string name = 4;
  TraceOperationKindV1 kind = 5;
  string target = 6;
  optional string service_name = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  int64 duration_micros = 10;
  TraceSpanStatusV1 status = 11;
  bool is_error = 12;
  optional string error_type = 13;
  optional string error_message = 14;
  bool has_exception_event = 15;

  // Level 4. The span's usage object, preserved under the EVAL SIDE'S contract:
  // the same `ProviderUsageRecordV1` type, the same 48-field / 96-byte-path /
  // 64-byte-text / 4096-byte bounds, and the same rule that breaching any bound
  // refuses the WHOLE record rather than truncating it. Those four numbers are
  // imported from the eval side rather than restated here, because a second
  // copy of them is a future disagreement.
  //
  // What CANNOT be reused is a provider body, and the record says so rather
  // than letting a reader assume the stronger claim: the ingest pipeline
  // normalises a provider's `usage` object into OTel-spelled columns before
  // this surface sees a span, so `availability.provenance` is
  // `otel_span_gen_ai_usage_attributes`. The record is verbatim with respect to
  // the SPAN — every scalar leaf it carries, in the span's own spelling, sorted
  // by path — and is not verbatim with respect to the provider.
  ProviderUsageRecordV1 verbatim_usage = 16;

  // NOT_SUPPORTED with `non_streaming_provider_client`: this build's provider
  // client does not stream, so there is no first-token instant to record. An
  // availability, never a zero.
  MetricAvailabilityV1 time_to_first_token_availability = 17;

  repeated TraceSpanContentRefV1 content_refs = 18;

  // Level 4b (wave 35). What this span cost, and where that number came from:
  // the client's own instrumented figure, an estimate off the provider's
  // published list price, or a typed absence. Display plane only — see
  // `TraceSpanCostV1`.
  TraceSpanCostV1 cost = 19;
}

// ---------------------------------------------------------------------------
// RPCs
// ---------------------------------------------------------------------------

message GetAgentTraceDetailRequest {
  // Lowercase hex, as `SessionV1.trace_ids` spells it.
  string trace_id = 1;
  // Unset means the recent-24h default; a range wider than the maximum is
  // clamped, and the clamp is reported in-band.
  optional google.protobuf.Timestamp start = 2;
  optional google.protobuf.Timestamp end = 3;
}

// Levels 1, 2 and 5, folded from ONE bounded span scan.
//
// It embeds no span page: a detail that carried one would grow without bound as
// a trace filled. It is `SELECTED_DETAIL`, not a page.
message GetAgentTraceDetailResponse {
  AgentTraceHeaderV1 header = 1;
  repeated TraceStepSummaryV1 steps = 2;
  TraceCriticalPathV1 critical_path = 3;
  TraceNeedsAttentionSetV1 needs_attention = 4;
  TraceSpanPopulationBoundaryV1 boundary = 5;
  TraceWindowV1 window = 6;
  EvaluationFreshnessV1 freshness = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
  // Set when the read refused. When set, every field above it carries its
  // zero/empty value and none of them is an answer.
  optional TraceReadRefusalV1 refusal = 9;
}

message ListAgentTraceSpansRequest {
  string trace_id = 1;
  optional google.protobuf.Timestamp start = 2;
  optional google.protobuf.Timestamp end = 3;
  // Defaulted and capped; see the `trace_view_span_page` capability limits.
  optional uint32 limit = 4;
  optional uint32 offset = 5;
  // Server-side filters. "Highlight errors" is this field, which is the whole
  // point of level 5 being server-computed: the client does not scan.
  optional string step_id = 6;
  optional TraceAttentionKindV1 attention_filter = 7;
}

// Levels 3 and 4.
message ListAgentTraceSpansResponse {
  // Ordered by start time ascending, span id ascending as tiebreak — a
  // server-fixed order, which is what makes an offset over it stable.
  repeated TraceSpanV1 spans = 1;
  // Over the FILTERED population, not the page. A client asking for the error
  // spans of a 10,000-span trace gets the error spans, a page of them, and the
  // true total.
  uint32 total_matching_span_count = 2;
  bool has_more = 3;
  TraceSpanPopulationBoundaryV1 boundary = 4;
  TraceWindowV1 window = 5;
  EvaluationFreshnessV1 freshness = 6;
  optional TraceReadRefusalV1 refusal = 7;
}


// ---------------------------------------------------------------------------
// ---- wave 41 lane B: summary index ----
//
// WHY THIS BLOCK IS HERE AND NOT IN `agent_run.proto`
//
// Lane A's block reserves these names and says they are defined "below" — in
// that file. They cannot be: `trace_view.proto` imports `agent_run.proto`
// (:47, for `ConfirmAgentRunGrouping`), and every message here carries at least
// one shape defined in THIS file — `TraceFaultBreakdownV1`,
// `TraceFirstFailureV1`, `TraceSpanCostRollupV1`, `TraceOperationKindV1`,
// `TraceWindowV1`, `TraceSpanPopulationBoundaryV1`. Defining them in
// `agent_run.proto` would need the reverse import, which is the cycle, or a
// second minting of the fault and cost shapes, which would put two spellings of
// one fault breakdown on one screen. The names stay unique either way: one
// prost module per package (lock ruling `L1-4`).
// ---------------------------------------------------------------------------

// The first word on the agent-run header (`BP:755`).
//
// `PLAN:1683` asks for an "outcome" and neither the plan nor `0b` §4 defines the
// vocabulary — handoff doc 11 §9 Q1 raises exactly that. This is the answer, and
// its derivation is published as `agent_run_outcome_v1` in the capability set so
// a reader can argue with the rule rather than only with the word.
//
// `_UNKNOWN` IS A VERDICT, NOT A NULL. It is what this build says when the
// conversation is still `_OPEN` — a run in flight has not had an outcome yet —
// and when no member span reported a status at all. `UNSET is not OK` on one
// span; a whole run of them is not a successful run either.
enum AgentRunOutcomeV1 {
  AGENT_RUN_OUTCOME_V1_UNSPECIFIED = 0;
  // Carries `outcome_unknown_reason_code`, always.
  AGENT_RUN_OUTCOME_V1_UNKNOWN = 1;
  // At least one member span reported OK, none failed, no rule judged it badly.
  AGENT_RUN_OUTCOME_V1_SUCCEEDED = 2;
  // Something recorded a fault without failing (`warned_span_count > 0`).
  AGENT_RUN_OUTCOME_V1_DEGRADED = 3;
  // A member span reported an error status.
  AGENT_RUN_OUTCOME_V1_FAILED = 4;
  // A production rule (§6, wave 39) returned a failing verdict over this run's
  // work. It OUTRANKS `_FAILED`, deliberately: the span plane knows whether the
  // machinery worked and the rule plane knows whether the work was acceptable,
  // and J2's operator arrived holding the second question.
  AGENT_RUN_OUTCOME_V1_POLICY_FAILED = 5;
}

// Which input the derivation consulted, so "why does it say Failed" is returned
// data rather than a frontend heuristic — `0b P7-3`'s rule for grouping
// confidence, applied to the field beside it.
enum AgentRunOutcomeInputKindV1 {
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_UNSPECIFIED = 0;
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_CONVERSATION_COMPLETENESS = 1;
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_PRODUCTION_RULE_VERDICT = 2;
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_MEMBER_SPAN_FAILURE = 3;
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_MEMBER_SPAN_WARNING = 4;
  AGENT_RUN_OUTCOME_INPUT_KIND_V1_MEMBER_SPAN_STATUS = 5;
}

message AgentRunOutcomeInputV1 {
  AgentRunOutcomeInputKindV1 kind = 1;
  // What this input saw. Zero is an honest zero here: the input WAS consulted.
  uint32 observed_count = 2;
  // Exactly one input in the list carries `true` — the rung that decided.
  bool contributed = 3;
}

// The verdict, its inputs, and the name of the rule that produced it.
message AgentRunOutcomeAssessmentV1 {
  AgentRunOutcomeV1 outcome = 1;
  // Every input in precedence order, decided one included.
  repeated AgentRunOutcomeInputV1 inputs = 2;
  // `agent_run_outcome_v1`. The same discipline `TraceCriticalPathV1.method_code`
  // applies: a header word computed by an unnamed rule is a word nobody can
  // argue with, and a later change of rule should be a fixture diff a reviewer
  // sees.
  string method_code = 3;
  // Set only for `_UNKNOWN`: `conversation_still_open` or
  // `no_member_span_reports_a_status`. Absent on every other verdict, because a
  // reason attached to `_SUCCEEDED` invites a reader to treat it as the answer.
  optional string outcome_unknown_reason_code = 4;
}

// One line of the run's spend.
//
// THERE IS NO RUN-LEVEL MONEY TOTAL ANYWHERE ON THIS SURFACE, and its absence is
// the design. A run-wide figure is a bill-shaped object, and a bill-shaped object
// on a telemetry read model is how a display-plane estimate ends up quoted at
// somebody. `PLAN:1683` says "cost line ITEMS"; a client that wants a total adds
// these in front of the reader, where the reader can see what is being added and
// that some of it is estimated.
message AgentRunCostLineItemV1 {
  TraceOperationKindV1 kind = 1;
  // The same second key `TraceOperationGroupV1` uses — model id for an LLM line,
  // tool name for a tool line — so a reader who has learned the vocabulary on the
  // trace surface does not learn a second one here.
  string target = 2;
  uint32 span_count = 3;
  // The trace surface's own rollup, over this bucket's members. Same arithmetic,
  // a third mount point.
  TraceSpanCostRollupV1 rollup = 4;
}

// The run's token totals, with the accounting basis attached.
//
// Every field is optional and an absent field is NOT a zero: a provider that
// never reported a cache dimension and a provider whose cache never hit must not
// arrive as the same number.
message AgentRunUsageTotalsV1 {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
  optional int64 total_tokens = 3;
  optional int64 cache_read_input_tokens = 4;
  optional int64 cache_creation_input_tokens = 5;
  optional int64 reasoning_tokens = 6;
  // How many member spans contributed. Zero means the totals are absent, not
  // that the run used no tokens.
  uint32 contributing_span_count = 7;
  // NOT_OBSERVED / `no_member_span_carries_token_usage` when nothing contributed.
  MetricAvailabilityV1 availability = 8;
  // `provider_accounting_unknown` — the span plane's basis, restated here
  // because a SUM of six columns is only honest with its basis beside it.
  EvaluationTokenAccountingV1 token_accounting = 9;
}

// What the score planes say about this run.
//
// Counts and a worst verdict, never rows: the rows live on the eval and workflow
// planes and are reached by a pivot. A summary that embedded them would be a
// page in a `SUMMARY`'s clothing (`A2` §2.1 rule 1).
message AgentRunScorePostureV1 {
  // `eval_scores` rows anchored to a member trace.
  uint32 score_count = 1;
  uint32 scored_member_trace_count = 2;
  optional double worst_score_value = 3;
  // Production-rule verdicts over this run's member traces (wave 39).
  uint32 failing_rule_verdict_count = 4;
  uint32 passing_rule_verdict_count = 5;
  // A scorer that could not produce a verdict. NEVER counted as a failing
  // verdict: a scorer that crashed has not judged the run.
  uint32 rule_scorer_failure_count = 6;
  // NOT_OBSERVED / `no_score_plane_row_for_any_member_trace` when both planes are
  // silent. Silence is not a pass.
  MetricAvailabilityV1 availability = 7;
}

// The dimensions `PLAN:1683` names and `PLAN:1685` filters on.
//
// `distinct_count > 1` is not an error — a conversation can legitimately cross
// deployments — but it is a fact the reader must be able to see, so the count
// rides the value instead of one member silently winning.
message AgentRunDimensionV1 {
  optional string value = 1;
  uint32 distinct_count = 2;
  // Two different absences, and a reader acts on them differently:
  // `span_plane_presents_no_run_dimension_columns` is an instrumentation
  // question for us, `no_member_span_states_this_dimension` is one for them.
  MetricAvailabilityV1 availability = 3;
}

// `PLAN:1683`'s "prompt/model/tool/retrieval versions".
message AgentRunVersionContextV1 {
  AgentRunDimensionV1 prompt_version = 1;
  AgentRunDimensionV1 model_version = 2;
  AgentRunDimensionV1 tool_version = 3;
  // ALWAYS NOT_SUPPORTED / `no_retrieval_version_attribute_in_build`. There is no
  // retrieval-version attribute anywhere in this build; `o11y.prompt.version` and
  // `o11y.tool.version` exist and are folded. A version filled from the
  // nearest-looking attribute would be a version nobody stated.
  MetricAvailabilityV1 retrieval_version_availability = 4;
}

// `PLAN:1683`'s "release context".
//
// The link is transitive and the response says so rather than implying a
// relation the planes do not carry: a release names a `release_key`, a release
// BLOCK names the same key and an execution, and an execution names a trace.
message AgentRunReleaseContextV1 {
  // Release keys reached from this run's member traces, bounded.
  repeated string release_keys = 1;
  uint32 release_count = 2;
  // Blocks in `active` or `indeterminate` over those keys.
  uint32 active_release_block_count = 3;
  // NOT_OBSERVED / `no_release_plane_row_for_any_member_trace` when nothing links.
  MetricAvailabilityV1 availability = 4;
}

// J2 step 7 — "is this failure already covered?" (`BP:482`, A2 gap `G21`).
//
// `_UNKNOWN` IS A REAL VERDICT AND NEVER MEANS "NOT COVERED". `0b` §4.5 says so
// in as many words, and the distinction is the whole value of the block: telling
// an operator "not covered" about a run whose lineage this build cannot resolve
// would send them to write a duplicate dataset case.
enum AgentRunCoverageVerdictV1 {
  AGENT_RUN_COVERAGE_VERDICT_V1_UNSPECIFIED = 0;
  // The lineage plane was asked and cannot answer for this run. Carries a reason.
  AGENT_RUN_COVERAGE_VERDICT_V1_UNKNOWN = 1;
  // Asked, answered, and nothing references any member trace.
  AGENT_RUN_COVERAGE_VERDICT_V1_NOT_COVERED = 2;
  // A dataset case or draft names a member trace as its source.
  AGENT_RUN_COVERAGE_VERDICT_V1_COVERED_BY_DATASET = 3;
  // ...and an evaluation run pinned one of those case revisions.
  AGENT_RUN_COVERAGE_VERDICT_V1_COVERED_BY_EVALUATION = 4;
}

message AgentRunCoverageReferenceV1 {
  // `dataset_item`, `dataset_proposed_case`, `evaluation_run`.
  string reference_kind = 1;
  string reference_id = 2;
  // The member trace that produced the link, so a reader can see WHICH part of
  // the run is covered rather than only that some of it is.
  optional string member_trace_id = 3;
}

message AgentRunEvaluationCoverageV1 {
  AgentRunCoverageVerdictV1 verdict = 1;
  // At most `max_coverage_references` (A2 J2.4 states ten). The count is over the
  // whole population; the list is capped, and `omitted_reference_count` says so.
  repeated AgentRunCoverageReferenceV1 references = 2;
  uint32 covering_reference_count = 3;
  uint32 omitted_reference_count = 4;
  // Set for `_UNKNOWN` only. `provisional_grouping_cannot_claim_lineage` is the
  // common one and is the `0b P7-10` matrix speaking: a group of unknown
  // membership has no lineage claim to make, so this build declines to make one
  // rather than making a weak one.
  optional string unknown_reason_code = 5;
  MetricAvailabilityV1 availability = 6;
}

// `PLAN:1684`'s instrumentation completeness, as facts rather than a grade.
message AgentRunInstrumentationCompletenessV1 {
  CompletenessStateV1 state = 1;
  // Member spans attributable to no agent turn. A real gap; never folded into a
  // neighbouring turn.
  uint32 unattributed_span_count = 2;
  // Members whose span population exceeded the cap and were refused whole.
  uint32 refused_member_trace_count = 3;
  // `cap + 1` on the worst refused member: AT LEAST this many, never an exact
  // total. Render it as "10 000+".
  optional uint32 refused_member_observed_span_count = 4;
  // Members not read because the run exceeds this build's fold ceiling.
  uint32 unread_member_trace_count = 5;
  // The counters this build cannot produce, each with its reason. They are
  // NOT_SUPPORTED forever until the build gains the signal, and they are here
  // rather than as five zeros because a zero handoff count on a run that handed
  // off is worse than no number at all.
  MetricAvailabilityV1 retry_count_availability = 6;
  MetricAvailabilityV1 handoff_count_availability = 7;
  MetricAvailabilityV1 guardrail_count_availability = 8;
  MetricAvailabilityV1 memory_operation_count_availability = 9;
  // Always NOT_SUPPORTED / `non_streaming_provider_client` — wave 32's code,
  // reused rather than re-minted.
  MetricAvailabilityV1 time_to_first_token_availability = 10;
  // Whether every count on the row is a total rather than a lower bound.
  // AVAILABLE, or NOT_OBSERVED naming the refusal or the ceiling.
  MetricAvailabilityV1 counts_availability = 11;
}

// The `PLAN:1683` field set, served from the maintained projection (`P7-14`).
//
// EVERY FIELD HERE IS A COLUMN, not a join performed while the page is built.
// `PLAN:1687` forbids scanning and hydrating models, tools, scores, releases and
// evidence per row, and the way this build keeps that promise is that the read
// path holds no query engine and issues no per-row statement — see the
// `agent_run_index` capability's `list_span_scans` limit, which is zero.
message AgentRunSummaryV1 {
  string agent_run_id = 1;
  // Lane A's spine, carried verbatim: state, confidence, the confidence INPUTS
  // (`P7-3`), revision, bounds, and the redirect when the id was stale.
  AgentRunGroupingV1 grouping = 2;
  ConversationCompletenessV1 completeness = 3;
  AgentRunOutcomeAssessmentV1 outcome = 4;

  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  // The keyset's sort key. A late span advances it and the run RE-SURFACES at the
  // head of the list; `P7-16`'s watermark rule is what makes that legible rather
  // than a reshuffle.
  google.protobuf.Timestamp last_seen_at = 7;

  uint32 trace_count = 8;
  uint32 folded_trace_count = 9;
  uint32 span_count = 10;
  // Σ of the members' own OTel event counts. Absent when the scanned schema did
  // not present the column.
  optional int64 span_event_count = 11;
  MetricAvailabilityV1 span_event_count_availability = 12;

  uint32 agent_count = 13;
  uint32 model_count = 14;
  uint32 tool_count = 15;
  uint32 retrieval_span_count = 16;
  uint32 mcp_span_count = 17;

  uint32 hard_failure_count = 18;
  // Spans that recorded a fault WITHOUT failing. Wave 35 found this is zero by
  // construction in today's ingest (`classify_error` ORs the exception into
  // `is_error`); the field is computed correctly and kept, on the same argument
  // wave 35 gave for keeping `warned_span_count`.
  uint32 degraded_failure_count = 19;
  TraceFaultBreakdownV1 faults = 20;
  optional TraceFirstFailureV1 first_failure = 21;

  // The MAXIMUM of the members' own critical paths, not a new chain definition.
  optional int64 critical_path_latency_micros = 22;
  MetricAvailabilityV1 critical_path_availability = 23;
  // `latest_finishing_child_chain_v1` — the trace surface's code, because it is
  // the trace surface's derivation.
  string critical_path_method_code = 24;
  // Which member produced it, so the number is followable.
  optional string critical_path_trace_id = 25;

  repeated AgentRunCostLineItemV1 cost_line_items = 26;
  uint32 omitted_cost_line_item_count = 27;
  AgentRunUsageTotalsV1 usage = 28;
  AgentRunScorePostureV1 score_posture = 29;

  AgentRunDimensionV1 customer = 30;
  AgentRunDimensionV1 deployment = 31;
  AgentRunVersionContextV1 versions = 32;
  AgentRunReleaseContextV1 release_context = 33;
  AgentRunInstrumentationCompletenessV1 instrumentation = 34;

  // The projection's own version and the watermark the fold read through.
  uint64 projection_version = 35;
  optional string facts_watermark = 36;
  google.protobuf.Timestamp refreshed_at = 37;
  EvaluationFreshnessV1 freshness = 38;
}

// `PLAN:1685` — the filters Production > Agent runs needs.
message AgentRunListFilterV1 {
  optional string customer_id = 1;
  optional string deployment_id = 2;
  repeated AgentRunOutcomeV1 outcomes = 3;
  repeated AgentRunGroupingConfidenceV1 grouping_confidences = 4;
  repeated ConversationCompletenessStateV1 completeness_states = 5;
  repeated CompletenessStateV1 instrumentation_states = 6;
  optional string prompt_version = 7;
  optional string model_version = 8;
  optional string tool_version = 9;
  // `P7-4`/`B1-4`: identity-less traces appear as single-trace runs and are
  // INCLUDED by default. Setting this hides them and the response then reports
  // `hidden_ungrouped_run_count` — R8's rule, satisfied by construction rather
  // than by a default the caller has to discover.
  bool exclude_ungrouped = 10;
}

message ListAgentRunsRequest {
  optional google.protobuf.Timestamp start = 1;
  optional google.protobuf.Timestamp end = 2;
  AgentRunListFilterV1 filter = 3;
  optional uint32 limit = 4;
  // Opaque keyset cursor over `(last_seen_at DESC, agent_run_id DESC)`, bound to
  // a facts watermark. Never an offset.
  optional string page_token = 5;
}

message ListAgentRunsResponse {
  repeated AgentRunSummaryV1 runs = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  // How many `_UNGROUPED` runs the filter removed. Present whenever
  // `exclude_ungrouped` was set, INCLUDING when it is zero: an empty list is
  // never evidence of none (R8).
  optional uint32 hidden_ungrouped_run_count = 4;
  // Clamped IN BAND, with the reason. The `ListSessions` silent clamp is the
  // defect this field exists not to repeat.
  TraceWindowV1 window = 5;
  // The population the projection was built from, declared.
  TraceSpanPopulationBoundaryV1 boundary = 6;
  // `keyset_last_seen_desc_late_data_resurfaces_at_head_v1`. Named on the wire
  // because "stable under late data" means something specific here and a client
  // that guesses will guess "nothing moves".
  string cursor_semantics_code = 7;
  EvaluationFreshnessV1 freshness = 8;
  AgenticEvaluationCapabilitiesV1 capabilities = 9;
  optional TraceReadRefusalV1 refusal = 10;
}

message GetAgentRunRequest {
  // A stale (`_MERGED_AWAY` / `_SPLIT_AWAY` / `_REDIRECTED`) id is answered with
  // the canonical run plus `summary.grouping.redirect`, never `NOT_FOUND`
  // (`P7-6`). A run in another tenant IS `NOT_FOUND`, and the two are different
  // answers on purpose.
  string agent_run_id = 1;
}

message GetAgentRunResponse {
  AgentRunSummaryV1 summary = 1;
  // J2 step 7. On the DETAIL only — putting it on every list row would be the
  // per-row hydration `PLAN:1687` forbids, even though the value is a stored
  // column, because the payload would then grow with the page.
  AgentRunEvaluationCoverageV1 evaluation_coverage = 2;
  TraceWindowV1 window = 3;
  TraceSpanPopulationBoundaryV1 boundary = 4;
  EvaluationFreshnessV1 freshness = 5;
  AgenticEvaluationCapabilitiesV1 capabilities = 6;
  optional TraceReadRefusalV1 refusal = 7;
}
// ---- end wave 41 lane B ----

// ---- wave 41 lane C: timeline ----
//
// `ListAgentRunEvents` (`PLAN:492`) and the three external-artifact verbs
// (`PLAN:495`-`:498`), against 0b §4.5 (`P7-13`, `P7-15`, `P7-16`) and §5
// (`AL-1`…`AL-14`, `SM-12`, `SM-13`).
//
// WHY THESE MESSAGES LIVE HERE AND NOT IN `agent_run.proto`
//
//   The same import-cycle constraint lane B recorded: `trace_view.proto` already
//   imports `agent_run.proto`, and every message below carries at least one
//   shape defined in THIS file — `TraceSpanCostV1`, `TraceSpanContentRefV1`,
//   `TraceOperationKindV1`, `TraceSpanStatusV1`, `TraceFaultCategoryV1`,
//   `TraceFirstFailureV1`, `TraceWindowV1`, `TraceReadRefusalV1`. Defining them
//   in `agent_run.proto` would need the reverse import or a second minting of
//   the cost and fault shapes, and a second minting is a future disagreement.
//   The names lane A reserved stay unique in the package either way: one prost
//   module per package (`L1-4`).
//
// WHAT IS DELIBERATELY NOT HERE
//
//   * **No raw-trace mode.** `0b P7-15` models three and makes raw trace a
//     PIVOT to `ListAgentTraceSpans`. A fourth arm would invite this RPC to grow
//     the raw-span path NN26 forbids, so there is no arm to reach for.
//   * **No handoff, memory, guardrail or retry event kind.** No ingest source
//     exists for any of them — a whole-crate grep of `transformation/` finds no
//     such attribute, and w35b already recorded that nothing marks a span as a
//     retry of another. They are reported through
//     `AgentRunEventKindCoverageV1` as typed absences. Synthesising them from
//     same-parent adjacency would put a relationship on the wire nobody
//     instrumented.
//   * **No reasoning text, anywhere.** NN27 (`PLAN:171`): a provider-exposed
//     reasoning SUMMARY is reachable only as an authorized content reference on
//     `AgentRunEventV1.content_refs`, never as an event and never as a body.
//     There is no field below that could carry one.
//   * **No run-level money total.** Handoff doc 11 §8: a trace-wide money total
//     is a bill-shaped object, and a bill-shaped object on a telemetry read
//     model is how a display-plane estimate ends up quoted at somebody. Costs
//     are per event, with `TraceSpanCostV1`'s own provenance.

// `0b P7-15`, FROZEN. Three modes, and raw trace is not one of them.
enum AgentRunTimelineModeV1 {
  AGENT_RUN_TIMELINE_MODE_V1_UNSPECIFIED = 0;
  // Semantic operations grouped by agent and task (`BP:772`). The unfiltered
  // timeline: this mode never filters server-side and says so.
  AGENT_RUN_TIMELINE_MODE_V1_SUMMARY = 1;
  // Failed/degraded work PLUS causal parents (`BP:773`). A failed tool call
  // without the model turn that issued it is a leaf with no story.
  AGENT_RUN_TIMELINE_MODE_V1_FAILURES_ONLY = 2;
  // The work determining end-to-end latency (`BP:774`), computed by the trace
  // viewer's own `latest_finishing_child_chain_v1` so "critical" means one
  // thing across this product.
  AGENT_RUN_TIMELINE_MODE_V1_CRITICAL_PATH = 3;
}

// The six event families this build has an ingest source for.
//
// A failure is a STATE on an event, not a kind: an errored tool call is
// `..._TOOL` with `is_error`, so "how many tool calls did this run make?" stays
// answerable from the kind alone. `..._ERROR` is for a span whose only semantic
// is that something broke.
enum AgentRunEventKindV1 {
  AGENT_RUN_EVENT_KIND_V1_UNSPECIFIED = 0;
  AGENT_RUN_EVENT_KIND_V1_MODEL = 1;
  AGENT_RUN_EVENT_KIND_V1_TOOL = 2;
  AGENT_RUN_EVENT_KIND_V1_RETRIEVAL = 3;
  AGENT_RUN_EVENT_KIND_V1_DOWNSTREAM = 4;
  AGENT_RUN_EVENT_KIND_V1_ERROR = 5;
  AGENT_RUN_EVENT_KIND_V1_GENERIC = 6;
}

// `0b P7-16`. How a client applies an event it just received.
enum AgentRunEventDeliveryV1 {
  AGENT_RUN_EVENT_DELIVERY_V1_UNSPECIFIED = 0;
  // New, after the cursor's position.
  AGENT_RUN_EVENT_DELIVERY_V1_APPEND = 1;
  // At or before the cursor's position, re-emitted because the watermark moved.
  // Keyed by `event_id`; apply idempotently. Never a page reshuffle.
  AGENT_RUN_EVENT_DELIVERY_V1_UPSERT = 2;
}

// Which spelling produced a normalized attribute (`PLAN:1720`, semconv registry
// §6.8). A verdict a client groups by, not a hint.
enum AgentRunAttributeSourceV1 {
  AGENT_RUN_ATTRIBUTE_SOURCE_V1_UNSPECIFIED = 0;
  AGENT_RUN_ATTRIBUTE_SOURCE_V1_CANONICAL = 1;
  // The deprecated `o11y.*` spelling. Every span in this build, until the
  // registry's `1C-5` rename lands the canonical columns.
  AGENT_RUN_ATTRIBUTE_SOURCE_V1_LEGACY_ALIAS = 2;
  AGENT_RUN_ATTRIBUTE_SOURCE_V1_BOTH_EQUAL = 3;
  // Both spellings, different values. Canonical wins and both are recorded.
  AGENT_RUN_ATTRIBUTE_SOURCE_V1_CONFLICT = 4;
}

// Which of `PLAN:1691`'s event families this build can actually produce.
//
// `kind` is a slug rather than `AgentRunEventKindV1` deliberately: the four
// families with no ingest source have no enum arm, and giving them one so they
// could be reported absent would be minting the very kinds this lane refuses to
// invent.
message AgentRunEventKindCoverageV1 {
  // `model` | `tool` | `retrieval` | `downstream` | `error` | `generic` |
  // `handoff` | `memory` | `guardrail` | `retry`.
  string kind = 1;
  // AVAILABLE for the six; NOT_SUPPORTED with `no_handoff_attribute_ingested`,
  // `no_memory_attribute_ingested`, `no_guardrail_attribute_ingested` or
  // `span_plane_marks_no_retry_relationship` for the four.
  MetricAvailabilityV1 availability = 2;
}

// Which of `AL-1`'s five source kinds this build can actually receive a link
// from.
//
// This is how a client tells "this run has no artifacts" from "this build could
// not have seen one" — NN11's rule that a refusal is observable, applied to an
// absence.
message AgentRunArtifactSourceCoverageV1 {
  ArtifactLinkSourceKindV1 source_kind = 1;
  // AVAILABLE for `FALLBACK_RPC` and `BACKFILL`. NOT_SUPPORTED with
  // `span_event_path_not_ingested`, `span_attribute_path_not_projected` or
  // `correlated_log_path_not_shipped` for the three telemetry paths, none of
  // which has an ingest path in this build.
  MetricAvailabilityV1 availability = 2;
}

// The deprecated-alias provenance channel (`PLAN:1695`).
//
// This is the ONLY place a legacy `o11y.*` string reaches a response. The public
// typed field is the neutral one — semconv registry §4.4 establishes that the
// response surface is already neutral, and this lane does not breach it.
message AgentRunEventAttributeProvenanceV1 {
  // The public, neutral field this resolves to.
  string canonical_field = 1;
  AgentRunAttributeSourceV1 source = 2;
  // The deprecated spelling that contributed. Absent when none did.
  optional string legacy_name = 3;
  // Set only on `_CONFLICT`: the value canonical precedence discarded, kept so
  // the disagreement is readable rather than merely counted.
  optional string discarded_legacy_value = 4;
}

// Per-event token usage, compact.
//
// The arithmetic is `span_usage`'s — the same six `gen_ai.usage.*` columns the
// trace surface reads — projected to six integers rather than carried as a full
// `ProviderUsageRecordV1`. Two hundred verbatim records would spend the page's
// byte budget on a field a timeline row does not need; the VERBATIM record stays
// available on `ListAgentTraceSpans`, which is the surface for it.
message AgentRunEventUsageV1 {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
  optional int64 total_tokens = 3;
  optional int64 cache_read_input_tokens = 4;
  optional int64 cache_creation_input_tokens = 5;
  optional int64 reasoning_tokens = 6;
  MetricAvailabilityV1 availability = 7;
}

// Generation settings and response identity, "where applicable" (`PLAN:1694`).
//
// Every field optional, because most spans are not model calls and a zero would
// claim a temperature nobody set.
message AgentRunEventGenerationV1 {
  optional string request_model = 1;
  optional string response_model = 2;
}

// One lane of the timeline (`PLAN:1694`, `BP:756-766`).
//
// Discovered from `gen_ai.agent.id` / `gen_ai.agent.name` / `service.name` at
// render time, never a fixed vocabulary: handoff doc 11 §8.1 records the
// prototype's four-value lane TYPE as the specific trap here. Work with no agent
// identity gets the `unattributed` lane rather than being dropped, so the lane
// counts and the event count agree.
message AgentRunLaneV1 {
  string lane_id = 1;
  optional string display_name = 2;
  uint32 event_count = 3;
}

// A nested child of an event, summarised. Capped independently.
message AgentRunChildSummaryV1 {
  string event_id = 1;
  string name = 2;
  AgentRunEventKindV1 kind = 3;
  int64 duration_micros = 4;
  bool is_error = 5;
}

// An artifact linked to this event, SUMMARISED (`PLAN:1703`).
//
// A summary, never content: `PLAN:1700` keeps large payloads behind the existing
// artifact content APIs, and `AL-14` rule 1 forbids resolving anything while
// building a page. `resolver_posture` is what the timeline shows instead — a
// client can render "resolvable" without a single byte having been fetched.
message AgentRunArtifactSummaryV1 {
  bytes link_id = 1;
  string artifact_id = 2;
  ArtifactTypeV1 artifact_type = 3;
  ArtifactRoleV1 role = 4;
  ArtifactRelationV1 relation = 5;
  // The CURRENT status: the row's write-time status overlaid with the
  // append-only correction ledger. A revoked link is projected identically to an
  // accepted one apart from this field and its audit — `PLAN:1693`.
  ArtifactLinkStatusV1 status = 6;
  ArtifactLinkConflictPostureV1 conflict_posture = 7;
  // `SM-13`. Posture, never resolution.
  ArtifactResolverPostureV1 resolver_posture = 8;
  // `AL-1`: the ONLY thing that distinguishes the paths. The typed read model is
  // otherwise identical, which is exit `:1733`'s whole claim.
  ArtifactLinkSourceKindV1 source_kind = 9;
  optional ArtifactLinkFallbackReasonV1 fallback_reason = 10;
  optional string media_type = 11;
  optional string filename = 12;
  optional string storage_system = 13;
  optional string resolver_key = 14;
  uint32 correction_sequence = 15;
  // `normalize::ArtifactLinkRejectionReason::as_str()`. Machine-groupable,
  // never prose — `PLAN:1692` requires rejected/unresolved diagnostics to be
  // preserved "without requiring raw-key parsing in the timeline".
  optional string rejection_reason_code = 16;
  google.protobuf.Timestamp observed_at = 17;
  // The anchor the link was made against, reusing the locked twelve-arm shape.
  EvidenceAnchorV1 anchor = 18;
}

// A link that did not become a usable artifact summary, and why.
//
// Grouped by reason code rather than listed per link, so a run with a thousand
// malformed emissions costs the page a handful of rows instead of a thousand.
message AgentRunArtifactDiagnosticV1 {
  string reason_code = 1;
  uint32 occurrence_count = 2;
}

// What each nested family lost to its own cap (`PLAN:1698`).
//
// Per family, because the caps are INDEPENDENT: an event with six artifacts and
// one child loses one artifact and no child. A single shared cap would make one
// noisy family silence another.
message AgentRunNestedCapsV1 {
  uint32 children_omitted = 1;
  uint32 artifacts_omitted = 2;
  uint32 content_refs_omitted = 3;
  uint32 attribute_provenance_omitted = 4;
}

// One timeline event (`PLAN:1694`).
message AgentRunEventV1 {
  // `trace_id:span_id`. Stable across re-reads, unique across the run's member
  // traces, and the key `P7-16`'s upserts are applied by.
  string event_id = 1;
  AgentRunEventDeliveryV1 delivery = 2;
  string lane_id = 3;
  optional string agent_name = 4;
  optional string agent_id = 5;
  AgentRunEventKindV1 kind = 6;
  // The trace viewer's own operation kind, carried so a client can render the
  // same icon on both surfaces.
  TraceOperationKindV1 operation_kind = 7;
  // The most specific identifier the event carries for its kind: tool name,
  // model id, route, data source. Never empty.
  string subject = 8;
  string name = 9;
  string trace_id = 10;
  string span_id = 11;
  optional string parent_span_id = 12;
  // The parent's `event_id`, when the parent is inside this run's population.
  // Absent when the parent started before the window — an honest absence rather
  // than a dangling reference.
  optional string parent_event_id = 13;
  optional string step_id = 14;
  // From the RUN, not from the span: the span reader does not project
  // `gen_ai.conversation.id` today.
  optional string conversation_id = 15;
  // NOT_SUPPORTED with `observation_id_not_projected_by_span_reader` until the
  // span projection carries `o11y.observation.id`. An availability, never an
  // empty string.
  MetricAvailabilityV1 observation_id_availability = 16;
  optional string observation_id = 17;
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp ended_at = 19;
  int64 duration_micros = 20;
  TraceSpanStatusV1 status = 21;
  bool is_error = 22;
  bool has_exception_event = 23;
  optional TraceFaultCategoryV1 fault_category = 24;
  optional string error_type = 25;
  optional string error_message = 26;
  bool on_critical_path = 27;
  AgentRunEventGenerationV1 generation = 28;
  AgentRunEventUsageV1 usage = 29;
  // `span_cost::span_cost`, by import. A list-rate estimate with its provenance
  // attached, never a bill.
  TraceSpanCostV1 cost = 30;
  // References, never bodies (`PLAN:1700`). The `reasoning` class is a
  // provider-exposed SUMMARY reference and nothing else (NN27).
  repeated TraceSpanContentRefV1 content_refs = 31;
  repeated AgentRunEventAttributeProvenanceV1 attribute_provenance = 32;
  repeated AgentRunChildSummaryV1 children = 33;
  repeated AgentRunArtifactSummaryV1 artifacts = 34;
  AgentRunNestedCapsV1 nested_caps = 35;
}

// Whether the server actually filtered, and by how much (`PLAN:1696`).
//
// `0b P7-15`: server-side filters exist "only where they materially reduce
// payload — a filter that returns 195 of 200 events is a client concern". The
// rule is published as a number (`filter_materiality_retained_percent`) and the
// verdict is on the wire, because a client that had to GUESS whether the server
// filtered would filter defensively every time and the server's filter would buy
// nothing.
message AgentRunTimelineModeEffectV1 {
  AgentRunTimelineModeV1 mode = 1;
  bool applied = 2;
  // `mode_is_unfiltered` | `filter_not_material` |
  // `filter_materially_reduces_payload`.
  string reason_code = 3;
  uint32 population_count = 4;
  // What the mode keeps. Reported whether or not it was applied, so a client can
  // check the rule rather than trust it.
  uint32 retained_count = 5;
}

// `0b P7-16`'s cursor.
message AgentRunTimelineCursorV1 {
  // Absent when the page exhausted the population.
  optional string next_page_token = 1;
  // The prefix to re-emit was larger than this build re-emits, so the client
  // restarts from page 1. A typed escape, never a silent truncation.
  bool resync_required = 2;
  // Lane A's monotone projection version this page was built at.
  int64 projection_version = 3;
  // Set when the BYTE ceiling ended the page rather than the event count.
  // "200 events" and "as many as fit" are different answers and an operator
  // diagnosing a short page needs to know which one they got.
  bool stopped_on_byte_ceiling = 4;
  // How many events this cursor walks in total, AFTER the mode decision. The
  // denominator a client needs to know how many pages to expect — without it,
  // "is there more?" is answerable only by asking for more.
  uint32 total_event_count = 5;
}

// The cost-driving event of the run (J2 step 4).
//
// The single largest AVAILABLE per-event cost — not a sum. A sum would be the
// run-level money total handoff doc 11 §8 refuses to publish.
message AgentRunTimelineCostDriverV1 {
  optional string event_id = 1;
  TraceSpanCostV1 cost = 2;
  MetricAvailabilityV1 availability = 3;
}

message ListAgentRunEventsRequest {
  // A non-`_CURRENT` id is not an error: it resolves to the canonical run and
  // the response carries the redirect (`P7-6`).
  string agent_run_id = 1;
  AgentRunTimelineModeV1 mode = 2;
  // From a previous response. Bound to the run, the mode and the projection
  // version it was minted at; replayed against a different run or mode it is
  // refused rather than silently re-pointed.
  optional string page_token = 3;
  // Clamped to the published maximum rather than refused, so a client that asks
  // for more gets the maximum and the capability tells it what that is.
  optional uint32 page_size = 4;
}

message ListAgentRunEventsResponse {
  // The CANONICAL run id, which may differ from the one requested.
  string agent_run_id = 1;
  // Present when the requested id was not `_CURRENT` (`P7-6`).
  optional GroupingRedirectV1 redirect = 2;
  repeated AgentRunEventV1 events = 3;
  repeated AgentRunLaneV1 lanes = 4;
  AgentRunTimelineModeEffectV1 mode_effect = 5;
  AgentRunTimelineCursorV1 cursor = 6;
  // `P7-13`: the timeline's "this conversation is done" affordance READS this
  // state. It computes no idle heuristic of its own, and there is no field here
  // that would let it.
  ConversationCompletenessV1 completeness = 7;
  repeated AgentRunEventKindCoverageV1 event_kind_coverage = 8;
  repeated AgentRunArtifactSourceCoverageV1 artifact_source_coverage = 9;
  repeated AgentRunArtifactDiagnosticV1 artifact_diagnostics = 10;
  // NOT_SUPPORTED with `event_scoped_scores_not_projected`: no plane keys a
  // score to a single span today. An absence with a reason, not an empty list a
  // client would read as "unscored".
  MetricAvailabilityV1 event_score_availability = 11;
  // J2's "downstream trace unavailable", typed. NOT_SUPPORTED with
  // `span_links_reach_the_lake_without_attributes` — OTel's own relational
  // mechanism survives ingest with its attributes dropped, so a span link cannot
  // say WHY it links and a downstream reference cannot be built from it.
  MetricAvailabilityV1 downstream_reference_availability = 12;
  // The earliest failure across the run's member traces (J2 step 4), reusing the
  // trace viewer's own shape and fold.
  optional TraceFirstFailureV1 first_failure = 13;
  AgentRunTimelineCostDriverV1 cost_driver = 14;
  TraceWindowV1 window = 15;
  TraceSpanPopulationBoundaryV1 boundary = 16;
  EvaluationFreshnessV1 freshness = 17;
  AgenticEvaluationCapabilitiesV1 capabilities = 18;
  // A member trace over the span cap refuses the WHOLE timeline with the
  // observed count. A summary over part of a conversation is wrong rather than
  // partial.
  optional TraceReadRefusalV1 refusal = 19;
  // Artifacts linked to the RUN rather than to any one span.
  //
  // Separate from `AgentRunEventV1.artifacts` deliberately: a link whose anchor
  // is the run belongs to the run, and hanging it off the first event would put
  // a relationship on a span nobody linked. Capped like every nested family.
  repeated AgentRunArtifactSummaryV1 run_artifacts = 20;
}

// `PLAN:497` / `AL-8` / `SM-12`. An audited logical revocation: a tombstone in
// the append-only correction ledger, never a delete of the immutable telemetry
// that carried the link.
message RevokeExternalArtifactLinkRequest {
  PrincipalRefV1 principal = 1;
  bytes link_id = 2;
  // Machine-groupable, never prose: "why were my links revoked?" has to be
  // answerable from a GROUP BY.
  string reason_code = 3;
  string idempotency_key = 4;
}

message RevokeExternalArtifactLinkResponse {
  // The link as it now reads: `status = REVOKED`, everything else preserved.
  ArtifactLinkV1 link = 1;
  uint32 correction_sequence = 2;
  optional string rejection_reason_code = 3;
}

// `PLAN:498` / `AL-14`. One resolve, one artifact, only after an explicit
// selection. List and timeline reads return POSTURE and never invoke a resolver.
message ResolveExternalArtifactLinkRequest {
  PrincipalRefV1 principal = 1;
  bytes link_id = 2;
}

message ResolveExternalArtifactLinkResponse {
  // The outcome posture. `SM-13`'s six values.
  ArtifactResolverPostureV1 posture = 1;
  // `resolver_not_configured` | `resolver_executor_not_shipped` |
  // `resolver_denied_by_policy` | `link_not_found` | `link_revoked`.
  string reason_code = 2;
  // Deliberately NOT a URL and NOT a credential. `AL-14` rule 3 and NN8: neither
  // is stored, and neither is returned. When a resolver executor ships, the
  // authorized content reference is what this grows — never a signed URL on a
  // read model.
  google.protobuf.Timestamp attempted_at = 3;
}
// ---- end wave 41 lane C ----


// The trace viewer's read plane.
//
// Served by the process that holds `UnifiedTelemetryQueryEngine`, because span
// rows are reachable through nothing else. Two RPCs, one bounded span scan
// each, so a screen costs two scans rather than five.
service AgenticTraceViewService {
  rpc GetAgentTraceDetail(GetAgentTraceDetailRequest) returns (GetAgentTraceDetailResponse);
  rpc ListAgentTraceSpans(ListAgentTraceSpansRequest) returns (ListAgentTraceSpansResponse);

  // ---- wave 41 lane A: identity ----
  //
  // The audited promotion of a provisional grouping (`PLAN:494`, `PLAN:1675`).
  // It lives here rather than on a service of its own because a confirmation is
  // a statement about a grouping the query engine produced, and the process that
  // holds the engine is the one that can resolve the run it names.
  //
  // It is also this lane's proof of `P7-6`: addressed with a `_MERGED_AWAY` id
  // it resolves to the canonical run and returns the redirect, and never a
  // `NOT_FOUND`.


  rpc ConfirmAgentRunGrouping(ConfirmAgentRunGroupingRequest) returns (ConfirmAgentRunGroupingResponse);
  // ---- end wave 41 lane A ----

  // ---- wave 41 lane B: summary index ----
  //
  // The Production > Agent runs list and the run header (`PLAN:491`).
  //
  // Both are served from the MAINTAINED projection (`P7-14`, `PLAN:1687`) and
  // neither touches the query engine: the index pass on the preparation worker
  // does the scanning, and `agent_trace_span_scans_issued()` not moving across
  // these two calls is how that is proved rather than asserted.
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse);
  rpc GetAgentRun(GetAgentRunRequest) returns (GetAgentRunResponse);
  // ---- end wave 41 lane B ----

  // ---- wave 41 lane C: timeline ----
  //
  // The conversation timeline (`PLAN:492`) and the three external-artifact verbs
  // (`PLAN:495`-`:498`).
  //
  // They live on this service for the reason the file header already gives: span
  // rows are reachable only through `UnifiedTelemetryQueryEngine`, and a read
  // model over spans is a query-engine read model or it is nothing. The three
  // verbs join them because the timeline is where an artifact link is READ, and
  // splitting the write of a link from the read of it across two services would
  // make "the RPC fallback produces the identical typed read model"
  // (exit `:1733`) a claim about two codebases instead of one.
  rpc ListAgentRunEvents(ListAgentRunEventsRequest) returns (ListAgentRunEventsResponse);

  // `AL-9`/`AL-10`: for unavailable instrumentation, backfill, correction or
  // revocation ONLY — never the normal instrumentation path. `MUTATION_ACK`
  // class, authorized principal, one audit row per call, rate-limited as a write
  // surface. Request and response are `artifact.proto`'s, which minted them and
  // left the surface to "the increment that wires it".
  rpc LinkExternalArtifact(LinkExternalArtifactRequest) returns (LinkExternalArtifactResponse);
  rpc RevokeExternalArtifactLink(RevokeExternalArtifactLinkRequest) returns (RevokeExternalArtifactLinkResponse);
  // `AL-14`: one authorized, explicitly selected artifact. There is no batch
  // resolve, because a batch resolve is a fan-out with a nicer name.
  rpc ResolveExternalArtifactLink(ResolveExternalArtifactLinkRequest) returns (ResolveExternalArtifactLinkResponse);
  // ---- end wave 41 lane C ----

}
