syntax = "proto3";

// Loop P3.5 (#722): runs and rollouts, the API a trainer drives Loop
// environments through.
//
// A person mints a run when they connect a trainer. It pins one published
// environment version and, optionally, one task dataset version, and holds the
// run's limits. The trainer then resets rollouts in it, steps each with tool
// calls, and closes it; a rollout's rewards come from its verifier VM at
// close, never from the environment it ran in. A GRPO group is the rollouts of
// one task reset together, each restored from the same snapshot.
//
// A machine credential with the `rollout:drive` scope may call
// ResetLoopRollout, StepLoopRollout, CloseLoopRollout, ForkLoopRollout,
// GetLoopRun and GetLoopRollout; every other RPC is a person's. A refusal
// carries LoopRolloutRejectionV1 and a stable code. Failures on our side are
// never billed.
//
// Same package as evaluation.proto (lock ruling L1-4), in its own FILE as
// environment.proto is. A later change adds fields; it never renames one.
package o11y_one.agentic.v1;

import "o11y_one/agentic/v1/environment.proto";
import "o11y_one/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service LoopRolloutService {
  // ---- a person's: the run ----
  // Mints a run. Its environment's base snapshot starts building now, so the
  // first reset finds it ready.
  rpc CreateLoopRun(CreateLoopRunRequest) returns (CreateLoopRunResponse);
  rpc GetLoopRun(GetLoopRunRequest) returns (GetLoopRunResponse);
  // The organization's runs, newest first.
  rpc ListLoopRuns(ListLoopRunsRequest) returns (ListLoopRunsResponse);
  // Changes the run's spend cap or environment limit.
  rpc UpdateLoopRun(UpdateLoopRunRequest) returns (UpdateLoopRunResponse);
  // New resets wait in Loop until the run resumes; rollouts in flight finish
  // and are scored.
  rpc PauseLoopRun(PauseLoopRunRequest) returns (PauseLoopRunResponse);
  rpc ResumeLoopRun(ResumeLoopRunRequest) returns (ResumeLoopRunResponse);
  // Ends the run for good: its later resets are refused with `run_stopped`.
  rpc StopLoopRun(StopLoopRunRequest) returns (StopLoopRunResponse);

  // ---- a trainer's (`rollout:drive`) ----
  // Starts a rollout and answers once its environment is ready for its first
  // step.
  rpc ResetLoopRollout(ResetLoopRolloutRequest) returns (ResetLoopRolloutResponse);
  // Runs one step's tool calls in the rollout's environment.
  rpc StepLoopRollout(StepLoopRolloutRequest) returns (StepLoopRolloutResponse);
  // Ends the rollout's episode and answers with its verifier's rewards.
  rpc CloseLoopRollout(CloseLoopRolloutRequest) returns (CloseLoopRolloutResponse);
  // Branches a running rollout into copies of its current state.
  rpc ForkLoopRollout(ForkLoopRolloutRequest) returns (ForkLoopRolloutResponse);
  rpc GetLoopRollout(GetLoopRolloutRequest) returns (GetLoopRolloutResponse);

  // ---- a person's: reads ----
  rpc ListLoopRollouts(ListLoopRolloutsRequest) returns (ListLoopRolloutsResponse);
  // A run's groups, newest first.
  rpc ListLoopRolloutGroups(ListLoopRolloutGroupsRequest) returns (ListLoopRolloutGroupsResponse);
  // The paths the rollout's verifier found changed in its final state.
  rpc GetLoopRolloutChangeList(GetLoopRolloutChangeListRequest) returns (GetLoopRolloutChangeListResponse);
  rpc GetLoopRolloutStats(GetLoopRolloutStatsRequest) returns (GetLoopRolloutStatsResponse);
  // A run's series by training step or by time.
  rpc ListLoopRunSteps(ListLoopRunStepsRequest) returns (ListLoopRunStepsResponse);
}

enum LoopTrainerFrameworkV1 {
  LOOP_TRAINER_FRAMEWORK_V1_UNSPECIFIED = 0;
  LOOP_TRAINER_FRAMEWORK_V1_TINKER = 1;
  LOOP_TRAINER_FRAMEWORK_V1_VERL = 2;
  LOOP_TRAINER_FRAMEWORK_V1_TRL = 3;
  LOOP_TRAINER_FRAMEWORK_V1_OPENRLHF = 4;
  LOOP_TRAINER_FRAMEWORK_V1_OTHER = 5;
}

// What a run is now. Where several hold, the earliest in this list wins.
enum LoopRunStateV1 {
  LOOP_RUN_STATE_V1_UNSPECIFIED = 0;
  // Stopped by a person; resets are refused with `run_stopped`.
  LOOP_RUN_STATE_V1_STOPPED = 1;
  // 24 hours without a call; resets are refused with `run_abandoned`.
  LOOP_RUN_STATE_V1_ABANDONED = 2;
  // The trainer reported its last training step and no rollout is open.
  LOOP_RUN_STATE_V1_FINISHED = 3;
  // Paused by a person; resets wait.
  LOOP_RUN_STATE_V1_PAUSED = 4;
  // No reset yet; nothing is billed.
  LOOP_RUN_STATE_V1_WAITING = 5;
  // The run's own spend cap is reached; resets are refused with
  // `run_spend_cap_reached`.
  LOOP_RUN_STATE_V1_AT_SPEND_CAP = 6;
  // The key of the run's latest call was revoked.
  LOOP_RUN_STATE_V1_CREDENTIAL_REVOKED = 7;
  // No call for 10 minutes: the run's environments were closed.
  LOOP_RUN_STATE_V1_SILENT = 8;
  // Resets wait for the plan's or the run's environment limit.
  LOOP_RUN_STATE_V1_AT_ENVIRONMENT_LIMIT = 9;
  // No environment open for 4 minutes.
  LOOP_RUN_STATE_V1_IDLE = 10;
  LOOP_RUN_STATE_V1_RUNNING = 11;
}

// Who called, as the SDK reports it on each reset. Each string is at most 64
// bytes.
message LoopClientV1 {
  // The o11y-one SDK's version, e.g. `0.3.0`.
  string sdk_version = 1;
  // The trainer adapter, e.g. `o11y_one.loop.verl`, and its version.
  string adapter = 2;
  string adapter_version = 3;
  // The trainer framework's own version, e.g. `0.9.1`.
  string framework_version = 4;
  // A UUID, random per trainer process: a new one on a run is a reconnect.
  string session_id = 5;
}

message LoopRunV1 {
  // `trn_` and the run's UUIDv7 in Crockford base32, 30 characters in all:
  // what O11Y_RUN carries. Not a secret.
  string run_id = 1;
  // 1 to 128 bytes.
  string name = 2;
  LoopTrainerFrameworkV1 framework = 3;
  string environment_id = 4;
  uint32 environment_version = 5;
  // Empty when the run names no task dataset.
  string dataset_version_id = 6;
  // 1 to 64: rollouts per task, each from the same snapshot.
  uint32 group_size = 7;
  // From 1 to the plan's limit: the run's environments open at once.
  uint32 environment_limit = 8;
  // The run's own cap, required and above 0; the organization's still
  // applies beside it.
  optional int64 spend_cap_cents = 9;
  LoopRunStateV1 state = 10;
  // The trainer's own name for the run (verl's `trainer.experiment_name`,
  // TRL's `run_name`), as its latest reset gave it; at most 128 bytes.
  string experiment_name = 11;
  // The latest reset's; absent before the first.
  LoopClientV1 client = 12;
  // The base snapshot the run's resets restore, 32 bytes; empty until it is
  // built.
  bytes base_snapshot_id = 13;
  // The latest call's key as its credential's `token_prefix` shows it:
  // `o11y_mach.` and a short head of its selector, never the whole selector.
  // Empty before one.
  string credential_prefix = 14;
  // Trainer processes seen.
  uint32 client_sessions = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp first_reset_at = 17;
  // The run's first group: from its first reset to its last rollout ready.
  optional uint32 first_group_start_millis = 18;
  google.protobuf.Timestamp first_reward_at = 19;
  // The first rollout's primary reward.
  optional double first_reward = 20;
  google.protobuf.Timestamp last_call_at = 21;
  google.protobuf.Timestamp paused_at = 22;
  // Stopped, finished or abandoned.
  google.protobuf.Timestamp ended_at = 23;
  // The environment's name and the task dataset's, with the dataset's version
  // number, as they were when the run was created; empty and 0 without a
  // dataset.
  string environment_name = 24;
  string dataset_name = 25;
  uint32 dataset_version = 26;
}

// The organization's environments open now, across its runs.
message LoopEnvironmentUsageV1 {
  uint32 open = 1;
  // The plan's limit at once.
  uint32 plan_limit = 2;
}

// Whose a rollout's failure is.
enum LoopFailureClassV1 {
  LOOP_FAILURE_CLASS_V1_UNSPECIFIED = 0;
  // The episode's or its task's, e.g. `wall_time_exceeded`: billed.
  LOOP_FAILURE_CLASS_V1_TASK = 1;
  // The verifier ran but returned no valid result: billed.
  LOOP_FAILURE_CLASS_V1_VERIFIER = 2;
  // Ours: never billed, and never in the rewards.
  LOOP_FAILURE_CLASS_V1_INFRASTRUCTURE = 3;
  // Closed by a person's Stop: billed for the time it ran.
  LOOP_FAILURE_CLASS_V1_CANCELLED = 4;
}

message LoopRolloutFailureV1 {
  LoopFailureClassV1 failure_class = 1;
  // Stable, e.g. `wall_time_exceeded` or `host_lost`; it never names our
  // configuration.
  string code = 2;
}

message LoopFailureCountsV1 {
  uint64 task = 1;
  uint64 verifier = 2;
  uint64 infrastructure = 3;
  uint64 cancelled = 4;
  // Our failures before a rollout's first step that Loop restored again.
  uint64 infrastructure_retried = 5;
}

message LoopFailureCodeCountV1 {
  LoopFailureClassV1 failure_class = 1;
  string code = 2;
  uint64 count = 3;
}

enum LoopVerdictV1 {
  LOOP_VERDICT_V1_UNSPECIFIED = 0;
  LOOP_VERDICT_V1_PASS = 1;
  LOOP_VERDICT_V1_FAIL = 2;
  LOOP_VERDICT_V1_PARTIAL = 3;
}

enum LoopRewardDeterminismV1 {
  LOOP_REWARD_DETERMINISM_V1_UNSPECIFIED = 0;
  // Offline, every input pinned: the only class in P3.
  LOOP_REWARD_DETERMINISM_V1_OFFLINE_PINNED = 1;
}

// A named reward the verifier returned: a finite number.
message LoopRewardV1 {
  string name = 1;
  double value = 2;
}

// Buckets of one reward's values: `counts[i]` is in [edges[i], edges[i + 1]),
// the last bucket closed. The edges range to the data.
message LoopHistogramV1 {
  repeated double edges = 1;
  repeated uint64 counts = 2;
}

message LoopRewardStatsV1 {
  string name = 1;
  // Rollouts with this reward.
  uint64 count = 2;
  double mean = 3;
  double p50 = 4;
  double min = 5;
  double max = 6;
  LoopRewardDeterminismV1 determinism = 7;
  LoopHistogramV1 histogram = 8;
}

// At the Loop API, over the last 15 minutes; zero without a sample.
message LoopLatencyV1 {
  uint32 reset_p50_millis = 1;
  uint32 reset_p99_millis = 2;
  // A step's time at the API less its tool calls' own.
  uint32 step_overhead_p50_micros = 3;
  uint32 step_overhead_p99_micros = 4;
  // A group's first reset to its last rollout ready.
  uint32 group_start_p50_millis = 5;
  uint32 group_start_p99_millis = 6;
}

// Where a closed rollout's time went, as Loop measured it: means, in
// milliseconds.
message LoopTimeSplitV1 {
  // Between the trainer's calls: its own sampling.
  uint64 trainer_millis = 1;
  // The tool calls in the environment.
  uint64 tool_millis = 2;
  uint64 verifier_millis = 3;
  // The trainer waiting on Loop: the reset, the steps' overhead, and close
  // until the rewards.
  uint64 reset_millis = 4;
  uint64 step_overhead_millis = 5;
  uint64 reward_wait_millis = 6;
}

// Rollouts of one run, or of one environment version, since a time.
message LoopRolloutStatsV1 {
  google.protobuf.Timestamp computed_at = 1;
  uint64 rollouts = 2;
  uint64 rollouts_open = 3;
  uint64 rollouts_rewarded = 4;
  // Closed in the last minute.
  double rollouts_per_minute = 5;
  uint64 groups = 6;
  uint64 groups_open = 7;
  // Ended groups whose rewarded rollouts, at least two, all got the same
  // primary reward: no learning signal.
  uint64 groups_without_spread = 8;
  // The verifier's verdicts.
  uint64 passed = 9;
  uint64 failed = 10;
  uint64 partial = 11;
  LoopFailureCountsV1 failures = 12;
  repeated LoopFailureCodeCountV1 failures_by_code = 13;
  // The first reward the environment declares.
  string primary_reward = 14;
  repeated LoopRewardStatsV1 rewards = 15;
  // Sandbox time in unit-seconds (1 vCPU and 2 GiB for one second): billed,
  // and ours, which never is.
  uint64 billed_unit_seconds = 16;
  uint64 our_unit_seconds = 17;
  // Billed so far plus what open rollouts reserve, at the plan's rate.
  int64 spend_cents = 18;
  // The trainer's latest training step and its last, as it reported them.
  optional uint32 trainer_step = 19;
  optional uint32 trainer_total_steps = 20;
  // The primary reward's mean at the first training step.
  optional double mean_reward_first_step = 21;
  LoopLatencyV1 latency = 22;
  LoopTimeSplitV1 time_split = 23;
  // Spans of the run's traces not kept, as the organization's event cap
  // refused them.
  uint64 dropped_spans = 24;
  // Groups with at least one failed rollout.
  uint64 groups_with_failures = 25;
  // A run's resets waiting in Loop for room now.
  uint32 resets_waiting = 26;
  // When admission first refused the run at its spend cap; cleared when the
  // cap changes.
  google.protobuf.Timestamp cap_reached_at = 27;
  // The primary reward's mean at each of the last 20 training steps, oldest
  // first.
  repeated double recent_step_means = 28;
}

enum LoopRolloutStateV1 {
  LOOP_ROLLOUT_STATE_V1_UNSPECIFIED = 0;
  // Reset, waiting for its environment.
  LOOP_ROLLOUT_STATE_V1_STARTING = 1;
  LOOP_ROLLOUT_STATE_V1_RUNNING = 2;
  // Closed; its verifier runs.
  LOOP_ROLLOUT_STATE_V1_CLOSING = 3;
  LOOP_ROLLOUT_STATE_V1_REWARDED = 4;
  // `failure` says whose and why.
  LOOP_ROLLOUT_STATE_V1_FAILED = 5;
  LOOP_ROLLOUT_STATE_V1_CANCELLED = 6;
}

// A rollout's task: a case of its run's dataset version.
message LoopTaskV1 {
  string case_revision_id = 1;
  // Set by reads: the case's title, at most 256 bytes.
  string title = 2;
}

// What the verifier found on the episode's final disk.
message LoopFinalStateV1 {
  uint64 entries = 1;
  uint64 bytes = 2;
  // Past the walk's bounds: the change list stops short.
  bool oversized = 3;
}

message LoopRolloutV1 {
  // A UUIDv7: the OpenEnv episode id.
  string rollout_id = 1;
  string run_id = 2;
  string group_id = 3;
  uint32 group_index = 4;
  uint32 group_size = 5;
  // Absent when the reset named none.
  LoopTaskV1 task = 6;
  LoopRolloutStateV1 state = 7;
  // Set when FAILED or CANCELLED.
  LoopRolloutFailureV1 failure = 8;
  // Set when REWARDED, and on a task's or a verifier's failure, as the
  // environment declares: a reward with a minimum is that minimum, one
  // without is the failure reward.
  repeated LoopRewardV1 rewards = 9;
  LoopVerdictV1 verdict = 10;
  LoopRewardDeterminismV1 determinism = 11;
  string environment_id = 12;
  uint32 environment_version = 13;
  LoopEnvironmentProfileRefV1 profile = 14;
  // The run's base snapshot, 32 bytes, and the one this rollout restored: the
  // base, or a fork's.
  bytes base_snapshot_id = 15;
  bytes restore_snapshot_id = 16;
  // A fork's copy: the rollout it was forked from, and at which step.
  string parent_rollout_id = 17;
  uint32 parent_step = 18;
  // The rollout's trace, 16 bytes.
  bytes trace_id = 19;
  uint32 step_count = 20;
  optional uint32 trainer_step = 21;
  // Set once its verifier reported.
  LoopFinalStateV1 final_state = 22;
  // Our failures before its first step that Loop restored again.
  uint32 infrastructure_retries = 23;
  google.protobuf.Timestamp created_at = 24;
  // Ready for its first step.
  google.protobuf.Timestamp ready_at = 25;
  google.protobuf.Timestamp closed_at = 26;
  google.protobuf.Timestamp verifier_started_at = 27;
  // Rewarded, failed or cancelled.
  google.protobuf.Timestamp ended_at = 28;
  // The key its reset came with, as its credential's `token_prefix` shows
  // it; empty for a person's reset.
  string credential_prefix = 29;
}

// A command, run without a shell.
message LoopToolExecV1 {
  // 1 to 64 arguments, each at most 4 KiB.
  repeated string argv = 1;
  // Per stream: 0 means 1 MiB, and at most 16 MiB.
  uint32 output_cap_bytes = 2;
}

// A script for `/bin/sh -c`.
message LoopToolShellV1 {
  // 1 byte to 64 KiB.
  string script = 1;
  uint32 output_cap_bytes = 2;
}

// A file of at most 64 MiB, as the call's result's `file`: its bytes from
// `offset`, at most `length` of them. Read a file larger than the step's
// response in ranges.
message LoopToolReadFileV1 {
  // Absolute, at most 4 KiB.
  string path = 1;
  uint64 offset = 2;
  // 0: to the file's end.
  uint64 length = 3;
}

message LoopToolWriteFileV1 {
  string path = 1;
  // With the rest of the call, within one 1 MiB tool frame: write a larger
  // file as one call, then appending ones.
  bytes data = 2;
  // Otherwise the file is truncated first.
  bool append = 3;
}

// Replaces `old` with `new` exactly `count` times, or fails and leaves the file
// as it was.
message LoopToolPatchV1 {
  string path = 1;
  // Not empty.
  bytes old = 2;
  bytes new = 3;
  // From 1.
  uint32 count = 4;
}

// One level of a directory, at most 10,000 entries.
message LoopToolListV1 {
  string path = 1;
}

// Sets variables for the rollout's later calls.
message LoopToolSetEnvV1 {
  // NAME=value, at most 256 entries and 64 KiB.
  repeated string env = 1;
}

message LoopToolCallV1 {
  // From 1 to the environment's wall time.
  uint32 timeout_millis = 1;
  // Unset runs the call as the image's user. Root is allowed.
  optional uint32 uid = 2;
  oneof call {
    LoopToolExecV1 exec = 3;
    LoopToolShellV1 shell = 4;
    LoopToolReadFileV1 read_file = 5;
    LoopToolWriteFileV1 write_file = 6;
    LoopToolPatchV1 patch = 7;
    LoopToolListV1 list = 8;
    LoopToolSetEnvV1 set_env = 9;
  }
}

enum LoopToolEntryKindV1 {
  LOOP_TOOL_ENTRY_KIND_V1_UNSPECIFIED = 0;
  LOOP_TOOL_ENTRY_KIND_V1_FILE = 1;
  LOOP_TOOL_ENTRY_KIND_V1_DIRECTORY = 2;
  LOOP_TOOL_ENTRY_KIND_V1_SYMLINK = 3;
  LOOP_TOOL_ENTRY_KIND_V1_OTHER = 4;
}

message LoopToolEntryV1 {
  // Lossy UTF-8, at most 255 bytes.
  string name = 1;
  LoopToolEntryKindV1 kind = 2;
  uint64 size = 3;
}

// How one call ended, and what it wrote. Output, file bytes and entries stop at
// the call's cap.
message LoopToolResultV1 {
  oneof outcome {
    // An exec or shell call's main process exited with this code,
    int32 exit_code = 1;
    // or was killed by this signal.
    int32 signal = 2;
    // A read_file, write_file, patch, list or set_env call succeeded.
    bool done = 3;
    // The call failed before or instead of running: a stable code, e.g.
    // `tool_call_invalid`.
    string error = 4;
  }
  // The call outlived its timeout and was killed.
  bool timed_out = 5;
  bytes stdout = 6;
  bytes stderr = 7;
  bytes file = 8;
  repeated LoopToolEntryV1 entries = 9;
  // The call reached a cap, or the step's response its 4 MiB, so what is
  // here stops short.
  bool truncated = 10;
  uint32 duration_millis = 11;
  // Before the response's cut: what the environment sent of each stream, and
  // the file's size.
  uint64 stdout_bytes = 12;
  uint64 stderr_bytes = 13;
  uint64 file_bytes = 14;
}

message CreateLoopRunRequest {
  string name = 1;
  LoopTrainerFrameworkV1 framework = 2;
  string environment_id = 3;
  // A published version.
  uint32 environment_version = 4;
  // Absent: the run names no task dataset.
  string dataset_version_id = 5;
  uint32 group_size = 6;
  uint32 environment_limit = 7;
  // Required, above 0: absent or 0 is INVALID_ARGUMENT
  // `run_spend_cap_required`.
  optional int64 spend_cap_cents = 8;
  // A UUID the client picks. A repeat with the same id returns the run the
  // first created.
  string request_id = 9;
}

message CreateLoopRunResponse {
  LoopRunV1 run = 1;
}

message GetLoopRunRequest {
  string run_id = 1;
}

message GetLoopRunResponse {
  LoopRunV1 run = 1;
  LoopRolloutStatsV1 stats = 2;
  LoopEnvironmentUsageV1 usage = 3;
}

message ListLoopRunsRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  // Absent: every run. With an environment, only runs of it; with a version
  // too, only of that version.
  string environment_id = 2;
  uint32 environment_version = 3;
  // Each run's stats count its rollouts since then; absent, since it began.
  google.protobuf.Timestamp since = 4;
}

message LoopRunSummaryV1 {
  LoopRunV1 run = 1;
  LoopRolloutStatsV1 stats = 2;
}

message ListLoopRunsResponse {
  repeated LoopRunSummaryV1 runs = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  LoopEnvironmentUsageV1 usage = 3;
  // The organization's rollouts closed in each of the last 60 minutes, oldest
  // first.
  repeated uint32 organization_rollouts_per_minute = 4;
}

// An absent field is left as it is.
message UpdateLoopRunRequest {
  string run_id = 1;
  // Above 0: a cap is changed, never cleared (`run_spend_cap_required`).
  optional int64 spend_cap_cents = 2;
  optional uint32 environment_limit = 3;
}

message UpdateLoopRunResponse {
  LoopRunV1 run = 1;
}

message PauseLoopRunRequest {
  string run_id = 1;
}

message PauseLoopRunResponse {
  LoopRunV1 run = 1;
}

message ResumeLoopRunRequest {
  string run_id = 1;
}

message ResumeLoopRunResponse {
  LoopRunV1 run = 1;
}

message StopLoopRunRequest {
  string run_id = 1;
  // Close the rollouts in flight now, as `rollout_cancelled` with no reward.
  // Otherwise they finish and are scored.
  bool close_in_flight = 2;
}

message StopLoopRunResponse {
  LoopRunV1 run = 1;
}

message ResetLoopRolloutRequest {
  string run_id = 1;
  // A UUID the client picks. A repeat with the same id returns the rollout
  // the first started.
  string request_id = 2;
  // A UUID the client picks for the rollout's group, the same on each of its
  // resets. Absent: the rollout is a group of its own.
  string group_id = 3;
  // From 0, below `group_size`.
  uint32 group_index = 4;
  // 1 to 64; absent takes the run's.
  uint32 group_size = 5;
  // A case revision of the run's dataset version. Absent: none.
  string case_revision_id = 6;
  // The trainer's training step and its last, for the run's charts.
  optional uint32 trainer_step = 7;
  optional uint32 trainer_total_steps = 8;
  // At most 128 bytes.
  string experiment_name = 9;
  LoopClientV1 client = 10;
}

message ResetLoopRolloutResponse {
  LoopRolloutV1 rollout = 1;
}

message StepLoopRolloutRequest {
  string rollout_id = 1;
  // 1 to 16, run at once. Each fits one 1 MiB tool frame, and together they
  // are at most 4 MiB encoded; past either, the step is INVALID_ARGUMENT
  // `step_too_large` and no call runs.
  repeated LoopToolCallV1 calls = 2;
  // The assistant message the calls came from, exactly as the model emitted
  // it (content and tool calls), as JSON; at most 1 MiB. Kept with the step for
  // exports; nothing in Loop reads inside it.
  string model_message_json = 3;
}

message StepLoopRolloutResponse {
  // The rollout's step, from 1.
  uint32 step = 1;
  // One per call, in order, at most 4 MiB encoded in all: a common client's
  // decode limit. Each call keeps its outcome, and the calls share the rest
  // for their stdout, stderr, file bytes and entries, each up to an equal
  // share and what one leaves going to the others. A call cut short has
  // `truncated` set.
  repeated LoopToolResultV1 results = 2;
}

message CloseLoopRolloutRequest {
  string rollout_id = 1;
}

message CloseLoopRolloutResponse {
  LoopRolloutV1 rollout = 1;
  // The verifier had not reported within the call's wait: read the rollout
  // again.
  bool pending = 2;
}

message ForkLoopRolloutRequest {
  string rollout_id = 1;
  // 2 to 64: the copies, the rollout itself among them as the first.
  uint32 copies = 2;
  // A UUID the client picks. A repeat with the same id returns the first's
  // copies.
  string request_id = 3;
}

message ForkLoopRolloutResponse {
  // The rollout itself first, then its new copies, each ready for its next
  // step.
  repeated LoopRolloutV1 rollouts = 1;
}

message GetLoopRolloutRequest {
  string rollout_id = 1;
}

message GetLoopRolloutResponse {
  LoopRolloutV1 rollout = 1;
}

message ListLoopRolloutsRequest {
  string run_id = 1;
  // Each filter set narrows; absent ones don't.
  string group_id = 2;
  optional uint32 trainer_step = 3;
  LoopRolloutStateV1 state = 4;
  LoopFailureClassV1 failure_class = 5;
  o11y_one.common.v1.PageRequestV1 page = 6;
}

message ListLoopRolloutsResponse {
  repeated LoopRolloutV1 rollouts = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
}

enum LoopRolloutGroupFilterV1 {
  // Every group.
  LOOP_ROLLOUT_GROUP_FILTER_V1_UNSPECIFIED = 0;
  LOOP_ROLLOUT_GROUP_FILTER_V1_OPEN = 1;
  LOOP_ROLLOUT_GROUP_FILTER_V1_WITHOUT_SPREAD = 2;
  LOOP_ROLLOUT_GROUP_FILTER_V1_WITH_FAILURES = 3;
}

message ListLoopRolloutGroupsRequest {
  string run_id = 1;
  LoopRolloutGroupFilterV1 filter = 2;
  o11y_one.common.v1.PageRequestV1 page = 3;
}

message LoopRolloutBriefV1 {
  string rollout_id = 1;
  uint32 group_index = 2;
  LoopRolloutStateV1 state = 3;
  LoopFailureClassV1 failure_class = 4;
  optional double primary_reward = 5;
  uint32 infrastructure_retries = 6;
}

message LoopRolloutGroupV1 {
  string group_id = 1;
  LoopTaskV1 task = 2;
  uint32 size = 3;
  uint32 rewarded = 4;
  uint32 open = 5;
  // Of the primary reward, over its rewarded rollouts.
  optional double mean = 6;
  // max - min; 0 is no learning signal.
  optional double spread = 7;
  // From the group's first reset to its last rollout ready.
  optional uint32 start_millis = 8;
  optional uint32 trainer_step = 9;
  google.protobuf.Timestamp created_at = 10;
  // By `group_index`.
  repeated LoopRolloutBriefV1 rollouts = 11;
}

message ListLoopRolloutGroupsResponse {
  repeated LoopRolloutGroupV1 groups = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
}

message GetLoopRolloutChangeListRequest {
  string rollout_id = 1;
  // 1 to 1,000 items a page; absent takes 1,000.
  o11y_one.common.v1.PageRequestV1 page = 2;
}

enum LoopChangeKindV1 {
  LOOP_CHANGE_KIND_V1_UNSPECIFIED = 0;
  LOOP_CHANGE_KIND_V1_FILE = 1;
  LOOP_CHANGE_KIND_V1_DIRECTORY = 2;
  LOOP_CHANGE_KIND_V1_SYMLINK = 3;
  // A deletion in the episode's overlay.
  LOOP_CHANGE_KIND_V1_WHITEOUT = 4;
  LOOP_CHANGE_KIND_V1_OTHER = 5;
  LOOP_CHANGE_KIND_V1_OPAQUE_DIRECTORY = 6;
}

message LoopChangeEntryV1 {
  // Exactly as on the disk, which may not be UTF-8.
  bytes path = 1;
  LoopChangeKindV1 kind = 2;
  uint64 size = 3;
  // A regular file's SHA-256; empty otherwise.
  bytes sha256 = 4;
  bytes symlink_target = 5;
  uint32 mode = 6;
}

// A page of the change list in its own order: the entries, then the declared
// paths missing from the final state, then those the verifier put back from
// the pristine tree or removed.
message GetLoopRolloutChangeListResponse {
  repeated LoopChangeEntryV1 entries = 1;
  repeated string missing = 2;
  repeated bytes put_back = 3;
  repeated bytes removed = 4;
  o11y_one.common.v1.PageResponseV1 page = 5;
}

message LoopEnvironmentVersionRefV1 {
  string environment_id = 1;
  uint32 version = 2;
}

message GetLoopRolloutStatsRequest {
  oneof scope {
    string run_id = 1;
    LoopEnvironmentVersionRefV1 environment_version = 2;
  }
  // Absent: since the scope began.
  google.protobuf.Timestamp since = 3;
}

message GetLoopRolloutStatsResponse {
  LoopRolloutStatsV1 stats = 1;
}

enum LoopRunStepBucketV1 {
  LOOP_RUN_STEP_BUCKET_V1_UNSPECIFIED = 0;
  // By the training step the trainer reported on each reset.
  LOOP_RUN_STEP_BUCKET_V1_TRAINER_STEP = 1;
  // By the minute each rollout closed: a bucket's `rollouts` closed in it.
  LOOP_RUN_STEP_BUCKET_V1_MINUTE = 2;
  // As MINUTE, by five minutes.
  LOOP_RUN_STEP_BUCKET_V1_FIVE_MINUTES = 3;
}

message ListLoopRunStepsRequest {
  string run_id = 1;
  LoopRunStepBucketV1 bucket = 2;
  // Absent: since the run began.
  google.protobuf.Timestamp since = 3;
  o11y_one.common.v1.PageRequestV1 page = 4;
}

// One bucket of a run's rollouts. The rewards are the primary reward's.
message LoopRunStepV1 {
  // Set for TRAINER_STEP buckets.
  optional uint32 trainer_step = 1;
  google.protobuf.Timestamp start = 2;
  uint64 rollouts = 3;
  uint64 rewarded = 4;
  optional double mean = 5;
  optional double p10 = 6;
  optional double p90 = 7;
  optional double stddev = 8;
  // The highest group mean.
  optional double best_group_mean = 9;
  uint64 groups = 10;
  uint64 groups_without_spread = 11;
  LoopFailureCountsV1 failures = 12;
  int64 spend_cents = 13;
  // The most environments open at once: the run's, and the organization's
  // across its runs.
  uint32 open_max = 14;
  uint32 organization_open_max = 15;
  // A trainer process the run had not seen began in this bucket.
  bool reconnected = 16;
  // A rollout's mean wait on Loop (its reset, its steps' overhead and its
  // close until the rewards), and the bucket's wall time, from its first
  // reset to its last rollout's end.
  uint64 wait_millis = 17;
  uint64 wall_millis = 18;
}

message ListLoopRunStepsResponse {
  repeated LoopRunStepV1 steps = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
}

// The detail every LoopRolloutService refusal carries.
message LoopRolloutRejectionV1 {
  // Stable, e.g. `run_spend_cap_reached` or `plan_concurrency_reached`; it
  // never names our configuration.
  string reason_code = 1;
  // When a retry may be admitted.
  optional uint64 retry_after_millis = 2;
  // The limit a concurrency refusal met.
  optional uint32 limit = 3;
}
