// ListAgentRuns*, GetAgentRun*, AgentRunEventV1, ListAgentRunEvents*, and the
// external-artifact link RPCs) are defined in `trace_view.proto`, beside the
// trace shapes they carry. `LinkExternalArtifactRequest` and
// `LinkExternalArtifactResponse` are defined in `artifact.proto`.
// ---------------------------------------------------------------------------
