// NAMES RESERVED FOR THE SIBLING LANES
//
// proto3 has no top-level name reservation, so this is the reservation: lanes B
// and C define these in their own blocks below, and lane A defines none of them.
//
//   Lane B (summary index):
//     AgentRunSummaryV1, AgentRunEvaluationCoverageV1,
//     AgentRunInstrumentationCompletenessV1, AgentRunListFilterV1,
//     AgentRunOutcomeV1, ListAgentRunsRequest, ListAgentRunsResponse,
//     GetAgentRunRequest, GetAgentRunResponse
//
//   Lane C (timeline and external artifacts):
//     AgentRunTimelineModeV1, AgentRunEventKindV1, AgentRunEventKindCoverageV1,
//     AgentRunEventV1, ListAgentRunEventsRequest, ListAgentRunEventsResponse,
//     RevokeExternalArtifactLinkRequest, RevokeExternalArtifactLinkResponse,
//     ResolveExternalArtifactLinkRequest, ResolveExternalArtifactLinkResponse
//
// `AgentRunEventKindCoverageV1` collides with nothing lane A mints: lane A's
// completeness message is `ConversationCompletenessV1`, which is SM-11 — a
// CONVERSATION lifecycle — and not an instrumentation-coverage statement.
// `LinkExternalArtifactRequest` / `LinkExternalArtifactResponse` already exist in
// `artifact.proto` and are wired by lane C rather than re-minted.
// ---------------------------------------------------------------------------
// ---- end wave 41 lane A ----

// ---- wave 41 lane B: summary index ----
//
// POINTER ONLY. The nine names lane A reserved above are defined in
// `trace_view.proto`, not here, and the reason is an import cycle rather than a
// preference: `trace_view.proto:47` already imports THIS file (for lane A's
// `ConfirmAgentRunGrouping`), while every lane-B message carries at least one
// shape defined there — `TraceFaultBreakdownV1`, `TraceFirstFailureV1`,
// `TraceSpanCostRollupV1`, `TraceOperationKindV1`, `TraceWindowV1`,
// `TraceSpanPopulationBoundaryV1`. Defining them here would need the reverse
// import, or a second minting of the fault and cost shapes.
//
// The names remain reserved and remain unique in the package: one prost module
// per package (lock ruling `L1-4`), so `AgentRunSummaryV1` means one thing
// whichever file a reader opens.
// ---- end wave 41 lane B ----

// ---- wave 41 lane C: timeline ----
//
// POINTER ONLY, for the reason lane B records above: `trace_view.proto` imports
// THIS file, and every lane-C message carries at least one shape defined there —
// `TraceSpanCostV1`, `TraceSpanContentRefV1`, `TraceOperationKindV1`,
// `TraceSpanStatusV1`, `TraceFaultCategoryV1`, `TraceFirstFailureV1`,
// `TraceWindowV1`, `TraceReadRefusalV1`. Defining them here would need the
// reverse import or a second minting of the cost and fault shapes.
//
// The ten names lane A reserved for lane C are defined in `trace_view.proto`,
// alongside the seventeen supporting messages and three supporting enums the
// timeline needs. `LinkExternalArtifactRequest` / `LinkExternalArtifactResponse`
// are NOT re-minted: they already exist in `artifact.proto` and lane C wires the
// service block they were waiting for.
// ---- end wave 41 lane C ----
