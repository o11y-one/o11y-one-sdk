// How much to trust the token counts in an ExperimentRunTokenUsageSummaryV1.
enum ExperimentRunTokenUsageCompletenessV1 {
  EXPERIMENT_RUN_TOKEN_USAGE_COMPLETENESS_V1_UNSPECIFIED = 0;
  // Counts were recorded at execution time from the provider response.
  EXPERIMENT_RUN_TOKEN_USAGE_COMPLETENESS_V1_EXACT = 1;
  // Counts were re-derived from a byte-capped artifact preview because the
  // execution predates write-time recording. Treat as a lower bound.
  EXPERIMENT_RUN_TOKEN_USAGE_COMPLETENESS_V1_ESTIMATED_LEGACY_PREVIEW = 2;
  // As above, and at least one preview was truncated or unparseable, so counts
  // are known to be missing contributions. Never display as a total.
  EXPERIMENT_RUN_TOKEN_USAGE_COMPLETENESS_V1_ESTIMATED_INCOMPLETE = 3;
  // Nothing was recorded and nothing could be estimated; the zeros are the
  // absence of data, not a measurement of zero.
  EXPERIMENT_RUN_TOKEN_USAGE_COMPLETENESS_V1_NOT_RECORDED = 4;
}

// Whether the scorers being compared graded the same candidate output.
enum ExperimentRunComparisonAlignmentV1 {
  EXPERIMENT_RUN_COMPARISON_ALIGNMENT_V1_UNSPECIFIED = 0;
  // Every scorer in the run graded one shared candidate output per item.
  EXPERIMENT_RUN_COMPARISON_ALIGNMENT_V1_ALIGNED = 1;
  // Legacy suite expansion executed the candidate once per scorer, so scorers
  // within one item graded different sampled outputs. Cross-scorer differences
  // are not attributable to the scorers.
  EXPERIMENT_RUN_COMPARISON_ALIGNMENT_V1_LEGACY_UNALIGNED_SUBJECTS = 2;
}

