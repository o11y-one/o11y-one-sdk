message GetAgenticEvidenceGraphRequest {
  oneof scope {
    string trace_id = 1;
    string session_id = 2;
    string dataset_item_id = 3;
    string eval_job_id = 4;
    string experiment_run_item_id = 5;
    string release_gate_evaluation_id = 6;
    string annotation_task_id = 7;
    // Wave 41 lane A. The EIGHTH arm, taking field 9 because 8 is `node_limit`.
    //
    // `PLAN:1709` was ticked in wave 37 as NOT NEEDED YET, with its own reversal
    // trigger written into the tick: "the wave that lands the agent-run grouping
    // plane adds the eighth arm in the same change". That plane lands in this
    // wave, so the arm lands with it — an id that names nothing was the whole
    // reason to wait, and it now names something.
    //
    // Scoped by the agent run's CANONICAL id; a stale id resolves through the
    // grouping redirect rather than answering `NOT_FOUND`. The graph is built
    // over the run's member traces through the same trace arm above, so a run of
    // one trace and that trace itself produce the same evidence.
    string agent_run_id = 9;
  }
  optional uint32 node_limit = 8;
}

message GetAgenticEvidenceGraphResponse {
  AgenticEvidenceGraphV1 graph = 1;
}

