    RecordedOutputCandidateV1 recorded_output = 4;
    ProviderPromptCandidateV1 provider_prompt = 5;
    HttpJsonEndpointCandidateV1 http_json_endpoint = 6;
    ExperimentTargetRefCandidateV1 experiment_target_ref = 7;
    AgentReleaseRevisionCandidateV1 agent_release_revision = 8;
    ExternallyExecutedCandidateV1 externally_executed = 9;
    ConversationSimulationCandidateV1 conversation_simulation = 10;
    ReplayCandidateV1 replay = 19;
  }
