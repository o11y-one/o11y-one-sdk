enum EvaluationScorerTargetKindV1 {
  EVALUATION_SCORER_TARGET_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_TARGET_KIND_V1_SUITE_REF = 1;
  EVALUATION_SCORER_TARGET_KIND_V1_EXPLICIT_LIST = 2;
}

message EvaluationScorerSelectionV1 {
  string score_config_id = 1;
  optional double weight = 2;
  optional bool is_blocking_gate = 3;
}

message EvaluationScorerTargetV1 {
  EvaluationScorerTargetKindV1 kind = 1;
  optional string scorer_suite_id = 2;
  repeated EvaluationScorerSelectionV1 scorers = 3;
}

// ===========================================================================
// Scorer suites
//
// A suite is members referenced by `score_config_id`, a version discriminator,
// and ONE declarative combine rule. It does not execute: it writes no result
// row, it has no `score_config_id` of its own, and it appears in no projection
// table. Its rollup and its matrix cell are COMPUTED from the member evidence,
// which is what makes "a suite adds one row, never replaces five" structural
// rather than a rule a future writer could break — the members' rows are the
// only place the evidence lives.
// ===========================================================================

enum EvaluationScorerSuiteCombineRuleV1 {
  EVALUATION_SCORER_SUITE_COMBINE_RULE_V1_UNSPECIFIED = 0;
  // All blocking gates must pass; the reported number is the weighted mean of
  // the NON-gate members. Declarative — the rule is data, and no code runs per
  // suite.
  //
  // A member with no score is excluded from BOTH the numerator and the
  // denominator of that mean. It is never zero-filled: a scorer that errored is
  // not a scorer that scored zero. And a failing gate zeroes nothing — the mean
  // is still computed and still reported beside the failure, because "which of
  // the five went wrong, and how did the other four do" is the question the
  // suite exists to answer.
  EVALUATION_SCORER_SUITE_COMBINE_RULE_V1_GATES_THEN_WEIGHTED_MEAN = 1;
}

message EvaluationScorerSuiteMemberV1 {
  string score_config_id = 1;
  string config_key = 2;
  // Absent means 1.0 at combine time. Ignored for a blocking gate, which is
  // adjudicated rather than averaged.
  optional double weight = 3;
  bool is_blocking_gate = 4;
}

message EvaluationScorerSuiteV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string name = 3;
  // `v0` on first authorship, `v{n+1}` on each revision. The same spelling as
  // `EvaluationScorerConfigV1.version_discriminator`, so "which version did
  // this run freeze" has one vocabulary.
  string version_discriminator = 4;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 5;
  repeated EvaluationScorerSuiteMemberV1 members = 6;
  google.protobuf.Timestamp created_at = 7;
  // (#611) One per CODE member, in author order.
  repeated EvaluationScorerSuiteCodeMemberV1 code_members = 8;
}

// What a launch froze. Its own message rather than a reuse of the one above,
// because a snapshot has no `created_at` and must never gain a field that
// moves.
message EvaluationScorerSuiteSnapshotV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string version_discriminator = 3;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 4;
  repeated EvaluationScorerSuiteMemberV1 members = 5;
}

// The suite, read across a whole run. ONE row on the overview; the members keep
// every row they have in `scorer_rollups`, and this one references them rather
// than replacing them.
message EvaluationScorerSuiteRollupV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string version_discriminator = 3;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 4;
  // References into `scorer_rollups`, where the member evidence still lives.
  // Not a copy of it.
  repeated string member_score_config_id = 5;
  // Absent when a blocking gate has no verdict yet — "not yet" and "failed" are
  // different customer situations and must not render identically. The
  // availability below carries which.
  optional bool gates_passed = 6;
  MetricAvailabilityV1 gates_availability = 7;
  repeated string failed_gate_config_key = 8;
  // The weighted mean of the non-gate members. Reported even when a gate
  // failed.
  optional double weighted_mean_score = 9;
  MetricAvailabilityV1 weighted_mean_availability = 10;
  // The gates' answer, and only the gates' answer. There is no suite pass
  // threshold in this build: a threshold is a decision rule, and the decision
  // plane owns verdict thresholds.
  EvaluationVerdictV1 verdict = 11;
  EvaluationFreshnessV1 freshness = 12;
}

// The suite, read at one matrix coordinate. ONE cell per candidate per row; the
// member cells stay in `EvaluationMatrixRowV1.cells`.
message EvaluationScorerSuiteCellV1 {
  string candidate_key = 1;
  string scorer_suite_id = 2;
  string suite_key = 3;
  optional bool gates_passed = 4;
  repeated string failed_gate_config_key = 5;
  optional double weighted_mean_score = 6;
  MetricAvailabilityV1 weighted_mean_availability = 7;
  EvaluationVerdictV1 verdict = 8;
  // How many member cells this was computed from, so a thin coordinate is
  // visible as thin rather than as an aggregate that looks complete.
  uint32 member_cell_count = 9;
}

message EvaluationExecutionPolicyV1 {
  uint32 max_concurrency = 1;
  uint32 per_candidate_timeout_seconds = 2;
  uint32 max_attempts = 3;
  uint32 retry_backoff_seconds = 4;
}

// Candidate and evaluator spend are separate budgets, never one number: a run
// stopped by evaluator cost is a different customer situation from one stopped
// by candidate cost.
message EvaluationBudgetV1 {
  optional CostAmountV1 candidate_budget = 1;
  optional CostAmountV1 evaluator_budget = 2;
  optional CostAmountV1 total_budget = 3;
  optional uint32 max_execution_count = 4;
}

enum EvaluationDecisionRuleKindV1 {
  EVALUATION_DECISION_RULE_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_DECISION_RULE_KIND_V1_MIN_SCORE = 1;
  EVALUATION_DECISION_RULE_KIND_V1_MAX_REGRESSION = 2;
  EVALUATION_DECISION_RULE_KIND_V1_MAX_COST = 3;
  EVALUATION_DECISION_RULE_KIND_V1_MIN_COVERAGE = 4;
}

message EvaluationDecisionRuleV1 {
  EvaluationDecisionRuleKindV1 kind = 1;
  optional string metric_key = 2;
  optional double threshold = 3;
  optional CostAmountV1 cost_threshold = 4;
}

message EvaluationDecisionPolicyV1 {
  repeated EvaluationDecisionRuleV1 rules = 1;
  optional string reference_candidate_key = 2;
  optional double minimum_confidence = 3;
}

// Sampling is frozen with the policy so a review verdict can never be read as
// covering cases the sampler never selected.
message EvaluationReviewSamplingPolicyV1 {
  optional double sample_rate = 1;
  optional uint32 max_sampled_cases = 2;
  optional uint32 reviewers_per_case = 3;
}

message EvaluationHumanReviewPolicyV1 {
  bool enabled = 1;
  optional EvaluationReviewSamplingPolicyV1 sampling = 2;
  optional string rubric_score_config_id = 3;
  // #656. Each unit compares its candidate against the decision policy's
  // reference candidate, and the reviewer also picks a winner. Needs a reference
  // and at least one other candidate, else INVALID_ARGUMENT
  // `pairwise_review_needs_reference_and_challenger`. The reference's own units
  // are not pairwise. Absent is false, so a manifest frozen before this stays
  // non-pairwise.
  optional bool pairwise = 4;
}

// The authored content. Everything a definition revision freezes and a run
// manifest later pins.
//
// `idempotency_key` is deliberately absent: it belongs to CreateEvaluationRun,
// because the same draft may be launched twice on purpose.
message EvaluationDefinitionDraftV1 {
  string display_name = 1;
  optional string description = 2;
  repeated EvaluationCohortSpecV1 cohorts = 3;
  repeated EvaluationCandidateV1 candidates = 4;
  EvaluationScorerTargetV1 scorer_target = 5;
  uint32 trials = 6;
  EvaluationExecutionPolicyV1 execution_policy = 7;
  EvaluationBudgetV1 budget = 8;
  EvaluationDecisionPolicyV1 decision_policy = 9;
  EvaluationLaunchModeV1 launch_mode = 10;
  EvaluationHumanReviewPolicyV1 human_review_policy = 11;
  repeated MetadataEntryV1 metadata = 12;
  // Where `trials` came from. Set by the server at the one draft-acceptance
  // resolution point, on create and on update alike, and never trusted from the
  // client: an authored 5 and a defaulted 5 are the same integer and are not
  // the same fact, and a stored revision that cannot tell them apart cannot
  // explain its own bill.
  EvaluationTrialsSourceV1 trials_source = 13;
}

// Whether a stored draft's trial count was typed by its author or resolved from
// the draft's own shape.
//
// The two defaults are named separately, so `COMPARISON_DEFAULT_TRIALS` is
// traceable from a stored revision without re-deriving it from the candidate
// count the revision also happens to carry.
enum EvaluationTrialsSourceV1 {
  EVALUATION_TRIALS_SOURCE_V1_UNSPECIFIED = 0;
  // The author stated a trial count, including an author who stated 1.
  EVALUATION_TRIALS_SOURCE_V1_AUTHORED = 1;
  // Unstated, and the draft compares two or more candidates: defaulted to the
  // repeat floor so the comparison renders a verdict.
  EVALUATION_TRIALS_SOURCE_V1_COMPARISON_DEFAULT = 2;
  // Unstated, and the draft measures one candidate: defaulted to 1.
  EVALUATION_TRIALS_SOURCE_V1_SINGLE_CANDIDATE_DEFAULT = 3;
}

// ===========================================================================
// Definition, revision, and list projection
// ===========================================================================

// Bounded reference to the newest run. Absent while no run exists; its
// availability says which of "no runs yet" and "run data unreadable" holds,
// so the list row never renders an absence as a zero.
message EvaluationRunSummaryRefV1 {
  string evaluation_run_id = 1;
  string definition_revision_id = 2;
  EvaluationRunStateV1 state = 3;
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  optional string decision_summary = 6;
}

message EvaluationDefinitionV1 {
  string definition_id = 1;
  string tenant_id = 2;
  string org_id = 3;
  string definition_key = 4;
  string display_name = 5;
  optional string description = 6;
  string current_revision_id = 7;
  uint64 revision_number = 8;
  EvaluationDefinitionStateV1 state = 9;
  repeated MetadataEntryV1 metadata = 10;
  PrincipalRefV1 created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional EvaluationRunSummaryRefV1 latest_run = 14;
  MetricAvailabilityV1 latest_run_availability = 15;
  uint32 run_count = 16;
  repeated AllowedActionV1 allowed_actions = 17;
}

message EvaluationDefinitionRevisionV1 {
  string revision_id = 1;
  string definition_id = 2;
  string tenant_id = 3;
  string org_id = 4;
  uint64 revision_number = 5;
  // sha256 hex over the canonical protobuf encoding of `draft`.
  string content_digest = 6;
  EvaluationDefinitionDraftV1 draft = 7;
  uint32 draft_schema_version = 8;
  PrincipalRefV1 created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  optional string change_summary = 11;
  optional string source_revision_id = 12;
}

// The list row. Carries the latest-run summary and run count inline so the
// evaluations screen answers its primary question in one round trip.
message EvaluationDefinitionSummaryV1 {
  string definition_id = 1;
  string tenant_id = 2;
  string org_id = 3;
  string definition_key = 4;
  string display_name = 5;
  optional string description = 6;
  EvaluationDefinitionStateV1 state = 7;
  string current_revision_id = 8;
  uint64 revision_number = 9;
  PrincipalRefV1 created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional EvaluationRunSummaryRefV1 latest_run = 13;
  MetricAvailabilityV1 latest_run_availability = 14;
  uint32 run_count = 15;
  repeated AllowedActionV1 allowed_actions = 16;
  EvaluationFreshnessV1 freshness = 17;
}

// ===========================================================================
// Authoring RPC messages
// ===========================================================================

// Metadata is deliberately absent here: it lives on the draft, which is the
// digested content. A second metadata field on the request would be a second
// authority for the same state, and the two would disagree on the first edit.
message CreateEvaluationDefinitionRequest {
  string definition_key = 1;
  EvaluationDefinitionDraftV1 draft = 2;
  optional string change_summary = 3;
}

message CreateEvaluationDefinitionResponse {
  EvaluationDefinitionV1 definition = 1;
  EvaluationDefinitionRevisionV1 revision = 2;
}

enum EvaluationDefinitionConflictSectionV1 {
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_UNSPECIFIED = 0;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_IDENTITY = 1;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_COHORTS = 2;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_CANDIDATES = 3;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_SCORERS = 4;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_EXECUTION_POLICY = 5;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_BUDGET = 6;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_DECISION_POLICY = 7;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_HUMAN_REVIEW = 8;
  EVALUATION_DEFINITION_CONFLICT_SECTION_V1_METADATA = 9;
}

// Returned as ABORTED detail on an optimistic-concurrency conflict: which
// sections moved remotely, plus the server copy, so the builder can reconcile
// rather than ask the author to retype the edit.
message EvaluationDefinitionConflictV1 {
  uint64 expected_revision_number = 1;
  uint64 current_revision_number = 2;
  string current_revision_id = 3;
  repeated EvaluationDefinitionConflictSectionV1 changed_sections = 4;
  EvaluationDefinitionRevisionV1 server_revision = 5;
}

message UpdateEvaluationDefinitionRequest {
  string definition_id = 1;
  // The revision number the author edited from. A mismatch is ABORTED.
  uint64 expected_revision_number = 2;
  EvaluationDefinitionDraftV1 draft = 3;
  optional string change_summary = 4;
  optional EvaluationDefinitionStateV1 state = 5;
}

message UpdateEvaluationDefinitionResponse {
  EvaluationDefinitionV1 definition = 1;
  EvaluationDefinitionRevisionV1 revision = 2;
  // Set only when the update was rejected as a conflict and the caller asked
  // for reconcile detail; the RPC itself returns ABORTED in that case.
  optional EvaluationDefinitionConflictV1 conflict = 3;
}

message GetEvaluationDefinitionRequest {
  string definition_id = 1;
  // Absent means the current revision.
  optional string revision_id = 2;
}

message GetEvaluationDefinitionResponse {
  EvaluationDefinitionV1 definition = 1;
  EvaluationDefinitionRevisionV1 revision = 2;
  EvaluationFreshnessV1 freshness = 3;
}

enum EvaluationDefinitionSortKeyV1 {
  EVALUATION_DEFINITION_SORT_KEY_V1_UNSPECIFIED = 0;
  EVALUATION_DEFINITION_SORT_KEY_V1_CREATED_AT = 1;
  EVALUATION_DEFINITION_SORT_KEY_V1_UPDATED_AT = 2;
  EVALUATION_DEFINITION_SORT_KEY_V1_DISPLAY_NAME = 3;
}

message ListEvaluationDefinitionsRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  optional EvaluationDefinitionStateV1 state_filter = 2;
  optional string name_contains = 3;
  optional EvaluationDefinitionSortKeyV1 sort_key = 4;
  optional o11y_one.common.v1.SortDirectionV1 sort_direction = 5;
}

message ListEvaluationDefinitionsResponse {
  repeated EvaluationDefinitionSummaryV1 definitions = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  // Top-level value is the oldest contributing section's freshness.
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // Present, with an empty page, when the supplied cursor could not be
  // honoured. A typed directive rather than a transport error with prose in it:
  // the client restarts at page one and keeps its selection, which it cannot
  // decide to do from a FAILED_PRECONDITION string.
  optional EvaluationCursorResyncV1 resync = 5;
}

// ===========================================================================
// Builder bootstrap
//
// Purpose-built rather than composed from batch resources: composition needs
// three sequential tiers and `7 + 2N + M` calls, which fails the budget
// structurally, not marginally.
// ===========================================================================

message NewDraftEntryV1 {}

message EditDefinitionEntryV1 {
  string evaluation_id = 1;
}

message DuplicateDefinitionEntryV1 {
  string evaluation_id = 1;
}

message RerunDefinitionEntryV1 {
  string evaluation_id = 1;
  string run_id = 2;
}

message FromDatasetEntryV1 {
  string dataset_version_id = 1;
}

message FromProductionEvidenceEntryV1 {
  string evidence_selector = 1;
}

message FromReleaseEntryV1 {
  string release_revision_id = 1;
}

message GetEvaluationBuilderContextRequest {
  oneof entry_context {
    NewDraftEntryV1 new_draft = 1;
    EditDefinitionEntryV1 edit_definition = 2;
    DuplicateDefinitionEntryV1 duplicate_definition = 3;
    RerunDefinitionEntryV1 rerun_definition = 4;
    FromDatasetEntryV1 from_dataset = 5;
    FromProductionEvidenceEntryV1 from_production = 6;
    FromReleaseEntryV1 from_release = 7;
  }
}

// Resolved summary, never a copy of the dataset. Carries the authoritative id
// so the picker pages and searches through the owning list RPC independently.
message EvaluationBuilderDatasetVersionOptionV1 {
  string dataset_version_id = 1;
  uint32 version_number = 2;
  optional string label = 3;
  uint32 case_count = 4;
  MetricAvailabilityV1 case_count_availability = 5;
  // Absent until dataset schema revisions ship. Its availability says so
  // explicitly rather than letting an empty string read as "no schema".
  optional string schema_fingerprint = 6;
  MetricAvailabilityV1 schema_fingerprint_availability = 7;
  google.protobuf.Timestamp created_at = 8;
  bool is_pinned = 9;
}

message EvaluationBuilderDatasetOptionV1 {
  string dataset_collection_id = 1;
  string name = 2;
  optional string description = 3;
  repeated EvaluationBuilderDatasetVersionOptionV1 versions = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message EvaluationBuilderModelOptionV1 {
  ProviderModelRefV1 model = 1;
  ProviderNameV1 provider = 2;
  string display_label = 3;
  // The model as a candidate.
  CapabilityPostureV1 posture = 4;
  // #1115. The model as a text judge and as a system-one judge. Authoring
  // refuses only UNAVAILABLE: a DEGRADED model is authorable and not yet
  // live-verified.
  CapabilityPostureV1 text_judge_posture = 5;
  CapabilityPostureV1 system_one_judge_posture = 6;
}

message EvaluationBuilderCandidateSourcesV1 {
  repeated EvaluationBuilderModelOptionV1 models = 1;
  CapabilityPostureV1 agent_endpoints = 2;
  CapabilityPostureV1 release_revisions = 3;
  CapabilityPostureV1 recorded_outputs = 4;
}

message EvaluationBuilderScorerChoiceV1 {
  string score_config_id = 1;
  string config_key = 2;
  string name = 3;
  optional string description = 4;
  string metric_name = 5;
  string success_dimension = 6;
  repeated EvaluationSubjectKindV1 compatible_subject_kinds = 7;
  bool is_archived = 8;
  // How this scorer produces its verdict, so a picker can tell a judge from a
  // comparator without a second read.
  //
  // UNSPECIFIED is a REAL answer and not a gap: it is what a scorer authored
  // outside `CreateEvaluationScorerConfig` looks like, and guessing a kind for
  // one would be the unmeasured assertion `compatible_subject_kinds` above
  // already refuses to make.
  EvaluationScorerKindV1 kind = 9;
  // (#611) Present exactly when `kind` is CODE. The builder lists a code scorer
  // only once it is PUBLISHED, so this carries its determinism class and
  // whether its runtime changed.
  optional EvaluationScorerCodeSummaryV1 code = 10;
}

message EvaluationBuilderRecommendedMeasureV1 {
  string score_config_id = 1;
  string rationale = 2;
  repeated string assumptions = 3;
  bool is_blocking_gate_by_default = 4;
}

message EvaluationBuilderScorecardRecommendationV1 {
  repeated EvaluationBuilderRecommendedMeasureV1 measures = 1;
  MetricAvailabilityV1 availability = 2;
}

// Reference only. Secret material appears in no message on this surface.
message EvaluationBuilderCredentialRefV1 {
  string credential_id = 1;
  string credential_key = 2;
  ProviderNameV1 provider = 3;
  bool is_default = 4;
  // The kill switch. A switched-off credential STAYS in this picker, marked:
  // hiding it would make re-enabling one impossible from the surface that
  // reported the problem.
  bool enabled = 5;
  // `credential_disabled_by_org` exactly when `enabled` is false. Absent
  // otherwise — a usable credential has no posture to report.
  optional string posture_code = 6;
  // #1117. The Cloudflare account this credential calls under, as registered.
  // Absent for every other provider, and for a Cloudflare credential
  // registered before the account moved onto the credential.
  optional string account_id = 7;
}

message EvaluationBuilderExecutionDefaultsV1 {
  EvaluationExecutionPolicyV1 execution_policy = 1;
  EvaluationBudgetV1 budget = 2;
  uint32 default_trials = 3;
  uint32 max_cohorts = 4;
  uint32 max_candidates = 5;
  uint32 max_scorers = 6;
  uint32 max_trials = 7;
}

enum EvaluationBuilderReadinessSeverityV1 {
  EVALUATION_BUILDER_READINESS_SEVERITY_V1_UNSPECIFIED = 0;
  EVALUATION_BUILDER_READINESS_SEVERITY_V1_INFO = 1;
  EVALUATION_BUILDER_READINESS_SEVERITY_V1_WARNING = 2;
  EVALUATION_BUILDER_READINESS_SEVERITY_V1_BLOCKING = 3;
}

enum EvaluationBuilderSectionV1 {
  EVALUATION_BUILDER_SECTION_V1_UNSPECIFIED = 0;
  EVALUATION_BUILDER_SECTION_V1_WORKLOAD = 1;
  EVALUATION_BUILDER_SECTION_V1_CANDIDATES = 2;
  EVALUATION_BUILDER_SECTION_V1_SCORECARD = 3;
  EVALUATION_BUILDER_SECTION_V1_CREDENTIALS = 4;
  EVALUATION_BUILDER_SECTION_V1_EXECUTION = 5;
}

// Every finding names the section that resolves it, so a readiness list is
// actionable rather than a wall of complaints.
message EvaluationBuilderReadinessFindingV1 {
  string finding_code = 1;
  EvaluationBuilderReadinessSeverityV1 severity = 2;
  EvaluationBuilderSectionV1 resolving_section = 3;
  string detail = 4;
  // Which SHAPE of the finding this is, when one code covers more than one
  // customer situation.
  //
  // The code and the severity are the taxonomy and they do not move; this says
  // which situation produced them. `no_provider_credential` carries either
  // `credential_absent` — the org has registered no key — or
  // `credential_disabled_by_org` — it has one and somebody switched it off.
  // One is a setup step, the other is an administrative act with an actor and
  // an instant behind it, and a client that renders them identically sends the
  // customer to the wrong screen.
  //
  // Absent on every finding that has only one shape. A client that ignores this
  // field behaves exactly as it did before it existed.
  optional string posture_code = 5;
}

message EvaluationBuilderInferredSubjectV1 {
  EvaluationSubjectKindV1 kind = 1;
  repeated EvaluationSubjectKindV1 alternatives = 2;
  MetricAvailabilityV1 availability = 3;
  optional string provenance_code = 4;
}

message GetEvaluationBuilderContextResponse {
  // Present for edit/duplicate/rerun and prefilled entry paths; a new draft
  // returns the resolved defaults instead of an empty workspace.
  optional EvaluationDefinitionDraftV1 draft = 1;
  optional string definition_id = 2;
  optional string source_revision_id = 3;
  uint64 revision_number = 4;
  repeated EvaluationBuilderDatasetOptionV1 datasets = 5;
  EvaluationBuilderCandidateSourcesV1 candidate_sources = 6;
  repeated EvaluationBuilderScorerChoiceV1 scorer_choices = 7;
  EvaluationBuilderScorecardRecommendationV1 scorecard_recommendation = 8;
  repeated EvaluationBuilderCredentialRefV1 credentials = 9;
  EvaluationBuilderExecutionDefaultsV1 execution_defaults = 10;
  AgenticEvaluationCapabilitiesV1 capabilities = 11;
  repeated EvaluationBuilderReadinessFindingV1 readiness = 12;
  EvaluationBuilderInferredSubjectV1 inferred_subject = 13;
  repeated AllowedActionV1 allowed_actions = 14;
  EvaluationFreshnessV1 freshness = 15;
}

// ===========================================================================
// Typed failure
//
// Async states carry actionable typed failure data rather than relying on a
// gRPC status: once a launch has been accepted, the transport has already
// answered and cannot describe what went wrong three minutes later.
// ===========================================================================

enum EvaluationFailureStageV1 {
  EVALUATION_FAILURE_STAGE_V1_UNSPECIFIED = 0;
  EVALUATION_FAILURE_STAGE_V1_PREPARATION = 1;
  EVALUATION_FAILURE_STAGE_V1_COHORT_RESOLUTION = 2;
  EVALUATION_FAILURE_STAGE_V1_CANDIDATE_EXECUTION = 3;
  EVALUATION_FAILURE_STAGE_V1_SUBJECT_RESOLUTION = 4;
  EVALUATION_FAILURE_STAGE_V1_SCORER_EXECUTION = 5;
  EVALUATION_FAILURE_STAGE_V1_AGGREGATION = 6;
  EVALUATION_FAILURE_STAGE_V1_FACT_PUBLICATION = 7;
  EVALUATION_FAILURE_STAGE_V1_HUMAN_REVIEW = 8;
  EVALUATION_FAILURE_STAGE_V1_EXTERNAL_LEASE = 9;
  // O11Y-596. Producing an export's object. A client that predates it reads
  // the value as unknown and still has the failure's code.
  EVALUATION_FAILURE_STAGE_V1_EXPORT = 10;
}

enum RetryabilityV1 {
  RETRYABILITY_V1_UNSPECIFIED = 0;
  RETRYABILITY_V1_RETRYABLE = 1;
  RETRYABILITY_V1_NOT_RETRYABLE = 2;
  // Retryable, but only after the caller changes something.
  RETRYABILITY_V1_RETRYABLE_AFTER_FIX = 3;
}

enum RecoveryActionV1 {
  RECOVERY_ACTION_V1_UNSPECIFIED = 0;
  RECOVERY_ACTION_V1_RETRY = 1;
  RECOVERY_ACTION_V1_RE_PREVIEW = 2;
  RECOVERY_ACTION_V1_EDIT_DEFINITION = 3;
  RECOVERY_ACTION_V1_WAIT = 4;
  RECOVERY_ACTION_V1_CONTACT_SUPPORT = 5;
}

// O11Y-592. Whether a failure says anything about the candidate's task.
enum EvaluationFailureClassV1 {
  EVALUATION_FAILURE_CLASS_V1_UNSPECIFIED = 0;
  // Our platform failed (a lease, a budget, a credential, our egress policy,
  // the scoring machinery), or a model provider was unavailable. Never a
  // failed trial; pass@k and pass^k leave it out.
  EVALUATION_FAILURE_CLASS_V1_INFRASTRUCTURE = 1;
  // The system under test failed: the candidate model's own output, the
  // customer's endpoint or external agent, or anything not classified as
  // infrastructure. A failed trial.
  EVALUATION_FAILURE_CLASS_V1_TASK = 2;
}

message EvaluationFailureV1 {
  EvaluationFailureStageV1 stage = 1;
  string code = 2;
  RetryabilityV1 retryability = 3;
  // Sanitized: no provider body, no credential material, no customer content.
  string sanitized_message = 4;
  optional string correlation_id = 5;
  optional RecoveryActionV1 recovery = 6;
  google.protobuf.Timestamp last_attempt_at = 7;
  // O11Y-592. UNSPECIFIED from a server that predates the taxonomy.
  EvaluationFailureClassV1 failure_class = 8;
}

// ===========================================================================
// Frozen launch manifest
//
// Written once at launch and never updated. Everything a run's later evidence
// cites must be pinned here, because every source it resolves from can still
// change underneath it.
// ===========================================================================

message EvaluationCohortSnapshotV1 {
  EvaluationCohortSpecV1 spec = 1;
  uint32 frozen_case_count = 2;
  // Absent until dataset schema revisions ship; the availability says which of
  // "no schema" and "not shipped" holds.
  optional string schema_fingerprint = 3;
  MetricAvailabilityV1 schema_fingerprint_availability = 4;
  optional string dataset_schema_revision_id = 5;
}

// O11Y-592. Whether a scorer gives the same verdict on the same input twice.
enum EvaluationDeterminismClassV1 {
  EVALUATION_DETERMINISM_CLASS_V1_UNSPECIFIED = 0;
  // Bounded code over the input: every built-in comparator.
  EVALUATION_DETERMINISM_CLASS_V1_DETERMINISTIC = 1;
  // A judge whose provider was sent a seed. Best effort, never a guarantee.
  EVALUATION_DETERMINISM_CLASS_V1_SEEDED_BEST_EFFORT = 2;
  // A judge without a seed, or a person.
  EVALUATION_DETERMINISM_CLASS_V1_NONDETERMINISTIC = 3;
}

// Pins the scorer configuration a run was launched against. `version_discriminator`
// is the configuration row's own last-changed instant rather than a version id,
// because scorer version rows do not exist yet; the two slices that need them
// report their availability instead of being silently omitted.
message EvaluationScorerVersionSnapshotV1 {
  string score_config_id = 1;
  string config_key = 2;
  string metric_name = 3;
  string version_discriminator = 4;
  repeated EvaluationSubjectKindV1 compatible_subject_kinds = 5;
  MetricAvailabilityV1 compatible_subject_kinds_availability = 6;
  MetricAvailabilityV1 required_context_availability = 7;
  optional double weight = 8;
  optional bool is_blocking_gate = 9;
  // O11Y-592. UNSPECIFIED on a manifest frozen before the class existed.
  EvaluationDeterminismClassV1 determinism_class = 10;
}

// Reference only. Credential material appears in no message on this surface and
// in no stored manifest.
message EvaluationCredentialReferenceV1 {
  string credential_id = 1;
  string credential_key = 2;
  ProviderNameV1 provider = 3;
}

// Where one candidate's rate came from. A rate an author typed and a rate this
// build's checked-in registry supplied are different evidence, and an operator
// reading a bill-shaped number has to be able to tell them apart.
enum EvaluationRateSourceV1 {
  EVALUATION_RATE_SOURCE_V1_UNSPECIFIED = 0;
  // `ProviderRequestSettingsV1` on the candidate itself: the author's own
  // number, which is authoritative for their account.
  EVALUATION_RATE_SOURCE_V1_CANDIDATE_AUTHORED = 1;
  // The server's checked-in static rate registry. A planning default, never a
  // provider invoice.
  EVALUATION_RATE_SOURCE_V1_STATIC_REGISTRY = 2;
  // A registry entry whose price was carried forward from the nearest
  // predecessor model because no published price has been transcribed for this
  // model yet. Separate from STATIC_REGISTRY so "we looked this up" and "we
  // guessed from the previous generation" never render as the same claim.
  EVALUATION_RATE_SOURCE_V1_STATIC_REGISTRY_PROVISIONAL = 3;
  // An org-level negotiated rate, recorded once against `(provider, model_id)`
  // and dated, sourced and owned. Precedence 1: it displaces a candidate's own
  // authored rate, and the displacement is REPORTED
  // (`authored_rate_superseded_by_org_negotiated_rate`) with both numbers
  // preserved in the frozen row rather than absorbed.
  EVALUATION_RATE_SOURCE_V1_ORG_NEGOTIATED_OVERRIDE = 4;
}

// One candidate's resolved rate, frozen at launch.
//
// Rates are per MILLION tokens in micros, not per token: a per-token micro rate
// rounds to zero for every model anyone would actually run, and a rate that
// rounds to zero prices a run at nothing.
message EvaluationModelRateV1 {
  string candidate_key = 1;
  ProviderNameV1 provider = 2;
  // The wire model id the call would use, or an empty string for a candidate
  // kind that names no model.
  string model_id = 3;
  optional int64 input_micros_per_million_tokens = 4;
  optional int64 output_micros_per_million_tokens = 5;
  // A flat per-call price, when the author declared one. Takes precedence over
  // the token rates, exactly as the executor's own arithmetic does.
  optional int64 fixed_micros_per_call = 6;
  EvaluationRateSourceV1 rate_source = 7;
  string currency_code = 8;
  // NOT_SUPPORTED with a reason for a candidate no rate could be resolved for.
  // A zero rate would price its calls at nothing.
  MetricAvailabilityV1 availability = 9;

  // Cache-tier and reasoning dimensions. Each is absent rather than zero, and
  // `dimension_notes` says which of the three kinds of absence it is — a
  // dimension the provider bills inside another one is NOT an unpriced
  // dimension, it is an already-priced one.
  optional int64 cache_read_micros_per_million_tokens = 10;
  // The provider's default (5-minute) cache-write tier. Absent for a provider
  // that does not bill cache writes at all.
  optional int64 cache_write_5m_micros_per_million_tokens = 11;
  // The extended (1-hour) cache-write tier, where the provider prices it
  // separately from the 5-minute one. Collapsing the two is what E1-4's H2
  // hazard forbids, so they are separate fields and not a single "cache write".
  optional int64 cache_write_1h_micros_per_million_tokens = 12;
  // Reasoning tokens, where the provider prices them apart from output. Absent
  // for every provider that counts reasoning inside `output_tokens` — see
  // `token_accounting.reasoning_tokens_inclusive`, which is the field that says
  // the difference between "not priced" and "priced over there".
  optional int64 reasoning_micros_per_million_tokens = 13;
  // The provider's own token-accounting convention. The single highest-leverage
  // field in this message: a total that mixes inclusive and exclusive
  // accounting is wrong by the size of the cache.
  EvaluationTokenAccountingV1 token_accounting = 14;
  // One note per dimension that carries no rate, saying why.
  repeated EvaluationRateDimensionNoteV1 dimension_notes = 15;

  // Every modifier this row declares, applied and declined alike, with its
  // evaluated outcome. Frozen with the rate, so a re-render of an old run cannot
  // re-evaluate today's modifiers against yesterday's facts.
  //
  // A declined modifier is NOT an absent one: it carries `applied = false` and
  // a `reason_code` naming the fact that was missing. A modifier that could
  // silently resolve to 1x is the defect this field exists to prevent.
  repeated EvaluationRateModifierV1 modifiers = 16;
  // When THIS ROW's numbers were last read off the provider's page. Separate
  // from the registry-wide `effective_date`, because a table-wide date cannot
  // answer "how stale is the price of the model I picked?" — borrowed from
  // `genai-prices`' per-model `prices_checked`.
  optional string rate_checked_date = 17;
  // The rate this one DISPLACED, when precedence 1 overrode a lower level.
  //
  // Present only when something was actually displaced. An org's negotiated
  // rate outranks a candidate author's hand-typed one, and the argument for
  // that ordering only holds because the loser is preserved rather than
  // absorbed: an operator who sees a cost they did not expect can read both
  // numbers and the rule that chose between them.
  optional EvaluationSupersededRateV1 superseded_rate = 18;
}

// A rate that lost a precedence contest, kept beside the one that won.
message EvaluationSupersededRateV1 {
  EvaluationRateSourceV1 rate_source = 1;
  optional int64 input_micros_per_million_tokens = 2;
  optional int64 output_micros_per_million_tokens = 3;
  optional int64 fixed_micros_per_call = 4;
  // Why it lost, e.g. `authored_rate_superseded_by_org_negotiated_rate`.
  string reason_code = 5;
}

// A condition under which a registry row's rate vector is a DIFFERENT vector.
//
// Never a number on its own. A modifier this build cannot evaluate for a run
// produces `applied = false` with a reason code naming the missing fact, and a
// matching `EvaluationRateDimensionNoteV1`; it never resolves to a silent 1x.
// An unevaluable condition is not a satisfied one and it is not an unsatisfied
// one either.
message EvaluationRateModifierV1 {
  // Stable wire code, e.g. `openai_long_context_272k`, `anthropic_batch_tier`.
  string code = 1;
  EvaluationRateModifierKindV1 kind = 2;
  // Whether this modifier's effect is in the rate vector beside it.
  bool applied = 3;
  // Always present, applied or not. When applied it says WHY it applied
  // (`context_tier_crossed_threshold`); when not, it names the fact that was
  // missing (`context_tier_not_evaluable_estimate_assumes_short_context`) or
  // the evaluated negative (`context_tier_evaluated_and_did_not_apply`).
  string reason_code = 4;
  // The effect as the provider PUBLISHES it, not as a computed delta: a client
  // renders "long context >=272K: input x2, output x1.5" rather than a number
  // whose derivation it cannot check.
  EvaluationRateEffectV1 effect = 5;
  // Cliff threshold, for a context-length tier. Crossing it re-rates ALL tokens
  // of every dimension the effect names, not just the tokens above it.
  optional uint64 threshold_tokens = 6;
  // Which token count the threshold is measured against. No provider documents
  // this and the two shipped providers meter differently (one reports cache
  // tokens inside its input count, the other beside it), so the choice is
  // STATED rather than inferred.
  optional string threshold_basis_code = 7;
  // A daily wall-clock window, for an off-peak modifier, in the provider's own
  // words.
  optional string window_description = 8;
  // The kind's own discriminator, where it has one: the service tier's name
  // (`batch`, `flex`, `fast`), the cache TTL (`5m`, `1h`), or the region code a
  // regional uplift applies to (`us`). Without it a client can render that a
  // tier exists but not WHICH tier, which is the difference between "money is
  // on the table" and a shrug.
  optional string kind_detail_code = 12;
  string effective_from = 9;
  // Absent for a modifier still in force. A modifier outside its window is not
  // applied and says so: a provider that WITHDRAWS a surcharge leaves a
  // dateless modifier over-quoting forever.
  optional string effective_until = 10;
  EvaluationRateProvenanceV1 provenance = 11;
}

// Exhaustive on the wire too. A kind added without an evaluator is a compile
// error on the server, and a kind a client does not know renders as its code
// rather than as nothing.
enum EvaluationRateModifierKindV1 {
  EVALUATION_RATE_MODIFIER_KIND_V1_UNSPECIFIED = 0;
  // Cliff tiering on prompt size. Crossing the threshold re-rates ALL tokens.
  EVALUATION_RATE_MODIFIER_KIND_V1_CONTEXT_LENGTH_TIER = 1;
  // Batch / Flex / Fast. Exactly one service tier applies per call; the default
  // is standard, and this build's execution path requests no other.
  EVALUATION_RATE_MODIFIER_KIND_V1_SERVICE_TIER = 2;
  // Batch is a service tier the providers publish and exclude from the others;
  // it is a separate kind only so the wire code reads `batch`.
  EVALUATION_RATE_MODIFIER_KIND_V1_BATCH_DISCOUNT = 3;
  // A daily wall-clock window, evaluated on the request instant. Nothing in a
  // usage object reports it.
  EVALUATION_RATE_MODIFIER_KIND_V1_OFF_PEAK_WINDOW = 4;
  // Reserved and currently published by no supported provider.
  // The variant exists so the first provider to publish one is a data edit.
  EVALUATION_RATE_MODIFIER_KIND_V1_LONG_OUTPUT_TIER = 5;
  // For a provider that publishes cache pricing ONLY as a multiplier with no
  // absolute table. Unused in this build: both shipped providers publish
  // absolutes, which are `EvaluationModelRateV1`'s own columns.
  EVALUATION_RATE_MODIFIER_KIND_V1_CACHE_TTL_TIER = 6;
  // Scalar uplift on every dimension for a regional / data-residency endpoint.
  EVALUATION_RATE_MODIFIER_KIND_V1_REGIONAL_UPLIFT = 7;
  // A charge the provider publishes that is NOT denominated in tokens: Google's
  // per-token-HOUR context-cache storage price, OpenRouter's account-level
  // credit-purchase fee. Non-token charges are out of scope for pricing EXCEPT
  // as typed refusals, and this kind is that refusal: its
  // evaluator always declines, so the charge is named, dated and provenanced
  // beside the row it belongs to instead of being absent from a total that
  // looks complete. A quoted cost is the token cost; this says what it omits.
  EVALUATION_RATE_MODIFIER_KIND_V1_NON_TOKEN_CHARGE = 8;
}

// A modifier's effect, as an EXACT rational or an absolute replacement.
//
// Rationals are integer pairs, never decimals: every published multiplier is an
// exact small rational (5/4, 2/1, 1/10, 11/10, 3/5, 1/2, 3/2), and a decimal
// field would force a client to reconstruct one through a float.
message EvaluationRateEffectV1 {
  // Per-dimension scale factors. A dimension absent from this list is left
  // alone, which is different from being scaled by 1/1 only in that nothing is
  // claimed about it.
  repeated EvaluationRateScaleV1 scales = 1;
  // Per-dimension absolute replacements, in micros per million tokens, for a
  // provider that publishes a full second table rather than a multiplier.
  repeated EvaluationRateReplacementV1 replacements = 2;
}

message EvaluationRateScaleV1 {
  // `input`, `output`, `cache_read`, `cache_write_5m`, `cache_write_1h`,
  // `reasoning`.
  string dimension_code = 1;
  int64 numerator = 2;
  int64 denominator = 3;
}

message EvaluationRateReplacementV1 {
  string dimension_code = 1;
  int64 micros_per_million_tokens = 2;
}

// Where one rate or one modifier came from, carried per row and per modifier
// because modifiers move independently of the row they hang off — one provider
// withdrew a long-context surcharge without touching a single base rate.
message EvaluationRateProvenanceV1 {
  // Short id of the source document.
  string source_id = 1;
  string url = 2;
  // The extracted fragment the claim is read out of. A rendered provider page's
  // whole-document digest is NOT a pin — the same URL fetched twice on one day
  // returns the same byte length and a different sha256 — so the section is the
  // only honest unit.
  string section_id = 3;
  string fetched_date = 4;
  string section_sha256 = 5;
  // How the number was obtained: `TRANSCRIBED` for a value copied out of the
  // named section, `RATIO_READ_FROM_PROVIDER_LONG_CONTEXT_TABLE` for a
  // multiplier derived from the two tables the section prints. A derived
  // multiplier must never render as a transcribed price.
  string derivation = 6;
}

// How stale the registry that produced a quote was, WHEN it produced it.
//
// Rendered beside every cost. Never a refusal to price: a build that refused
// past a date would break previews for a reason the customer cannot fix, and a
// visible flag is the honest instrument.
enum EvaluationRateStalenessV1 {
  EVALUATION_RATE_STALENESS_V1_UNSPECIFIED = 0;
  EVALUATION_RATE_STALENESS_V1_FRESH = 1;
  EVALUATION_RATE_STALENESS_V1_STALE = 2;
}

// Whether a provider's reported token counts already contain the dimensions
// reported beside them.
//
// Anthropic's `input_tokens` EXCLUDES cache tokens — the provider documents
// `total = cache_read + cache_creation + input` — so cache tokens are an
// additional charge. OpenAI's input token count INCLUDES its cached tokens, so
// the same arithmetic would bill them twice. There is no safe default: a build
// that guesses is wrong by the size of the cache for one of the two, which is
// 41-80% of the bill on workloads where caching matters.
message EvaluationTokenAccountingV1 {
  ProviderNameV1 provider = 1;
  // True when the provider's reported input tokens already contain its cache
  // read/write counts.
  bool cache_tokens_inclusive = 2;
  // True when the provider's reported output tokens already contain its
  // reasoning tokens.
  bool reasoning_tokens_inclusive = 3;
  // Where this convention came from: `provider_published_usage_contract` for a
  // provider whose documentation states it, `provider_accounting_unknown` for
  // one this build has not verified — never a silent default.
  string accounting_basis_code = 4;
}

// Why one rate dimension carries no number.
//
// Three different facts that a zero would collapse into one: the provider bills
// the dimension inside another one (already priced), the provider publishes no
// price for it, or the candidate's author froze their own rates and the
// authored shape has no field for this dimension.
message EvaluationRateDimensionNoteV1 {
  // `input`, `output`, `cache_read`, `cache_write_5m`, `cache_write_1h`,
  // `reasoning`.
  string dimension_code = 1;
  string reason_code = 2;
}

// What the estimate assumed about traffic it has not seen yet.
//
// Stated on the wire rather than buried in the server, because an estimate
// whose assumptions are invisible is a number an operator cannot argue with —
// and every cost estimate before execution is an assumption about token counts.
message EvaluationCostAssumptionV1 {
  uint64 assumed_input_tokens_per_call = 1;
  uint64 assumed_output_tokens_per_call = 2;
  // Which frozen input produced each assumption:
  // `candidate_max_output_tokens`, `pricing_registry_default`, or
  // `candidate_fixed_cost` (in which case token counts are not used at all).
  string input_basis_code = 3;
  string output_basis_code = 4;
  // What the estimate assumed about the cache. Always
  // `pricing_registry_assumes_cold_cache` in this build: nothing in a frozen
  // definition says what a run's hit rate will be, and an invented hit rate is
  // an assumption an operator cannot argue with. Stated rather than implied,
  // because an estimate that silently assumes no cache and an actual that
  // prices one WILL disagree, and the drift field is where that shows up.
  string cache_basis_code = 5;
}

message EvaluationPricingSourceV1 {
  string pricing_source_version = 1;
  optional string pricing_snapshot_ref = 2;
  // The resolved rate table this run froze, one entry per candidate. This is
  // the snapshot: a later edit to the server's registry cannot move a launched
  // run's numbers, because the numbers are here and the manifest is immutable.
  repeated EvaluationModelRateV1 model_rates = 3;
  // ISO-8601 date the registry's entries were last reviewed. A version with no
  // date cannot answer "how stale is this price?".
  string effective_date = 4;
  // sha256 over the registry's entries, so two runs can be compared for "same
  // prices" without diffing the whole table.
  string registry_digest = 5;

  // How old the registry was AT PRICING TIME, in days since `effective_date`.
  //
  // Frozen rather than re-derived at render, and deliberately: this message is
  // sealed into an immutable run manifest, so re-deriving would make every
  // historical run report today's age against a registry it stopped following
  // at launch. The frozen sentence is "when we quoted you this number, the
  // registry was N days old".
  uint32 registry_age_days = 6;
  EvaluationRateStalenessV1 rate_staleness = 7;
  // The threshold the staleness code was computed against, so a client renders
  // the rule rather than re-deriving it.
  uint32 staleness_threshold_days = 8;
  // Every source the rows and modifiers in this snapshot cite, de-duplicated.
  // A price is a dated, sourced fact or it is a rumour.
  repeated EvaluationRateProvenanceV1 provenance = 9;
}

// The estimate a launch accepted and the ceiling it accepted it against.
//
// Frozen into the manifest rather than kept in a side table: the manifest is
// written once and never updated, which is exactly the immutability a
// reservation needs. "Which estimate did the operator agree to?" is answerable
// from the run row forever.
message EvaluationCostReservationV1 {
  optional CostAmountV1 reserved_candidate_cost = 1;
  MetricAvailabilityV1 reserved_availability = 2;
  // The frozen budget this reservation was checked against: the candidate
  // budget when one was authored, otherwise the total. Never the evaluator's.
  optional CostAmountV1 budget_ceiling = 3;
  string pricing_source_version = 4;
  optional EvaluationCostAssumptionV1 assumption = 5;
}

message EvaluationRunLimitsV1 {
  uint32 max_expanded_cells = 1;
  uint32 preparation_shard_size = 2;
  uint32 preparation_max_attempts = 3;
}

message EvaluationRunManifestV1 {
  uint32 manifest_schema_version = 1;
  string definition_revision_id = 2;
  // sha256 of the revision this run froze, so a manifest can be checked against
  // the revision it claims without re-reading the draft.
  string definition_content_digest = 3;
  repeated EvaluationCohortSnapshotV1 cohorts = 4;
  uint32 total_case_revision_count = 5;
  repeated EvaluationCandidateV1 candidates = 6;
  repeated EvaluationScorerVersionSnapshotV1 scorers = 7;
  repeated EvaluationCredentialReferenceV1 credentials = 8;
  optional EvaluationPricingSourceV1 pricing_source = 9;
  MetricAvailabilityV1 pricing_source_availability = 10;
  EvaluationExecutionPolicyV1 execution_policy = 11;
  EvaluationBudgetV1 budget = 12;
  EvaluationRunLimitsV1 limits = 13;
  uint32 trials = 14;
  EvaluationHumanReviewPolicyV1 human_review_policy = 15;
  EvaluationDecisionPolicyV1 decision_policy = 16;
  // The capability STAMP at launch: the set version and the instant, postures
  // empty, exactly as a response envelope carries it. A later reader names the
  // set the evidence was produced under and fetches it by version from
  // `GetAgenticEvaluationCapabilities`. Manifests frozen before capability set
  // version 51 carry the full postures here; the number and the type are
  // unchanged, so both still parse.
  AgenticEvaluationCapabilitiesV1 capability_set = 17;
  EvaluationLaunchModeV1 launch_mode = 18;
  // The estimate this launch reserved against its own ceiling. Absent on a
  // manifest frozen before the pricing plane shipped.
  optional EvaluationCostReservationV1 cost_reservation = 19;
  // The scorer suite this launch resolved, when the definition pointed at one.
  // Absent for every explicit-list run, which is every run that existed before
  // this field.
  //
  // Its MEMBERS are also in `scorers` above, resolved on exactly the path an
  // explicit selection resolves on — one freeze, not two. This field is the
  // suite's own identity: which suite, which version of it, and what
  // membership, weights and gate postures it had at the moment of the launch.
  // A suite edited afterwards cannot move this run, because a manifest is
  // written once and nothing reads the suite table again.
  optional EvaluationScorerSuiteSnapshotV1 scorer_suite = 20;
  // One entry per scorer in `scorers`, in the same order.
  //
  // A judge's provider, model, credential reference, rubric and rate are frozen
  // here at launch, so no edit between launch and the last batch can move the
  // judge. The measuring instrument is as immutable as the thing it measures.
  //
  // Absent on every manifest frozen before this field, which is what the
  // executor's fallback to the live template row exists for.
  repeated EvaluationFrozenEvaluatorRefV1 frozen_evaluators = 21;
  // The live traces this launch selected, when its case source was the span
  // plane rather than a dataset. Absent on every dataset-sourced run, which is
  // every run that existed before this field.
  optional LiveTraceCaseSourceSnapshotV1 live_trace_source = 22;
  // O11Y-592. What reproducing this run takes, beyond what `candidates`
  // already freezes. Absent on a manifest frozen before it existed.
  optional EvaluationHarnessManifestV1 harness = 23;
}

// O11Y-592. One candidate's reproduction facts, frozen at launch. Digests and
// identifiers only, never a prompt.
message EvaluationCandidateHarnessV1 {
  string candidate_key = 1;
  // UNSPECIFIED for a candidate that calls no model.
  ProviderNameV1 provider = 2;
  // The model id the request names, which is a dated snapshot wherever the
  // provider publishes one. What the provider actually served, and its
  // fingerprint, are recorded per run apart from this, and the manifest
  // section's provider drift compares them (O11Y-634).
  string model_snapshot_id = 3;
  // True only when the candidate set a seed AND its adapter puts one on the
  // wire. Sampling is still best effort; no provider guarantees it.
  bool seed_sent = 4;
  // sha256 hex over the template reference, its version and the request
  // mapping that build the prompt. Absent for a candidate that builds none.
  optional string prompt_bundle_digest = 5;
  // sha256 hex over the canonical JSON of the candidate's tool definitions,
  // sorted, so a reordered list is the same catalog. Absent for a candidate
  // that declares none (O11Y-633).
  optional string tool_schema_digest = 6;
}

message EvaluationHarnessManifestV1 {
  repeated EvaluationCandidateHarnessV1 candidates = 1;
  // Reserved; never used.
  reserved 2, 3;
  reserved "host_class", "placement";
}

// Everything a launch freezes about ONE scorer's evaluator, so a template or
// registry edit after the launch cannot move what the run is measuring.
//
// Covers every scorer, not only judges: `evaluator_kind` and `execution_mode`
// are what decide whether a scorer is human review, a judge, a deterministic
// comparator or a refusal, and a template edited mid-run could otherwise turn
// one into another on batch 40 of 50.
//
// Reusable by design: a regrade job that pins its own evaluator at ACCEPT time
// stores this same message, and a job regrading at the run's original evaluator
// copies the bytes the launch already wrote.
message EvaluationFrozenEvaluatorRefV1 {
  string score_config_id = 1;
  string config_key = 2;
  string evaluator_template_id = 3;
  // The template's own last-changed instant, in the same micros-since-epoch
  // spelling `EvaluationScorerVersionSnapshotV1.version_discriminator` uses.
  // It moves whenever the template does, which is what makes a template edit
  // invalidate a preview rather than silently move a launched run.
  string template_version_discriminator = 4;
  string evaluator_kind = 5;
  string execution_mode = 6;
  // The template's `config` and `provider_execution` JSONB, frozen verbatim.
  // Reference only: `provider_execution` names a credential id and never key
  // material, which is already true of the live column.
  string evaluator_config_json = 7;
  string provider_execution_json = 8;
  // Resolved from `provider_execution` at launch, so a reader does not have to
  // parse JSON to answer "which model graded this run?".
  ProviderNameV1 provider = 9;
  string model_id = 10;
  optional string provider_credential_id = 11;
  // The judge's rate, frozen exactly as a candidate's is — the rate vector AND
  // the full modifier list, so a context tier crossed by a long rubric and a
  // service tier the response confirms still re-decide at ATTEMPT time. A flat
  // frozen number would have destroyed that.
  //
  // Absent for an evaluator that calls no model. When a judge could not be
  // priced the row is present and its own `availability` says why — never a
  // zero, which would read as "evaluation is free".
  //
  // This row is NEVER merged into `EvaluationPricingSourceV1.model_rates`: an
  // evaluator's economics and a candidate's are never summed, and the
  // separation is structural rather than conventional.
  optional EvaluationModelRateV1 model_rate = 12;
  // #1005. A TEXT_THEN_SYSTEM_ONE judge's system-one step's rate, frozen as
  // `model_rate` is, so its quote and its calls price both steps. Absent for
  // every other judge, and for a step the registry cannot price.
  optional EvaluationModelRateV1 system_one_model_rate = 13;
  // #1106. Resolved from `provider_execution_json` at launch, as `provider`
  // is. UNSPECIFIED for an evaluator that is no judge, and on a ref frozen
  // before #1106, whose `provider_execution_json` still says how it runs.
  JudgeModeV1 judge_mode = 14;
  // #1110. Resolved at launch from `evaluator_config_json`'s `question` and
  // `provider_execution_json`'s `judge_id`: present exactly when the scorer is
  // a question of a judge authored through CreateEvaluationJudge.
  optional EvaluationJudgeQuestionRefV1 judge_question = 15;
}

// ===========================================================================
// Run and operation
// ===========================================================================

// Counts, never percentages: a percentage cannot distinguish "nothing prepared
// yet" from "nothing to prepare", and both are real states.
message EvaluationRunProgressV1 {
  uint32 expected_cell_count = 1;
  uint32 prepared_cell_count = 2;
  uint32 queued_cell_count = 3;
  uint32 cancelled_cell_count = 4;
  uint32 completed_shard_count = 5;
  uint32 total_shard_count = 6;
  // AVAILABLE once a run has reached execution; NOT_SUPPORTED with a reason
  // while it has not, because a zero here would render as "0% done" on a screen
  // whose whole job is to say whether work is moving.
  MetricAvailabilityV1 execution_progress_availability = 7;
  // Execution counts. Counts, never percentages, for the same reason as the
  // fields above.
  uint32 executed_cell_count = 8;
  uint32 succeeded_cell_count = 9;
  uint32 failed_cell_count = 10;
  uint32 scorer_result_count = 11;
  // Recovery counts. A cell parked on human review is not a failed cell and not
  // a missing one; a cell a policy excluded is neither. Both are counted apart
  // from `failed_cell_count` so a progress bar cannot render either as a defect.
  uint32 awaiting_review_cell_count = 12;
  uint32 skipped_cell_count = 13;
  // Result rows a later attempt generation replaced. They are still readable;
  // this is how many of them there are, not how many were deleted (there are
  // never any of those).
  uint32 superseded_result_count = 14;
  // (#611) Code scores still to come, and the cells waiting for them: a cell
  // scoring in the sandbox is neither failed nor unscored.
  uint32 pending_code_scorer_count = 15;
  uint32 scoring_in_sandbox_cell_count = 16;
}

message EvaluationRunV1 {
  string evaluation_run_id = 1;
  string definition_id = 2;
  string definition_revision_id = 3;
  string tenant_id = 4;
  string org_id = 5;
  EvaluationRunManifestV1 manifest = 6;
  EvaluationRunStateV1 state = 7;
  EvaluationRunProgressV1 progress = 8;
  EvaluationFreshnessV1 freshness = 9;
  // User or machine principal: CI is a first-class launcher.
  PrincipalRefV1 launched_by = 10;
  // sha256 of the preview binding this launch accepted. Permanent, so "which
  // estimate did the operator agree to?" is answerable after the fact.
  string accepted_preview_digest = 11;
  optional EvaluationFailureV1 failure = 12;
  repeated AllowedActionV1 allowed_actions = 13;
  google.protobuf.Timestamp created_at = 14;
  optional google.protobuf.Timestamp started_at = 15;
  optional google.protobuf.Timestamp finished_at = 16;
  string idempotency_key = 17;
  // Comparability analysis is a later phase; the state says so.
  MetricAvailabilityV1 comparability_availability = 18;
}

enum EvaluationOperationKindV1 {
  EVALUATION_OPERATION_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_OPERATION_KIND_V1_PREPARE_RUN = 1;
  EVALUATION_OPERATION_KIND_V1_RETRY_CELLS = 2;
  EVALUATION_OPERATION_KIND_V1_CANCEL_RUN = 3;
  EVALUATION_OPERATION_KIND_V1_EXPORT = 4;
}

enum EvaluationOperationStateV1 {
  EVALUATION_OPERATION_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_OPERATION_STATE_V1_PENDING = 1;
  EVALUATION_OPERATION_STATE_V1_RUNNING = 2;
  EVALUATION_OPERATION_STATE_V1_SUCCEEDED = 3;
  EVALUATION_OPERATION_STATE_V1_FAILED = 4;
  EVALUATION_OPERATION_STATE_V1_CANCELLED = 5;
}

// The resumable unit of asynchronous work. `expected_cell_count` sits beside
// `expanded_cell_count` on purpose: a stalled preparation is then diagnosable
// from one row instead of from a worker's logs.
message EvaluationOperationV1 {
  string operation_id = 1;
  string evaluation_run_id = 2;
  string tenant_id = 3;
  string org_id = 4;
  EvaluationOperationKindV1 kind = 5;
  EvaluationOperationStateV1 state = 6;
  uint32 completed_shard_count = 7;
  uint32 total_shard_count = 8;
  uint32 expected_cell_count = 9;
  uint32 expanded_cell_count = 10;
  uint32 attempt_count = 11;
  optional EvaluationFailureV1 failure = 12;
  string idempotency_key = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  optional google.protobuf.Timestamp finished_at = 16;
}

// ===========================================================================
// Preview
// ===========================================================================

message EvaluationCohortEstimateV1 {
  string cohort_key = 1;
  string dataset_version_id = 2;
  uint32 case_count = 3;
  MetricAvailabilityV1 case_count_availability = 4;
}

// Candidate and evaluator spend are separate estimates, never one number, and
// an absent amount stays structurally distinct from a zero one: "we cannot
// price this" and "this is free" are different answers.
message EvaluationPreviewEstimatesV1 {
  repeated EvaluationCohortEstimateV1 cohorts = 1;
  uint32 total_case_count = 2;
  uint32 candidate_count = 3;
  uint32 scorer_count = 4;
  uint32 trials = 5;
  uint32 candidate_call_count = 6;
  uint32 scorer_call_count = 7;
  uint32 max_retry_count = 8;
  uint32 max_concurrency = 9;
  optional CostAmountV1 candidate_cost = 10;
  MetricAvailabilityV1 candidate_cost_availability = 11;
  optional CostAmountV1 evaluator_cost = 12;
  MetricAvailabilityV1 evaluator_cost_availability = 13;
  optional CostAmountV1 total_cost = 14;
  MetricAvailabilityV1 total_cost_availability = 15;
  optional CostAmountV1 reserved_budget = 16;
  // What the numbers above assumed about tokens nobody has spent yet.
  optional EvaluationCostAssumptionV1 cost_assumption = 17;
  // Per-category line items, so "tool, retrieval and external spend are not
  // estimable here" is a stated absence with a reason rather than a silence a
  // client would read as zero.
  optional CostBreakdownV1 cost_breakdown = 18;
  // The ceiling the launch would be checked against — the candidate budget when
  // one was authored, otherwise the total. Distinct from `reserved_budget`,
  // which echoes what the author typed.
  optional CostAmountV1 budget_ceiling = 19;
  MetricAvailabilityV1 budget_ceiling_availability = 20;
  // (#611) The worst case of the run's code scorers: for each job, its
  // profile's wall limit times its units, which is what launch admission
  // reserves; no measured average exists before a run. Absent with no code
  // scorer.
  optional int64 sandbox_unit_seconds = 21;
  // That worst case past what the Loop window has left of its included and
  // purchased hours, at the plan's overage rate.
  optional CostAmountV1 sandbox_cost = 22;
  // NOT_SUPPORTED on a plan with no Loop rate (an enterprise contract, the
  // trial). Sandbox
  // time bills through the Loop window and never counts against
  // `EvaluationBudgetV1`, so it is never folded into `evaluator_cost` or
  // `total_cost`.
  MetricAvailabilityV1 sandbox_cost_availability = 23;
}

// What this run would touch in the outside world, stated before it touches it.
message EvaluationBlastRadiusV1 {
  uint32 case_count = 1;
  uint32 trials = 2;
  uint32 estimated_external_calls = 3;
  SideEffectPostureV1 worst_posture = 4;
  bool has_unattested_mutating_candidate = 5;
  MetricAvailabilityV1 attestation_enforcement_availability = 6;
}

enum EvaluationPreviewBlockerKindV1 {
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_SCALE_LIMIT_EXCEEDED = 1;
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_CAPABILITY_UNAVAILABLE = 2;
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_MISSING_DEPENDENCY = 3;
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_UNATTESTED_SIDE_EFFECT = 4;
  EVALUATION_PREVIEW_BLOCKER_KIND_V1_SCORER_BINDING_INCOMPLETE = 5;
}

message EvaluationPreviewBlockerV1 {
  EvaluationPreviewBlockerKindV1 kind = 1;
  string code = 2;
  EvaluationBuilderReadinessSeverityV1 severity = 3;
  EvaluationBuilderSectionV1 resolving_section = 4;
  string detail = 5;
  // Same contract as `EvaluationBuilderReadinessFindingV1.posture_code`, and
  // the same two values under `no_provider_credential`. The planning surfaces
  // and the builder say "your key is switched off" in one vocabulary, because
  // a client reading both must not have to learn two.
  optional string posture_code = 6;
}

// Which traces a live-trace case source selects.
//
// Defined here and also used by `ListAgentTracesRequest` in `trace_view.proto`:
// one filter, one meaning, so a scratch launch and the trace list never
// disagree about what `errors_only` selects.
message AgentTraceListFilterV1 {
  optional string customer_id = 1;
  optional string deployment_id = 2;
  // Traces with at least one failed span. Applied AFTER the aggregate: applying
  // it to the rows would make `span_count` a count of failures and `started_at`
  // the first failure's instant.
  bool errors_only = 3;
  // The members of one agent run. Resolved on the control plane FIRST, so the
  // span scan is pruned to those trace ids rather than filtered after it.
  optional string agent_run_id = 4;
}

// A launch whose cases come from live traces rather than from a dataset version.
//
// Only a `SCRATCH` launch may ask for it. The whole point of the mode is ad-hoc
// iteration against production traffic, and a comparison run whose workload was
// resolved from a moving span plane could not be compared with anything.
message LiveTraceCaseSourceV1 {
  // The same predicate `ListAgentTraces` applies, resolved on the same path, so
  // the traces a scratch run materialises are the traces the list showed.
  AgentTraceListFilterV1 filter = 1;
  // How many traces to take. Zero means the cap. A larger number is CLAMPED to
  // the cap rather than refused, and the clamp is reported in band on
  // `PreviewEvaluationRunResponse.resolved_manifest.live_trace_source`.
  uint32 limit = 2;
  // How the root span maps onto the case, in the vocabulary a capture already
  // uses. Empty selects the default projection, so an unmapped case still
  // resolves at execution.
  repeated EvaluationCaptureFieldSelectionV1 field_selection = 3;
}

// What a live-trace launch RESOLVED, frozen into the manifest.
//
// The trace ids are here rather than re-resolved at launch because they are the
// one input the world cannot be re-read for: the span plane moves, and a launch
// that re-selected would run against a different population from the one whose
// estimate the operator accepted.
message LiveTraceCaseSourceSnapshotV1 {
  // Exactly what was asked for, so a reader can see the request beside its
  // resolution rather than having to infer one from the other.
  LiveTraceCaseSourceV1 source = 1;
  // The selected traces, in page order. At most `effective_limit` of them.
  repeated string trace_ids = 2;
  // What the server actually paged at, after the cap.
  uint32 effective_limit = 3;
  // Clamp and report, never truncate silently.
  bool clamped = 4;
  optional string clamp_reason_code = 5;
  // The dataset version this launch materialises its cases into, derived at
  // preview so the manifest names a real cohort and the launch writes into the
  // id the operator already accepted.
  string dataset_collection_id = 6;
  string dataset_version_id = 7;
  // The window the page was selected over, frozen so the launch's root-span scan
  // reads the same interval. Re-defaulting "the last N hours" at launch would
  // shift the window by the age of the preview and could drop a trace that was
  // selected at its edge.
  google.protobuf.Timestamp window_start = 8;
  google.protobuf.Timestamp window_end = 9;
}

message PreviewEvaluationRunRequest {
  string definition_id = 1;
  // Absent means the current revision.
  optional string revision_id = 2;
  // The mode this LAUNCH runs in, when it is not the definition's own.
  //
  // Absent is the definition's mode, which is today's behaviour exactly. Only
  // `SCRATCH` may be asked for here; every other value is INVALID_ARGUMENT.
  //
  // DO NOT GENERALISE THIS to the other modes without moving what depends on
  // them. The server derives a definition's MINIMUM CANDIDATE COUNT from the
  // definition's own mode — a `COMPARISON` needs at least two candidates and a
  // `VALIDATION` legitimately has one — and it checks that when the definition
  // is authored, not when it is launched. A launch that could declare itself
  // `VALIDATION` would therefore run a one-candidate comparison the authoring
  // path refuses, and nothing downstream would notice. `SCRATCH` is exempt
  // because it changes no rule a draft was validated against: it changes
  // whether the RESULT is evidence.
  //
  // It rides the preview rather than the create because the preview response
  // echoes it, the manifest freezes it, and the launch accepts that manifest by
  // digest — so the mode a run is launched in is the mode whose estimate the
  // operator agreed to, and there is nothing new to authenticate. On
  // `CreateEvaluationRunRequest` it would sit outside the accepted preview.
  optional EvaluationLaunchModeV1 launch_mode = 3;
  // Take this run's cases from live traces instead of the definition's cohorts.
  //
  // Valid only alongside `launch_mode = SCRATCH`, and refused by name otherwise.
  // It rides the preview for the reason `launch_mode` does: the selection is
  // frozen into the manifest the launch accepts by digest, so the run
  // materialises the population whose estimate the operator agreed to rather
  // than whatever the span plane holds a minute later.
  optional LiveTraceCaseSourceV1 live_traces = 4;
  // Price this unsaved draft instead of a saved revision (#839), so a builder
  // can quote a draft before its author saves it.
  //
  // Exactly one of `definition_id` and this names what is previewed, and
  // `revision_id` only rides `definition_id`; anything else is
  // INVALID_ARGUMENT. The draft is accepted exactly as a create or an update
  // accepts it, with the same refusals, and priced by the same resolver a saved
  // revision is. Nothing is persisted, so the response names no definition or
  // revision, carries an empty `preview_token`, and reports the blocking
  // finding `inline_draft_not_launchable`: a launch previews the saved revision.
  optional EvaluationDefinitionDraftV1 inline_draft = 5;
}

message PreviewEvaluationRunResponse {
  // Opaque. Verified by reconstruction at launch, not merely parsed: the server
  // re-resolves every input it binds and recomputes the digest, so a tampered
  // or drifted token cannot launch. Empty for an `inline_draft` preview, which
  // has no saved revision to bind.
  string preview_token = 1;
  string preview_digest = 2;
  google.protobuf.Timestamp expires_at = 3;
  string definition_id = 4;
  string definition_revision_id = 5;
  uint64 revision_number = 6;
  EvaluationLaunchModeV1 launch_mode = 7;
  EvaluationPreviewEstimatesV1 estimates = 8;
  EvaluationBlastRadiusV1 blast_radius = 9;
  // Exactly what a launch would freeze. Returning it here is what makes
  // "frozen versions" reviewable before the run exists rather than after.
  EvaluationRunManifestV1 resolved_manifest = 10;
  repeated EvaluationPreviewBlockerV1 blockers = 11;
  MetricAvailabilityV1 comparability_availability = 12;
  MetricAvailabilityV1 data_quality_availability = 13;
  EvaluationBuilderInferredSubjectV1 inferred_subject = 14;
  bool launch_allowed = 15;
  repeated AllowedActionV1 allowed_actions = 16;
  AgenticEvaluationCapabilitiesV1 capabilities = 17;
  EvaluationFreshnessV1 freshness = 18;
}

// ===========================================================================
// Create, operation, cancel
// ===========================================================================

message CreateEvaluationRunRequest {
  string definition_id = 1;
  // Caller-minted. The same key and the same accepted preview return the
  // original run; the same key with a different preview is ALREADY_EXISTS.
  string idempotency_key = 2;
  string preview_token = 3;
}

message CreateEvaluationRunResponse {
  EvaluationRunV1 run = 1;
  EvaluationOperationV1 operation = 2;
  // True when this call replayed an earlier accepted launch rather than
  // creating one. The client needs to know, because it decides whether the
  // "launched" toast is a new event or a reconciliation.
  bool idempotent_replay = 3;
}

enum EvaluationLaunchRejectionKindV1 {
  EVALUATION_LAUNCH_REJECTION_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_PREVIEW_EXPIRED = 1;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_PREVIEW_MALFORMED = 2;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_DEFINITION_REVISION_MOVED = 3;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_DEPENDENCY_VERSIONS_MOVED = 4;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_CARDINALITY_MOVED = 5;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_CAPABILITY_SET_MOVED = 6;
  EVALUATION_LAUNCH_REJECTION_KIND_V1_IDEMPOTENCY_KEY_REUSED = 7;
}

// Returned in `Status::details` when a launch is refused, so the builder can
// say which binding moved and offer the one action that resolves it, instead of
// asking the author to guess from a sentence.
message EvaluationLaunchRejectionV1 {
  EvaluationLaunchRejectionKindV1 kind = 1;
  string expected_digest = 2;
  string observed_digest = 3;
  optional string existing_evaluation_run_id = 4;
  RecoveryActionV1 recovery = 5;
  string detail = 6;
}

// After an ambiguous launch the client has no run id, so the idempotency key
// it minted is the only handle it still holds. A key that names nothing is
// NOT_FOUND: the definitive "it never started".
message GetEvaluationOperationRequest {
  oneof selector {
    string operation_id = 1;
    string idempotency_key = 2;
  }
}

message GetEvaluationOperationResponse {
  EvaluationOperationV1 operation = 1;
  EvaluationRunV1 run = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message CancelEvaluationRunRequest {
  string evaluation_run_id = 1;
  optional string reason = 2;
}

message CancelEvaluationRunResponse {
  EvaluationRunV1 run = 1;
  EvaluationOperationV1 operation = 2;
  // True when the run was already cancelled: cancellation is idempotent, and a
  // second call is a confirmation rather than an error.
  bool already_cancelled = 3;
}

// ===========================================================================
// Recovery
//
// Every terminal and partial state this surface can reach is addressable: the
// customer is told which cells can be re-executed, which cannot and why, and
// what re-executing them would cost — before anything is written.
// ===========================================================================

// One cell, by the coordinate that is already its storage identity. There is no
// synthetic cell id: inventing one would mean the server had to translate it
// back on every request, and the coordinate is what the customer's matrix shows.
message EvaluationCellRefV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
}

// Why one cell in a selection cannot be retried. An enum rather than a code
// string because a client renders each of these differently: an immutable
// success is an explanation, an exhausted budget is a call to action.
enum EvaluationRetryIneligibilityV1 {
  EVALUATION_RETRY_INELIGIBILITY_V1_UNSPECIFIED = 0;
  // Successful evidence is immutable. A rerun is a new run or a new trial, never
  // an overwrite.
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_SUCCEEDED_IMMUTABLE = 1;
  // Still queued, leased, or running: there is nothing to retry yet.
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_NOT_TERMINAL = 2;
  // Excluded by the budget stop. Retrying into the same ceiling stops again.
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_SKIPPED_BY_BUDGET = 3;
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_CANCELLED = 4;
  // Parked on human review. Not failed, so there is nothing to re-execute.
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_AWAITING_REVIEW = 5;
  // The coordinate does not exist in this run.
  EVALUATION_RETRY_INELIGIBILITY_V1_CELL_UNKNOWN = 6;
}

message EvaluationRetryCellStatusV1 {
  EvaluationCellRefV1 cell = 1;
  bool eligible = 2;
  // Present exactly when `eligible` is false.
  optional EvaluationRetryIneligibilityV1 ineligibility = 3;
  EvaluationExecutionStateV1 current_state = 4;
  // The failure this cell would be retried out of. Absent for an eligible cell
  // that timed out without a recorded code, and for every ineligible cell whose
  // state is not a failure.
  optional EvaluationFailureV1 last_failure = 5;
  uint32 prior_attempt_generation = 6;
}

// What a retry would cost and what it would supersede.
//
// Candidate spend only, never a total that folds evaluator work in. Absent
// rather than zero when nothing in the selection was ever priced: a free retry
// and an unpriced one are different facts.
message EvaluationRetryEstimateV1 {
  optional CostAmountV1 estimated_candidate_cost = 1;
  MetricAvailabilityV1 cost_availability = 2;
  // Blast radius in the same vocabulary the launch preview uses: how many
  // external calls this would issue.
  uint32 estimated_external_call_count = 3;
  // Result rows the retry would stamp superseded. They are never deleted.
  uint32 superseded_result_count = 4;
  // ESTIMATED: the basis is what those exact coordinates were already billed,
  // which the executor now retains for attempts the provider metered before
  // they failed.
  CostPostureV1 cost_posture = 5;
  // Coverage, beside the total, for the same reason every other total on this
  // surface carries one: an amount over three of a hundred eligible cells is
  // not the selection's cost.
  uint32 priced_cell_count = 6;
  uint32 unpriced_cell_count = 7;
}

message PreviewRetryEvaluationCellsRequest {
  string evaluation_run_id = 1;
  // Explicit coordinates only in this iteration, bounded at 500. A larger
  // selection needs the server-issued frozen filter token (`MatrixSelectionV1`);
  // until it exists an over-large selection is refused by name rather than
  // truncated.
  repeated EvaluationCellRefV1 cells = 2;
}

message PreviewRetryEvaluationCellsResponse {
  string evaluation_run_id = 1;
  // One entry per requested coordinate, in request order, eligible or not. A
  // mixed selection is the normal case and a single aggregate verdict would hide
  // which half is which.
  repeated EvaluationRetryCellStatusV1 cells = 2;
  uint32 retryable_cell_count = 3;
  EvaluationRetryEstimateV1 estimate = 4;
  bool retry_allowed = 5;
  // Why the whole retry is refused, when it is: the run is still running, was
  // cancelled, is parked on review, or names a credential the org switched off
  // (code `no_provider_credential`). Absent when
  // `retry_allowed` is true.
  optional string blocked_reason_code = 6;
  repeated AllowedActionV1 allowed_actions = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
  EvaluationFreshnessV1 freshness = 9;
  // Which shape of `blocked_reason_code` this is, on the same contract as
  // `EvaluationPreviewBlockerV1.posture_code`. Populated for
  // `no_provider_credential` and absent for every lifecycle reason, which has
  // only one shape.
  optional string blocked_posture_code = 10;
}

message RetryEvaluationCellsRequest {
  string evaluation_run_id = 1;
  repeated EvaluationCellRefV1 cells = 2;
  string idempotency_key = 3;
}

message RetryEvaluationCellsResponse {
  EvaluationRunV1 run = 1;
  // Kind `RETRY_CELLS`. Progress is `GetEvaluationOperation`, exactly as it is
  // for preparation.
  EvaluationOperationV1 operation = 2;
  uint32 accepted_cell_count = 3;
  // The generation the accepted cells now carry. Their prior results are stamped
  // superseded and stay readable.
  uint32 attempt_generation = 4;
  uint32 superseded_result_count = 5;
  // Coordinates the request named and this retry declined, with the typed reason
  // each was declined for. A partially accepted retry is a normal outcome, not
  // an error.
  repeated EvaluationRetryCellStatusV1 rejected = 6;
  // True when this key was already used for this selection: the same operation
  // is returned, no new generation was created, and nothing was superseded twice.
  bool idempotent_replay = 7;
}

// ===========================================================================
// Scorer-grained retry
//
// A SEPARATE PAIR, not a scorer dimension on the cell pair, and the separation
// is the point: a cell retry re-runs the candidate and re-bills it, a scorer
// retry re-grades output the run already paid for and must not. One field set
// that meant both would be one refactor away from re-billing a customer.
// ===========================================================================

// One `(cell, scorer)` coordinate a scorer retry acts on.
//
// The scorer dimension sits BESIDE the reused cell ref, never inside it, so the
// cell-grained pair's own message cannot drift into meaning both grains.
message EvaluationScorerCoordinateV1 {
  EvaluationCellRefV1 cell = 1;
  string score_config_id = 2;
}

// Why one `(cell, scorer)` coordinate cannot be re-graded. An enum rather than
// a code string for the same reason `EvaluationRetryIneligibilityV1` is one: a
// client renders "there is nothing to re-grade" and "this scorer needs a
// person" completely differently.
enum EvaluationScorerRetryIneligibilityV1 {
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_UNSPECIFIED = 0;
  // The cell's candidate never produced output, so there is nothing to
  // re-grade. A CELL retry — which re-runs the candidate — is the action.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_CANDIDATE_OUTPUT_ABSENT = 1;
  // The scorer needs a person or a provider call. Re-grading it in-process
  // would either fabricate a human answer or re-bill a model.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_SCORER_NOT_DETERMINISTIC = 2;
  // The scorer-attempt ceiling. A retry loop that cannot terminate is a defect.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_ATTEMPT_CEILING_REACHED = 3;
  // The coordinate, or that scorer on it, does not exist in this run. A typed
  // per-entry answer, never NOT_FOUND and never a silent skip.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_COORDINATE_UNKNOWN = 4;
  // The scorer is an LLM judge and this build does not re-dispatch judges.
  //
  // Distinct from SCORER_NOT_DETERMINISTIC at 2, which became a FALSE statement
  // about judges the moment the executor gained them: a judge scorer is now
  // executed, priced and metered like any other, and telling a customer that
  // their judge "is not deterministic" would send them looking for a
  // configuration change that does not exist. What is missing is a re-DISPATCH
  // path — re-grading a judge means N live provider calls, which a unary
  // handler must not make — and this code names that, so the two situations
  // stay renderable apart.
  //
  // **Retired and never reused.** The value stays so a client
  // that persisted it still decodes it, but nothing in this build returns it:
  // a judge regrade IS dispatchable now, through the job pair below, and 6 says
  // so.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_JUDGE_REGRADE_NOT_DISPATCHABLE = 5;
  // The scorer is an LLM judge, and re-grading it is a JOB rather than a unary
  // apply.
  //
  // This replaces 5 as the answer a live build gives, and the difference is the
  // whole point: 5 told a customer that the dispatch path did not exist, and 6
  // tells them where it is. `RequestEvaluationJudgeRegrade` accepts exactly the
  // coordinates this verb declines with this code.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_JUDGE_REGRADE_REQUIRES_JOB = 6;
  // The coordinate names the run's scorer SUITE, which is derived and not
  // executed.
  //
  // Distinct from COORDINATE_UNKNOWN at 4, which is where this used to land and
  // which says "does not exist" about a row the customer is looking at. The
  // status's `derived_suite` carries the member coordinates that ARE
  // re-gradable.
  EVALUATION_SCORER_RETRY_INELIGIBILITY_V1_SCORER_IS_A_DERIVED_SUITE = 7;
}

message EvaluationScorerRetryStatusV1 {
  EvaluationScorerCoordinateV1 coordinate = 1;
  bool eligible = 2;
  // Present exactly when `eligible` is false.
  optional EvaluationScorerRetryIneligibilityV1 ineligibility = 3;
  // The scorer's frozen config key. Empty for an unknown coordinate, which is
  // the only case where the server has no scorer to name.
  string scorer_key = 4;
  // What this coordinate says today, before any re-grade.
  EvaluationVerdictV1 current_verdict = 5;
  // The highest scorer attempt already recorded here. The re-grade would land
  // at this + 1, and this one stays readable.
  uint32 prior_scorer_attempt = 6;
  // Present exactly when `ineligibility` is SCORER_IS_A_DERIVED_SUITE.
  optional EvaluationDerivedSuiteCoordinateV1 derived_suite = 7;
}

// Why a scorer-retry selection was refused before it was read.
//
// Rides `Status.details` on the `INVALID_ARGUMENT` both halves raise, exactly as
// `EvaluationLaunchRejectionV1` rides the launch's `FAILED_PRECONDITION`. A cap
// stated only in a prose message is a cap a client has to parse English to
// respect.
message EvaluationScorerRetryRejectionV1 {
  // A machine-groupable code, not a sentence.
  string reason_code = 1;
  uint32 requested_coordinate_count = 2;
  uint32 max_coordinate_count = 3;
  string detail = 4;
}

message PreviewRetryEvaluationScorersRequest {
  string evaluation_run_id = 1;
  // Explicit coordinates only, bounded at 50 on THIS half as well as on the
  // apply: the cap binds both halves. An over-large
  // selection is refused by name rather than truncated.
  repeated EvaluationScorerCoordinateV1 coordinates = 2;
}

message PreviewRetryEvaluationScorersResponse {
  string evaluation_run_id = 1;
  // One entry per requested coordinate, in request order, eligible or not. A
  // mixed selection is the normal case and a single aggregate verdict would
  // hide which half is which.
  repeated EvaluationScorerRetryStatusV1 coordinates = 2;
  uint32 retryable_coordinate_count = 3;
  // A NUMBER, not an availability posture. A scorer retry's external cost is
  // not unknown: it is zero by construction, because no code path from this
  // surface reaches a provider client.
  uint32 estimated_external_call_count = 4;
  bool retry_allowed = 5;
  // Why the whole selection is refused, when it is. Absent when `retry_allowed`
  // is true.
  optional string blocked_reason_code = 6;
  repeated AllowedActionV1 allowed_actions = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
  EvaluationFreshnessV1 freshness = 9;
  // Why re-grading loses no evidence: the prior scorer attempt is STAMPED
  // superseded and stays readable. A code once per response rather than once
  // per coordinate — it is a constant of the mechanism, not a property of a
  // coordinate.
  string superseded_evidence_code = 10;
}

message RetryEvaluationScorersRequest {
  string evaluation_run_id = 1;
  repeated EvaluationScorerCoordinateV1 coordinates = 2;
  string idempotency_key = 3;
}

// What one applied scorer retry changed.
message EvaluationScorerRetryAppliedV1 {
  EvaluationScorerCoordinateV1 coordinate = 1;
  string scorer_key = 2;
  EvaluationVerdictV1 prior_verdict = 3;
  EvaluationVerdictV1 verdict = 4;
  // Absent rather than zero when the comparison produced no score: an ERROR
  // verdict never carries one, and a failed comparison is not a zero.
  optional double score = 5;
  uint32 scorer_attempt = 6;
  // Attempts this re-grade stamped superseded. They are stamped, never removed.
  uint32 superseded_attempt_count = 7;
}

message RetryEvaluationScorersResponse {
  string evaluation_run_id = 1;
  repeated EvaluationScorerRetryAppliedV1 applied = 2;
  // Coordinates the request named and this retry declined, with the typed
  // reason each was declined for. A partially applied retry is a normal
  // outcome, not an error.
  repeated EvaluationScorerRetryStatusV1 refused = 3;
  uint32 applied_coordinate_count = 4;
  // Zero, always, and asserted rather than counted: there is no code path from
  // here to a provider client.
  uint32 external_calls_issued = 5;
  // True when this key had already been applied to every coordinate it named:
  // nothing was appended and nothing was superseded twice.
  bool idempotent_replay = 6;
  AgenticEvaluationCapabilitiesV1 capabilities = 7;
}

// ===========================================================================
// Execution metrics
//
// Separation is structural, not conventional: there is exactly ONE
// ExecutionMetricsV1 per scope and no field anywhere that sums candidate and
// evaluator tokens into one bucket. The legacy surface adds judge and target
// tokens together; this contract makes that shape unrepresentable rather than
// discouraged.
//
// Every group carries its own availability, never a bare zero. A candidate that
// was never called has no latency; reporting 0 would make a dashboard render it
// as instant and a Pareto plot place it at the origin.
// ===========================================================================

message TokenUsageV1 {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 total_tokens = 3;
  optional uint64 cache_read_input_tokens = 4;
  optional uint64 cache_creation_input_tokens = 5;
  optional uint64 reasoning_tokens = 6;
  // Reused as-is from the legacy provider vocabulary, never twinned.
  optional ProviderReasoningEffortV1 requested_reasoning_effort = 7;
  // One availability for the group: a provider that reports no usage reports
  // none of it, and eight identical availability blocks would be noise.
  MetricAvailabilityV1 availability = 8;
}

// The provider's own `usage` object, preserved before any narrowing.
//
// This is the record of truth; `TokenUsageV1` above is a derived view over it.
// TTL splits, per-modality breakdowns and fields no adapter has learned to read
// yet survive only here, and a destructively normalized history cannot be
// re-derived when the convention lands.
//
// It is NOT a provider body, and that distinction is structural rather than
// promised:
//
//   * only the subtree under the response's `usage` key is ever read;
//   * only SCALAR leaves are kept — an object is descended into, an array is
//     refused, because no provider reports usage as an array and permitting one
//     is the only shape that could smuggle a payload;
//   * every text leaf is capped at 64 bytes, which cannot hold a prompt, a
//     completion or a reasoning trace;
//   * the whole record is capped, and breaching any cap refuses the WHOLE
//     record rather than truncating it — a half-preserved "verbatim" record is
//     a lie about the word verbatim.
message ProviderUsageRecordV1 {
  ProviderNameV1 provider = 1;
  string model_id = 2;
  // The accounting the counts below follow. Carried WITH the counts, never
  // looked up beside them, so a cell can never be summed against a cell from a
  // provider with the opposite convention without the difference being visible.
  EvaluationTokenAccountingV1 token_accounting = 3;
  repeated ProviderUsageFieldV1 fields = 4;
  uint32 field_count = 5;
  uint32 preserved_byte_count = 6;
  // AVAILABLE when the object was preserved whole. NOT_SUPPORTED with
  // `usage_object_exceeds_verbatim_bound` when it breached a cap and was
  // refused, `usage_object_absent` when the provider reported none. Never an
  // empty field list presented as a preserved one.
  MetricAvailabilityV1 availability = 7;
  // `E1-4a` / `H-OR-2`. Which upstream actually served THIS attempt, in the
  // router's own spelling, when `provider` above names a router that chooses an
  // upstream per call. Absent for a lab, which has no upstream to echo, and
  // absent for a router that echoed none — which are the same absence for a
  // reader and a different one for an operator, so `provider_kind` on the
  // capability set is what separates them, not a sentinel here.
  //
  // This is the fact that makes a router attempt's accounting decidable at all:
  // the cache-inclusivity sign, the price and the tokenizer belong to the
  // upstream, not to the router, and no adapter can supply them. Recorded per
  // ATTEMPT rather than per cell because a router may
  // serve two attempts of one cell from two upstreams.
  optional string served_upstream_provider = 8;
  // The model identifier the response itself echoed, in the provider's own
  // spelling. On a router this is the RESOLVED slug and may carry a routing
  // variant the request never named, which is `H-OR-1` made observable rather
  // than absorbed. Never assumed equal to `model_id` above: that one is what
  // was asked for.
  optional string echoed_model_id = 9;
  // The service tier the provider echoed, verbatim. CAPTURED and not yet
  // evaluated by any rate modifier. Absent means the provider sent none, never
  // "standard".
  optional string echoed_service_tier = 10;
  // O11Y-538. Set when the provider's terms let it train on this call's inputs
  // (DeepSeek; Meta's contributor tier; #1122: Moonshot). Absent for every
  // other attempt.
  optional bool provider_trains_on_inputs = 11;
  // Set beside the above when the tenant recorded its acknowledgement. A
  // DeepSeek call is refused before it is made without one. #1115: so is a
  // candidate call on any such model, and a judge call on one is refused.
  optional bool provider_terms_acknowledged = 12;
}

// One scalar leaf of a provider's `usage` object, in the provider's own
// spelling.
message ProviderUsageFieldV1 {
  // Dotted path as the provider spells it: `input_tokens`,
  // `cache_creation.ephemeral_1h_input_tokens`,
  // `input_tokens_details.cached_tokens`. Never renamed into our vocabulary —
  // renaming is the narrowing this message exists to happen after.
  string path = 1;
  oneof value {
    int64 integer = 2;
    double number = 3;
    bool boolean = 4;
    string text = 5;
  }
}

enum CostCategoryV1 {
  COST_CATEGORY_V1_UNSPECIFIED = 0;
  COST_CATEGORY_V1_CANDIDATE_MODEL = 1;
  COST_CATEGORY_V1_EVALUATOR_MODEL = 2;
  COST_CATEGORY_V1_TOOL = 3;
  COST_CATEGORY_V1_RETRIEVAL = 4;
  COST_CATEGORY_V1_EXTERNAL_API = 5;
}

enum CostPostureV1 {
  COST_POSTURE_V1_UNSPECIFIED = 0;
  COST_POSTURE_V1_ACTUAL_PROVIDER_BILLED = 1;
  COST_POSTURE_V1_ESTIMATED = 2;
}

message CostLineItemV1 {
  CostCategoryV1 category = 1;
  // Absent is not zero: "we cannot price this" and "this was free" are
  // different answers and an operator budgets against them differently.
  optional int64 amount_micros = 2;
  string currency_code = 3;
  CostPostureV1 posture = 4;
  string pricing_source_version = 5;
  optional string pricing_snapshot_ref = 6;
  MetricAvailabilityV1 availability = 7;
}

message CostBreakdownV1 {
  repeated CostLineItemV1 line_items = 1;
  optional CostAmountV1 total = 2;
  MetricAvailabilityV1 total_availability = 3;
}

message LatencyMetricsV1 {
  optional uint64 total_micros = 1;
  MetricAvailabilityV1 total_availability = 2;
  // Captured only when actually measured. A non-streaming provider, and a
  // recorded output, have no first token.
  optional uint64 time_to_first_token_micros = 3;
  MetricAvailabilityV1 time_to_first_token_availability = 4;
  // Derived only when the generation interval AND the output token count are
  // both available; otherwise the availability says which was missing.
  optional double output_tokens_per_second = 5;
  MetricAvailabilityV1 output_tokens_per_second_availability = 6;
}

enum ProviderStatusClassV1 {
  PROVIDER_STATUS_CLASS_V1_UNSPECIFIED = 0;
  PROVIDER_STATUS_CLASS_V1_OK = 1;
  PROVIDER_STATUS_CLASS_V1_CLIENT_ERROR = 2;
  PROVIDER_STATUS_CLASS_V1_SERVER_ERROR = 3;
  PROVIDER_STATUS_CLASS_V1_TIMEOUT = 4;
  PROVIDER_STATUS_CLASS_V1_RATE_LIMITED = 5;
  PROVIDER_STATUS_CLASS_V1_CANCELLED = 6;
  // No provider was involved. Distinct from OK, which claims one answered.
  PROVIDER_STATUS_CLASS_V1_NOT_APPLICABLE = 7;
}

// Classification only. No provider response body, no headers, no credential
// material ever reaches this message.
message ProviderStatusV1 {
  ProviderStatusClassV1 status_class = 1;
  optional uint32 http_status = 2;
  optional string provider_error_code = 3;
  MetricAvailabilityV1 availability = 4;
}

enum InstrumentationCompletenessStateV1 {
  INSTRUMENTATION_COMPLETENESS_STATE_V1_UNSPECIFIED = 0;
  INSTRUMENTATION_COMPLETENESS_STATE_V1_COMPLETE = 1;
  INSTRUMENTATION_COMPLETENESS_STATE_V1_PARTIAL = 2;
  INSTRUMENTATION_COMPLETENESS_STATE_V1_UNINSTRUMENTED = 3;
  INSTRUMENTATION_COMPLETENESS_STATE_V1_REDACTED = 4;
  INSTRUMENTATION_COMPLETENESS_STATE_V1_SAMPLED_OUT = 5;
  // The value exists but only under a vendor alias; provenance names which.
  INSTRUMENTATION_COMPLETENESS_STATE_V1_CONVENTION_ALIAS = 6;
}

message InstrumentationCompletenessV1 {
  InstrumentationCompletenessStateV1 state = 1;
  optional string reason_code = 2;
  optional SemanticConventionProvenanceV1 provenance = 3;
}

enum ExecutionMetricsScopeV1 {
  EXECUTION_METRICS_SCOPE_V1_UNSPECIFIED = 0;
  EXECUTION_METRICS_SCOPE_V1_CANDIDATE_EXECUTION = 1;
  EXECUTION_METRICS_SCOPE_V1_SCORER_EXECUTION = 2;
  EXECUTION_METRICS_SCOPE_V1_EVALUATOR_AGGREGATE = 3;
  EXECUTION_METRICS_SCOPE_V1_EVALUATION_TOTAL = 4;
  // ONE evaluator's execution — the model call a judge scorer makes to reach
  // its verdict. Kept apart from EVALUATOR_AGGREGATE at 3, which is a roll-up
  // ACROSS evaluators: a reader has to be able to tell "this judge cost this
  // much" from "the evaluator side cost this much in total", and a single scope
  // would make the two indistinguishable on the wire.
  //
  // A message carrying this scope is NEVER summed with one carrying
  // CANDIDATE_EXECUTION.
  EXECUTION_METRICS_SCOPE_V1_EVALUATOR_EXECUTION = 5;
}

message ExecutionMetricsV1 {
  ExecutionMetricsScopeV1 scope = 1;
  TokenUsageV1 tokens = 2;
  CostBreakdownV1 cost = 3;
  LatencyMetricsV1 latency = 4;
  uint32 retry_count = 5;
  // On EVALUATOR_EXECUTION, 0 when provider_status is NOT_APPLICABLE: a judge
  // stopped before any call reached a provider made no call (#1132).
  uint32 attempt_count = 6;
  ProviderStatusV1 provider_status = 7;
  optional string execution_trace_id = 8;
  optional EvaluationFailureV1 failure = 9;
  InstrumentationCompletenessV1 completeness = 10;
  // The output-token budget the call was sent. Set on EVALUATOR_EXECUTION
  // only; absent where this build did not record it.
  optional uint32 max_output_tokens = 11;
}

// ===========================================================================
// Per-cell result
// ===========================================================================

enum EvaluationVerdictV1 {
  EVALUATION_VERDICT_V1_UNSPECIFIED = 0;
  EVALUATION_VERDICT_V1_PASS = 1;
  EVALUATION_VERDICT_V1_FAIL = 2;
  // The scorer could not produce a verdict. Distinct from FAIL, which is a
  // verdict, and carries no score at all rather than a zero one.
  EVALUATION_VERDICT_V1_ERROR = 3;
  // Policy or sampling excluded it; never "failed".
  EVALUATION_VERDICT_V1_SKIPPED = 4;
  // The scorer does not apply to this subject.
  EVALUATION_VERDICT_V1_NOT_APPLICABLE = 5;
}

// How a candidate's output was obtained. A scalar discriminant beside the
// manifest's oneof, because facts and filters need one that survives projection
// into a column.
enum EvaluationCandidateSourceV1 {
  EVALUATION_CANDIDATE_SOURCE_V1_UNSPECIFIED = 0;
  EVALUATION_CANDIDATE_SOURCE_V1_RECORDED_OUTPUT = 1;
  EVALUATION_CANDIDATE_SOURCE_V1_PROVIDER_CALL = 2;
  EVALUATION_CANDIDATE_SOURCE_V1_HTTP_ENDPOINT = 3;
  EVALUATION_CANDIDATE_SOURCE_V1_EXTERNAL_SUBMISSION = 4;
}

// Score and verdict are kept distinct from execution health: a scorer that
// failed has no score, and a scorer that scored zero did not fail.
message EvaluationScorerResultV1 {
  string score_config_id = 1;
  string config_key = 2;
  string metric_name = 3;
  EvaluationVerdictV1 verdict = 4;
  optional double score = 5;
  MetricAvailabilityV1 score_availability = 6;
  optional bool is_blocking_gate = 7;
  optional EvaluationFailureV1 failure = 8;
  // scope = SCORER_EXECUTION. Never aggregated with candidate metrics.
  ExecutionMetricsV1 metrics = 9;
}

message EvaluationCellResultV1 {
  string evaluation_run_id = 1;
  string cohort_key = 2;
  string candidate_key = 3;
  string case_revision_id = 4;
  uint32 trial = 5;
  EvaluationExecutionStateV1 state = 6;
  EvaluationCandidateSourceV1 candidate_source = 7;
  // scope = CANDIDATE_EXECUTION. Resolved once per cell however many scorers
  // read it.
  ExecutionMetricsV1 candidate_metrics = 8;
  repeated EvaluationScorerResultV1 scorer_results = 9;
  EvaluationVerdictV1 aggregate_verdict = 10;
  // The candidate's own failure. A scorer failure lives on the scorer result
  // and never turns a valid candidate output into a candidate failure.
  optional EvaluationFailureV1 failure = 11;
  optional google.protobuf.Timestamp executed_at = 12;
}

// ===========================================================================
// Run overview
// ===========================================================================

enum EvaluationRunOverviewProfileV1 {
  EVALUATION_RUN_OVERVIEW_PROFILE_V1_UNSPECIFIED = 0;
  EVALUATION_RUN_OVERVIEW_PROFILE_V1_INITIAL = 1;
  EVALUATION_RUN_OVERVIEW_PROFILE_V1_FULL = 2;
}

message EvaluationVerdictCountsV1 {
  uint32 pass_count = 1;
  uint32 fail_count = 2;
  uint32 error_count = 3;
  uint32 skipped_count = 4;
  uint32 not_applicable_count = 5;
  uint32 total_count = 6;
}

message EvaluationScorerRollupV1 {
  string score_config_id = 1;
  string config_key = 2;
  string metric_name = 3;
  EvaluationVerdictCountsV1 verdicts = 4;
  // Absent when no result carried a score. The availability distinguishes
  // "nothing scored yet" from "every scorer errored", which are different
  // customer situations with the same empty rendering.
  optional double mean_score = 5;
  MetricAvailabilityV1 mean_score_availability = 6;
  optional bool is_blocking_gate = 7;
  EvaluationFreshnessV1 freshness = 8;
  // How much of this scorer's work is done, and whether what is missing is
  // outstanding work or parked human review. A scorer three cells into a
  // thousand and a scorer waiting on a reviewer render identically without this.
  EvaluationScorerCompletionV1 completion = 9;
  // This scorer's OWN model economics across the run, so "which judge is
  // costing the money?" is answerable from the rollup a client already has.
  //
  // `scope = EVALUATOR_EXECUTION`, never summed with the run's candidate
  // economics. Unlike the per-cell candidate figures on the series grain, THIS
  // one IS additive across scorers: a judge call happens once per
  // `(cell, scorer)`, so summing these across a run's scorers is the run's
  // evaluator spend.
  ExecutionMetricsV1 evaluator_economics = 10;
}

enum EvaluationScorerCompletionStateV1 {
  EVALUATION_SCORER_COMPLETION_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_COMPLETION_STATE_V1_NOT_STARTED = 1;
  EVALUATION_SCORER_COMPLETION_STATE_V1_PARTIAL = 2;
  EVALUATION_SCORER_COMPLETION_STATE_V1_COMPLETE = 3;
  // Required human evidence is outstanding. A state, not missing work: the
  // cells exist, the candidate output exists, and the score is pending — it is
  // never zero and never a FAIL verdict.
  EVALUATION_SCORER_COMPLETION_STATE_V1_AWAITING_HUMAN_REVIEW = 4;
}

message EvaluationScorerCompletionV1 {
  EvaluationScorerCompletionStateV1 state = 1;
  uint32 expected_cell_count = 2;
  uint32 completed_cell_count = 3;
  uint32 pending_review_cell_count = 4;
  // Cells the frozen human-review sampling policy did not select. Distinct from
  // missing, failed, and pending.
  uint32 not_sampled_cell_count = 5;
  optional string reason_code = 6;
}

message EvaluationFailureStageCountV1 {
  EvaluationFailureStageV1 stage = 1;
  string code = 2;
  uint32 count = 3;
}

message EvaluationRunFailureRollupV1 {
  uint32 candidate_failure_count = 1;
  uint32 scorer_failure_count = 2;
  uint32 cancelled_cell_count = 3;
  repeated EvaluationFailureStageCountV1 by_stage = 4;
  // The failure that ended the run, when one did. Distinct from the per-cell
  // counts: a run can fail with zero failed cells (a validation refusal).
  optional EvaluationFailureV1 terminal_failure = 5;
  // What `by_stage` is and is not: it is populated at stage granularity, and
  // the per-code split inside a stage is not computed, so the availability says
  // so rather than the section implying a fidelity it does not carry.
  MetricAvailabilityV1 by_stage_availability = 6;
  // #616. Failed cells per class and stage, classified by the taxonomy the
  // trial counts use. Cells only: a scorer error is not a trial, and is
  // `scorer_failure_count`.
  repeated EvaluationFailureClassCountV1 by_class = 7;
  MetricAvailabilityV1 by_class_availability = 8;
}

message EvaluationFailureClassCountV1 {
  EvaluationFailureClassV1 failure_class = 1;
  EvaluationFailureStageV1 stage = 2;
  uint32 count = 3;
}

// The run's recovery posture: what is left, what can be re-executed, and what
// re-executing already replaced.
//
// Counts, never percentages, and each one apart from the others: a run with 40
// budget-blocked cells and a run with 40 failed cells need different actions and
// must not render the same.
message EvaluationRunRecoveryV1 {
  uint32 retryable_cell_count = 1;
  uint32 awaiting_review_cell_count = 2;
  uint32 budget_blocked_cell_count = 3;
  uint32 cancelled_cell_count = 4;
  uint32 superseded_result_count = 5;
  // The highest attempt generation any cell in this run carries. 1 for a run
  // that has never been retried.
  uint32 attempt_generation = 6;
  // What this build recommends the operator do. Absent when the run needs
  // nothing.
  optional RecoveryActionV1 recommended_action = 7;
  MetricAvailabilityV1 availability = 8;
}

// Why a cursor could not be honoured, as a typed directive rather than as prose
// inside a transport status: a superseded snapshot returns a typed resync.
enum EvaluationResyncReasonV1 {
  EVALUATION_RESYNC_REASON_V1_UNSPECIFIED = 0;
  // The rows the cursor pointed at are no longer the rows the query returns.
  EVALUATION_RESYNC_REASON_V1_SNAPSHOT_SUPERSEDED = 1;
  // The cursor was written for a different filter or sort.
  EVALUATION_RESYNC_REASON_V1_FILTER_CHANGED = 2;
  EVALUATION_RESYNC_REASON_V1_CURSOR_MALFORMED = 3;
  // The change backlog behind this cursor is longer than the feed will replay,
  // so refetching the overview costs the customer less than catching up.
  EVALUATION_RESYNC_REASON_V1_BACKLOG_EXCEEDED = 4;
}

message EvaluationCursorResyncV1 {
  EvaluationResyncReasonV1 reason = 1;
  // True when the client must restart from the first page. False would mean the
  // cursor is still usable, which no current reason allows — the field exists so
  // a future recoverable reason does not need a second message.
  bool restart_required = 2;
  optional string detail = 3;
}

// ===========================================================================
// Decision drivers
// ===========================================================================

// What kind of finding a driver row is.
//
// The kinds that do not name a reference exist because a run may have no pinned
// champion: a surface that could only describe regressions would have nothing to
// say about the first run of a new evaluation, which is exactly when "what
// should I inspect first?" is hardest to answer.
enum EvaluationDecisionDriverKindV1 {
  EVALUATION_DECISION_DRIVER_KIND_V1_UNSPECIFIED = 0;
  // The challenger failed where the pinned reference passed, on aligned cases.
  EVALUATION_DECISION_DRIVER_KIND_V1_SCORER_REGRESSION = 1;
  // Failures concentrated on one (candidate, scorer) with no reference to
  // compare against.
  EVALUATION_DECISION_DRIVER_KIND_V1_SCORER_FAILURE_CONCENTRATION = 2;
  // Results exist but carry no score, so the mean this row feeds is thinner
  // than its denominator suggests.
  EVALUATION_DECISION_DRIVER_KIND_V1_MISSING_SCORE_EVIDENCE = 3;
  // The candidate itself failed to produce output; no scorer opinion exists.
  EVALUATION_DECISION_DRIVER_KIND_V1_CANDIDATE_EXECUTION_FAILURE = 4;
}

// What the finding costs the customer. Separate from the kind because the same
// kind means different things on a blocking gate and on a diagnostic measure.
enum EvaluationDecisionConsequenceV1 {
  EVALUATION_DECISION_CONSEQUENCE_V1_UNSPECIFIED = 0;
  EVALUATION_DECISION_CONSEQUENCE_V1_BLOCKS_RELEASE_GATE = 1;
  EVALUATION_DECISION_CONSEQUENCE_V1_QUALITY_REGRESSION = 2;
  EVALUATION_DECISION_CONSEQUENCE_V1_QUALITY_FAILURE = 3;
  EVALUATION_DECISION_CONSEQUENCE_V1_EVIDENCE_INCOMPLETE = 4;
}

// One ranked "inspect this first" finding.
//
// Count AND denominator, never a percentage and never a bare count: "12 cases"
// is unreadable without "of 50", and a percentage cannot distinguish 1-of-2 from
// 500-of-1000.
message EvaluationDecisionDriverV1 {
  // 1-based position in the server's total ordering. Two clients rendering the
  // same run agree on what to inspect first.
  uint32 ordinal = 1;
  EvaluationDecisionDriverKindV1 kind = 2;
  EvaluationDecisionConsequenceV1 consequence = 3;
  // The pair this finding is about. `reference_candidate_key` is absent exactly
  // when the run pinned no champion, which is also when `kind` is one of the
  // reference-free kinds.
  string candidate_key = 4;
  optional string reference_candidate_key = 5;
  string score_config_id = 6;
  string config_key = 7;
  string metric_name = 8;
  bool is_blocking_gate = 9;
  uint32 affected_count = 10;
  uint32 denominator = 11;
  // The frozen matrix filter this driver deep-links to. Server-issued and stable;
  // the matrix that consumes it is `evaluation_run_matrix` in the capability set,
  // which this build reports AVAILABLE.
  string matrix_filter_token = 12;
}

message EvaluationDecisionDriversV1 {
  MetricAvailabilityV1 availability = 1;
  // Ranked, at most 10. The ordering is total and server-assigned.
  repeated EvaluationDecisionDriverV1 drivers = 2;
  // The champion these drivers are stated against. Absent when the frozen
  // decision policy pinned none.
  optional string reference_candidate_key = 3;
  // Why the list is empty, when it is. "No regressions" and "the run has not
  // finished" render completely differently and must not share an empty list.
  optional string reason_code = 4;
  EvaluationFreshnessV1 freshness = 5;
}

// ===========================================================================
// Statistics (Holm-corrected)
// ===========================================================================

enum StatisticalTestV1 {
  STATISTICAL_TEST_V1_UNSPECIFIED = 0;
  // Two-sided exact binomial sign test on the discordant pairs. Paired, because
  // both candidates were graded on the same frozen cases; an unpaired test would
  // throw the pairing away and understate power.
  STATISTICAL_TEST_V1_MCNEMAR_EXACT = 1;
}

enum MultipleComparisonCorrectionV1 {
  MULTIPLE_COMPARISON_CORRECTION_V1_UNSPECIFIED = 0;
  MULTIPLE_COMPARISON_CORRECTION_V1_NONE = 1;
  MULTIPLE_COMPARISON_CORRECTION_V1_HOLM = 2;
}

enum StatisticalValidityV1 {
  STATISTICAL_VALIDITY_V1_UNSPECIFIED = 0;
  STATISTICAL_VALIDITY_V1_VALID = 1;
  // Too few aligned pairs for the test to say anything. The result is then
  // ABSENT rather than present-and-wide.
  STATISTICAL_VALIDITY_V1_INSUFFICIENT_SAMPLE = 2;
  STATISTICAL_VALIDITY_V1_NOT_APPLICABLE = 3;
}

// Which table a rollout count was read from.
//
// The comparison plane and the matrix count repeats from different evidence, and
// a number whose provenance differs between two surfaces says so on the wire
// rather than leaving a client to assume they are the same count.
enum EvaluationRepeatBasisV1 {
  EVALUATION_REPEAT_BASIS_V1_UNSPECIFIED = 0;
  // Rollouts that produced evidence, counted per (candidate, case, scorer)
  // coordinate: a verdict, or a task-class failure counted as a failed trial.
  // Infrastructure failures are not rollouts.
  EVALUATION_REPEAT_BASIS_V1_SCORED_ROLLOUTS = 1;
  // Rollouts the frozen plan prepared per (candidate, case) coordinate. Never
  // smaller than the scored count for the same run.
  EVALUATION_REPEAT_BASIS_V1_PREPARED_ROLLOUTS = 2;
}

// How a coordinate's repeated rollouts became one outcome per case.
enum ComparisonAlignmentRuleV1 {
  COMPARISON_ALIGNMENT_RULE_V1_UNSPECIFIED = 0;
  // Exactly one usable rollout per coordinate: the collapse is the identity.
  COMPARISON_ALIGNMENT_RULE_V1_SINGLE_ROLLOUT = 1;
  // The verdict with a strict lead in rollout count wins the case. An exact tie
  // for the lead is neither a regression nor an improvement AND stays in the
  // aligned denominator.
  COMPARISON_ALIGNMENT_RULE_V1_MAJORITY_TIE_IS_NEITHER_WIN = 2;
}

// The rollout floor, observed against required.
//
// It binds RENDERING, not launching: a run below it launches normally and
// `default_trials` does not move, but no surface renders a verdict from it.
message RepeatSampleCheckV1 {
  bool satisfied = 1;
  // The WEAKEST coordinate, never a mean: the floor holds per (candidate, case)
  // coordinate, and a universal claim is met only when its
  // weakest instance meets it.
  uint32 observed_repeat_count = 2;
  uint32 required_repeat_count = 3;
  EvaluationRepeatBasisV1 basis = 4;
}

// What the sample was WORTH.
//
// The smallest true net improved-case rate a two-sided test at `alpha` would
// have rejected with probability `power`, on the aligned-case denominator this
// comparison actually had. Same units as `StatisticalResultV1.effect_size`, so
// the two render side by side without conversion.
message MinimumDetectableEffectV1 {
  double effect = 1;
  double alpha = 2;
  double power = 3;
  // Cases, after the cluster collapse. The denominator this is a statement
  // about.
  uint32 aligned_pair_count = 4;
  // (regressed + improved) / aligned. The estimate conditions on the discordant
  // rate that was OBSERVED, which is what `basis_code` records.
  double discordant_rate = 5;
  // `observed_discordant_rate_normal_approximation`. Carried so this is never
  // mistaken for a power calculation performed before the run.
  string basis_code = 6;
}

// Repeats of one case are a cluster, not independent observations.
//
// States what the collapse did to this pair's rollouts, and how much the
// challenger's own repeats disagreed with each other.
message ComparisonRepeatAlignmentV1 {
  ComparisonAlignmentRuleV1 rule = 1;
  // The rule in words, so a surface never hard-codes the semantics of `rule`.
  string reason_code = 2;
  // Cases carrying two or more usable rollouts — the only cases a collapse
  // could resolve.
  uint32 repeated_case_count = 3;
  // Cases whose own rollouts disagreed with each other.
  uint32 split_case_count = 4;
  // Cases whose rollouts tied for the lead. A tie is neither a regression nor an
  // improvement and it STAYS in `aligned_pair_count`.
  uint32 tie_case_count = 5;
  // split / repeated. Absent — never 0.0 — when no case carried a repeat, which
  // is a different statement from "every repeat agreed".
  optional double instability_rate = 6;
}

// Observed against required, both stated. A boolean alone cannot tell a customer
// how many more cases would make the answer trustworthy.
message MinimumSampleCheckV1 {
  bool satisfied = 1;
  uint32 observed_count = 2;
  uint32 required_count = 3;
}

// #694. An interval on a net improved-case rate that inverts the exact sign
// test it sits beside: it excludes zero exactly when that test is significant
// after Holm's correction. `confidence_level` is the level it was built at,
// Holm's per-test level 1 - alpha / (m - rank + 1), so it equals 1 - alpha only
// when one pair was tested; its coverage is never below 1 - alpha.
message ConfidenceIntervalV1 {
  double lower = 1;
  double upper = 2;
  double confidence_level = 3;
}

message StatisticalResultV1 {
  StatisticalTestV1 test = 1;
  double p_value = 2;
  // After the correction named below. Equal to `p_value` only when the family
  // has one member.
  double corrected_p_value = 3;
  MultipleComparisonCorrectionV1 correction = 4;
  // Net improved-case rate: (improved - regressed) / aligned pairs. Signed, so a
  // regression is visible as one.
  double effect_size = 5;
  optional ConfidenceIntervalV1 confidence_interval = 6;
  StatisticalValidityV1 validity = 7;
  bool significant = 8;
  // The threshold `significant` was decided against, carried so a reader never
  // has to assume 0.05.
  double alpha = 9;
  // Absent — with the reason below — when the comparison saw no discordant pair:
  // an observed discordant rate of zero drives the estimate to zero, which would
  // render as "this suite can detect any effect at all".
  optional MinimumDetectableEffectV1 minimum_detectable_effect = 10;
  MetricAvailabilityV1 minimum_detectable_effect_availability = 11;
  // The CLUSTER-ROBUST variance of `effect_size`, and its square root.
  //
  // Robust by construction rather than by a sandwich estimator: the paired
  // denominator counts cases, each case contributes exactly one signed
  // difference, so the ordinary variance of the case-level mean IS the clustered
  // variance. Optional so a future floor below two cases cannot turn an
  // undefined variance into 0.0.
  optional double effect_size_variance = 12;
  optional double effect_size_standard_error = 13;
}

// ===========================================================================
// Candidate comparison
// ===========================================================================

// O11Y-592. pass@k and pass^k for one challenger under one scorer, over the
// same trials. An infrastructure failure is not a trial; a task failure is a
// failed one. Each is the unbiased per-case estimate over n usable trials,
// C(c,k)/C(n,k) for pass^k and 1 - C(n-c,k)/C(n,k) for pass@k, averaged over
// the cases with n >= k.
message EvaluationConsistencyV1 {
  // The rollout floor, so runs with different trial counts estimate the same
  // quantity.
  uint32 k = 1;
  // The chance at least one of k trials passes.
  optional double pass_at_k = 2;
  // The chance all k trials pass.
  optional double pass_hat_k = 3;
  // Cases with at least k usable trials: the denominator of both.
  uint32 case_count = 4;
  // Cases left out because fewer than k of their trials were usable. Absent
  // from the estimate, never scored zero.
  uint32 cases_below_k = 5;
  // NOT_SUPPORTED with `fewer_usable_trials_than_k` when no case reached k.
  MetricAvailabilityV1 availability = 6;
}

message CandidatePairComparisonV1 {
  string candidate_key = 1;
  string score_config_id = 2;
  string config_key = 3;
  string metric_name = 4;
  bool is_blocking_gate = 5;
  // Cases where BOTH the challenger and the reference produced evidence: a
  // verdict, or a task-class failure, which counts as a failed trial.
  // Infrastructure failures are not evidence. Every count below is out of this
  // denominator.
  uint32 aligned_pair_count = 6;
  // Reference passed, challenger failed.
  uint32 regressed_count = 7;
  // Reference failed, challenger passed.
  uint32 improved_count = 8;
  uint32 unchanged_count = 9;
  // Absent when either sample floor is not met — never present with a shrug.
  optional StatisticalResultV1 statistics = 10;
  MinimumSampleCheckV1 minimum_sample = 11;
  // The rollout floor. Carried on the pair rather than only on
  // the decision because this is the row the verdict is about.
  RepeatSampleCheckV1 repeat_sample = 12;
  // How this pair's repeated rollouts were collapsed to one outcome per case.
  // Always present, including when `statistics` is absent — a reason that
  // disappears whenever it matters is not a reason.
  ComparisonRepeatAlignmentV1 repeat_alignment = 13;
  // The minimum detectable effect, on the pair.
  //
  // `statistics` above is absent exactly when a sample floor is unmet, which is
  // exactly when a customer most needs to know what effect size this comparison
  // COULD have detected: "we cannot rule" and "we cannot rule, and here is how
  // much better a candidate would have had to be before we could have"
  // are different answers, and only the second one cannot be read as "no
  // difference". An MDE carried only inside `StatisticalResultV1` therefore
  // vanishes in the one state the guarantee was written for.
  //
  // Filled from the SAME call that fills
  // `StatisticalResultV1.minimum_detectable_effect`: one computation, two
  // placements, so the two can never disagree. Absent — never 0.0 — with the
  // reason below when the estimate has no basis.
  optional MinimumDetectableEffectV1 minimum_detectable_effect = 14;
  // Always present, for the reason `repeat_alignment` is: an absence with no
  // stated reason is indistinguishable from a server that forgot to compute
  // one. NOT_SUPPORTED under `no_discordant_pairs_to_estimate_from`,
  // `no_aligned_cases_to_estimate_from` or
  // `mde_undefined_for_the_declared_alpha_and_power` — none of which resolves
  // by waiting on this run's evidence.
  MetricAvailabilityV1 minimum_detectable_effect_availability = 15;
  // O11Y-592. The challenger's consistency under this scorer. Absent from a
  // server that predates it.
  EvaluationConsistencyV1 consistency = 16;
}

message EvaluationCandidateComparisonV1 {
  optional string reference_candidate_key = 1;
  // Why there is no reference, when there is none. A comparison section with an
  // empty pair list and no reason is indistinguishable from a broken one.
  MetricAvailabilityV1 reference_availability = 2;
  repeated CandidatePairComparisonV1 pairs = 3;
  MultipleComparisonCorrectionV1 correction = 4;
  // How many tests the correction was applied across. Holm's adjustment is
  // meaningless without it.
  uint32 test_family_size = 5;
  MetricAvailabilityV1 availability = 6;
  EvaluationFreshnessV1 freshness = 7;
}

// ===========================================================================
// Slice analysis
// ===========================================================================

// The approved slice dimensions. Only COHORT is carried at the cell grain
// today; richer dimensions live on dataset items.
enum EvaluationSliceDimensionV1 {
  EVALUATION_SLICE_DIMENSION_V1_UNSPECIFIED = 0;
  EVALUATION_SLICE_DIMENSION_V1_COHORT = 1;
}

message EvaluationSliceCandidateRowV1 {
  string candidate_key = 1;
  EvaluationVerdictCountsV1 verdicts = 2;
  // Absent when nothing in this slice carried a score. Never 0.0 for missing.
  optional double mean_score = 3;
  MetricAvailabilityV1 mean_score_availability = 4;
  uint32 scored_result_count = 5;
}

message EvaluationSliceV1 {
  string slice_key = 1;
  uint32 case_count = 2;
  repeated EvaluationSliceCandidateRowV1 candidates = 3;
}

message EvaluationSliceAnalysisV1 {
  EvaluationSliceDimensionV1 dimension = 1;
  repeated EvaluationSliceV1 slices = 2;
  // Slices beyond the cap, counted rather than dropped: a truncated section that
  // does not say it truncated is a wrong section.
  uint32 truncated_slice_count = 3;
  MetricAvailabilityV1 availability = 4;
  EvaluationFreshnessV1 freshness = 5;
}

// ===========================================================================
// Data quality
// ===========================================================================

enum DataQualityFindingKindV1 {
  DATA_QUALITY_FINDING_KIND_V1_UNSPECIFIED = 0;
  DATA_QUALITY_FINDING_KIND_V1_DUPLICATE_CASES = 1;
  DATA_QUALITY_FINDING_KIND_V1_MISSING_GROUND_TRUTH = 2;
  DATA_QUALITY_FINDING_KIND_V1_UNSCORED_EVIDENCE = 3;
  DATA_QUALITY_FINDING_KIND_V1_COHORT_COVERAGE_GAP = 4;
  // Declared for the full frozen vocabulary; not computed by this build, which
  // reports DEGRADED rather than emitting them as absent.
  DATA_QUALITY_FINDING_KIND_V1_CONFLICTING_EXPECTED_OUTPUT = 5;
  DATA_QUALITY_FINDING_KIND_V1_LEAKAGE_SIGNAL = 6;
  DATA_QUALITY_FINDING_KIND_V1_DISTRIBUTION_DRIFT = 7;
}

enum FindingSeverityV1 {
  FINDING_SEVERITY_V1_UNSPECIFIED = 0;
  FINDING_SEVERITY_V1_INFO = 1;
  FINDING_SEVERITY_V1_WARNING = 2;
  FINDING_SEVERITY_V1_BLOCKING = 3;
}

message DataQualityFindingV1 {
  DataQualityFindingKindV1 kind = 1;
  FindingSeverityV1 severity = 2;
  // The method that produced the finding, versioned. Plan :702 forbids a warning
  // becoming an automatic block without a versioned rule, so the rule version is
  // a field rather than a comment.
  string method_name = 3;
  string method_version = 4;
  optional double false_positive_rate = 5;
  // Bounded sample of the affected cases, for a deep link. Never the whole set.
  repeated string affected_case_ids = 6;
  optional string policy_rule_version = 7;
  uint32 affected_count = 8;
  // "12 duplicates" without "of 100" is not a finding.
  uint32 denominator = 9;
}

message EvaluationDataQualityV1 {
  repeated DataQualityFindingV1 findings = 1;
  uint32 case_count = 2;
  uint32 duplicate_case_count = 3;
  uint32 unscored_result_count = 4;
  uint32 aligned_case_count = 5;
  MetricAvailabilityV1 availability = 6;
  EvaluationFreshnessV1 freshness = 7;
}

// ===========================================================================
// Regression history
// ===========================================================================

// Keyset cursors carry no ordinal or filtered-set total, but a screen announces
// "7 of 120". Exact only when cheap; approximate is labelled as such and never
// silently exact.
message TotalMatchingV1 {
  uint64 value = 1;
  bool exact = 2;
}

message RegressionSeriesPointV1 {
  // 1-based, newest first.
  uint32 ordinal = 1;
  string evaluation_run_id = 2;
  EvaluationRunStateV1 state = 3;
  optional google.protobuf.Timestamp started_at = 4;
  optional google.protobuf.Timestamp finished_at = 5;
  EvaluationVerdictCountsV1 verdicts = 6;
  optional double mean_score = 7;
  MetricAvailabilityV1 mean_score_availability = 8;
  uint32 executed_cell_count = 9;
  optional CostAmountV1 candidate_cost = 10;
  // True for the run the overview is about, so the client can mark "you are
  // here" without comparing ids.
  bool is_current_run = 11;
}

message EvaluationRegressionHistoryV1 {
  repeated RegressionSeriesPointV1 points = 1;
  TotalMatchingV1 total_matching = 2;
  MetricAvailabilityV1 availability = 3;
  EvaluationFreshnessV1 freshness = 4;
}

// ===========================================================================
// The decision itself
// ===========================================================================

enum EvaluationDecisionOutcomeV1 {
  EVALUATION_DECISION_OUTCOME_V1_UNSPECIFIED = 0;
  EVALUATION_DECISION_OUTCOME_V1_RECOMMENDED = 1;
  // First-class, not a degenerate RECOMMENDED.
  EVALUATION_DECISION_OUTCOME_V1_NO_CLEAR_WINNER = 2;
  EVALUATION_DECISION_OUTCOME_V1_INSUFFICIENT_EVIDENCE = 3;
  EVALUATION_DECISION_OUTCOME_V1_BLOCKED = 4;
}

// #708. Which way a candidate's net effect went, and whether its strongest
// Holm-corrected p cleared the decision's alpha: the test RECOMMENDED already
// applies, stated for regressions too. Significance follows the sign of the
// net effect, so a candidate significantly worse on one scorer and better on
// net reads SIGNIFICANT_IMPROVEMENT.
enum EvaluationEffectDirectionV1 {
  EVALUATION_EFFECT_DIRECTION_V1_UNSPECIFIED = 0;
  EVALUATION_EFFECT_DIRECTION_V1_SIGNIFICANT_IMPROVEMENT = 1;
  EVALUATION_EFFECT_DIRECTION_V1_SIGNIFICANT_REGRESSION = 2;
  // Tested and not significant, or significant with a net effect of zero.
  EVALUATION_EFFECT_DIRECTION_V1_NOT_SIGNIFICANT = 3;
}

// Whether this decision is the record or a what-if.
//
// One enum on the one decision shape, rather than a parallel "exploration"
// message: a separate message could be rendered through the adopted code path by
// accident, and a field cannot go missing from the wire without the marker
// going missing too.
enum EvaluationDecisionProvenanceV1 {
  EVALUATION_DECISION_PROVENANCE_V1_UNSPECIFIED = 0;
  EVALUATION_DECISION_PROVENANCE_V1_ADOPTED = 1;
  EVALUATION_DECISION_PROVENANCE_V1_EXPLORATION = 2;
}

enum DecisionBlockerKindV1 {
  DECISION_BLOCKER_KIND_V1_UNSPECIFIED = 0;
  DECISION_BLOCKER_KIND_V1_MIN_SCORE_NOT_MET = 1;
  DECISION_BLOCKER_KIND_V1_MAX_REGRESSION_EXCEEDED = 2;
  DECISION_BLOCKER_KIND_V1_MAX_COST_EXCEEDED = 3;
  DECISION_BLOCKER_KIND_V1_MIN_COVERAGE_NOT_MET = 4;
  DECISION_BLOCKER_KIND_V1_EVIDENCE_INCOMPLETE = 5;
  DECISION_BLOCKER_KIND_V1_NOT_COMPARABLE = 6;
}

message DecisionBlockerV1 {
  DecisionBlockerKindV1 kind = 1;
  string candidate_key = 2;
  optional string score_config_id = 3;
  // Observed against threshold, both stated: "below the minimum" without the two
  // numbers is not actionable.
  optional double observed_value = 4;
  optional double threshold_value = 5;
  string detail = 6;
}

message CandidateTradeoffV1 {
  string candidate_key = 1;
  // Net improved-case rate against the reference. Signed.
  double quality_delta = 2;
  optional CostAmountV1 cost_delta = 3;
  uint32 improved_case_count = 4;
  uint32 regressed_case_count = 5;
  // Holm-corrected. Absent when a sample floor was not met.
  optional double corrected_p_value = 6;
  bool blocked = 7;
  // How often this candidate's own repeats of one case disagreed with each other,
  // pooled over its scorers. A candidate that is INCONSISTENT shows a high rate
  // with `quality_delta` near zero; a candidate that is WORSE shows a low rate
  // with a negative `quality_delta`. Absent, never 0.0, when no case carried a
  // repeat.
  optional double instability_rate = 8;
  // The WIDEST of this candidate's per-scorer cluster-robust standard errors,
  // not a pooled one: `quality_delta` sums across scorers that graded the same
  // cases, and pooling their variances would treat correlated observations as
  // independent, which is anti-conservative.
  // Absent when no pair met the floors.
  optional double quality_delta_standard_error = 9;
  // O11Y-592. The consistency of this candidate's least consistent scorer, by
  // pass^k. Absent when no scorer produced an estimate, or from a server that
  // predates it.
  optional EvaluationConsistencyV1 consistency = 10;
  // #708. The denominator of `quality_delta`: aligned pairs summed across this
  // candidate's scorers, so pairs × scorers rather than cases. With the summed
  // counts above, quality_delta == (improved - regressed) / aligned_pair_count.
  uint32 aligned_pair_count = 11;
  // #708. Absent when `corrected_p_value` is: below a sample floor nothing was
  // tested, which is a different answer from NOT_SIGNIFICANT.
  optional EvaluationEffectDirectionV1 direction = 12;
  // #694. The interval on `quality_delta` at the decision's alpha, agreeing with
  // `direction`. Absent when `direction` is, and when `quality_delta` pools
  // several scorers: no interval on a pooled rate agrees with a direction
  // decided by the strongest single scorer.
  optional ConfidenceIntervalV1 quality_delta_interval = 13;
}

// How much of the evidence the decision is standing on.
message EvidencePostureV1 {
  CompletenessStateV1 completeness = 1;
  uint32 aligned_case_count = 2;
  uint32 expected_case_count = 3;
  uint32 unscored_result_count = 4;
  uint32 awaiting_review_cell_count = 5;
  MetricAvailabilityV1 availability = 6;
}

message EvaluationDecisionV1 {
  string decision_policy_version = 1;
  EvaluationDecisionOutcomeV1 outcome = 2;
  optional string recommended_candidate_key = 3;
  optional string reference_candidate_key = 4;
  repeated CandidateTradeoffV1 tradeoffs = 5;
  repeated DecisionBlockerV1 blockers = 6;
  MinimumSampleCheckV1 minimum_sample = 7;
  optional StatisticalResultV1 statistics = 8;
  EvidencePostureV1 evidence_posture = 9;
  // ADOPTED or EXPLORATION.
  EvaluationDecisionProvenanceV1 provenance = 10;
  string algorithm_version = 11;
  // The rollout floor this decision was — or was not — standing on. Below it the
  // outcome is INSUFFICIENT_EVIDENCE, which is a different answer from
  // NO_CLEAR_WINNER and must not be confused with it.
  RepeatSampleCheckV1 repeat_sample = 12;
  // #708. The significance threshold every tradeoff's `direction` was decided
  // against: 1 - the policy's `minimum_confidence`, else the default. Absent on
  // a recorded revision, whose ledger row does not persist it.
  optional double alpha = 13;
}

// One row of the append-only ledger. Late facts create a new revision; nothing
// here is ever mutated.
message EvaluationDecisionRevisionV1 {
  string id = 1;
  string evaluation_run_id = 2;
  // 1-based and unique per run, so the ledger has an order that survives clock
  // skew.
  uint32 revision_ordinal = 3;
  // The evidence this revision pins: the run's monotonic evidence version.
  uint64 evidence_projection_version = 4;
  string decision_policy_version = 5;
  string algorithm_version = 6;
  bytes inputs_digest = 7;
  EvaluationDecisionV1 decision = 8;
  repeated EvaluationCellRefV1 exclusions = 9;
  // Required. An adoption without a stated reason is an audit hole, not a
  // convenience.
  string reason = 10;
  PrincipalRefV1 actor = 11;
  google.protobuf.Timestamp created_at = 12;
}

message EvaluationAdoptedDecisionV1 {
  optional EvaluationDecisionRevisionV1 revision = 1;
  MetricAvailabilityV1 availability = 2;
}

// The release warning: does a release already stand on a PRIOR revision of the
// run whose decision is being re-adopted?
//
// `AdoptEvaluationDecisionRevision` answers this: `availability` is `AVAILABLE`
// and `release_ids` names the releases that pinned a prior revision of the same
// run.
//
// `EvaluationRunManifestSectionV1.release_adoption` is the one place that still
// reports an absence, and for a different and still-true reason: that section
// rides the `FULL` overview read, whose statement budget has no room for the
// lookup, so it reports `release_adoption_not_read_by_manifest_section` rather
// than a `false` nothing checked. Absence with the RIGHT reason, not absence
// because the feature is missing.
message ReleaseAdoptionWarningV1 {
  bool prior_revision_adopted_by_release = 1;
  repeated string release_ids = 2;
  MetricAvailabilityV1 availability = 3;
}

// What the launch reserved against what the run has actually spent.
//
// Candidate scope only. `drift_micros` is signed on purpose: an underspend of
// ten times is as much a defect in the estimate as an overspend, and an
// absolute value would hide half of them.
message EvaluationCostDriftV1 {
  optional CostAmountV1 reserved_candidate_cost = 1;
  optional CostAmountV1 actual_candidate_cost = 2;
  // actual - reserved.
  optional int64 drift_micros = 3;
  // actual / reserved. Absent when nothing was reserved: a ratio over zero is
  // not infinity, it is an unanswerable question.
  optional double drift_ratio = 4;
  // AVAILABLE only when BOTH sides exist. PENDING while the run has spent
  // nothing yet, NOT_SUPPORTED when the launch reserved nothing.
  MetricAvailabilityV1 availability = 5;
  bool exceeds_reservation = 6;
  string pricing_source_version = 7;
  // How much of the run the actual side covers, so a drift computed over three
  // of a thousand cells cannot present itself as the run's drift.
  uint32 priced_cell_count = 8;
  uint32 executed_cell_count = 9;

  // What the PROVIDER says it charged, beside what this build computed.
  //
  // A second measurement of the same money, never folded into
  // `actual_candidate_cost`: substituting an invoice for a computed cost would
  // put a router's markup where a lab's price belongs, on exactly the cells
  // where the two differ.
  optional CostAmountV1 provider_billed_cost = 10;
  // billed - computed. Signed in the SAME direction as `drift_micros`: positive
  // means the provider charged more than this build quoted.
  optional int64 billed_drift_micros = 11;
  // How much of the run each side covers, at attempt granularity — the same
  // discipline `priced_cell_count`/`executed_cell_count` applies at cell
  // granularity. A run that metered a thousand attempts and got a stated cost
  // for three must not present the comparison as the run's.
  //
  // There is deliberately NO `billed_drift_ratio`: a ratio over a zero computed
  // cost is not infinity, it is an unanswerable question, as `drift_ratio` above
  // already says.
  uint32 billed_attempt_count = 12;
  uint32 metered_attempt_count = 13;
}

message GetEvaluationRunOverviewRequest {
  string evaluation_run_id = 1;
  // Required. UNSPECIFIED is INVALID_ARGUMENT rather than a silent INITIAL:
  // a client that forgot to choose must not be given the cheap answer and told
  // it asked for it.
  EvaluationRunOverviewProfileV1 profile = 2;
}

message GetEvaluationRunOverviewResponse {
  EvaluationRunV1 run = 1;
  EvaluationRunOverviewProfileV1 profile = 2;
  EvaluationRunProgressV1 progress = 3;
  // Verdicts across every scorer, then per scorer. Both come from maintained
  // projections; neither is computed by scanning cells at read time.
  EvaluationVerdictCountsV1 verdicts = 4;
  repeated EvaluationScorerRollupV1 scorer_rollups = 5;
  EvaluationRunFailureRollupV1 failures = 6;
  EvaluationDecisionDriversV1 decision_drivers = 7;
  // Each section states its own posture. A section this build cannot serve
  // reports UNAVAILABLE with a reason code and never AVAILABLE with empty data.
  MetricAvailabilityV1 throughput_availability = 8;
  MetricAvailabilityV1 budget_waterfall_availability = 9;
  MetricAvailabilityV1 leaderboard_availability = 10;
  MetricAvailabilityV1 comparability_availability = 11;
  MetricAvailabilityV1 data_quality_availability = 12;
  MetricAvailabilityV1 release_posture_availability = 13;
  repeated AllowedActionV1 allowed_actions = 14;
  AgenticEvaluationCapabilitiesV1 capabilities = 15;
  EvaluationFreshnessV1 freshness = 16;
  // Why the candidate cost/latency/token panels are empty for this run. A
  // recorded-output candidate was never called, so it has no latency and no
  // tokens: the reason code says `recorded_output` rather than the response
  // reporting zeros a throughput panel would render as "instant and free".
  MetricAvailabilityV1 candidate_metrics_availability = 17;
  // The run's candidate economics, rolled up from the same projection the
  // verdicts come from. `scope = CANDIDATE_EXECUTION` and nothing on it sums
  // candidate and evaluator work; the evaluator's own envelope arrives with
  // judge scorers.
  ExecutionMetricsV1 candidate_economics = 18;
  // Projection lag and fact-publication lag are different facts and are reported
  // separately from each other and from execution failure. Projection lag is
  // measured on this response — `freshness.completeness` becomes STALE with a
  // typed reason when the maintained projection trails the run's own newest
  // transition. Fact publication is not shipped, and this field says that rather
  // than leaving a client to infer it from an absent watermark.
  MetricAvailabilityV1 publication_lag_availability = 19;
  // What is left and what can be done about it.
  EvaluationRunRecoveryV1 recovery = 20;
  // Estimated-versus-actual, stated. A run that costs four times its estimate
  // is a fact the operator has to be told, and an overview that quietly
  // reported only the actual would absorb it.
  EvaluationCostDriftV1 cost_drift = 21;

  // ---------------------------------------------------------------------
  // FULL profile only.
  //
  // Absent under INITIAL — absent, not present-and-empty. A client that asked
  // for the cheap profile must not be able to read an empty comparison as "no
  // difference"; the two are different answers and only one of them was paid
  // for.
  // ---------------------------------------------------------------------
  optional EvaluationCandidateComparisonV1 comparison = 22;
  optional EvaluationSliceAnalysisV1 slice_analysis = 23;
  optional EvaluationDataQualityV1 data_quality = 24;
  optional EvaluationRegressionHistoryV1 regression_history = 25;

  // Both profiles. Read from the append-only ledger inside the INITIAL read's
  // existing first statement, so the decision statement the screen paints first
  // costs no additional round trip and no additional query.
  EvaluationAdoptedDecisionV1 adopted_decision = 26;

  // FULL profile only. The fifth section: what was frozen, what changed against the
  // reference, and who touched it. Absent under INITIAL for the same reason the
  // other four are — an absent section and an empty one are different answers.
  optional EvaluationRunManifestSectionV1 manifest = 27;

  // The run's EVALUATOR economics.
  //
  // `scope = EVALUATOR_EXECUTION`, BESIDE `candidate_economics` and never
  // inside it. There is no field on this response, or anywhere else, that sums
  // the two: a single "tokens" or "cost" number spanning candidate and
  // evaluator work is exactly what makes a cost regression untraceable, which
  // is why the separation is structural rather than a convention.
  //
  // A run with no judge scorer reports this section with its availabilities
  // stating `deterministic_scorer` rather than with zeros — a $0.00 evaluator
  // cost on a waterfall claims something was priced.
  ExecutionMetricsV1 evaluator_economics = 28;

  // The scorer suite this run froze, combined across the run. Empty for every
  // explicit-list run.
  //
  // ONE entry, BESIDE `scorer_rollups` and never inside it. Every member keeps
  // its own rollup row with its own verdict counts, its own mean and its own
  // economics; this row references them by `member_score_config_id` and is
  // computed from the same numbers the reader can see beside it.
  repeated EvaluationScorerSuiteRollupV1 scorer_suite_rollups = 29;

  // Whether what this response carries may be used as evidence.
  //
  // MANDATORY on the `SCRATCH_READ` class: a scratch run renders on its own
  // surface — that is the whole point of the mode — so the surface has to say
  // that what it is showing is not evidence. Filing the read under `SUMMARY` and
  // leaving this out would invite the one assumption the mode exists to prevent.
  // `NOT_SUPPORTED / scratch_run_non_evidence` for a scratch run, AVAILABLE for
  // every other run.
  MetricAvailabilityV1 evidence_posture = 30;
}

// ===========================================================================
// Decision policy exploration and adoption
// ===========================================================================

message PreviewEvaluationDecisionRequest {
  string evaluation_run_id = 1;
  // The evidence version the client is exploring against, taken from the
  // overview's freshness. A version that has moved is a typed refusal rather
  // than a silently different answer to the question that was asked.
  uint64 evidence_projection_version = 2;
  // One policy per request. The same type the definition authors and the
  // manifest freezes — exploration does not get a second policy language.
  EvaluationDecisionPolicyV1 policy = 3;
  // Cases to exclude from the decision, bounded. Exploring an exclusion must not
  // require adopting it.
  repeated EvaluationCellRefV1 exclusions = 4;
}

message PreviewEvaluationDecisionResponse {
  // `provenance` is always EXPLORATION on this response, and nothing is
  // persisted: the RPC opens no transaction at all.
  EvaluationDecisionV1 decision = 1;
  EvaluationCandidateComparisonV1 comparison = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message AdoptEvaluationDecisionRevisionRequest {
  string evaluation_run_id = 1;
  uint64 evidence_projection_version = 2;
  EvaluationDecisionPolicyV1 policy = 3;
  repeated EvaluationCellRefV1 exclusions = 4;
  // Required.
  string reason = 5;
  string idempotency_key = 6;
}

message AdoptEvaluationDecisionRevisionResponse {
  EvaluationDecisionRevisionV1 revision = 1;
  bool idempotent_replay = 2;
  ReleaseAdoptionWarningV1 release_adoption_warning = 3;
}

// ===========================================================================
// #710. Each aligned case's collapsed outcome, computed with the comparison's
// own pairs, so a list of moved cases always sums to the comparison's totals.
// ===========================================================================

// One (cohort, case, candidate, scorer) coordinate's trials collapsed to one
// outcome: infrastructure failures dropped, task failures counted as FAIL, the
// verdict with a strict lead in trial count, TIE on an exact tie.
enum EvaluationCaseOutcomeV1 {
  EVALUATION_CASE_OUTCOME_V1_UNSPECIFIED = 0;
  EVALUATION_CASE_OUTCOME_V1_PASS = 1;
  EVALUATION_CASE_OUTCOME_V1_FAIL = 2;
  EVALUATION_CASE_OUTCOME_V1_TIE = 3;
  EVALUATION_CASE_OUTCOME_V1_SKIPPED = 4;
  EVALUATION_CASE_OUTCOME_V1_NOT_APPLICABLE = 5;
}

// How an aligned case moved against the reference. A pair's
// `aligned_pair_count` is exactly REGRESSED + IMPROVED + UNCHANGED +
// CHANGED_UNRANKED, and its `regressed_count`, `improved_count` and
// `unchanged_count` are the first three.
enum EvaluationCaseMovementV1 {
  EVALUATION_CASE_MOVEMENT_V1_UNSPECIFIED = 0;
  // The reference passed and the candidate failed.
  EVALUATION_CASE_MOVEMENT_V1_REGRESSED = 1;
  // The reference failed and the candidate passed.
  EVALUATION_CASE_MOVEMENT_V1_IMPROVED = 2;
  // The outcomes differ without a pass/fail flip: a TIE, SKIPPED or
  // NOT_APPLICABLE on one side. Neither a win nor a loss.
  EVALUATION_CASE_MOVEMENT_V1_CHANGED_UNRANKED = 3;
  EVALUATION_CASE_MOVEMENT_V1_UNCHANGED = 4;
}

message EvaluationCaseMovementRowV1 {
  string cohort_key = 1;
  string case_revision_id = 2;
  string candidate_key = 3;
  string score_config_id = 4;
  // Empty when the scorer has no projection row.
  string config_key = 5;
  EvaluationCaseOutcomeV1 candidate_outcome = 6;
  EvaluationCaseOutcomeV1 reference_outcome = 7;
  EvaluationCaseMovementV1 movement = 8;
  // Rollouts the collapse counted on each side (infrastructure failures are
  // not rollouts), and how many of them passed.
  uint32 candidate_usable_rollout_count = 9;
  uint32 candidate_passed_rollout_count = 10;
  uint32 reference_usable_rollout_count = 11;
  uint32 reference_passed_rollout_count = 12;
}

message ListEvaluationCaseMovementsRequest {
  string evaluation_run_id = 1;
  // Default 50, at most the published `max_page_size`. A page token is bound
  // to the `movements` it was minted under; another filter refuses it.
  o11y_one.common.v1.PageRequestV1 page = 2;
  // Empty means every aligned case. UNSPECIFIED is refused, never a wildcard.
  repeated EvaluationCaseMovementV1 movements = 3;
  // Empty means every challenger. A key that is not one of this run's
  // challengers (the reference included) matches no row rather than being
  // refused. At most as many keys as a run may have candidates. A page token
  // is bound to these too.
  repeated string candidate_keys = 4;
}

message ListEvaluationCaseMovementsResponse {
  // REGRESSED first, then IMPROVED, CHANGED_UNRANKED and UNCHANGED; within a
  // movement by candidate, scorer config key, scorer id, cohort and case.
  repeated EvaluationCaseMovementRowV1 rows = 1;
  // `total_count` is the filtered set, counted by each page's own statement
  // over the evidence as it stood for that page. It is read off the page's
  // rows, so an empty continuation page (the evidence moved after the token was
  // minted) reports 0.
  o11y_one.common.v1.PageResponseV1 page = 2;
  optional string reference_candidate_key = 3;
  // NOT_SUPPORTED `no_reference_candidate` when the run pinned no reference:
  // nothing is aligned, and an empty list must not read as "nothing moved".
  MetricAvailabilityV1 availability = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

// ===========================================================================
// The case matrix and the cell inspector
//
// The matrix ROW is the case coordinate INCLUDING the trial, and its cells are
// the (candidate, scorer) pairs. A row keyed by the cell coordinate would put
// one case on several rows and make "7 of 120" count cells rather than cases,
// which is not the number the screen announces; a row keyed by the case alone
// would collapse three trials of the same case into one line.
// ===========================================================================

// How the server orders the filtered set. Both values are server-backed: no sort
// happens only over the loaded page, so there is no "client sorts this one" arm.
enum EvaluationMatrixSortKeyV1 {
  EVALUATION_MATRIX_SORT_KEY_V1_UNSPECIFIED = 0;
  // "What changed the decision?" — regressions first, then the states that mean
  // the evidence cannot answer, then improvements, then agreement.
  EVALUATION_MATRIX_SORT_KEY_V1_DECISION_IMPACT = 1;
  // The stable coordinate order, for a reader who is walking the cohort rather
  // than triaging it.
  EVALUATION_MATRIX_SORT_KEY_V1_CASE_ORDER = 2;
}

// What one cell (and, aggregated, one row) did to the decision.
//
// `MISSING_EVIDENCE` is NOT a regression. A candidate that produced no output
// did not get worse; counting it as a regression is the single easiest way for
// this surface to lie, and the pairwise comparison already refuses it.
enum EvaluationMatrixDecisionImpactV1 {
  EVALUATION_MATRIX_DECISION_IMPACT_V1_UNSPECIFIED = 0;
  EVALUATION_MATRIX_DECISION_IMPACT_V1_REGRESSED = 1;
  EVALUATION_MATRIX_DECISION_IMPACT_V1_IMPROVED = 2;
  EVALUATION_MATRIX_DECISION_IMPACT_V1_UNCHANGED = 3;
  // Two scorers disagree about the same candidate on the same case: one passed
  // it and another failed it. A quality signal about the scorecard, not about
  // the candidate, which is why it is not folded into the other four.
  EVALUATION_MATRIX_DECISION_IMPACT_V1_DISAGREEMENT = 4;
  // One side of the comparison has no opinion: no result row, or an ERROR
  // verdict, or no reference candidate pinned at all.
  EVALUATION_MATRIX_DECISION_IMPACT_V1_MISSING_EVIDENCE = 5;
}

// How complete this cell's evidence is, and what is wrong with it when
// something is.
//
// `CANDIDATE_FAILED` and `SCORER_FAILED` are separate values and must stay
// separate: a candidate that never produced output and a scorer that could not
// grade a perfectly good output need different actions, and one badge for both
// is the defect the mutation proof reintroduces.
enum EvaluationMatrixEvidenceStateV1 {
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_COMPLETE = 1;
  // Some of this cell's scorers have reported and some have not.
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_PARTIAL = 2;
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_CANDIDATE_FAILED = 3;
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_SCORER_FAILED = 4;
  // Required human evidence is outstanding. Never a FAIL and never a zero
  // score.
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_AWAITING_REVIEW = 5;
  // The frozen sampling policy did not select this cell.
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_NOT_SAMPLED = 6;
  // A later attempt generation replaced this evidence. It stays readable and
  // stays labelled; it is never deleted.
  EVALUATION_MATRIX_EVIDENCE_STATE_V1_SUPERSEDED = 7;
}

// Typed composable filters only. There is no query language on this surface:
// every field below is an intersection term, and every repeated field is a
// union within itself.
message EvaluationMatrixFilterV1 {
  repeated string cohort_keys = 1;
  repeated string candidate_keys = 2;
  repeated string score_config_ids = 3;
  repeated EvaluationVerdictV1 verdicts = 4;
  repeated EvaluationMatrixDecisionImpactV1 decision_impacts = 5;
  repeated EvaluationMatrixEvidenceStateV1 evidence_states = 6;
  optional uint32 trial = 7;
  // Restricts to scorers the frozen scorecard marks as release gates.
  optional bool blocking_gates_only = 8;
}

// One (candidate, scorer) cell.
//
// No preview text and no explanation body: the payload budget derives 400 B per
// cell, and one candidate preview is ten times that. Long values belong to
// `SELECTED_DETAIL`.
message EvaluationMatrixCellV1 {
  string candidate_key = 1;
  string score_config_id = 2;
  string config_key = 3;
  EvaluationVerdictV1 verdict = 4;
  optional double score = 5;
  MetricAvailabilityV1 score_availability = 6;
  // The pinned champion's answer on the same case, same trial, same scorer.
  // Absent exactly when no reference candidate is pinned or the reference has
  // no result for this coordinate.
  optional EvaluationVerdictV1 reference_verdict = 7;
  optional double reference_score = 8;
  // score - reference_score. Absent when either side has no score; never 0.0
  // to mean "we could not compute it".
  optional double score_delta = 9;
  EvaluationMatrixDecisionImpactV1 decision_impact = 10;
  EvaluationMatrixEvidenceStateV1 evidence_state = 11;
  // Two codes, never one. A cell may carry both — a candidate that failed and a
  // scorer that then could not grade the absence — and a single field would
  // force the server to pick which half of that to tell the customer.
  optional string candidate_failure_code = 12;
  optional string scorer_failure_code = 13;
  uint32 attempt_generation = 14;
  bool is_blocking_gate = 15;
  // (#611) How the cell's scorer produces its verdict, so a chip can mark a
  // code scorer without reading the manifest. UNSPECIFIED on a cell with no
  // result yet, and on a scorer authored outside
  // `CreateEvaluationScorerConfig`.
  EvaluationScorerKindV1 scorer_kind = 16;
  // #1106. The cell's judge's mode, read beside `scorer_kind`. UNSPECIFIED
  // wherever `scorer_kind` is, and for every scorer that is no judge.
  JudgeModeV1 judge_mode = 17;
  // #1108. The judge's typed answer in about 10 B: the chosen label's or
  // level's index, as `EvaluationJudgeAnswerV1.label_index`, and its
  // confidence. Absent wherever that message's are, and for a result with no
  // typed answer. The cell's evidence carries the rest.
  optional uint32 answer_label_index = 18;
  optional float answer_confidence = 19;
}

// #840. The first line of one candidate's output on one matrix row, so the grid
// can show what a candidate answered beside its scorers' marks without a cell
// read per cell.
//
// Never the output itself. `first_line` is the answer's first non-blank line
// with every whitespace run collapsed to one space, cut at 200 characters, so a
// row's lines cost at most 800 bytes per candidate (200 for ASCII) beside the
// 400 B budget each of its cells already carries.
//
// A provider candidate's line is sanitized when its cell is written: the
// reasoning the provider marks is never part of the answer, the
// organization's redaction policy runs over the answer, and the line is stamped
// with the policy that produced it; an unstamped line is never served. A
// recorded-output candidate's line is read from its case revision. Otherwise
// `first_line` is empty and `availability` says why:
//   NOT_SUPPORTED `reasoning_unseparable`: an HTTP endpoint's or an external
//     runtime's answer, which no adapter separates from its reasoning;
//   REDACTED `candidate_output_redaction_refused`: the redaction policy
//     refused the answer;
//   PENDING `candidate_output_pending`: the cell has not executed yet;
//   NOT_OBSERVED `candidate_output_absent`: the candidate produced no output,
//     or `recorded_case_missing` when its case revision is gone;
//   NOT_OBSERVED `candidate_output_not_retained`: written before this build,
//     or reduced by retention.
// AVAILABLE with an empty line is an answer that is blank.
message EvaluationMatrixOutputPreviewV1 {
  string candidate_key = 1;
  string first_line = 2;
  MetricAvailabilityV1 availability = 3;
}

message EvaluationMatrixRowV1 {
  // 1-based position within the WHOLE filtered set under this sort, not within
  // the page. Keyset cursors carry no ordinal, which is why this is computed by
  // the page's own window rather than by the client counting rows.
  uint64 ordinal = 1;
  string cohort_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  // The row's impact is the strongest impact among its cells, in the order
  // REGRESSED > DISAGREEMENT > MISSING_EVIDENCE > IMPROVED > UNCHANGED.
  EvaluationMatrixDecisionImpactV1 decision_impact = 5;
  EvaluationMatrixEvidenceStateV1 evidence_state = 6;
  repeated EvaluationMatrixCellV1 cells = 7;
  // Result rows this row's cells are built from, so a client can tell a row
  // with one thin cell from a row with twenty.
  uint32 result_count = 8;
  // One entry per candidate in this row, when the run froze a scorer suite.
  // Empty for every explicit-list run.
  //
  // ADDITIONAL to `cells`, never instead of them: each entry is computed from
  // the member cells above it and those cells are still there, with their own
  // verdicts and their own scores. A suite that replaced its members would have
  // to delete the evidence it is computed from.
  repeated EvaluationScorerSuiteCellV1 suite_cells = 9;
  // #840. One per candidate in `cells`, in their order. Empty when the run's
  // frozen manifest cannot be decoded.
  repeated EvaluationMatrixOutputPreviewV1 output_previews = 10;
}

// The eight facets. A fixed vocabulary rather than a discovered one, capped at
// eight.
enum EvaluationMatrixFacetKindV1 {
  EVALUATION_MATRIX_FACET_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_MATRIX_FACET_KIND_V1_REGRESSIONS = 1;
  EVALUATION_MATRIX_FACET_KIND_V1_IMPROVEMENTS = 2;
  EVALUATION_MATRIX_FACET_KIND_V1_DISAGREEMENTS = 3;
  EVALUATION_MATRIX_FACET_KIND_V1_MISSING_EVIDENCE = 4;
  EVALUATION_MATRIX_FACET_KIND_V1_CANDIDATE_FAILURES = 5;
  EVALUATION_MATRIX_FACET_KIND_V1_SCORER_FAILURES = 6;
  EVALUATION_MATRIX_FACET_KIND_V1_AWAITING_REVIEW = 7;
  EVALUATION_MATRIX_FACET_KIND_V1_UNCHANGED = 8;
}

// One facet count, over the FULL filtered set and never over the returned page.
message EvaluationMatrixFacetV1 {
  EvaluationMatrixFacetKindV1 kind = 1;
  uint64 matching_row_count = 2;
}

// Why a matrix has nothing to compare. A typed reason rather than an empty
// list, because "this run has not executed yet", "no champion was pinned" and
// "your filter excluded everything" render completely differently.
message EvaluationMatrixAlignmentV1 {
  bool has_aligned_cases = 1;
  // `no_executed_cells`, `no_reference_candidate`, `filter_matched_no_rows`,
  // `no_aligned_cases`, or `below_repeat_floor`. The last is ranked after the
  // other four: a run can have aligned cases and still be below the rollout
  // floor, and `has_aligned_cases` keeps saying only
  // what it has always said.
  optional string reason_code = 2;
  optional string reference_candidate_key = 3;
  uint64 aligned_row_count = 4;
  // The rollout floor on the matrix's own comparison affordance. Counted over
  // the frozen plan (`PREPARED_ROLLOUTS`), which is a different basis from the
  // comparison section's, and the `basis` field says so.
  RepeatSampleCheckV1 repeat_sample = 5;
}

// Explicit coordinates, bounded at 500. Above that the caller carries a frozen
// filter token instead of shipping thousands of coordinates.
message MatrixSelectionExplicitIdsV1 {
  repeated EvaluationCellRefV1 cells = 1;
}

// Server-issued and server-verified: the token binds the run, the evidence
// revision, the filter digest and the sort, and lives 15 minutes.
//
// It is deliberately not authenticated, for the same reason the list cursor is
// not: forging one can only name rows the caller is already authorised to read,
// because scope comes from the session and never from the token.
message MatrixSelectionV1 {
  oneof selection {
    MatrixSelectionExplicitIdsV1 explicit_ids = 1;
    string frozen_filter_token = 2;
  }
}

// Which plane answered a cell-detail read.
//
// A field rather than a comment: the fact plane and the maintained projection
// are different evidence with different freshness, and a response
// that could not say which one it used would make the whole substitution
// unverifiable.
enum EvaluationCellEvidenceSourceV1 {
  EVALUATION_CELL_EVIDENCE_SOURCE_V1_UNSPECIFIED = 0;
  EVALUATION_CELL_EVIDENCE_SOURCE_V1_POSTGRES_PROJECTION = 1;
  EVALUATION_CELL_EVIDENCE_SOURCE_V1_FACT_PLANE_LOCATOR = 2;
}

message ListEvaluationMatrixRowsRequest {
  string evaluation_run_id = 1;
  // Absent on INITIAL_PAGE, present on PAGE. A page token already carries the
  // filter and sort it was minted under, so sending one alongside a filter is
  // INVALID_ARGUMENT rather than a silent precedence rule.
  optional string page_token = 2;
  optional EvaluationMatrixFilterV1 filter = 3;
  // Required on INITIAL_PAGE. UNSPECIFIED is INVALID_ARGUMENT rather than a
  // silent default: a client that forgot to choose must not be given an order
  // and told it asked for one.
  EvaluationMatrixSortKeyV1 sort_key = 4;
  optional o11y_one.common.v1.SortDirectionV1 sort_direction = 5;
  // Clamped by the server to the derived cardinality bound; the response says
  // what it actually used.
  optional uint32 page_size = 6;
  // The frozen deep link a decision driver issues. Mutually exclusive with
  // `filter`: the token IS a filter, and honouring both would mean the server
  // silently intersecting a link the customer clicked with a filter they forgot
  // was set.
  optional string matrix_filter_token = 7;
}

message ListEvaluationMatrixRowsResponse {
  repeated EvaluationMatrixRowV1 rows = 1;
  // INITIAL_PAGE only. A PAGE response omits them and says so through
  // `facets_availability` rather than through an empty list, because "not
  // computed" and "computed and zero" are different answers.
  repeated EvaluationMatrixFacetV1 facets = 2;
  MetricAvailabilityV1 facets_availability = 3;
  // `exact` is false above the 5,000-row ceiling and is never true for a total
  // the server did not actually count.
  TotalMatchingV1 total_matching = 4;
  // Absent on the last page.
  optional string next_page_token = 5;
  // What the server actually paged at, after the payload clamp.
  uint32 effective_page_size = 6;
  // The frozen selection for this filtered set, reissued on every response so a
  // client always holds a live one.
  MatrixSelectionV1 selection = 7;
  EvaluationMatrixAlignmentV1 alignment = 8;
  // Present, with an empty page, when the supplied cursor could not be
  // honoured. The selection above is still issued, which is what "selection
  // preserved" means on the wire.
  optional EvaluationCursorResyncV1 resync = 9;
  EvaluationMatrixSortKeyV1 sort_key = 10;
  o11y_one.common.v1.SortDirectionV1 sort_direction = 11;
  repeated AllowedActionV1 allowed_actions = 12;
  AgenticEvaluationCapabilitiesV1 capabilities = 13;
  EvaluationFreshnessV1 freshness = 14;
  // The run's evidence posture, on the same contract as the overview's field of
  // this name. The matrix is the scratch run's other own surface, and a client
  // painting cells from it must be able to tell that they are not evidence
  // without fetching the overview to find out.
  MetricAvailabilityV1 evidence_posture = 15;
}

// The case behind a cell: what was asked and what was expected.
//
// Both previews are bounded and both carry their own availability. A payload
// this build cannot classify for redaction is REDACTED with a reason, never
// emitted and never replaced by a summary nothing computed.
message EvaluationCaseContextV1 {
  string case_revision_id = 1;
  string dataset_version_id = 2;
  string cohort_key = 3;
  optional string subject_preview = 4;
  MetricAvailabilityV1 subject_availability = 5;
  optional string expected_outcome_preview = 6;
  MetricAvailabilityV1 expected_outcome_availability = 7;
  // True when the preview below the cap is a prefix of a longer value, so a
  // client renders "truncated" rather than implying the case is short.
  bool subject_truncated = 8;
  bool expected_outcome_truncated = 9;
}

// One candidate attempt. Candidate scope only — nothing here is ever summed
// with evaluator work.
message EvaluationCandidateAttemptDetailV1 {
  uint32 attempt_ordinal = 1;
  EvaluationExecutionStateV1 state = 2;
  optional EvaluationFailureV1 failure = 3;
  ProviderStatusV1 provider_status = 4;
  optional int64 latency_micros = 5;
  optional CostAmountV1 cost = 6;
  TokenUsageV1 tokens = 7;
  // What the PROVIDER says this attempt cost, where its contract states one —
  // two of the seven do.
  //
  // Never summed with `cost` at field 6 and never summed with evaluator work.
  // `cost` is what this build computed from a rate row the manifest froze; this
  // is the invoice. Present only on the TERMINAL attempt, exactly as `cost` is:
  // earlier attempts are reconstructed from the cell's retry counter and carry
  // no per-attempt figures.
  optional CostAmountV1 provider_billed_cost = 8;
}

message EvaluationCandidateExecutionDetailV1 {
  string candidate_key = 1;
  EvaluationCandidateSourceV1 candidate_source = 2;
  EvaluationExecutionStateV1 state = 3;
  // At most 10. `attempt_count` on the cell says how many there were; this list
  // says what they did.
  repeated EvaluationCandidateAttemptDetailV1 attempts = 4;
  uint32 attempt_generation = 5;
  // The candidate's OWN failure. A scorer failure never lands here.
  optional EvaluationFailureV1 failure = 6;
  ExecutionMetricsV1 metrics = 7;
  MetricAvailabilityV1 availability = 8;
}

// One scorer's evidence on one cell. At most 50 per cell.
message EvaluationScorerEvidenceV1 {
  string score_config_id = 1;
  string config_key = 2;
  string metric_name = 3;
  EvaluationVerdictV1 verdict = 4;
  optional double score = 5;
  MetricAvailabilityV1 score_availability = 6;
  optional string score_reason_code = 7;
  bool is_blocking_gate = 8;
  // The SCORER's failure. Never the candidate's.
  optional EvaluationFailureV1 failure = 9;
  optional int64 duration_micros = 10;
  uint32 attempt_generation = 11;
  bool is_superseded = 12;
  // What THIS scorer's own model call cost on THIS cell.
  //
  // `scope = EVALUATOR_EXECUTION`. Present on every scorer's evidence, and for
  // a deterministic scorer every availability inside it states
  // `deterministic_scorer` — a string comparison consumes no tokens, and the
  // difference between "consumed nothing" and "has not run" is the one this
  // section exists to keep.
  ExecutionMetricsV1 evaluator_execution = 13;
  // Per-ATTEMPT evaluator economics.
  //
  // Field 13 above describes ONE attempt: the executor's first pass, which a
  // regrade deliberately never overwrites (overwriting it would make the first
  // pass's per-cell spend unreadable anywhere).
  // That left a reader asking "what did the call behind THIS verdict cost?"
  // with nowhere to look but the regrade job.
  //
  // This is the union. One entry per recorded attempt at this
  // `(cell, scorer, generation)`, in attempt order, each naming the plane that
  // produced it and — for a regrade — the job. Evidence is ADDED here, never
  // replaced: field 13 keeps meaning exactly what it meant.
  repeated EvaluationScorerAttemptEconomicsV1 attempt_economics = 14;
  // The tie-out, on the wire: the sum of the priced attempts above. Σ of this
  // across every cell and scorer equals the run's `evaluator_cost_micros`,
  // which is what makes the ledger checkable by ADDITION rather than by
  // reconstructing overwritten history.
  //
  // Absent — never zero — when no attempt on this scorer was priced.
  optional CostAmountV1 attempt_economics_total = 15;
  // Whether the union is complete for this scorer, and when it is not, why.
  MetricAvailabilityV1 attempt_economics_availability = 16;
  // (#611) Present on a code scorer's evidence: its job's result and typed
  // failure stage.
  optional EvaluationCodeScorerResultV1 code = 17;
  // #1108. The judge's typed answer. Absent for every scorer that answered no
  // typed question, and on an ERROR result.
  optional EvaluationJudgeAnswerV1 judge_answer = 18;
  // #1106. The scorer's judge mode, as on its matrix cell. UNSPECIFIED for
  // every scorer that is no judge, and for one authored outside
  // `CreateEvaluationScorerConfig`.
  JudgeModeV1 judge_mode = 19;
  // #1111. The score config whose evidence on this cell carries the judge
  // call that also answered this scorer's question. Set when one call
  // answered several questions and this is not the question its spend sits
  // on: field 13 then states `judge_call_billed_on_carrier` rather than any
  // spend, so summing field 13 over a cell counts the call once. Absent on the
  // carrier, and on every scorer that shared no call.
  optional string evaluator_shared_with_score_config_id = 20;
  // #1114. A chained judge's two calls apart, which field 13 sums: its text
  // judge's call, the sum less its step's, and its system-one step's. Both
  // `scope = EVALUATOR_EXECUTION`. Absent on every scorer that made no step
  // call: every other judge, a chain whose text judge failed before its step
  // was asked, and a question whose call another carries.
  ExecutionMetricsV1 chain_text_judge_execution = 21;
  ExecutionMetricsV1 chain_system_one_step_execution = 22;
}

// Which plane recorded one scorer attempt.
//
// The five origins of a scorer attempt, as an enum rather than a string,
// because a client renders "your judge was re-run and billed" and "a reviewer
// changed this by hand" completely differently, and only one of the five can
// carry money.
enum EvaluationScorerAttemptOriginV1 {
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_UNSPECIFIED = 0;
  // The executor's own pass.
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_EXECUTION = 1;
  // A deterministic re-grade through `RetryEvaluationScorers`. Its contract is
  // zero external calls, so it can never carry economics.
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_SCORER_RETRY = 2;
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_HUMAN_REVIEW = 3;
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_ADJUDICATION = 4;
  // An async judge regrade job. The only origin that spends.
  EVALUATION_SCORER_ATTEMPT_ORIGIN_V1_JUDGE_REGRADE = 5;
}

// One attempt's evaluator-scope economics on one `(cell, scorer)`.
//
// Every attempt appears, including the four origins that cannot spend, because
// the absence of a charge is a fact a reader needs: "this verdict was produced
// by a human" and "this verdict's judge call has not happened yet" are
// different answers and neither of them is zero.
message EvaluationScorerAttemptEconomicsV1 {
  uint32 scorer_attempt = 1;
  EvaluationScorerAttemptOriginV1 origin = 2;
  // The regrade job that produced this attempt. Present exactly on
  // `JUDGE_REGRADE`, so a reader can walk from a verdict to the job that bought
  // it.
  optional string regrade_job_id = 3;
  // Stamped, not deleted. A superseded attempt is still evidence and still
  // carries the charge it incurred.
  bool is_superseded = 4;
  // `scope = EVALUATOR_EXECUTION`. Absent throughout — with the reason on
  // `economics_availability` below — for every attempt whose plane recorded
  // none. Never zeros: a `$0.00` line item claims something was billed.
  ExecutionMetricsV1 evaluator_execution = 5;
  // WHY this attempt has no economics, when it has none, in a vocabulary that
  // distinguishes the four ways that happens: a deterministic retry, a human,
  // an adjudication, an attempt recorded before this build measured grading at
  // all, and a regrade that has not yet reached a provider.
  MetricAvailabilityV1 economics_availability = 6;
  // #1114. Field 5's two calls apart, for a chained judge's attempt, as
  // `EvaluationScorerEvidenceV1` fields 21 and 22.
  ExecutionMetricsV1 chain_text_judge_execution = 7;
  ExecutionMetricsV1 chain_system_one_step_execution = 8;
}

// An artifact this cell produced, as metadata. The body is a separate
// authorized content read.
message EvaluationArtifactSummaryV1 {
  string artifact_id = 1;
  string media_type = 2;
  uint64 byte_size = 3;
  string content_digest = 4;
  MetricAvailabilityV1 content_availability = 5;
}

message EvaluationCellDetailV1 {
  EvaluationCellRefV1 cell = 1;
  // 1-based position within the set the selection names: the frozen filter's
  // own set for a token selection, and the run's whole case order for an
  // explicit-coordinate selection. Never a position within the returned batch,
  // which is the number a client can already count.
  uint64 ordinal = 2;
  EvaluationCaseContextV1 case_context = 3;
  EvaluationCandidateExecutionDetailV1 candidate_execution = 4;
  repeated EvaluationScorerEvidenceV1 scorer_evidence = 5;
  // At most 20, summaries only.
  repeated EvaluationArtifactSummaryV1 artifacts = 6;
  MetricAvailabilityV1 artifacts_availability = 7;
  EvaluationMatrixEvidenceStateV1 evidence_state = 8;
  EvaluationFreshnessV1 freshness = 9;
  // Set only when this attempt's SDK recording never completed (the process
  // died, or a chunk was rejected): the last step it stored. A replay of this
  // cell answers RECORDING_INCOMPLETE, so re-run it before replaying from it.
  // Absent for a complete recording and for a cell that recorded nothing.
  optional uint32 incomplete_recording_last_step = 10;
}

message BatchGetEvaluationCellDetailsRequest {
  string evaluation_run_id = 1;
  // Explicit coordinates (bounded at 20 for THIS rpc, though the selection type
  // itself permits 500) or a frozen filter token, in which case the server
  // takes the first 20 rows of that selection under its own sort.
  MatrixSelectionV1 selection = 2;
  // Which candidate columns the inspector has open. Empty means every candidate
  // on the cell's row.
  repeated string candidate_keys = 3;
}

message BatchGetEvaluationCellDetailsResponse {
  repeated EvaluationCellDetailV1 cells = 1;
  // Coordinates the request named and this run does not have. A partially
  // satisfied batch is a normal outcome, not an error.
  repeated EvaluationCellRefV1 missing = 2;
  // Neighbour cursors: the page token that opens the matrix one row before and
  // one row after this selection, under the selection's own sort.
  optional string previous_page_token = 3;
  optional string next_page_token = 4;
  TotalMatchingV1 total_matching = 5;
  // Which plane answered, and — when it was not the fact plane — why not.
  EvaluationCellEvidenceSourceV1 evidence_source = 6;
  MetricAvailabilityV1 fact_plane_availability = 7;
  repeated AllowedActionV1 allowed_actions = 8;
  AgenticEvaluationCapabilitiesV1 capabilities = 9;
  EvaluationFreshnessV1 freshness = 10;
}

// ===========================================================================
// The run change feed
//
// The transport is a cursor-polled unary list, not a server stream:
// `ListEvaluationRunChanges` is a replayable sequence, and a watch is an
// optimization over the same event type.
// ===========================================================================

enum EvaluationRunChangeKindV1 {
  EVALUATION_RUN_CHANGE_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_RUN_CHANGE_KIND_V1_PROGRESS = 1;
  EVALUATION_RUN_CHANGE_KIND_V1_CELL_BATCH = 2;
  EVALUATION_RUN_CHANGE_KIND_V1_SECTION_REFRESHED = 3;
  EVALUATION_RUN_CHANGE_KIND_V1_DECISION_REVISION = 4;
  EVALUATION_RUN_CHANGE_KIND_V1_TERMINAL = 5;
  EVALUATION_RUN_CHANGE_KIND_V1_RESYNC_REQUIRED = 6;
  EVALUATION_RUN_CHANGE_KIND_V1_REPLAY_GAP = 7;
}

// The counters as of one durable projection bump. Read from the projection row,
// never recomputed from cell results: a STREAM_UPDATE whose cost grows with the
// run's size is not a stream update.
message EvaluationRunProgressChangeV1 {
  EvaluationRunStateV1 run_state = 1;
  uint64 projection_version = 2;
  uint32 expected_cell_count = 3;
  uint32 executed_cell_count = 4;
  uint32 succeeded_cell_count = 5;
  uint32 failed_cell_count = 6;
  uint32 cancelled_cell_count = 7;
  uint32 awaiting_review_cell_count = 8;
  // #790. As on `EvaluationRunProgressV1` (15, 16), read with every tick: the
  // code scores still to come, and the cells waiting for them.
  uint32 pending_code_scorer_count = 9;
  uint32 scoring_in_sandbox_cell_count = 10;
}

// One cell moved. Coordinates and state only — the row's evidence comes from the
// matrix, and duplicating it here would give one screen two authorities for it.
message EvaluationCellDeltaV1 {
  EvaluationCellRefV1 cell = 1;
  EvaluationExecutionStateV1 state = 2;
  uint32 attempt_generation = 3;
}

message EvaluationCellBatchChangeV1 {
  // At most 200.
  repeated EvaluationCellDeltaV1 deltas = 1;
  // True when the page cap cut this batch short. The remaining deltas are the
  // next page's, not lost: `has_more` on the response carries the same fact for
  // the whole page.
  bool truncated_by_page_cap = 2;
}

message EvaluationSectionRefreshedChangeV1 {
  // Which section of the overview moved, as a stable key a client can match
  // against the section it is rendering.
  string section_key = 1;
  optional string score_config_id = 2;
  uint64 projection_version = 3;
}

message EvaluationDecisionRevisionChangeV1 {
  string decision_revision_id = 1;
  uint32 revision_ordinal = 2;
  uint64 evidence_revision = 3;
}

message EvaluationTerminalChangeV1 {
  EvaluationRunStateV1 run_state = 1;
  uint32 executed_cell_count = 2;
  uint32 succeeded_cell_count = 3;
  uint32 failed_cell_count = 4;
  uint32 cancelled_cell_count = 5;
  // DECISION:165,992 — a cancelled run keeps the evidence it already produced,
  // and the feed says so rather than ending in a silence a client would read as
  // "everything was thrown away".
  bool completed_evidence_preserved = 6;
}

message EvaluationChangeResyncV1 {
  EvaluationResyncReasonV1 reason = 1;
  string reason_code = 2;
  // Saturating: the server counts a bounded probe, so this says "at least this
  // many" and deliberately never claims an exact backlog it did not count.
  uint64 pending_change_estimate = 3;
  bool refetch_overview_required = 4;
}

// The gap a cursor cannot replay.
//
// Separate from resync because the client's situation differs: a resync means
// "you are too far behind to catch up", a replay gap means "the change you asked
// to resume from is not there".
message EvaluationChangeReplayGapV1 {
  // The sequence the cursor's next change would have had.
  uint64 expected_sequence = 1;
  // The earliest sequence the journal still holds for this run.
  uint64 available_from_sequence = 2;
  // replay_floor_moved | change_sequence_discontinuous
  string reason_code = 3;
  bool refetch_overview_required = 4;
}

message EvaluationRunChangeV1 {
  // The last journal sequence this change covers. A cell batch coalesces a run
  // of consecutive journal entries, so a client advances its cursor to this
  // number and never to a number it inferred.
  uint64 sequence = 1;
  google.protobuf.Timestamp recorded_at = 2;
  // Redundant with the oneof by construction, and present so a client can switch
  // on one field and so an unknown future arm still carries a readable kind.
  EvaluationRunChangeKindV1 kind = 3;
  oneof change {
    EvaluationRunProgressChangeV1 progress = 4;
    EvaluationCellBatchChangeV1 cell_batch = 5;
    EvaluationSectionRefreshedChangeV1 section_refreshed = 6;
    EvaluationDecisionRevisionChangeV1 decision_revision = 7;
    EvaluationTerminalChangeV1 terminal = 8;
    EvaluationChangeResyncV1 resync_required = 9;
    EvaluationChangeReplayGapV1 replay_gap = 10;
  }
}

message ListEvaluationRunChangesRequest {
  string evaluation_run_id = 1;
  // Absent means "from the journal's retained floor". A cursor minted for
  // another run is INVALID_ARGUMENT rather than silently reinterpreted.
  optional string cursor = 2;
  // Clamped by the server; the response says what it actually used.
  optional uint32 page_size = 3;
}

message ListEvaluationRunChangesResponse {
  repeated EvaluationRunChangeV1 changes = 1;
  // Reissued on every response including an empty one, so an idle client always
  // holds a live cursor and polling never degrades into "start from the floor".
  string next_cursor = 2;
  bool has_more = 3;
  // The same number the matrix cursor and the frozen selection bind, so two
  // surfaces on one screen cannot disagree about what the current evidence is.
  uint64 evidence_revision = 4;
  bool run_terminal = 5;
  uint32 effective_page_size = 6;
  repeated AllowedActionV1 allowed_actions = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
  EvaluationFreshnessV1 freshness = 9;
}

// ===========================================================================
// Authorized artifact bodies
//
// The RPCs are `GetExecutionArtifactContent` and
// `BatchGetExecutionArtifactContents`; their messages carry the `Evaluation…`
// prefix.
// ===========================================================================

enum EvaluationArtifactContentStateV1 {
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_SERVED = 1;
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_UNAUTHORIZED = 2;
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_REVOKED = 3;
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_REDACTED = 4;
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_NOT_FOUND = 5;
  // No artifact links in this build.
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_PLANE_NOT_SHIPPED = 6;
  // The batch's 2 MiB budget was already spent by earlier references. The
  // reference is fine; the batch was too big.
  EVALUATION_ARTIFACT_CONTENT_STATE_V1_BYTE_BUDGET_EXCEEDED = 7;
}

enum EvaluationArtifactRemediationKindV1 {
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_NONE = 1;
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_REQUEST_ACCESS = 2;
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_CONTACT_OWNER = 3;
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_RETRY_NARROWER_BATCH = 4;
  EVALUATION_ARTIFACT_REMEDIATION_KIND_V1_WAIT_FOR_PLANE = 5;
}

message EvaluationArtifactContentRefV1 {
  string artifact_id = 1;
  // When present and the plane's digest differs, the reference is refused as
  // REVOKED-class rather than answered with a body the caller did not ask for.
  optional string content_digest = 2;
}

message EvaluationArtifactRemediationV1 {
  EvaluationArtifactRemediationKindV1 kind = 1;
  string reason_code = 2;
  optional string detail = 3;
}

// One reference's answer.
//
// `content` is ABSENT — not empty — on every refusal. An empty body would render
// as "the artifact was empty", which is a different and false fact.
message EvaluationArtifactContentV1 {
  string artifact_id = 1;
  EvaluationArtifactContentStateV1 state = 2;
  optional string media_type = 3;
  optional string content_digest = 4;
  // The artifact's size, which is knowable from its summary even when the body
  // is refused. Zero when the plane could not tell us.
  uint64 byte_size = 5;
  // Sanitized bytes only. A body this build cannot classify is REDACTED rather
  // than emitted.
  optional bytes content = 6;
  bool truncated = 7;
  MetricAvailabilityV1 availability = 8;
  optional EvaluationArtifactRemediationV1 remediation = 9;
}

message GetEvaluationArtifactContentRequest {
  string evaluation_run_id = 1;
  EvaluationCellRefV1 cell = 2;
  EvaluationArtifactContentRefV1 artifact = 3;
}

message GetEvaluationArtifactContentResponse {
  EvaluationArtifactContentV1 content = 1;
  repeated AllowedActionV1 allowed_actions = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
  EvaluationFreshnessV1 freshness = 4;
}

message BatchGetEvaluationArtifactContentsRequest {
  string evaluation_run_id = 1;
  EvaluationCellRefV1 cell = 2;
  // At most 4. Above that is INVALID_ARGUMENT, not a silent trim.
  repeated EvaluationArtifactContentRefV1 artifacts = 3;
}

message BatchGetEvaluationArtifactContentsResponse {
  // One entry per requested reference, in request order. A partially satisfied
  // batch is a normal outcome, not an error.
  repeated EvaluationArtifactContentV1 contents = 1;
  uint64 total_content_bytes = 2;
  uint64 byte_budget = 3;
  repeated AllowedActionV1 allowed_actions = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
  EvaluationFreshnessV1 freshness = 6;
}

// ===========================================================================
// Manifest and history
//
// `DECISION:979` keeps raw serialized manifests as developer diagnostics: this
// section is a SERVER-COMPUTED, bounded, typed difference plus the immutable
// pointers around it. No field on it carries an encoded manifest as bytes.
// ===========================================================================

// The twenty dimensions a configuration difference can fall in. An enum rather
// than a free-form key, because a client renders a model change and a dataset
// change differently.
enum ConfigurationDimensionV1 {
  CONFIGURATION_DIMENSION_V1_UNSPECIFIED = 0;
  CONFIGURATION_DIMENSION_V1_CANDIDATE_RELEASE_REVISION = 1;
  CONFIGURATION_DIMENSION_V1_PROVIDER_MODEL = 2;
  CONFIGURATION_DIMENSION_V1_RESPONSE_MODEL = 3;
  CONFIGURATION_DIMENSION_V1_PROMPT = 4;
  CONFIGURATION_DIMENSION_V1_GENERATION_PARAMS = 5;
  CONFIGURATION_DIMENSION_V1_TOOL_CATALOG = 6;
  CONFIGURATION_DIMENSION_V1_TOOL_VERSION = 7;
  CONFIGURATION_DIMENSION_V1_RETRIEVAL_BACKEND = 8;
  CONFIGURATION_DIMENSION_V1_RETRIEVAL_CONFIG = 9;
  CONFIGURATION_DIMENSION_V1_FEATURE_FLAG = 10;
  CONFIGURATION_DIMENSION_V1_DEPLOYMENT = 11;
  CONFIGURATION_DIMENSION_V1_ENVIRONMENT = 12;
  CONFIGURATION_DIMENSION_V1_SCORER = 13;
  CONFIGURATION_DIMENSION_V1_RUBRIC = 14;
  CONFIGURATION_DIMENSION_V1_DECISION_POLICY = 15;
  CONFIGURATION_DIMENSION_V1_DATASET = 16;
  CONFIGURATION_DIMENSION_V1_COHORT = 17;
  CONFIGURATION_DIMENSION_V1_SCHEMA = 18;
  CONFIGURATION_DIMENSION_V1_NORMALIZATION = 19;
  CONFIGURATION_DIMENSION_V1_TRIALS = 20;
}

// One difference. Values are bounded typed metadata, never a serialized blob;
// a value too large to inline is referenced, not truncated into a lie.
message ConfigurationDiffEntryV1 {
  ConfigurationDimensionV1 dimension = 1;
  // Which thing changed within the dimension — a candidate key, a scorer key, a
  // cohort key. Stable, never a display label.
  string subject_key = 2;
  optional MetadataValueV1 reference_value = 3;
  optional MetadataValueV1 candidate_value = 4;
  // Set when a value exceeded the per-entry inline byte cap. The digests are
  // then the whole answer for that side, and the value is absent rather than
  // silently shortened — a truncated prompt read as the prompt is worse than no
  // prompt at all.
  //
  // Not an `ExternalArtifactRefV1`: that type belongs to artifact.proto.
  bool value_truncated = 5;
  optional string reference_value_digest = 6;
  optional string candidate_value_digest = 7;
}

message EvaluationConfigurationDiffV1 {
  // The run this one is being compared against. Absent when there is nothing to
  // compare to, in which case `availability` says so rather than the entry list
  // being empty and readable as "no differences".
  optional string reference_evaluation_run_id = 1;
  optional string reference_definition_revision_id = 2;
  repeated ConfigurationDiffEntryV1 entries = 3;
  // Set when the diff hit its entry cap. The count is the number of differences
  // found, which is not the same as the number returned.
  bool truncated = 4;
  uint32 total_entry_count = 5;
  MetricAvailabilityV1 availability = 6;
}

enum EvaluationAuditEventKindV1 {
  EVALUATION_AUDIT_EVENT_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_AUDIT_EVENT_KIND_V1_RUN_LAUNCHED = 1;
  EVALUATION_AUDIT_EVENT_KIND_V1_RUN_STATE_CHANGED = 2;
  EVALUATION_AUDIT_EVENT_KIND_V1_CELLS_RETRIED = 3;
  EVALUATION_AUDIT_EVENT_KIND_V1_RUN_CANCELLED = 4;
  EVALUATION_AUDIT_EVENT_KIND_V1_DECISION_ADOPTED = 5;
  EVALUATION_AUDIT_EVENT_KIND_V1_REVIEW_SUBMITTED = 6;
  EVALUATION_AUDIT_EVENT_KIND_V1_EXPORT_REQUESTED = 7;
  EVALUATION_AUDIT_EVENT_KIND_V1_SHARE_CREATED = 8;
}

// One audit row. Bounded by construction: a typed kind, an actor, an instant,
// and at most a handful of typed details. Never a message a client parses.
message EvaluationAuditEntryV1 {
  uint64 sequence = 1;
  EvaluationAuditEventKindV1 kind = 2;
  optional PrincipalRefV1 actor = 3;
  google.protobuf.Timestamp occurred_at = 4;
  repeated MetadataEntryV1 details = 5;
}

message EvaluationRunManifestSectionV1 {
  // The frozen revision this run pinned, and the digest that proves it.
  string definition_revision_id = 1;
  string definition_content_digest = 2;
  uint32 manifest_schema_version = 3;
  EvaluationConfigurationDiffV1 configuration_diff = 4;
  // Scorer and policy versions, read from the frozen manifest rather than from
  // today's catalog: what the run used, not what exists now.
  repeated EvaluationScorerVersionSnapshotV1 scorers = 5;
  optional string decision_policy_version = 6;
  optional EvaluationPricingSourceV1 pricing_source = 7;
  MetricAvailabilityV1 pricing_source_availability = 8;
  // Evidence and decision revision pointers, plus where a release adopted them.
  uint64 evidence_projection_version = 9;
  optional string adopted_decision_revision_id = 10;
  ReleaseAdoptionWarningV1 release_adoption = 11;
  // At most EVALUATION_MANIFEST_MAX_AUDIT_ROWS (200), paged.
  repeated EvaluationAuditEntryV1 audit = 12;
  optional string audit_next_cursor = 13;
  bool audit_has_more = 14;
  // This section's own posture and age. Sections legitimately differ in age and
  // say so.
  EvaluationFreshnessV1 freshness = 15;
  MetricAvailabilityV1 availability = 16;
  // O11Y-592 and O11Y-634. What changed per candidate since the previous run
  // of the same definition, one entry per change, with that run in
  // `reference_evaluation_run_id`:
  //   PROVIDER_MODEL: the REQUESTED model snapshot, from the two frozen
  //     harnesses;
  //   PROMPT: the requested prompt bundle digest, from the same harnesses;
  //   RESPONSE_MODEL: what the provider SERVED, for the candidates in
  //     `served_drift_candidate_keys` only. Each side lists that run's
  //     distinct served model ids, each with the fingerprint it was served
  //     under where the provider sent one. A changed set of model ids is
  //     drift whatever the fingerprints say; otherwise a changed set of
  //     fingerprints is drift when both runs recorded some.
  // An empty list means nothing compared moved; `availability` says when there
  // was nothing to compare. Its reason code is `served_runs_incomplete` when
  // either run is not COMPLETED, since only then has every cell been served
  // and a smaller set is not drift; otherwise it is `launch_harness_only` when
  // no candidate's served models were compared. Absent from a server that
  // predates it.
  optional EvaluationConfigurationDiffV1 provider_drift = 17;
  // O11Y-634. The candidates `provider_drift` also compared on what was
  // SERVED. Both runs are COMPLETED, both recorded a served model for the
  // candidate, and either the model ids differ or the fingerprints are
  // comparable: both runs recorded some, or neither did. The same model with
  // a fingerprint only one run recorded is not comparable, so that candidate
  // is not listed. Every unlisted candidate is compared on its launch harness
  // alone.
  repeated string served_drift_candidate_keys = 18;
}

// ===========================================================================
// Human review
//
// Three levels: a review UNIT owns the completion policy, a
// TASK is one reviewer's slot on that unit, and a SUBMISSION is the immutable
// record of what one reviewer said, once.
//
// Blind posture is enforced on the READ path. There is no
// request field on any message below that asks to bypass it; reveal is a policy
// transition, and an authorized adjudicator is a role exception, never a
// parameter.
// ===========================================================================

// The full frozen vocabulary ships, including states nothing writes yet: a
// partially frozen enum is not frozen.
enum EvaluationReviewTaskStateV1 {
  EVALUATION_REVIEW_TASK_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_REVIEW_TASK_STATE_V1_PENDING = 1;
  EVALUATION_REVIEW_TASK_STATE_V1_ASSIGNED = 2;
  EVALUATION_REVIEW_TASK_STATE_V1_RESERVED = 3;
  EVALUATION_REVIEW_TASK_STATE_V1_SUBMITTED = 4;
  // The lease lapsed. Requeued WITHOUT data loss: the reviewer's partial rubric
  // survives as their own draft.
  EVALUATION_REVIEW_TASK_STATE_V1_RESERVATION_EXPIRED = 5;
  EVALUATION_REVIEW_TASK_STATE_V1_RELEASED = 6;
  EVALUATION_REVIEW_TASK_STATE_V1_CANCELLED = 7;
  // An audited policy waiver. Not written yet.
  EVALUATION_REVIEW_TASK_STATE_V1_WAIVED = 8;
}

enum ReviewReservationStateV1 {
  REVIEW_RESERVATION_STATE_V1_UNSPECIFIED = 0;
  REVIEW_RESERVATION_STATE_V1_NONE = 1;
  REVIEW_RESERVATION_STATE_V1_ACTIVE = 2;
  REVIEW_RESERVATION_STATE_V1_EXPIRING = 3;
  REVIEW_RESERVATION_STATE_V1_EXPIRED = 4;
  REVIEW_RESERVATION_STATE_V1_RELEASED = 5;
  REVIEW_RESERVATION_STATE_V1_TRANSFERRED = 6;
}

// Completion drives the run state, not the reverse.
enum ReviewUnitCompletionStateV1 {
  REVIEW_UNIT_COMPLETION_STATE_V1_UNSPECIFIED = 0;
  REVIEW_UNIT_COMPLETION_STATE_V1_AWAITING_REVIEWERS = 1;
  REVIEW_UNIT_COMPLETION_STATE_V1_AWAITING_ADJUDICATION = 2;
  REVIEW_UNIT_COMPLETION_STATE_V1_COMPLETE = 3;
  REVIEW_UNIT_COMPLETION_STATE_V1_WAIVED = 4;
  REVIEW_UNIT_COMPLETION_STATE_V1_INCOMPLETE_EXPIRED = 5;
}

enum ReviewAdjudicationStateV1 {
  REVIEW_ADJUDICATION_STATE_V1_UNSPECIFIED = 0;
  REVIEW_ADJUDICATION_STATE_V1_NOT_REQUIRED = 1;
  REVIEW_ADJUDICATION_STATE_V1_REQUIRED = 2;
  REVIEW_ADJUDICATION_STATE_V1_ASSIGNED = 3;
  REVIEW_ADJUDICATION_STATE_V1_RESOLVED = 4;
  // No authorized adjudicator available. A typed queue state, not a silent
  // stall.
  REVIEW_ADJUDICATION_STATE_V1_UNRESOLVABLE = 5;
}

// #656. Why a unit's binding submissions disagree.
enum EvaluationReviewConflictKindV1 {
  EVALUATION_REVIEW_CONFLICT_KIND_V1_UNSPECIFIED = 0;
  // The verdicts differ.
  EVALUATION_REVIEW_CONFLICT_KIND_V1_GRADES_DIFFER = 1;
  // Same verdict, different winner. Pairwise units only.
  EVALUATION_REVIEW_CONFLICT_KIND_V1_SPLIT_ON_PICK = 2;
}

// The unit: (evaluation run, cell coordinate, human scorer version). Owns the
// completion policy, the conflict state, and the evidence contribution.
message EvaluationReviewUnitV1 {
  string review_unit_id = 1;
  string evaluation_run_id = 2;
  EvaluationCellRefV1 cell = 3;
  string scorer_key = 4;
  string scorer_version = 5;
  ReviewUnitCompletionStateV1 completion_state = 6;
  ReviewAdjudicationStateV1 adjudication_state = 7;
  // Progress, required count and blocking effect, so a client never computes
  // any of them.
  uint32 submitted_count = 8;
  uint32 required_count = 9;
  // What this unit is blocking, named. Empty when it blocks nothing yet.
  optional string blocking_effect_code = 10;
  bool blind_posture = 11;
  bool pairwise = 12;
  // Present exactly when this unit's subject is a proposed dataset case rather
  // than an evaluation cell, in which case `evaluation_run_id` and `cell` are
  // empty — the unit names no run, because a production match is not a run.
  optional string dataset_proposed_case_id = 13;
  // #656. Present on a queue row when the unit's binding submissions conflict
  // and the caller holds the adjudicator role; absent otherwise, so a blind
  // reviewer learns nothing about their peers. The same rule moves a unit to
  // `_AWAITING_ADJUDICATION` / `_REQUIRED` when its last required reviewer
  // submits (#760). The queue lists parked cells only, so a resolved unit
  // leaves it.
  optional EvaluationReviewConflictKindV1 conflict_kind = 14;
}

// The task: one reviewer's slot. `review_task_id` is the durable task URL's
// handle.
message EvaluationReviewTaskV1 {
  string review_task_id = 1;
  EvaluationReviewUnitV1 unit = 2;
  EvaluationReviewTaskStateV1 state = 3;
  ReviewReservationStateV1 reservation_state = 4;
  optional google.protobuf.Timestamp reservation_expires_at = 5;
  optional PrincipalRefV1 reviewer = 6;
  repeated AllowedActionV1 allowed_actions = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // The lease generation's fence token, delivered ONLY to the principal who
  // currently holds that generation.
  //
  // Present on every task in a `ClaimEvaluationReviewTasksResponse` (the claim
  // minted it for this caller) and on `GetEvaluationReviewTaskResponse.task`
  // when the caller is the live lease holder, which is what makes the durable
  // task URL a flow a client can finish: open the link, then submit.
  //
  // EMPTY otherwise, and the two cases where it is empty are the point:
  //
  //   * a reader who is not the holder — the adjudicator reading another
  //     reviewer's task under `adjudicator_reveal` — gets nothing here, because
  //     they hold no lease, and a fence they cannot pass is a field that
  //     teaches a client the wrong thing;
  //   * the queue read NEVER carries it. Nothing submits from a queue, and a
  //     write credential on every row of a list read is a write credential in
  //     every log of one.
  //
  // It is a STALENESS fence, not an authorization: `SubmitEvaluationReview`
  // separately requires the caller to be the task's reviewer. See the comment
  // on `SubmitEvaluationReviewRequest.reservation_token`.
  string reservation_token = 10;
}

// The safe subject a reviewer judges. References, never hydrated bodies: no
// trace or artifact is hydrated per task, which is what makes the durable task
// URL a SELECTED_DETAIL rather than a fan-out.
message EvaluationReviewSubjectV1 {
  string cohort_key = 1;
  string case_revision_id = 2;
  // Presented in this order. Derived from a seed over (review_unit_id,
  // reviewer_principal_id) plus the manifest's frozen seed, so an audit can
  // reconstruct exactly what a reviewer saw without the order being guessable
  // across reviewers.
  repeated string presented_candidate_keys = 3;
  repeated EvaluationArtifactContentRefV1 artifact_refs = 4;
  MetricAvailabilityV1 availability = 5;
  // Which kind of subject the fields above describe. A unit written before this
  // field existed is `_EVALUATION_CELL`, and `cohort_key` /
  // `case_revision_id` mean exactly what they always did.
  EvaluationReviewSubjectKindV1 subject_kind = 6;
  // Present exactly when `subject_kind` is `_DATASET_PROPOSED_CASE`: the case a
  // production rule proposed and asked a human to look at before it becomes
  // golden data.
  optional string dataset_proposed_case_id = 7;
  // #656. Present on a pairwise unit: the run's reference candidate, which
  // `presented_candidate_keys` shows beside the unit's own candidate
  // (`cell.candidate_key`). A winner names a side relative to these two.
  optional string baseline_candidate_key = 8;
}

message EvaluationReviewRubricFieldV1 {
  string field_key = 1;
  bool required = 2;
  // Which MetadataValueV1 arm this field accepts. A field that accepts a double
  // and one that accepts a string are not interchangeable.
  string value_type_code = 3;
  optional double minimum = 4;
  optional double maximum = 5;
}

message EvaluationReviewRubricV1 {
  string rubric_score_config_id = 1;
  string rubric_version = 2;
  repeated EvaluationReviewRubricFieldV1 fields = 3;
  bool pairwise = 4;
}

// Immutable. No field on a stored submission is ever overwritten; an
// adjudication is a NEW record referencing the submissions it resolves.
message EvaluationReviewSubmissionV1 {
  string submission_id = 1;
  string review_task_id = 2;
  uint32 attempt = 3;
  PrincipalRefV1 reviewer = 4;
  repeated MetadataEntryV1 field_values = 5;
  // Reused, not duplicated.
  optional AnnotationPairwiseWinnerV1 pairwise_winner = 6;
  optional string explanation = 7;
  google.protobuf.Timestamp submitted_at = 8;
  // A submission beyond the required count is stored and displayed and does not
  // change an evidence revision a release already adopted.
  bool binding = 9;
}

// Incompleteness is typed PER FIELD. One opaque INVALID_ARGUMENT would make a
// client guess which box it failed to fill.
message EvaluationReviewRubricFieldErrorV1 {
  string field_key = 1;
  string error_code = 2;
}

message ListEvaluationReviewTasksRequest {
  // Required. The queue is a run's queue: which units exist is derived from the
  // run's frozen manifest (which human scorers) crossed with the cells parked
  // for review, so a queue is never cross-run.
  string evaluation_run_id = 1;
  o11y_one.common.v1.PageRequestV1 page = 2;
  // Queue filters. Absent means "everything this reviewer could act on".
  repeated EvaluationReviewTaskStateV1 states = 3;
  // When true, only tasks this caller already holds or has submitted.
  optional bool mine_only = 4;
}

message ListEvaluationReviewTasksResponse {
  repeated EvaluationReviewTaskV1 tasks = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // The page was cut short of its row cap by the byte budget. Stated rather
  // than inferred, so a client does not read a short page as the last one.
  bool truncated_by_byte_budget = 5;
  uint64 response_byte_budget = 6;
}

message ClaimEvaluationReviewTasksRequest {
  string evaluation_run_id = 1;
  // At most EVALUATION_REVIEW_CLAIM_MAX_TASKS. Above that is INVALID_ARGUMENT,
  // not a silent trim: a reviewer who asked for forty and got ten would not
  // know which thirty they do not hold.
  uint32 max_tasks = 2;
  // Same vocabulary the launch and retry paths use.
  string idempotency_key = 3;
  // Take THESE tasks rather than the top of the queue.
  //
  // Empty is the shipped behaviour, unchanged byte for byte: assign from the
  // top. Non-empty is bounded by the same `EVALUATION_REVIEW_CLAIM_MAX_TASKS`
  // the batch is, and over that is `INVALID_ARGUMENT` for the same reason
  // `max_tasks` is — a reviewer who named twelve and got ten would not know
  // which two they do not hold.
  //
  // WHAT CAN BE NAMED. A `review_task_id` is a reviewer SLOT, and a slot comes
  // into existence when a claim creates it. A unit nobody has claimed has no task
  // id at all (the queue returns an empty handle for exactly that reason), so it
  // cannot be named here, and the empty-list path stays the only way to acquire
  // a NEW slot. What this list is for is the caller's own slots: re-take the two
  // whose reservation lapsed, or re-mint the token for one still held whose
  // token the client lost.
  //
  // Ids that cannot be claimed come back as per-id `refusals` on the response
  // rather than failing the whole call, so a partial batch costs one round trip
  // and not ten.
  repeated string review_task_ids = 4;
}

message ClaimEvaluationReviewTasksResponse {
  repeated EvaluationReviewTaskV1 tasks = 1;
  // Why fewer than `max_tasks` came back, when fewer did. A typed reason, so
  // "the queue is empty" stays distinguishable from "you already hold your
  // maximum".
  optional string short_claim_reason_code = 2;
  uint32 reserved_task_count = 3;
  uint32 max_simultaneous_reservations = 4;
  EvaluationFreshnessV1 freshness = 5;
  AgenticEvaluationCapabilitiesV1 capabilities = 6;
  // Per-id refusals for `review_task_ids` this claim could not take. Empty on
  // an untargeted claim, and empty on a targeted one that took everything it
  // was asked for.
  //
  // On the RESPONSE rather than in `Status::details`, unlike the release and
  // requeue verbs: those refuse WHOLE, and this one deliberately does not. A
  // partial success is not an error status.
  //
  // Every named id appears exactly once across `tasks` and `refusals`, with one
  // typed exception: when `short_claim_reason_code` is
  // `reviewer_reservation_limit_reached` the ids the limit cut are in neither
  // list. That is deliberate — the limit is a fact about the caller, and those
  // rows are still claimable on the next call. A refusal there would send a
  // client to fix the wrong thing.
  repeated EvaluationReviewTaskRefusalV1 refusals = 7;
}

message GetEvaluationReviewTaskRequest {
  string review_task_id = 1;
}

// Subject, safe context, rubric, the reviewer's OWN prior submission, queue
// state, and allowed actions.
message GetEvaluationReviewTaskResponse {
  EvaluationReviewTaskV1 task = 1;
  EvaluationReviewSubjectV1 subject = 2;
  EvaluationReviewRubricV1 rubric = 3;
  // The caller's own prior submission, if any.
  optional EvaluationReviewSubmissionV1 own_submission = 4;
  // The caller's preserved partial work after a lapsed reservation.
  // Reviewer-scoped: another reviewer's claim never sees it.
  repeated MetadataEntryV1 own_draft_field_values = 5;
  // Populated ONLY when the unit's completion policy is satisfied, or when the
  // caller holds the adjudicator role for this unit. Under blind posture with
  // an unmet policy this is empty, and `blind_withheld` says why — an empty
  // list alone would be indistinguishable from "nobody else has submitted".
  repeated EvaluationReviewSubmissionV1 other_submissions = 6;
  bool blind_withheld = 7;
  optional string blind_withheld_reason_code = 8;
  bool adjudicator_reveal = 9;
  repeated AllowedActionV1 allowed_actions = 10;
  EvaluationFreshnessV1 freshness = 11;
  AgenticEvaluationCapabilitiesV1 capabilities = 12;
  // #775. The body of each `subject.presented_candidate_keys` entry, at the same
  // index and never named: `artifact_id` is `presented_output_{index}`, so the
  // subject's key at that index names it. Bounded and refused per entry as
  // `BatchGetExecutionArtifactContents` is. Only a recorded-output candidate
  // keeps its output; any other is `candidate_output_not_retained`. Empty
  // unless the caller holds the task's live lease or adjudicates another
  // reviewer's task; `presented_outputs_availability` says which.
  repeated EvaluationArtifactContentV1 presented_outputs = 13;
  // AVAILABLE when `presented_outputs` was read; NOT_SUPPORTED
  // `review_lease_not_live` when the caller holds no live lease (never claimed,
  // lapsed, or already submitted).
  MetricAvailabilityV1 presented_outputs_availability = 14;
}

message SubmitEvaluationReviewRequest {
  string review_task_id = 1;
  // The lease token the claim issued. Every write-back is fenced by it, so a
  // submission from a reservation somebody else now holds is refused rather
  // than silently accepted.
  //
  // WHERE A CLIENT GETS IT. From `EvaluationReviewTaskV1.reservation_token` —
  // on every task the claim returns, and on the task read when the caller is
  // the live holder.
  //
  //   The token fences STALE LEASE GENERATIONS, not unauthorized callers.
  //   Authorization is the authed scope, and this verb separately requires
  //   `reviewer_principal_id` to be the caller — so another principal holding
  //   this token still cannot write, and the only caller a delivered token
  //   admits is the one the fence exists to admit.
  string reservation_token = 2;
  repeated MetadataEntryV1 field_values = 3;
  // #656. Required on a pairwise unit (field error `pairwise_winner` /
  // `required_field_missing`), and INVALID_ARGUMENT
  // `review_pairwise_not_enabled` on any other.
  optional AnnotationPairwiseWinnerV1 pairwise_winner = 4;
  optional string explanation = 5;
  string idempotency_key = 6;
  // A partial save. Stored as the reviewer's own draft and NOT as a submission,
  // which is what makes reservation expiry lossless.
  bool draft_only = 7;
  // The reviewer's verdict when this task's unit names a
  // `dataset_proposed_case` subject.
  //
  // Optional, so a client written before it is unaffected. Present on a
  // CELL-subject task is `INVALID_ARGUMENT`: the
  // outcome vocabulary belongs to the dataset draft lifecycle, and accepting it
  // on a cell would be a second meaning for one field.
  optional DatasetCaseReviewOutcomeV1 dataset_case_outcome = 8;
  // Required when the outcome is `_MERGE_WITH_EXISTING` (it names the target
  // revision) or `_REJECT` (it needs a typed reason).
  optional string merge_target_case_revision_id = 9;
  optional DatasetCaseDraftRejectionReasonV1 dataset_case_rejection_reason = 10;
  // #588. The candidate this reviewer judged the unit's candidate against, as
  // presented to them. Optional: the server stores the subject's
  // `baseline_candidate_key` beside the winner (#656). When sent it must equal
  // that, else INVALID_ARGUMENT `review_baseline_invalid`.
  optional string baseline_candidate_key = 11;
}

message SubmitEvaluationReviewResponse {
  // Absent when `draft_only` was set: a draft is not a submission.
  optional EvaluationReviewSubmissionV1 submission = 1;
  EvaluationReviewUnitV1 unit = 2;
  // Present and non-empty when the rubric was incomplete, in which case nothing
  // was written.
  repeated EvaluationReviewRubricFieldErrorV1 field_errors = 3;
  bool idempotent_replay = 4;
  // True when this submission completed the unit, and true again when that was
  // the run's last outstanding unit — the two facts a reviewer's screen needs
  // to say "you unblocked the run".
  bool unit_completed = 5;
  bool run_review_completed = 6;
  EvaluationFreshnessV1 freshness = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
}

// ===========================================================================
// Export and share
//
// Shares and exports CANNOT increase content permissions. A share is a pointer:
// it carries no grant, and resolving one runs the same authorization the direct
// read runs.
// ===========================================================================

enum EvaluationExportFormatV1 {
  EVALUATION_EXPORT_FORMAT_V1_UNSPECIFIED = 0;
  EVALUATION_EXPORT_FORMAT_V1_CSV = 1;
  EVALUATION_EXPORT_FORMAT_V1_JSONL = 2;
  EVALUATION_EXPORT_FORMAT_V1_PARQUET = 3;
  // (#726) A dataset version's tasks, one row each in the shape its
  // trainer's Loop adapter reads. Only a dataset version exports in these, and
  // it exports in nothing else.
  EVALUATION_EXPORT_FORMAT_V1_VERL_PARQUET = 4;
  EVALUATION_EXPORT_FORMAT_V1_TRL_PARQUET = 5;
  EVALUATION_EXPORT_FORMAT_V1_OPENRLHF_JSONL = 6;
  EVALUATION_EXPORT_FORMAT_V1_TINKER_JSONL = 7;
}

message EvaluationExportV1 {
  string export_id = 1;
  string evaluation_run_id = 2;
  EvaluationExportFormatV1 format = 3;
  EvaluationOperationStateV1 state = 4;
  // Pinned at creation. An export that re-read the watermark on completion
  // would return a different dataset than the one the operator asked for.
  uint64 pinned_projection_version = 5;
  optional string pinned_facts_watermark = 6;
  PrincipalRefV1 requested_by = 7;
  optional uint64 byte_size = 8;
  optional string content_digest = 9;
  optional EvaluationFailureV1 failure = 10;
  uint32 attempt_count = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp finished_at = 14;
  // O11Y-596. When the export's object is deleted and its download refused.
  // Absent until the export succeeds.
  optional google.protobuf.Timestamp expires_at = 15;
  // #636. True once the object was deleted or `expires_at` has passed: the
  // download is refused as expired.
  bool expired = 16;
  // (#726) The dataset version a trainer export writes the tasks of. Empty on a
  // run's export, whose `evaluation_run_id` is set instead.
  string dataset_version_id = 17;
  // (#726) The tasks a completed dataset version's export skipped, having no
  // prompt a trainer can read, and the first of them by id; for a trajectory
  // version, the rollouts it skipped, their steps not whole, cut or gone, or
  // their task without a prompt, and the first of them by its ordinal. 0 and
  // empty on a run's export, which skips nothing.
  uint64 skipped_rows = 18;
  string first_skipped_task_id = 19;
}

message CreateEvaluationExportRequest {
  string evaluation_run_id = 1;
  EvaluationExportFormatV1 format = 2;
  string idempotency_key = 3;
  // O11Y-596. How long the export's object is kept once written, 1 to 720
  // hours. Absent keeps it 48 hours.
  optional uint32 retention_hours = 4;
  // (#726) A dataset version whose tasks to export, in a trainer's format.
  // Exactly one of `evaluation_run_id` and this is set; otherwise the request
  // is refused as `export_source_invalid`.
  string dataset_version_id = 5;
  // (#726) The dataset version's splits to export: `train`, `eval`, `golden`,
  // `regression` or `canary`. Empty exports train, eval and regression;
  // golden and canary are exported only when named. Only with
  // `dataset_version_id`; any other value is refused as `export_split_invalid`.
  repeated string splits = 6;
}

message CreateEvaluationExportResponse {
  EvaluationExportV1 export = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message GetEvaluationExportRequest {
  string export_id = 1;
}

message GetEvaluationExportResponse {
  EvaluationExportV1 export = 1;
  repeated AllowedActionV1 allowed_actions = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

// #636. One row of the organisation's exports. Never a download URL: a
// download is `CreateEvaluationExportDownload`, audited per call.
message EvaluationExportListRowV1 {
  EvaluationExportV1 export = 1;
  // The run's evaluation, by its display name; for a dataset version's export
  // (#726), its dataset collection's name.
  string definition_display_name = 2;
}

message ListEvaluationExportsRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  optional string evaluation_run_id = 2;
  // Empty means every state. UNSPECIFIED is refused, never a wildcard.
  repeated EvaluationOperationStateV1 states = 3;
  // (#726) This dataset version's trainer exports alone. Without it,
  // evaluation runs' exports alone are listed. Never with `evaluation_run_id`.
  optional string dataset_version_id = 4;
}

message ListEvaluationExportsResponse {
  repeated EvaluationExportListRowV1 exports = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
  optional EvaluationCursorResyncV1 resync = 4;
}

// O11Y-596. A short-lived URL for one succeeded export's object. Each call is
// audited.
message CreateEvaluationExportDownloadRequest {
  string export_id = 1;
}

message CreateEvaluationExportDownloadResponse {
  // Signed for a GET of this export's object and nothing else. Server-minted.
  string url = 1;
  // At most 15 minutes away, and never past the export's own expiry.
  google.protobuf.Timestamp expires_at = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

enum EvaluationShareStateV1 {
  EVALUATION_SHARE_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_SHARE_STATE_V1_ACTIVE = 1;
  EVALUATION_SHARE_STATE_V1_REVOKED = 2;
}

// Org-only, authenticated, exact-run. There is no field here that grants
// anything: a share names a run and nothing else.
message EvaluationShareV1 {
  string share_id = 1;
  string evaluation_run_id = 2;
  EvaluationShareStateV1 state = 3;
  PrincipalRefV1 created_by = 4;
  google.protobuf.Timestamp created_at = 5;
  optional google.protobuf.Timestamp revoked_at = 6;
}

message CreateEvaluationShareRequest {
  string evaluation_run_id = 1;
  string idempotency_key = 2;
}

message CreateEvaluationShareResponse {
  EvaluationShareV1 share = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message GetEvaluationShareRequest {
  string share_id = 1;
}

message GetEvaluationShareResponse {
  EvaluationShareV1 share = 1;
  // What the holder may do with the run behind the share, resolved through the
  // SAME authorization a direct read runs. A holder who lacks the underlying
  // content permission gets the same typed refusal here as there.
  repeated AllowedActionV1 allowed_actions = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

// Withdraws a share pointer.
//
// Revokes a share: `EVALUATION_SHARE_STATE_V1_REVOKED`, with
// `EvaluationShareV1.revoked_at` set exactly when the state is revoked.
//
// Revoking is org-authorized exactly as creating is. A revoked share then
// resolves to a TYPED refusal on a served response, never a 404: a holder
// learns the link was withdrawn rather than that it never existed. A share the
// caller may not see at all is still the direct read's NOT_FOUND, unchanged.
message RevokeEvaluationShareRequest {
  string share_id = 1;
  string idempotency_key = 2;
}

message RevokeEvaluationShareResponse {
  EvaluationShareV1 share = 1;
  // True when the share was already revoked. Revoking twice is an
  // acknowledgement, not an error.
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ===========================================================================
// Operations tab
//
// "Where did the time and the money go, which operation is failing, and what
// did retries and caching do?" — grouped by operation kind and name, with
// bounded exemplar cells.
//
// THIS SURFACE NEVER BECOMES A GENERIC INFRASTRUCTURE DASHBOARD, and that
// boundary is a TYPE rather than a docstring. The request carries exactly three
// selectors and every one of them is an evaluation coordinate: there is no time
// range, no service, host, container, node, region or resource selector, and no
// free-form filter expression. The response enumerates the dimensions this
// surface refuses, so a client can render the boundary instead of discovering
// it by having a query rejected.
// ===========================================================================

enum EvaluationWorkOperationKindV1 {
  EVALUATION_WORK_OPERATION_KIND_V1_UNSPECIFIED = 0;
  // One candidate invocation per cell: the provider call, the endpoint call, or
  // the recorded-output resolution that replaced one.
  EVALUATION_WORK_OPERATION_KIND_V1_CANDIDATE_CALL = 1;
  // One scorer execution per (cell, scorer). Its economics are NEVER summed
  // with the candidate's.
  EVALUATION_WORK_OPERATION_KIND_V1_SCORER_EXECUTION = 2;
  // Run preparation: cohort resolution and cell materialization.
  EVALUATION_WORK_OPERATION_KIND_V1_RUN_PREPARATION = 3;
}

// Dimensions this surface deliberately does not offer, as a frozen enum.
enum EvaluationOperationDimensionV1 {
  EVALUATION_OPERATION_DIMENSION_V1_UNSPECIFIED = 0;
  EVALUATION_OPERATION_DIMENSION_V1_HOST = 1;
  EVALUATION_OPERATION_DIMENSION_V1_SERVICE = 2;
  EVALUATION_OPERATION_DIMENSION_V1_CONTAINER = 3;
  EVALUATION_OPERATION_DIMENSION_V1_NODE = 4;
  EVALUATION_OPERATION_DIMENSION_V1_REGION = 5;
  EVALUATION_OPERATION_DIMENSION_V1_TIME_BUCKET = 6;
  EVALUATION_OPERATION_DIMENSION_V1_TELEMETRY_SPAN = 7;
}

// Why this operation's token usage looks the way it does. A typed code rather
// than prose, because a client renders "the provider reported no cache
// dimension at all" and "the provider reported a cache and it never hit"
// differently — and a zero would collapse them.
enum EvaluationOperationCacheExplanationV1 {
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_UNSPECIFIED = 0;
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_NOT_REPORTED = 1;
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_NO_CACHE_ACTIVITY = 2;
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_CACHE_READS_OBSERVED = 3;
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_CACHE_WRITES_OBSERVED = 4;
  EVALUATION_OPERATION_CACHE_EXPLANATION_V1_NOT_APPLICABLE = 5;
}

// The typed boundary. Carried on every response so the tab can say what it is
// and what it is not without the client having to know.
message EvaluationOperationBoundaryV1 {
  // Always `evaluation_run_scoped_operations_only`.
  string scope_code = 1;
  uint32 max_groups = 2;
  uint32 max_exemplars_per_group = 3;
  repeated EvaluationOperationDimensionV1 excluded_dimensions = 4;
}

// One operation group. Fixed-width metrics plus bounded exemplars: never a
// per-row telemetry join.
message EvaluationOperationGroupV1 {
  EvaluationWorkOperationKindV1 kind = 1;
  // The operation's name within its kind: the candidate key for a candidate
  // call, the scorer's config key for a scorer execution.
  string operation_name = 2;
  // How the candidate was produced, when the kind is CANDIDATE_CALL. Absent for
  // every other kind rather than defaulted to a source nothing observed.
  optional string operation_source_code = 3;

  uint32 call_count = 4;
  uint32 succeeded_count = 5;
  uint32 failed_count = 6;
  uint32 retry_count = 7;

  // Time. Absent rather than zero when nothing in the group was instrumented.
  optional int64 total_latency_micros = 8;
  MetricAvailabilityV1 latency_availability = 9;
  uint32 latency_observed_count = 10;

  // Money. Candidate spend only; a scorer group reports NOT_SUPPORTED here
  // because scorer economics are not instrumented, never 0.
  optional CostAmountV1 cost = 11;
  CostPostureV1 cost_posture = 12;
  MetricAvailabilityV1 cost_availability = 13;
  uint32 priced_count = 14;
  uint32 unpriced_count = 15;

  // Tokens. Every dimension absent rather than zero when unreported.
  optional int64 input_tokens = 16;
  optional int64 output_tokens = 17;
  optional int64 cache_read_tokens = 18;
  optional int64 cache_write_tokens = 19;
  optional int64 reasoning_tokens = 20;
  MetricAvailabilityV1 token_availability = 21;
  EvaluationOperationCacheExplanationV1 cache_explanation = 22;

  // The failing operation, named. Absent when nothing in the group failed.
  optional string dominant_failure_code = 23;
  optional string dominant_failure_stage = 24;
  uint32 dominant_failure_count = 25;

  // At most `max_exemplars_per_group`, ordered failures-first then by the cell
  // coordinate — a stable order, for the same reason the group order is.
  repeated EvaluationCellRefV1 exemplar_cells = 26;

  // For a SCORER_EXECUTION group: can this
  // operation be re-graded on the candidate output the run already paid for, or
  // not, and why not. Always false for a candidate group — a candidate call
  // cannot be re-run without re-billing it, which is a cell retry
  // (`RetryEvaluationCells`) and a different action.
  bool regrade_available = 27;
  // Present exactly when `regrade_available` is false and the group has
  // failures worth re-grading. Carries the domain's typed ineligibility, or
  // `scorer_retry_wire_contract_unspecified` when the re-grade is possible and
  // this build publishes no RPC to ask for it.
  optional string regrade_blocked_reason_code = 28;
}

// Run-level totals. Candidate and evaluator are separate fields and there is no
// field anywhere that sums them.
message EvaluationOperationTotalsV1 {
  uint32 operation_group_count = 1;
  uint32 candidate_call_count = 2;
  uint32 scorer_execution_count = 3;
  optional CostAmountV1 candidate_cost = 4;
  MetricAvailabilityV1 candidate_cost_availability = 5;
  optional int64 candidate_latency_micros = 6;
  optional int64 scorer_latency_micros = 7;
  MetricAvailabilityV1 scorer_cost_availability = 8;
  // Time to first token, which this build never observes: the provider client
  // is non-streaming. Reported as NOT_SUPPORTED rather than as a zero a Pareto
  // plot would read as instant.
  MetricAvailabilityV1 time_to_first_token_availability = 9;
  // How many exemplar coordinates on this tab could be re-graded on candidate
  // output the run has already paid for, and what that would cost in external
  // calls. The second number is structurally ZERO — a scorer re-grade reaches
  // no provider — and it is stated as a number rather than as an availability
  // posture because "free" and "unknown" are different answers.
  uint32 regradable_operation_count = 10;
  uint32 regrade_external_call_count = 11;
}

message GetEvaluationOperationBreakdownRequest {
  string evaluation_run_id = 1;
  // Narrow to one candidate. Absent means every candidate in the run.
  optional string candidate_key = 2;
  // Narrow to one cohort/slice. Absent means every cohort in the run.
  optional string cohort_key = 3;
}

message GetEvaluationOperationBreakdownResponse {
  string evaluation_run_id = 1;
  // At most `boundary.max_groups`, in a total order over STABLE keys
  // (candidate spend desc, then kind, then name) so a truncated tab drops the
  // same tail on every read. Measured latency is reported and is deliberately
  // not a sort key: it varies between reads of the same run.
  repeated EvaluationOperationGroupV1 groups = 2;
  // How many groups the cap dropped. Stated rather than inferred: a client must
  // not read 30 groups as "there were 30".
  uint32 truncated_group_count = 3;
  EvaluationOperationTotalsV1 totals = 4;
  EvaluationOperationBoundaryV1 boundary = 5;
  repeated AllowedActionV1 allowed_actions = 6;
  EvaluationFreshnessV1 freshness = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
}

// ===========================================================================
// Definition revision history
// ===========================================================================

// The list row. Deliberately NOT EvaluationDefinitionRevisionV1: that message
// embeds the whole authored draft, and a page of 50 of them would blow the
// payload budget on content the history pane does not render. The digest and
// the byte size are here so a client can still tell two revisions apart and ask
// for either one in full through GetEvaluationDefinition.
message EvaluationDefinitionRevisionSummaryV1 {
  string revision_id = 1;
  string definition_id = 2;
  uint64 revision_number = 3;
  string content_digest = 4;
  uint32 draft_schema_version = 5;
  uint64 draft_byte_size = 6;
  PrincipalRefV1 created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  optional string change_summary = 9;
  optional string source_revision_id = 10;
  // True for the revision the definition currently points at.
  bool is_current = 11;
}

message ListEvaluationDefinitionRevisionsRequest {
  string definition_id = 1;
  o11y_one.common.v1.PageRequestV1 page = 2;
}

message ListEvaluationDefinitionRevisionsResponse {
  repeated EvaluationDefinitionRevisionSummaryV1 revisions = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // A cursor this build cannot honour returns a typed resync directive with an
  // empty page, never a transport error carrying prose.
  optional EvaluationCursorResyncV1 resync = 5;
}

// ===========================================================================
// Adjudication
//
// "Authorized resolution WITHOUT overwriting the original reviews." An
// adjudication is a NEW record that resolves a conflict; no field of a stored
// submission is ever rewritten, and the adjudicator exception is attached to
// the caller's ROLE rather than to anything on this request.
// ===========================================================================

enum EvaluationAdjudicationRefusalV1 {
  EVALUATION_ADJUDICATION_REFUSAL_V1_UNSPECIFIED = 0;
  // The caller does not hold the adjudicator role for this organisation.
  EVALUATION_ADJUDICATION_REFUSAL_V1_NOT_AN_ADJUDICATOR = 1;
  // The unit's binding submissions agree. There is nothing to resolve, and
  // "adjudicating" it would be an override wearing a conflict's name.
  EVALUATION_ADJUDICATION_REFUSAL_V1_NO_CONFLICT_TO_ADJUDICATE = 2;
  // The unit already completed and its evidence is immutable. A different
  // answer needs a new run or a new trial.
  EVALUATION_ADJUDICATION_REFUSAL_V1_UNIT_ALREADY_COMPLETE = 3;
  EVALUATION_ADJUDICATION_REFUSAL_V1_UNIT_NOT_FOUND = 4;
}

// The adjudication record. Append-only, exactly as a submission is: it names the
// submissions it resolved rather than replacing them.
message EvaluationReviewAdjudicationV1 {
  string adjudication_id = 1;
  string review_unit_id = 2;
  string evaluation_run_id = 3;
  PrincipalRefV1 adjudicator = 4;
  repeated MetadataEntryV1 field_values = 5;
  optional AnnotationPairwiseWinnerV1 pairwise_winner = 6;
  // Required. An adjudication with no stated reason is an override, and the
  // audit cannot tell the two apart afterwards.
  string reason = 7;
  // The submissions this adjudication resolved. Every one of them is still
  // stored, unmodified, and still readable.
  repeated string resolved_submission_ids = 8;
  google.protobuf.Timestamp resolved_at = 9;
  // False when the run had already terminalized: stored and displayed, and not
  // changing an evidence revision a release adopted.
  bool binding = 10;
}

message AdjudicateEvaluationReviewConflictRequest {
  string review_unit_id = 1;
  repeated MetadataEntryV1 field_values = 2;
  // #656. Required on a pairwise unit, else INVALID_ARGUMENT
  // `review_pairwise_winner_required`.
  optional AnnotationPairwiseWinnerV1 pairwise_winner = 3;
  string reason = 4;
  string idempotency_key = 5;
  // #588. As `SubmitEvaluationReviewRequest.baseline_candidate_key`.
  optional string baseline_candidate_key = 6;
}

message AdjudicateEvaluationReviewConflictResponse {
  // Absent exactly when `refusal` is present.
  optional EvaluationReviewAdjudicationV1 adjudication = 1;
  optional EvaluationReviewUnitV1 unit = 2;
  // The conflicting submissions, revealed because the caller holds the
  // adjudicator role. Empty on every refusal, so a refused call reveals
  // nothing.
  repeated EvaluationReviewSubmissionV1 resolved_submissions = 3;
  optional EvaluationAdjudicationRefusalV1 refusal = 4;
  bool idempotent_replay = 5;
  bool unit_completed = 6;
  bool run_review_completed = 7;
  EvaluationFreshnessV1 freshness = 8;
  AgenticEvaluationCapabilitiesV1 capabilities = 9;
}

// ===========================================================================
// Org negotiated rates — the override surface
//
// Record, list, end and void an organisation's negotiated rates, which
// `EVALUATION_RATE_SOURCE_V1_ORG_NEGOTIATED_OVERRIDE` and
// `EvaluationSupersededRateV1` report on.
//
// THERE IS NO DELETE, AND THAT IS THE DESIGN
//
//   A rate is ENDED (its window is closed), never removed. Three reasons:
//   pricing already selects on the window, so a deleted row and an ended row
//   differ for every historical question and agree only about today; a rate is
//   closed rather than updated; and the use case is a disputed invoice, where
//   the September rate, its recording date and its contract reference are the
//   evidence — and a delete is most attractive at exactly the moment someone
//   has a motive to destroy it.
//
// `Record` / `End` rather than `Create` / `Revoke`: a revoked share NEVER
// worked, whereas an ended negotiated rate DID -- every run launched under it
// keeps its frozen numbers forever. Calling that "revoke" would imply a
// retroactive withdrawal of prices this build already quoted.
// ===========================================================================

// Where a negotiated rate sits relative to today.
//
// A code rather than three date comparisons every client re-derives, and three
// states rather than a boolean, because "we negotiated this and it starts next
// quarter" and "we negotiated this and it lapsed" are not the same answer.
enum EvaluationOrgNegotiatedRateStateV1 {
  EVALUATION_ORG_NEGOTIATED_RATE_STATE_V1_UNSPECIFIED = 0;
  // `effective_from` is in the future: recorded, and not yet pricing anything.
  EVALUATION_ORG_NEGOTIATED_RATE_STATE_V1_SCHEDULED = 1;
  // Inside its window. This is the row a preview resolves against.
  EVALUATION_ORG_NEGOTIATED_RATE_STATE_V1_IN_FORCE = 2;
  // `effective_until` has passed. Kept, because it is the answer to "what were
  // we quoting last quarter?".
  EVALUATION_ORG_NEGOTIATED_RATE_STATE_V1_ENDED = 3;
  // Recorded in error and marked as never honoured, with a reason. A void is
  // only possible while NO run has frozen the rate, so a VOIDED row priced
  // nothing and no manifest contradicts it. Rendered in preference to the three
  // window states: a voided row's dates are a historical statement, not an
  // operative one.
  EVALUATION_ORG_NEGOTIATED_RATE_STATE_V1_VOIDED = 4;
}

// One org's negotiated rate for one `(provider, model_id)`, as stored.
//
// Every rate dimension is optional and absent is NEVER zero: an org that
// negotiated input and output only inherits the registry's cache columns, and
// the pricing plane reports the inheritance by name
// (`org_override_inherits_registry_cache_dimension`) rather than leaving it to
// be inferred from a number. That is deliberately unlike the authored-rate
// branch: an author typing two floats into one candidate claims nothing about
// their cache rate, whereas an org's negotiated schedule is a rate card, and a
// rate card silent on cache means the list price applies.
message EvaluationOrgNegotiatedRateV1 {
  string negotiated_rate_id = 1;
  ProviderNameV1 provider = 2;
  string model_id = 3;

  // Micros per MILLION tokens, matching `EvaluationModelRateV1`. A per-token
  // micro rate rounds to zero for every model anyone would actually run.
  optional int64 input_micros_per_million_tokens = 4;
  optional int64 output_micros_per_million_tokens = 5;
  optional int64 cache_read_micros_per_million_tokens = 6;
  optional int64 cache_write_5m_micros_per_million_tokens = 7;
  optional int64 cache_write_1h_micros_per_million_tokens = 8;
  optional int64 reasoning_micros_per_million_tokens = 9;

  // Registry modifier codes this org's contract flattens away. The modifier is
  // still reported on the wire, `applied = false`, with
  // `modifier_suppressed_by_org_negotiated_contract` -- a suppression is a
  // stated condition, not a silence.
  repeated string suppressed_modifier_codes = 10;

  // ISO-8601 dates, same idiom as `EvaluationModelRateV1.rate_checked_date`.
  // A rate is a dated, sourced fact or it is a rumour.
  string effective_from_date = 11;
  optional string effective_until_date = 12;
  // The contract or PO reference. "Who set this and when" is the question a
  // hand-typed float has never been able to answer.
  optional string source_note = 13;
  PrincipalRefV1 created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  EvaluationOrgNegotiatedRateStateV1 state = 16;

  // Set together or not at all. A rate recorded in error is VOIDED rather than
  // deleted: the row stays in the catalog and says why it was withdrawn, so
  // "recorded in error, never used" and "used, then withdrawn" are different
  // answers on the wire rather than the same silence.
  optional google.protobuf.Timestamp voided_at = 17;
  optional string void_reason = 18;
}

// `MUTATION_ACK`. Org-authorized exactly as every other mutation on this
// service is.
message RecordEvaluationOrgNegotiatedRateRequest {
  // UNSPECIFIED is INVALID_ARGUMENT rather than a silent default: a rate
  // recorded against no provider would match no candidate and price nothing,
  // which is a wasted contract rather than a stored one.
  ProviderNameV1 provider = 1;
  string model_id = 2;

  optional int64 input_micros_per_million_tokens = 3;
  optional int64 output_micros_per_million_tokens = 4;
  optional int64 cache_read_micros_per_million_tokens = 5;
  optional int64 cache_write_5m_micros_per_million_tokens = 6;
  optional int64 cache_write_1h_micros_per_million_tokens = 7;
  optional int64 reasoning_micros_per_million_tokens = 8;

  repeated string suppressed_modifier_codes = 9;
  string effective_from_date = 10;
  optional string source_note = 11;
  // Caller-minted. The same key returns the row the first call recorded; a
  // second OPEN row for one `(provider, model_id)` under a different key is a
  // FAILED_PRECONDITION naming the open row, because the caller's correct move
  // is to end it first.
  string idempotency_key = 12;
}

message RecordEvaluationOrgNegotiatedRateResponse {
  EvaluationOrgNegotiatedRateV1 negotiated_rate = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// `INITIAL_PAGE`. Open rows and ended ones alike: a list that hid the history
// would delete the answer this surface refuses to delete.
message ListEvaluationOrgNegotiatedRatesRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
}

message ListEvaluationOrgNegotiatedRatesResponse {
  repeated EvaluationOrgNegotiatedRateV1 negotiated_rates = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // A cursor this build cannot honour returns a typed resync directive with an
  // empty page, never a transport error carrying prose.
  optional EvaluationCursorResyncV1 resync = 5;
}

// `MUTATION_ACK`. Closes the window; nothing is removed.
message EndEvaluationOrgNegotiatedRateRequest {
  string negotiated_rate_id = 1;
  // The day the rate stops applying, exclusive. The table refuses a window that
  // ends on or before the day it started, so a rate recorded today cannot also
  // end today -- the recovery from a wrongly recorded rate is to end it
  // tomorrow and record the correction from tomorrow.
  string effective_until_date = 2;
  string idempotency_key = 3;
}

message EndEvaluationOrgNegotiatedRateResponse {
  EvaluationOrgNegotiatedRateV1 negotiated_rate = 1;
  // True when the row was already ended. Ending twice is an acknowledgement,
  // not an error -- the same rule `RevokeEvaluationShare` follows.
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// `MUTATION_ACK`. Marks a rate recorded IN ERROR as never honoured.
//
// The recovery `EndEvaluationOrgNegotiatedRate` cannot provide: the table
// refuses a window that closes on the day it opened, so before this RPC a rate
// recorded with a typo priced the whole day at the wrong number. A void takes
// effect immediately -- the next preview does not see the row.
//
// Only possible while NO run has frozen the rate. A rate a run has priced
// against is FAILED_PRECONDITION naming how many runs are in the way, and its
// recovery is `End`: those runs keep their frozen numbers, and the catalog must
// not be made to say a rate they quoted never existed.
message VoidEvaluationOrgNegotiatedRateRequest {
  string negotiated_rate_id = 1;
  // Required and non-empty. The whole reason a void is a mark rather than a
  // delete is that a withdrawn number should be legible afterwards, and an
  // unexplained mark is not legible. Bounded at the same 512 bytes
  // `source_note` carries.
  string void_reason = 2;
  string idempotency_key = 3;
}

message VoidEvaluationOrgNegotiatedRateResponse {
  EvaluationOrgNegotiatedRateV1 negotiated_rate = 1;
  // True when the row was already void. Voiding twice is an acknowledgement and
  // the FIRST reason stands -- a second void is not a correction, and the
  // reason is the one field on this row an interested party would want to edit.
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// #1123. An empty filter matches every row; two filters match a row both match.
message ListEvaluationModelRatesRequest {
  repeated ProviderNameV1 providers = 1;
  // Wire model ids, matched exactly.
  repeated string model_ids = 2;
}

// The checked-in registry as a preview reads it now. `pricing_source.model_rates`
// holds one row per matching model, with `candidate_key` empty, composed as a
// quote at this instant composes it; the version, date, digest, age, staleness,
// threshold and provenance are the whole registry's. Org negotiated rates are
// not folded in: `ListEvaluationOrgNegotiatedRates` serves them.
//
// A row is the model's rate for every use. A system-one call bills no output
// (#1000), so a client quoting a system-one judge prices input alone, even on
// `gpt-6-luna`, whose row carries its text output rate.
message ListEvaluationModelRatesResponse {
  EvaluationPricingSourceV1 pricing_source = 1;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

// ===========================================================================
// Score series as a platform signal
//
// Cost class SIGNAL_SERIES: a bounded, time-bucketed read over maintained
// projections whose consumer is a non-screen plane. Not ANALYTICAL (bounded by
// series keys x buckets, not by a page) and not PAGE (no cursor). A series
// response may not embed a page of runs.
// ===========================================================================

// Which coordinates make up a series key.
//
// A dimension that is not part of the key is aggregated over, not filtered: a
// series at DEFINITION grain is the sum of its candidates, never one of them.
enum EvaluationSeriesGrainV1 {
  EVALUATION_SERIES_GRAIN_V1_UNSPECIFIED = 0;
  // One series for the whole definition.
  EVALUATION_SERIES_GRAIN_V1_DEFINITION = 1;
  // One series per candidate. The grain that makes "which candidate got worse"
  // answerable; before the candidate-grain projection it had no source at all.
  EVALUATION_SERIES_GRAIN_V1_CANDIDATE = 2;
  // One series per scorer.
  EVALUATION_SERIES_GRAIN_V1_SCORER = 3;
  EVALUATION_SERIES_GRAIN_V1_CANDIDATE_SCORER = 4;
  // The approved-slice grain. COHORT is the only slice dimension the cell plane
  // carries, so it is the only one that can be served; every other slice
  // dimension reports NOT_SUPPORTED rather than an empty series.
  EVALUATION_SERIES_GRAIN_V1_COHORT = 5;
  // Reserved and refused: this value reports NOT_SUPPORTED /
  // production_rule_grain_phase6. A declared absence with a reason code: the
  // capability is declared and its dependency has not shipped, and the response
  // says so.
  EVALUATION_SERIES_GRAIN_V1_PRODUCTION_RULE = 6;
}

// Which plane answered a series read.
//
// A field rather than an inference. While the fact plane is off the series is
// projection-backed, and a response that implied otherwise would be the
// instrumentation lie EvaluationFreshnessV1.facts_watermark's optionality
// exists to prevent.
enum EvaluationSeriesPlaneV1 {
  EVALUATION_SERIES_PLANE_V1_UNSPECIFIED = 0;
  EVALUATION_SERIES_PLANE_V1_PROJECTION = 1;
  EVALUATION_SERIES_PLANE_V1_FACTS = 2;
}

// The identity of one series.
//
// A re-keyed candidate STARTS A NEW SERIES: the old key goes absent from the
// re-key forward and nothing is spliced or back-filled. candidate_key is
// manifest-declared per run, so two runs of one definition agree only as long
// as the definition's candidate keys do, and splicing a renamed candidate into
// an existing line would assert a continuity the evidence does not have.
message EvaluationSeriesKeyV1 {
  string definition_id = 1;
  optional string candidate_key = 2;
  optional string cohort_key = 3;
  optional string score_config_id = 4;
  // Display label carried beside the key, never part of it: a scorer renamed in
  // its config is the same scorer and must not break its series.
  optional string metric_name = 5;
}

// One time bucket of one series.
//
// Every ratio is absent rather than zero when its denominator is zero, and
// every denominator rides with its numerator: a mean without its denominator is
// how "one cell scored 1.0" becomes a green dashboard, and the release gate's
// min_samples and the detector's insufficient-sample decision are shipped
// consumers of exactly these counts.
message EvaluationSeriesPointV1 {
  google.protobuf.Timestamp bucket_start = 1;
  // Absent when scored_result_count is zero. NEVER 0.0.
  optional double mean_score = 2;
  // pass / (pass + fail). Absent when that denominator is zero. Errors, skips
  // and not-applicables are deliberately outside the denominator: a scorer that
  // could not run is not a failure of the candidate.
  optional double pass_rate = 3;
  // executed / expected. Absent when nothing was expected.
  optional double coverage_ratio = 4;
  // The candidate spend attributable to this bucket, de-duplicated across the
  // scorers that witnessed each call. Absent when nothing here was priced.
  optional int64 candidate_cost_micros = 5;
  optional string candidate_cost_currency = 6;
  uint32 run_count = 7;
  uint32 scored_result_count = 8;
  uint32 expected_cell_count = 9;
  uint32 executed_cell_count = 10;
  uint32 verdict_pass_count = 11;
  uint32 verdict_fail_count = 12;
  uint32 verdict_error_count = 13;
  uint32 verdict_skipped_count = 14;
  uint32 verdict_not_applicable_count = 15;
  uint32 pending_review_count = 16;
  uint32 not_sampled_count = 17;
  uint32 candidate_priced_cell_count = 18;
  // Why a value is absent, when it is. NOT_OBSERVED / nothing_scored,
  // PENDING / human_review_pending and NOT_SAMPLED are four different answers
  // and this is where they stay four.
  MetricAvailabilityV1 availability = 19;
}

// One series: its identity, its points, and -- when it has none -- why.
message EvaluationScoreSeriesV1 {
  EvaluationSeriesKeyV1 key = 1;
  // Buckets with no evidence are ABSENT from this list, never present with a
  // zero. Missing is not zero.
  repeated EvaluationSeriesPointV1 points = 2;
  MetricAvailabilityV1 availability = 3;
}

// What the server actually bounded the response at, and whether it bound it.
//
// Clamp and report, never truncate: a silent truncation at a row cap is a
// pre-watermark gap in another costume.
message EvaluationSeriesClampV1 {
  uint32 max_series_keys = 1;
  uint32 max_buckets = 2;
  uint32 max_points = 3;
  uint32 effective_series_keys = 4;
  uint32 effective_buckets = 5;
  uint32 effective_points = 6;
  bool clamped = 7;
  // Which bound bit first. Absent when nothing was clamped.
  optional string clamp_reason_code = 8;
  // True when series keys exist beyond the bound. The caller learns that its
  // chart is a subset rather than discovering it from a suspicious total.
  bool more_series_available = 9;
  // The window the server actually read, after any bucket clamp. Never assumed
  // equal to the requested window.
  google.protobuf.Timestamp effective_window_start = 10;
  google.protobuf.Timestamp effective_window_end = 11;
  uint32 effective_bucket_seconds = 12;
}

message ListEvaluationScoreSeriesRequest {
  string definition_id = 1;
  google.protobuf.Timestamp window_start = 2;
  // Half-open: [window_start, window_end). Adjacent windows neither
  // double-count a run nor drop one on the boundary.
  google.protobuf.Timestamp window_end = 3;
  // Clamped by the server so the window yields at most max_buckets buckets; the
  // response says what it actually used.
  uint32 bucket_seconds = 4;
  EvaluationSeriesGrainV1 grain = 5;
  // Clamped to the capability's max_series_keys. Absent takes the bound.
  optional uint32 max_series_keys = 6;
}

message ListEvaluationScoreSeriesResponse {
  repeated EvaluationScoreSeriesV1 series = 1;
  EvaluationSeriesClampV1 clamp = 2;
  // Which plane answered. PROJECTION while the fact plane is off.
  EvaluationSeriesPlaneV1 answering_plane = 3;
  // projection_version is this family's own version. facts_watermark is ABSENT
  // and its absence is load-bearing: it already means "this response performed
  // no fact-plane read".
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

// ===========================================================================
// Capture from production
//
// One verb, two sources. A trace span or an evaluation matrix cell becomes a
// PROPOSED CASE REVISION inside a dataset-version DRAFT, carrying the mapping
// selectors that produced it, its typed absences, and a provenance stamp that
// lives on the case revision rather than on the draft.
// ===========================================================================

enum EvaluationCaptureSourceKindV1 {
  EVALUATION_CAPTURE_SOURCE_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_CAPTURE_SOURCE_KIND_V1_TRACE_SPAN = 1;
  EVALUATION_CAPTURE_SOURCE_KIND_V1_EVALUATION_MATRIX_CELL = 2;
  // A case a production rule promoted. Its source kind and lineage are
  // PRESERVED rather than folded into `_TRACE_SPAN`.
  EVALUATION_CAPTURE_SOURCE_KIND_V1_PRODUCTION_RULE = 3;
  // ONE lifecycle covers manual authoring, import, trace extraction and rule
  // promotion.
  //
  // `_MACHINE_PRINCIPAL` is a programmatic principal. It is a value with
  // **no writer in this build** — no machine principal can reach the capture
  // verb yet — and the capability set says so rather than leaving the enum's
  // existence to imply otherwise.
  //
  // A matrix-cell capture is `_EVALUATION_MATRIX_CELL`, never
  // `_TRACE_EXTRACTION`: a cell has no telemetry identity.
  EVALUATION_CAPTURE_SOURCE_KIND_V1_MANUAL = 4;
  EVALUATION_CAPTURE_SOURCE_KIND_V1_IMPORT = 5;
  EVALUATION_CAPTURE_SOURCE_KIND_V1_MACHINE_PRINCIPAL = 6;
}

// Seven kinds because each has a distinct remediation. A caller told only
// "invalid argument" cannot act, and a partial case is never one of the
// answers: a source that cannot be mapped is refused WHOLE.
enum EvaluationCaptureRefusalKindV1 {
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  // The named span or cell is not readable in this scope.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_SOURCE_NOT_FOUND = 1;
  // This build has no reader for that source kind. Deliberately distinct from
  // SOURCE_NOT_FOUND: "we cannot look" is not "we looked and found none".
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_SOURCE_PLANE_NOT_SHIPPED = 2;
  // A required target path resolved nothing. Nothing was written.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_REQUIRED_FIELD_UNMAPPED = 3;
  // A path the caller DECLARED resolves nothing against the composed case.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_MAPPING_RESOLVED_NOTHING = 4;
  // A target path whose root is not one of the four case payload columns.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_INVALID_TARGET_PATH = 5;
  // The key already captured DIFFERENT content. Nothing was overwritten.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_IDEMPOTENCY_KEY_REUSED = 6;
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_DRAFT_CASE_CAP_EXCEEDED = 7;
  // The source moved between the preview the caller approved and the capture
  // they sent. Distinct from IDEMPOTENCY_KEY_REUSED: that one says "you already
  // captured different content under this key", this one says "the SOURCE now
  // maps to different content than the preview showed you".
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_PREVIEW_DIGEST_MOVED = 8;
  // The span's content references exceed the total byte budget for one
  // hydration. Refused WHOLE rather than partially hydrated: dropping the
  // overflow would make the case's contents depend on a sort order.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_SPAN_CONTENT_BUDGET_EXCEEDED = 9;
  // This SOURCE is already a case in this collection, promoted under a
  // different caller key.
  //
  // Deliberately distinct from `IDEMPOTENCY_KEY_REUSED`: that one says "YOU
  // already captured different content under this key", this one says "this
  // span is already a case here, whoever put it there". The opaque key is the
  // caller's replay ledger; the structured key `(tenant, org, source_kind,
  // source_reference, target_collection)` is the promotion identity, and two
  // different callers cannot both promote one span into one collection.
  // `existing_proposed_case_id` names what is already there, and nothing was
  // mutated.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_PROMOTION_KEY_EXISTS = 12;
  // The configured redaction policy matched a rule whose action is `block`, or
  // a deny-path. The refusal names the FIELD PATHS and the detector kinds and
  // never the matched text.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_REDACTION_BLOCKED = 10;
  // The redaction check could not run — a value over the scan bound, or a policy
  // that could not be loaded. This FAILS CLOSED: the draft is not
  // created, because a field we declined to scan is not a field we found clean.
  EVALUATION_CAPTURE_REFUSAL_KIND_V1_REDACTION_INDETERMINATE = 11;
}

enum EvaluationDatasetDraftStateV1 {
  EVALUATION_DATASET_DRAFT_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_DATASET_DRAFT_STATE_V1_OPEN = 1;
  EVALUATION_DATASET_DRAFT_STATE_V1_FINALIZED = 2;
  EVALUATION_DATASET_DRAFT_STATE_V1_ABANDONED = 3;
}

enum EvaluationProposedCaseStateV1 {
  EVALUATION_PROPOSED_CASE_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_PROPOSED_CASE_STATE_V1_PROPOSED = 1;
  // Withdrawn from the draft. The row, its payloads and its provenance stay:
  // voided is not deleted.
  EVALUATION_PROPOSED_CASE_STATE_V1_VOIDED = 2;
}

message EvaluationCaptureSpanSourceV1 {
  // Raw bytes, matching TelemetryRefV1 (artifact.proto) rather than a hex
  // string: two spellings of one identity eventually disagree.
  bytes trace_id = 1;
  bytes span_id = 2;
}

message EvaluationCaptureCellSourceV1 {
  string evaluation_run_id = 1;
  EvaluationCellRefV1 cell = 2;
}

// The stamp. It rides the case revision, so a finalized version's cases can
// still answer "where did this come from".
message EvaluationCaptureProvenanceV1 {
  EvaluationCaptureSourceKindV1 source_kind = 1;
  optional bytes trace_id = 2;
  optional bytes span_id = 3;
  // AVAILABLE for a span capture; NOT_SUPPORTED / `cell_capture_carries_no_span`
  // for a cell capture, because a matrix cell has no telemetry identity and an
  // empty byte string would read as one.
  MetricAvailabilityV1 telemetry_availability = 4;
  optional EvaluationCellRefV1 cell = 5;
  optional string evaluation_run_id = 6;
  optional string source_dataset_version_id = 7;
  google.protobuf.Timestamp captured_at = 8;
}

// What one mapping selector actually resolved: an overwritten or empty selector
// is visible rather than silent.
message EvaluationCaptureFieldSelectionV1 {
  string source_path = 1;
  string target_path = 2;
  MetricAvailabilityV1 availability = 3;
}

message EvaluationProposedCaseV1 {
  // The proposed case REVISION id.
  string proposed_case_id = 1;
  string draft_id = 2;
  uint32 ordinal = 3;
  EvaluationProposedCaseStateV1 state = 4;
  EvaluationCaptureProvenanceV1 provenance = 5;
  repeated EvaluationCaptureFieldSelectionV1 selections = 6;
  // Typed absence at ingest, with the two slugs the design names:
  // `case_carries_no_input_payload` / `case_carries_no_expected_output`.
  MetricAvailabilityV1 input_availability = 7;
  MetricAvailabilityV1 expected_output_availability = 8;
  // The nested recorded-output field path, e.g. `original_context.output`.
  optional string recorded_output_field_path = 9;
  MetricAvailabilityV1 recorded_output_availability = 10;
  string content_digest = 11;
  optional string void_reason = 12;
  google.protobuf.Timestamp created_at = 13;
  // The immutable extraction snapshot: which content references this case's
  // payloads were hydrated from, and what happened to each one. Empty for a
  // matrix-cell capture — a cell has no content references, and `[]` says that
  // where an absent field would mean "we did not record".
  //
  // References and postures only. No body and no fragment of one: the bodies
  // live in the object store and in the preview response, which is where they
  // already were.
  repeated EvaluationSpanContentHydrationV1 source_content_refs = 14;
  // The ten-state draft lifecycle.
  //
  // `state` above KEEPS its meaning exactly — container membership, "is this
  // case still a live member of the draft's proposed set", because an older
  // client reads it that way. The four voiding terminals render `_VOIDED` there
  // and everything else `_PROPOSED`.
  DatasetCaseDraftStateV1 draft_state = 15;
}

message EvaluationDatasetVersionDraftV1 {
  string draft_id = 1;
  string dataset_collection_id = 2;
  optional string base_dataset_version_id = 3;
  EvaluationDatasetDraftStateV1 state = 4;
  // Two counters, never a total and a subtraction: voided cases are facts, and
  // an honest zero on either is a fact at 0.
  uint32 proposed_case_count = 5;
  uint32 voided_case_count = 6;
  // Optimistic-concurrency token. Finalizing the draft binds against it.
  uint64 draft_version = 7;
  optional string finalized_dataset_version_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// Carried in the error details of a refused capture, the same way
// EvaluationLaunchRejectionV1 is carried by a refused launch.
message EvaluationCaptureRefusalV1 {
  EvaluationCaptureRefusalKindV1 kind = 1;
  string detail = 2;
  // The target paths a required-field or declared-path refusal could not fill.
  // Named so the remediation IS the error.
  repeated string missing_target_paths = 3;
  RecoveryActionV1 recovery = 4;
  // Set on IDEMPOTENCY_KEY_REUSED so the caller can find what the key already
  // captured instead of guessing.
  optional string existing_proposed_case_id = 5;
}

message CaptureEvaluationCaseRequest {
  string dataset_collection_id = 1;
  // Absent takes the collection's one OPEN draft, creating it on the first
  // capture. Naming a draft that is not open is SOURCE_NOT_FOUND.
  optional string draft_id = 2;
  oneof source {
    EvaluationCaptureSpanSourceV1 span = 3;
    EvaluationCaptureCellSourceV1 cell = 4;
  }
  // Explicit mapping selectors. Target paths are dotted and rooted at one of
  // `input_payload`, `expected_output`, `correction_payload`,
  // `original_context`, the four parts of a case.
  repeated DatasetFieldMappingV1 field_mappings = 5;
  // Declaring this path is a CLAIM about the case. A declared path that
  // resolves nothing is refused, not stored: it would silently fail every
  // recorded-output run that ever pinned the case.
  optional string recorded_output_field_path = 6;
  string idempotency_key = 7;
  optional string base_dataset_version_id = 8;
  // The digest a `PreviewEvaluationCaseCapture` returned for this exact source
  // and these exact selectors.
  //
  // Additive and optional on a shipped message, so a client written before the
  // preview existed is unaffected. When set, the capture re-resolves the source
  // and recomputes the digest from ITS OWN bytes — never from this echo — and
  // refuses with PREVIEW_DIGEST_MOVED before its first write if the two differ.
  // A span whose manifest was re-emitted, or whose body was replaced at the
  // same URI, moves the digest, and the caller is told the case they approved
  // is not the case they would get.
  optional string expected_content_digest = 9;
}

message CaptureEvaluationCaseResponse {
  EvaluationDatasetVersionDraftV1 draft = 1;
  // The one case this call landed. Never a page of the draft's cases: a
  // mutation acknowledgement that embedded a list would grow as the draft did.
  EvaluationProposedCaseV1 proposed_case = 2;
  bool idempotent_replay = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  EvaluationFreshnessV1 freshness = 5;
}

// ===========================================================================
// The extraction PREVIEW and span-content hydration
//
// One verb that shows what a capture WOULD produce, through the same mapping
// kernel the capture uses. Preview and capture cannot disagree, and the digest
// binding above is what lets a client hold them to it.
// ===========================================================================

// The eight classes the OTLP trace ingest fans out of `o11y.content.*.ref`
// attributes into content manifests, spelled as ingest spells them (not the
// six-class subset the trace view carries).
enum EvaluationSpanContentClassV1 {
  EVALUATION_SPAN_CONTENT_CLASS_V1_UNSPECIFIED = 0;
  EVALUATION_SPAN_CONTENT_CLASS_V1_INPUT_MESSAGES = 1;
  EVALUATION_SPAN_CONTENT_CLASS_V1_OUTPUT_MESSAGES = 2;
  EVALUATION_SPAN_CONTENT_CLASS_V1_TOOL_DEFINITIONS = 3;
  EVALUATION_SPAN_CONTENT_CLASS_V1_SYSTEM_INSTRUCTIONS = 4;
  EVALUATION_SPAN_CONTENT_CLASS_V1_RETRIEVAL_DOCUMENTS = 5;
  EVALUATION_SPAN_CONTENT_CLASS_V1_TOOL_ARGUMENTS = 6;
  EVALUATION_SPAN_CONTENT_CLASS_V1_TOOL_RESULT = 7;
  EVALUATION_SPAN_CONTENT_CLASS_V1_REASONING = 8;
}

// What happened to one content reference on the span.
//
// A reference this build resolved, and a reference it could not, are the same
// message with different availability — never a present entry versus an absent
// one, because "we did not look" and "we looked and it is gone" are the two
// answers this whole surface exists to keep apart.
message EvaluationSpanContentHydrationV1 {
  EvaluationSpanContentClassV1 content_class = 1;
  // The reference exactly as the span emitted it. Opaque: this platform stores
  // the string, not the body it names.
  string storage_uri = 2;
  // Bytes served, when the body was read. Absent when it was not — a zero would
  // read as "the body was empty".
  optional uint64 byte_size = 3;
  // AVAILABLE, or NOT_OBSERVED / NOT_SUPPORTED with one of:
  //   `content_reference_expired_past_retention`
  //   `content_reference_kind_not_readable_by_this_build`
  //   `content_body_over_byte_bound`
  //   `content_body_not_stored`
  //   `content_body_not_utf8`
  //   `content_redacted_by_policy`
  //   `content_plane_unreachable`
  MetricAvailabilityV1 availability = 4;
}

// One target path, and the value that would land at it.
//
// A materialized payload preview, not a placeholder instruction.
message EvaluationCapturePreviewFieldV1 {
  // Dotted, rooted at one of the four case payload columns.
  string target_path = 1;
  // The value as it would be STORED, rendered by the same canonicalisation the
  // content digest hashes — so what a reviewer reads and what the digest binds
  // are the same bytes.
  //
  // A string and not google.protobuf.Value: this surface carries no untyped
  // document, and a JSON rendering is how it carries an arbitrarily-shaped
  // payload.
  //
  // Absent when the field did not resolve, and ALSO absent when the value is
  // over `max_preview_field_bytes` — the availability reason distinguishes
  // those two, and `byte_size` says how large the thing we declined to render
  // is. A field too large to SHOW is still captured; the preview says so rather
  // than implying otherwise.
  optional string materialized_json = 2;
  optional uint64 byte_size = 3;
  MetricAvailabilityV1 availability = 4;
}

message PreviewEvaluationCaseCaptureRequest {
  string dataset_collection_id = 1;
  oneof source {
    EvaluationCaptureSpanSourceV1 span = 2;
    EvaluationCaptureCellSourceV1 cell = 3;
  }
  repeated DatasetFieldMappingV1 field_mappings = 4;
  optional string recorded_output_field_path = 5;
}

message PreviewEvaluationCaseCaptureResponse {
  // The stamp the capture WOULD write, built by the same resolver.
  EvaluationCaptureProvenanceV1 provenance = 1;
  // One entry per case payload column the mappings reach.
  repeated EvaluationCapturePreviewFieldV1 fields = 2;
  // The capture's OWN selection message, produced by the capture's own kernel.
  repeated EvaluationCaptureFieldSelectionV1 selections = 3;
  // Empty for a matrix-cell source.
  repeated EvaluationSpanContentHydrationV1 content_hydration = 4;
  // Echo this on the capture as `expected_content_digest` to bind the two.
  string content_digest = 5;
  // False when this source, mapped this way, would be REFUSED. The refusal is
  // reported rather than raised: a preview whose job is to show what would
  // happen must be able to show a refusal without becoming one.
  bool capture_allowed = 6;
  EvaluationCaptureRefusalV1 refusal = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
  EvaluationFreshnessV1 freshness = 9;
  // The four quality sections, computed from the SAME materialized payload the
  // fields above render, through the same kernel the capture uses. Present even
  // on a refused preview, where every section carries a typed unavailability
  // rather than being omitted.
  DatasetCaseQualitySignalsV1 quality = 10;
}

// ===========================================================================
// The Tier B authoring surfaces
//
// Three creates behind the three readiness findings the builder already emits.
// Every one of them is a MUTATION_ACK: it returns the entity it created, says
// whether it was a replay, and carries the capability set. None returns a page,
// and none returns secret material.
// ===========================================================================

// Metadata about a registered provider credential.
//
// Reference only, and structurally so: key material is stored in
// `provider_credential_secret_versions`, which no read on this surface joins,
// and this message has no field it could be written into. The one place key
// material appears in this file is `RegisterEvaluationProviderCredentialRequest`.
message EvaluationProviderCredentialV1 {
  string credential_id = 1;
  string credential_key = 2;
  ProviderNameV1 provider = 3;
  bool is_default = 4;
  google.protobuf.Timestamp created_at = 5;
  // The active secret version this registration minted. A number, never the
  // material: it tells an operator that a key IS stored without telling them
  // what it is.
  uint32 secret_version_number = 6;
  // The kill switch. False means execution planning refuses this key: no
  // preview resolves it, no launch freezes it, no cell retry plans against it.
  bool enabled = 7;
  // When it was switched off, and why. Present exactly when `enabled` is
  // false — re-enabling clears both, and the history that survives that is the
  // switch event ledger, not these fields.
  optional google.protobuf.Timestamp disabled_at = 8;
  optional string disabled_reason = 9;
  // #1117. The Cloudflare account this credential calls under, as registered.
  // An identifier, not a secret. Absent for every other provider, and for a
  // Cloudflare credential registered before the account moved onto the
  // credential.
  optional string account_id = 10;
}

enum EvaluationProviderCredentialRejectionKindV1 {
  EVALUATION_PROVIDER_CREDENTIAL_REJECTION_KIND_V1_UNSPECIFIED = 0;
  // The org already holds the maximum number of credentials.
  EVALUATION_PROVIDER_CREDENTIAL_REJECTION_KIND_V1_CAP_EXCEEDED = 1;
  // A credential with this key name already exists in this org.
  EVALUATION_PROVIDER_CREDENTIAL_REJECTION_KIND_V1_DUPLICATE_KEY_NAME = 2;
  // The provider is unspecified or is not a kind this build mints credentials
  // for. Refused before anything is written.
  EVALUATION_PROVIDER_CREDENTIAL_REJECTION_KIND_V1_INVALID_PROVIDER = 3;
  // #1117. `account_id` is wrong for this provider: absent on a Cloudflare
  // credential (`provider_account_id_required`), not 32 letters or digits
  // (`provider_account_id_malformed`), or sent for a provider that has no
  // account (`provider_account_id_not_applicable`). Its own kind so a form can
  // put the error on the account field.
  EVALUATION_PROVIDER_CREDENTIAL_REJECTION_KIND_V1_INVALID_ACCOUNT = 4;
}

message EvaluationProviderCredentialRejectionV1 {
  EvaluationProviderCredentialRejectionKindV1 kind = 1;
  // A machine-groupable code, not a sentence.
  string reason_code = 2;
  // Populated on CAP_EXCEEDED so the caller can render "20 of 20" rather than
  // discovering the bound by bisection.
  uint32 registered_credential_count = 3;
  uint32 max_credential_count = 4;
  // Server-authored and bounded: never longer than the `max_detail_bytes` this
  // surface publishes on `evaluation_provider_credential_registration`.
  string detail = 5;
  // The one action that resolves this refusal, named rather than inferred from
  // `kind`. The same enum the launch, capture, failure and trace-read refusals
  // carry — one vocabulary, so a client renders one button.
  RecoveryActionV1 recovery = 6;
}

message RegisterEvaluationProviderCredentialRequest {
  string credential_key = 1;
  ProviderNameV1 provider = 2;
  // WRITE-ONLY. This field exists on this message and on no response message
  // anywhere in this file. It is encrypted under the org's AAD-bound envelope
  // before it reaches storage, and it is read back by nothing.
  string key_material = 3;
  bool is_default = 4;
  string idempotency_key = 5;
  // #1117. The Cloudflare account the key calls Workers AI under: 32 letters or
  // digits, as the Cloudflare dashboard shows it. Required for a Cloudflare
  // credential and refused for any other provider. Fixed for the credential's
  // life; another account is another credential.
  optional string account_id = 6;
}

message RegisterEvaluationProviderCredentialResponse {
  EvaluationProviderCredentialV1 credential = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// How a scorer produces its verdict.
enum EvaluationScorerKindV1 {
  EVALUATION_SCORER_KIND_V1_UNSPECIFIED = 0;
  // A comparison this build performs itself.
  EVALUATION_SCORER_KIND_V1_DETERMINISTIC = 1;
  // A person. Cells are parked for review rather than scored automatically.
  EVALUATION_SCORER_KIND_V1_HUMAN = 2;
  // A language model grading against an authored rubric.
  EVALUATION_SCORER_KIND_V1_LLM_JUDGE = 3;
  // (#611) Customer code run in the sandbox. Authored as a member draft;
  // preview and publication come later, and a run refuses a draft by name.
  EVALUATION_SCORER_KIND_V1_CODE = 4;
}

// The deterministic comparators this build runs, authored rather than
// invented. EXACT, NUMERIC_THRESHOLD and PATTERN name the retained comparison
// modes. The rest are built-ins, compiled at publication from a config frozen
// with its implementation version into the run's manifest. None is a sandboxed
// code scorer.
enum EvaluationScorerEvaluatorV1 {
  EVALUATION_SCORER_EVALUATOR_V1_UNSPECIFIED = 0;
  // Whole-value equality. Stored comparison mode `exact`.
  EVALUATION_SCORER_EVALUATOR_V1_EXACT = 1;
  // The subject must be numerically at least the expected value. Stored
  // comparison mode `numeric_gte`.
  EVALUATION_SCORER_EVALUATOR_V1_NUMERIC_THRESHOLD = 2;
  // SUBSTRING CONTAINMENT, not a regular expression. Stored comparison mode
  // `contains`. Regular expressions are REGEX, a separate value, so what an
  // existing PATTERN scorer measures never changes under it.
  EVALUATION_SCORER_EVALUATOR_V1_PATTERN = 3;
  // The subject string matches a Rust `regex` pattern, anywhere unless the
  // pattern anchors itself. The syntax has no look-around or backreferences,
  // which is what makes matching linear in the subject; a pattern using them is
  // refused at publication, as is one over the published size limits and one
  // using the Unicode word boundary `\b` (the ASCII `(?-u:\b)` runs). Matching
  // runs on a bounded automaton: a search that outgrows it stops and the cell
  // is the Error verdict `regex_search_gave_up`, never a slow pass or fail.
  EVALUATION_SCORER_EVALUATOR_V1_REGEX = 4;
  // The subject string is JSON text the pinned parser accepts. A repeated
  // object key is valid and is reported as the `json_duplicate_keys`
  // diagnostic. A subject that is not a string was decoded from JSON already.
  EVALUATION_SCORER_EVALUATOR_V1_JSON_VALID = 5;
  // The subject equals the expected value after the frozen normalization;
  // byte-exact when no option is set.
  EVALUATION_SCORER_EVALUATOR_V1_NORMALIZED_STRING = 6;
  // The edit distance between subject and expected value, counted in Unicode
  // scalar values after the frozen normalization, is at most `max_distance`.
  EVALUATION_SCORER_EVALUATOR_V1_LEVENSHTEIN = 7;
  // The subject satisfies a Draft 2020-12 JSON Schema. A string subject is
  // parsed as JSON text first; any other subject is JSON already. Every `$ref`
  // must resolve inside the schema document: nothing is fetched, at publication
  // or at run time. `pattern` runs on REGEX's bounded automaton under REGEX's
  // refusals, and a search that gives up is the Error verdict
  // `regex_search_gave_up`; `patternProperties` is refused at publication.
  EVALUATION_SCORER_EVALUATOR_V1_JSON_SCHEMA = 8;
}

message EvaluationScorerDeterministicSpecV1 {
  EvaluationScorerEvaluatorV1 evaluator = 1;
  // Dotted path into the candidate's recorded output. Absent reads the whole
  // document, which is the legacy deterministic evaluator's own behaviour.
  optional string subject_path = 2;
  // Dotted path into the case. Absent defaults to `expected_output`, the one
  // field a dataset is guaranteed to carry.
  optional string expected_path = 3;
  // Present exactly when `evaluator` takes a config: REGEX, NORMALIZED_STRING,
  // LEVENSHTEIN and JSON_SCHEMA. Any other pairing is refused as a spec mismatch. Not
  // echoed on read: it is frozen into the evaluator template, which the
  // scorer configuration row does not carry.
  oneof config {
    EvaluationScorerRegexConfigV1 regex = 4;
    EvaluationScorerStringNormalizationV1 normalized_string = 5;
    EvaluationScorerLevenshteinConfigV1 levenshtein = 6;
    EvaluationScorerJsonSchemaConfigV1 json_schema = 7;
  }
}

message EvaluationScorerRegexConfigV1 {
  string pattern = 1;
}

// Applied to both operands, in this order: case folding, NFC, trim, whitespace
// collapse. All false is byte-exact.
message EvaluationScorerStringNormalizationV1 {
  // Unicode full case folding (CaseFolding.txt statuses C and F).
  bool case_fold = 1;
  // Unicode Normalization Form C.
  bool nfc = 2;
  // Drops leading and trailing Unicode whitespace.
  bool trim = 3;
  // Replaces each run of Unicode whitespace with one ASCII space.
  bool collapse_whitespace = 4;
}

message EvaluationScorerLevenshteinConfigV1 {
  uint32 max_distance = 1;
  EvaluationScorerStringNormalizationV1 normalization = 2;
}

message EvaluationScorerJsonSchemaConfigV1 {
  // The schema as JSON text. A declared `$schema` must name the Draft 2020-12
  // meta-schema; the published caps bound its bytes, its nesting depth and the
  // subschemas it can run at one instance location, each `$ref` counted at its
  // target. A `$ref` is a `#` JSON pointer into this schema; `$dynamicRef`, a
  // nested `$id` and a reference cycle that never descends are refused.
  // Numbers, in the schema and the subject, compare as IEEE 754 doubles.
  string schema_json = 1;
}

// The review policy a human-kind scorer is authored with.
//
// Recorded and read back. Enforcement of claim size, reservation minutes and
// adjudication minimum is run-scoped in this build; a per-scorer override is not
// enforced yet, and the posture says so.
message EvaluationScorerReviewPolicySpecV1 {
  uint32 reviewers_per_cell = 1;
  bool blind = 2;
  uint32 claim_size = 3;
  uint32 reservation_minutes = 4;
  uint32 adjudication_minimum = 5;
}

message EvaluationScorerConfigV1 {
  string score_config_id = 1;
  string config_key = 2;
  string name = 3;
  optional string description = 4;
  string metric_name = 5;
  // Authored on a config created through this verb; derived from the metric
  // name for every config that predates it.
  string success_dimension = 6;
  // Starts at `v0` and moves to `v{n+1}` on each revision. Frozen into a run's
  // manifest as `EvaluationScorerVersionSnapshotV1.version_discriminator`.
  string version_discriminator = 7;
  EvaluationScorerKindV1 kind = 8;
  optional double weight = 9;
  bool is_blocking_gate = 10;
  // Present exactly when `kind` is DETERMINISTIC.
  optional EvaluationScorerDeterministicSpecV1 deterministic = 11;
  // Present exactly when `kind` is HUMAN.
  optional EvaluationScorerReviewPolicySpecV1 review_policy = 12;
  google.protobuf.Timestamp created_at = 13;
  // Present exactly when `kind` is LLM_JUDGE.
  //
  // Read back on the SOURCE arm the caller sent, with one deliberate
  // narrowing: a judge authored from a template reference reads back as
  // `rubric_content`, carrying the content that was copied. The reference was
  // how the content was chosen; the content is what the run will execute, and
  // echoing the reference would tell a client its scorer still points at a row
  // it no longer depends on.
  optional EvaluationScorerJudgeSpecV1 judge = 14;
  // (#611) Present exactly when `kind` is CODE.
  optional EvaluationScorerCodeConfigV1 code = 15;
}

enum EvaluationScorerConfigRejectionKindV1 {
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_UNSPECIFIED = 0;
  // The config key is taken by a scorer this org cannot revise through this
  // verb (one authored outside it). #1110: or by a judge's question, or, on
  // CreateEvaluationJudge, a question's key is held by a scorer that is not
  // that judge's.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_DUPLICATE_CONFIG_KEY = 1;
  // A run's frozen manifest pins this configuration. Revising it would change
  // what a launched run is measuring, so it is refused and the runs are named.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_PINNED_BY_RUN = 2;
  // `kind` and the spec block disagree: a deterministic scorer with a review
  // policy, a human scorer with an evaluator, or a kind with neither.
  //
  // #1110: also an LLM_JUDGE sent to CreateEvaluationScorerConfig, and a
  // judge's question sent to ArchiveEvaluationScorerConfig. A judge is
  // authored and archived through its own verbs.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_KIND_SPEC_MISMATCH = 3;
  // The evaluator is unspecified, or names a comparison this build does not
  // retain.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_EVALUATOR_NOT_RETAINED = 4;
  // The review policy cannot be satisfied as written: a field that must be at
  // least one is zero, or the adjudication minimum is above the number of
  // reviewers who could disagree. Which one is in `reason_code`, and the two
  // numbers are in the `review_policy_*` fields.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_REVIEW_POLICY_UNSATISFIABLE = 5;
  // The judge specification cannot be executed as written: an empty rubric, a
  // rubric over the published byte bound, more verdict mappings than the bound,
  // a mapped score outside the unit interval, two mappings that normalize to
  // the same label, or a model reference this build cannot address.
  // `reason_code` says which.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_JUDGE_SPEC_INVALID = 6;
  // The judge names a provider whose capability cell is not AVAILABLE in this
  // build. Refused rather than accepted, because the LAUNCH freeze resolves
  // only the AVAILABLE providers into a priced reference: a judge on any other
  // provider would be called and billed under a manifest that recorded no
  // provider and quoted no rate. `reason_code` is the provider cell's own
  // reason and `judge_provider` names the provider.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_JUDGE_PROVIDER_NOT_AVAILABLE = 7;
  // The judge was authored from an existing evaluator template under a version
  // pin, and the template has changed since the client read it. Refused rather
  // than copied, so "copy from the template as you last saw it" is a keepable
  // promise.
  //
  // #1110: no longer returned. A judge carries its own rubric through
  // CreateEvaluationJudge, and CreateEvaluationScorerConfig refuses a judge
  // before it reads any template.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_JUDGE_TEMPLATE_MOVED = 8;
  // The evaluator's config block cannot run as written: absent for a built-in
  // that needs one, present on an evaluator that takes none, belonging to
  // another evaluator, or a regex or JSON Schema this build refuses to compile.
  // `reason_code` says which.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_EVALUATOR_CONFIG_INVALID = 9;
  // (#611) Code scorers are not available to this organization right now.
  // `reason_code` is `sandbox_unavailable`.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_SANDBOX_UNAVAILABLE = 10;
  // (#611) The code specification cannot run as written: a source bundle over a
  // limit or with a path that is not a relative `.py` path, a language, runtime
  // profile or limit profile this build does not have, or a determinism class a
  // code scorer cannot declare. `reason_code` says which.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_CODE_SPEC_INVALID = 11;
  // (#611) The code scorer is published, or being published, and a published
  // version never changes: author a new config key. `reason_code` is
  // `scorer_config_published` or `scorer_config_publishing`.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_CODE_VERSION_IMMUTABLE = 12;
  // (#611) A preview input or a smoke input the sandbox would refuse, or a
  // publish without 1 to 3 smoke inputs. `reason_code` says which.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_CODE_INPUT_INVALID = 13;
  // #1110. CreateEvaluationJudge's `expected_version_discriminator` is not the
  // judge's current version, or names a judge that does not exist. Re-read it
  // with GetEvaluationJudge and author against what it says now.
  EVALUATION_SCORER_CONFIG_REJECTION_KIND_V1_JUDGE_VERSION_MOVED = 14;
}

message EvaluationScorerConfigRejectionV1 {
  EvaluationScorerConfigRejectionKindV1 kind = 1;
  string reason_code = 2;
  // The true count, always. `pinned_run_ids` is bounded and may be shorter.
  uint32 pinned_run_count = 3;
  repeated string pinned_run_ids = 4;
  // Server-authored and bounded: never longer than the `max_detail_bytes` this
  // surface publishes on `evaluation_scorer_config_authoring`.
  string detail = 5;
  // The one action that resolves this refusal. Same enum as every other refusal
  // envelope on this surface.
  RecoveryActionV1 recovery = 6;
  // Present exactly on REVIEW_POLICY_UNSATISFIABLE. The field whose value makes
  // the policy unsatisfiable — `reviewers_per_cell`, `claim_size`,
  // `reservation_minutes` or `adjudication_minimum` — and the two numbers the
  // check compared, so the sentence can be rebuilt without parsing it.
  //
  // `review_policy_bound` is the value `review_policy_observed_value` violated:
  // the minimum it fell below, or the maximum it exceeded. Which of the two it
  // is follows from `reason_code`.
  optional string review_policy_field = 7;
  optional uint32 review_policy_observed_value = 8;
  optional uint32 review_policy_bound = 9;
  // Present exactly on JUDGE_PROVIDER_NOT_AVAILABLE. The provider the spec
  // named, so a client can render the refusal against the same provider cell
  // the capability set already published a posture for.
  optional ProviderNameV1 judge_provider = 10;
  // #1110. The question a CreateEvaluationJudge refusal is about, as sent:
  // present exactly when one question failed, or its config key was taken,
  // and on ArchiveEvaluationScorerConfig's `scorer_config_belongs_to_judge`.
  optional string question_key = 11;
}

// ---- judge authoring ----
//
// An `llm_judge` scorer authored here is frozen at launch, regraded, priced and
// joins suites exactly as any other judge does.

// One label and what it is worth.
//
// The two keys the shared verdict kernel already reads, and no others. A
// mapping wins outright over the judge's own number, which is why an unknown
// label is an error rather than a fallback.
message EvaluationScorerJudgeVerdictMappingV1 {
  string verdict = 1;
  // Finite, and in the closed unit interval. A score outside it is refused at
  // authoring rather than at execution planning, so the client learns it while
  // the form is still open.
  double mapped_score = 2;
}

// A judge's content, authored HERE.
//
// This is the PRIMARY arm. A v2 client that had to create an evaluator
// template on the legacy plane before it could create a scorer would not have
// been unblocked -- it would have been given a two-plane workflow.
message EvaluationScorerJudgeRubricV1 {
  // What the judge is asked to grade, shown with every case. Bounded by
  // `max_rubric_bytes` on `evaluation_scorer_config_authoring`: a rubric
  // travels on EVERY cell, so an unbounded one is unbounded spend on a large
  // run, and a long one crosses the context tiers the frozen rate's modifier
  // list re-decides at attempt time.
  string rubric = 1;
  // The system instructions. Absent leaves the executor's own default in
  // place; an empty string is refused rather than sent, because instructions
  // that say nothing still cost a token budget.
  optional string instructions = 2;
  // Absent scores from the judge's own number, which is the common case.
  repeated EvaluationScorerJudgeVerdictMappingV1 verdict_mappings = 3;
  // Dotted path into the candidate's recorded output, the same meaning and the
  // same spelling as `EvaluationScorerDeterministicSpecV1.subject_path`.
  // Absent shows the judge the whole document.
  optional string subject_path = 4;
}

// A judge's content, COPIED from an evaluator template that already exists.
//
// A copy at author time, never a live reference. A live reference would give
// the v2 configuration a shape that moves when a row on another plane is
// edited, which is the defect the launch freeze exists to close, reintroduced
// one layer up: the freeze would still catch it AT LAUNCH, but between
// authoring and launch the client would be shown a scorer whose definition is
// not the one it authored.
message EvaluationScorerJudgeTemplateRefV1 {
  string evaluator_template_id = 1;
  // The optional pin, in the same micros-since-epoch spelling
  // `EvaluationFrozenEvaluatorRefV1.template_version_discriminator` uses.
  //
  // Absent copies the template as it reads now. Present refuses with
  // JUDGE_TEMPLATE_MOVED if it has changed since the client read it, which is
  // what makes "copy from the template as you last saw it" keepable.
  optional string template_version_discriminator = 2;
}

// #1004. How a judge reaches its verdict: a mode of the one judge kind, stored
// and frozen with the rest of its provider execution.
enum JudgeModeV1 {
  // #1106. Refused JUDGE_SPEC_INVALID `judge_mode_unspecified`: every judge
  // states its mode. A judge authored or frozen before #1106 names none, and
  // still runs as a TEXT judge.
  JUDGE_MODE_V1_UNSPECIFIED = 0;
  // A system-one model answers one typed question built from the rubric: a
  // choice over the verdict mapping labels, or a yes/no when there are none.
  // A single mapping is refused JUDGE_SPEC_INVALID, since a choice of one can
  // only answer one way. TypeSafe's Jev, Cloudflare's Clef and OpenAI's
  // gpt-6-luna answer one.
  JUDGE_MODE_V1_SYSTEM_ONE = 1;
  // #1005. A text judge, then a system-one model that reads its answer and
  // asks the question SYSTEM_ONE would, under the same single-mapping rule.
  // The text judge's answer need not parse: the second answer is the verdict.
  JUDGE_MODE_V1_TEXT_THEN_SYSTEM_ONE = 2;
  // #1106. The text judge: the model answers in the verdict JSON contract.
  JUDGE_MODE_V1_TEXT = 3;
}

// #1108. What a judge's question asks for.
enum JudgeAnswerKindV1 {
  JUDGE_ANSWER_KIND_V1_UNSPECIFIED = 0;
  // The probability that the question holds.
  JUDGE_ANSWER_KIND_V1_YES_NO = 1;
  // One of the question's labels.
  JUDGE_ANSWER_KIND_V1_CHOICE = 2;
  // One of the question's levels, lowest first.
  JUDGE_ANSWER_KIND_V1_SCALE = 3;
}

// #1108. What a judge answered on one cell, kept as numbers. The labels are
// the frozen scorer config's: no model text is stored or served.
message EvaluationJudgeAnswerV1 {
  JudgeAnswerKindV1 kind = 1;
  // The chosen label or level, 0-based into `option_labels`. Absent for
  // YES_NO, and for a SCALE whose vendor sent no probabilities, whose most
  // probable level is then unknown.
  optional uint32 label_index = 2;
  // `option_labels[label_index]`. Absent with `label_index`, and for a run
  // frozen without its scorer's config.
  optional string label = 3;
  // One per entry of `option_labels`, in its order, or [p(yes)] for YES_NO.
  repeated float probabilities = 4;
  // AVAILABLE when `probabilities` holds the vendor's. NOT_OBSERVED
  // `vendor_sent_no_probabilities` for a Jev or Clef answer that carried
  // none, and NOT_SUPPORTED `text_judge_states_no_probabilities` for a text
  // judge's label.
  MetricAvailabilityV1 probabilities_availability = 5;
  // The probability the judge gave the answer it returned: max(p, 1 - p) for
  // YES_NO, else `probabilities[label_index]`, else the vendor's own
  // confidence. Absent for a text judge's label.
  optional float confidence = 6;
  // The labels of a CHOICE or the levels of a SCALE, in the order the
  // question offered them, from the frozen scorer config. Empty for YES_NO.
  repeated string option_labels = 7;
}

// #1005. The system-one model a TEXT_THEN_SYSTEM_ONE judge hands its text
// judge's answer to, named as the judge's own model is.
message SystemOneStepV1 {
  // A model a system-one wire serves, or the spec is refused
  // JUDGE_SPEC_INVALID, exactly as for a SYSTEM_ONE judge.
  ProviderModelRefV1 model = 1;
  // Credential BY REFERENCE, as `credential_ref` on the judge.
  string credential_ref = 2;
  // As `provider_endpoint_ref` on the judge.
  optional string provider_endpoint_ref = 3;
}

// Which model grades, under what settings.
//
// Typed throughout, and deliberately NOT `ProviderExecutionConfigV1`: that
// message carries a `google.protobuf.Struct` for its request params and a
// `provider_key_ref` that names key material's location. Neither belongs on an
// authoring request.
message EvaluationScorerJudgeProviderExecutionV1 {
  // The typed model reference. An unknown model is unrepresentable by
  // construction; a representable model on a provider whose cell is not
  // AVAILABLE is refused JUDGE_PROVIDER_NOT_AVAILABLE.
  ProviderModelRefV1 model = 1;
  // Credential BY REFERENCE. Key material never appears on this surface,
  // exactly as on `EvaluationCandidateV1.credential_ref`.
  string credential_ref = 2;
  // Only the knobs that change what the provider is asked to do travel to the
  // provider; the cost-rate fields on this message are ignored, because
  // pricing is this build's arithmetic and not the provider's.
  optional ProviderRequestSettingsV1 request_settings = 3;
  // Base URL of a gateway this judge is proxied through. Absent means the
  // provider's own public base. Same name and same semantics as
  // `ProviderPromptCandidateV1.provider_endpoint_ref`, because it is the same
  // knob. #1118: for Cloudflare, absent means the credential's account's
  // `…/ai/run`, and the judge is refused JUDGE_SPEC_INVALID
  // `provider_credential_account_absent` when the credential has no account;
  // one that is given must be an account's `…/ai/run`.
  optional string provider_endpoint_ref = 4;
  // Whether the judge is asked to reason before answering. UNSPECIFIED and
  // NONE both leave reasoning off, which is the executor's own default: a
  // reasoning budget the manifest did not freeze is spend the customer did not
  // authorise.
  ProviderReasoningEffortV1 reasoning_effort = 5;
  // #1004. #1106: REQUIRED, and UNSPECIFIED is refused; TEXT is the text
  // judge, which every judge authored before this field is. SYSTEM_ONE needs a
  // model with a system-one wire, or the spec is refused JUDGE_SPEC_INVALID; it
  // is also what admits a decision-only provider, whose cell is DEGRADED for
  // every text call. A system-one judge sends no reasoning effort or output
  // budget.
  JudgeModeV1 judge_mode = 6;
  // #1005. Required for TEXT_THEN_SYSTEM_ONE and refused for every other
  // mode, each JUDGE_SPEC_INVALID. The fields above stay the text judge, so a
  // judge authored without this field keeps its meaning.
  SystemOneStepV1 system_one = 7;
}

// Everything a judge scorer is authored with.
//
// Immutable once a run pins it, under the same guard every other scorer
// configuration obeys: a revision of an unpinned configuration mints a fresh
// evaluator template and moves `version_discriminator` to `v{n+1}`; a
// revision of a pinned one is refused PINNED_BY_RUN with the runs named.
message EvaluationScorerJudgeSpecV1 {
  oneof source {
    EvaluationScorerJudgeRubricV1 rubric_content = 1;
    EvaluationScorerJudgeTemplateRefV1 template_ref = 2;
  }
  // REQUIRED on the request. ABSENT on the acknowledgement, deliberately: the
  // typed model reference is not reconstructed from the resolved provider slug
  // and model id, because a round trip through two string tables could land on
  // a different catalog entry than the one the caller sent. An empty message
  // here would say "there is a provider execution and it names nothing", which
  // is false — there is one, and the acknowledgement does not carry it.
  EvaluationScorerJudgeProviderExecutionV1 provider_execution = 3;
  // The threshold a resolved score is compared against to produce pass or
  // fail. Absent keeps this build's default of 1.0. Finite and in the closed
  // unit interval, because a threshold outside the range a score can take is a
  // scorer that can only ever answer one way.
  optional double pass_threshold = 4;
}

// ---- end of judge authoring ----

message CreateEvaluationScorerConfigRequest {
  string config_key = 1;
  string name = 2;
  optional string description = 3;
  string metric_name = 4;
  string success_dimension = 5;
  EvaluationScorerKindV1 kind = 6;
  optional double weight = 7;
  bool is_blocking_gate = 8;
  optional EvaluationScorerDeterministicSpecV1 deterministic = 9;
  optional EvaluationScorerReviewPolicySpecV1 review_policy = 10;
  string idempotency_key = 11;
  // Present exactly when `kind` is LLM_JUDGE.
  //
  // #1110: an LLM_JUDGE is refused KIND_SPEC_MISMATCH
  // `judge_authored_through_create_evaluation_judge`; author it through
  // CreateEvaluationJudge. Kept, deprecated, so the wire does not break.
  optional EvaluationScorerJudgeSpecV1 judge = 12 [deprecated = true];
  // (#611) Present exactly when `kind` is CODE.
  optional EvaluationScorerCodeSpecV1 code = 13;
}

message CreateEvaluationScorerConfigResponse {
  EvaluationScorerConfigV1 scorer_config = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ---- a judge and its typed questions (#1110) ----
//
// A judge asks 1 to 16 typed questions in one call, and each question is its
// own score configuration: its own metric, threshold, weight, gate and unsure
// line. Everything downstream already keys on `score_config_id`, so a question
// is a scorer to the matrix, the gates, the exports, the regrade and the
// freeze. A question's config key is `{judge_key}.{question_key}`.

// One label a CHOICE question offers, and what choosing it scores.
message EvaluationJudgeLabelV1 {
  // 1 to `max_judge_label_bytes`, unique within its question.
  string label = 1;
  // What the label means, shown to a system-one model beside it; a text
  // judge is shown each label with its score. At most
  // `max_judge_question_instructions_bytes`.
  optional string description = 2;
  // Finite, in the closed unit interval.
  double score = 3;
}

// One question, as authored.
message EvaluationJudgeQuestionSpecV1 {
  // `[a-z0-9_]{1,40}`, unique within the judge: the name the question is asked
  // under on the wire.
  string question_key = 1;
  string name = 2;
  string metric_name = 3;
  string success_dimension = 4;
  JudgeAnswerKindV1 answer_kind = 5;
  // What the question asks, 1 to `max_judge_question_instructions_bytes`.
  string instructions = 6;
  // CHOICE only, `min_choice_labels` to `max_verdict_mappings`.
  repeated EvaluationJudgeLabelV1 labels = 7;
  // SCALE only, lowest first, `min_scale_levels` to `max_scale_levels`, each
  // 1 to `max_judge_label_bytes`. A scale scores its expected level over its
  // top level.
  repeated string scale_levels = 8;
  // Absent keeps this build's default of 1.0.
  optional double pass_threshold = 9;
  optional double weight = 10;
  bool is_blocking_gate = 11;
  // An answer whose confidence is below this line is held for a person. A
  // SYSTEM_ONE or TEXT_THEN_SYSTEM_ONE judge only: a text judge states no
  // confidence. Stored and validated now; no answer is held on it yet.
  optional float review_below_confidence = 12;
}

// Everything a judge is authored with: the one call every question shares,
// and the questions.
message EvaluationJudgeSpecV1 {
  // As on `EvaluationScorerJudgeProviderExecutionV1`, and refused the same
  // way: UNSPECIFIED, a model no system-one wire serves for SYSTEM_ONE, and a
  // step on any mode but TEXT_THEN_SYSTEM_ONE.
  JudgeModeV1 judge_mode = 1;
  ProviderModelRefV1 model = 2;
  string credential_ref = 3;
  optional string provider_endpoint_ref = 4;
  // The text call's only: a system-one call sends neither.
  optional ProviderRequestSettingsV1 request_settings = 5;
  ProviderReasoningEffortV1 reasoning_effort = 6;
  // TEXT_THEN_SYSTEM_ONE only.
  SystemOneStepV1 system_one = 7;
  // What the judge grades, at most `max_rubric_bytes`.
  string rubric = 8;
  // The text judge's system instructions. Refused on a SYSTEM_ONE judge,
  // whose call sends none.
  optional string instructions = 9;
  optional string subject_path = 10;
  // 1 to `max_judge_questions`, in the order they are asked. A TEXT judge asks
  // exactly one, YES_NO or CHOICE.
  repeated EvaluationJudgeQuestionSpecV1 questions = 11;
}

// One question of a judge, with the score configuration that keeps its
// answers.
message EvaluationJudgeMemberV1 {
  EvaluationJudgeQuestionSpecV1 question = 1;
  string score_config_id = 2;
  // `{judge_key}.{question_key}`.
  string config_key = 3;
  // 0-based, in the order the judge asks its questions.
  uint32 ordinal = 4;
  // The configuration's own `v{n}`, as `EvaluationScorerConfigV1` carries it.
  string version_discriminator = 5;
}

// One judge, read back whole from its current version.
message EvaluationJudgeV1 {
  string judge_id = 1;
  string judge_key = 2;
  string name = 3;
  optional string description = 4;
  // `v0` on first authorship and `v{n+1}` on each revision: what
  // `expected_version_discriminator` is compared with.
  string version_discriminator = 5;
  JudgeModeV1 judge_mode = 6;
  // The call every question shares, as it will execute, read from the
  // members' template as `EvaluationScorerJudgeDetailV1` reads it: the
  // provider, model id, credential, endpoint, whether it reasons, its
  // effective request settings and a chain's step. Not the typed request,
  // whose reasoning level and settings are stored as less than were sent.
  EvaluationScorerJudgeResolvedExecutionV1 execution = 7;
  string rubric = 8;
  optional string instructions = 9;
  optional string subject_path = 10;
  // The questions the current version asks, in ordinal order. A question
  // dropped by a revision is archived and no longer listed.
  repeated EvaluationJudgeMemberV1 members = 11;
  // An archived judge's members are archived with it. Authoring it again
  // revives it.
  bool is_archived = 12;
  optional google.protobuf.Timestamp archived_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  // A user, as on `EvaluationScorerConfigSummaryV1.created_by`.
  optional PrincipalRefV1 created_by = 16;
}

// Which question of which judge a score configuration is, as a library row,
// its detail and a frozen ref carry it.
message EvaluationJudgeQuestionRefV1 {
  string judge_id = 1;
  string question_key = 2;
  uint32 ordinal = 3;
  JudgeAnswerKindV1 answer_kind = 4;
}

// What one question asks, as the template of one version holds it.
message EvaluationJudgeQuestionV1 {
  string question_key = 1;
  uint32 ordinal = 2;
  JudgeAnswerKindV1 answer_kind = 3;
  string instructions = 4;
  repeated EvaluationJudgeLabelV1 labels = 5;
  repeated string scale_levels = 6;
  optional float review_below_confidence = 7;
}

message CreateEvaluationJudgeRequest {
  // 1 to `max_judge_key_bytes`. Authoring an existing key revises that judge:
  // every question is re-minted at the next version, a dropped one is
  // archived, and a run that pinned any of them refuses the whole judge.
  string judge_key = 1;
  string name = 2;
  optional string description = 3;
  EvaluationJudgeSpecV1 spec = 4;
  string idempotency_key = 5;
  // The `version_discriminator` the caller last read. Present and not the
  // judge's current version, or naming a judge that does not exist, is
  // refused JUDGE_VERSION_MOVED. Absent authors over whatever is there.
  optional string expected_version_discriminator = 6;
}

message CreateEvaluationJudgeResponse {
  EvaluationJudgeV1 judge = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message GetEvaluationJudgeRequest {
  oneof identity {
    string judge_id = 1;
    string judge_key = 2;
  }
}

message GetEvaluationJudgeResponse {
  EvaluationJudgeV1 judge = 1;
  EvaluationFreshnessV1 freshness = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message ArchiveEvaluationJudgeRequest {
  oneof identity {
    string judge_id = 1;
    string judge_key = 2;
  }
}

message ArchiveEvaluationJudgeResponse {
  EvaluationJudgeV1 judge = 1;
  // TRUE when it was already archived. Not an error, as on
  // `ArchiveEvaluationScorerConfigResponse`.
  bool already_archived = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ---- end of a judge and its typed questions ----

// #618. A deterministic spec run once on a sample, nothing stored. The spec
// compiles as publication compiles it, so a spec publication would refuse is
// refused here with the same EVALUATOR_CONFIG_INVALID `reason_code`, and the
// sample is scored as the scorer worker scores a cell.
message PreviewEvaluationScorerRequest {
  EvaluationScorerDeterministicSpecV1 spec = 1;
  // JSON text: the candidate output `subject_path` reads.
  string sample_output_json = 2;
  // JSON text: the case document `expected_path` reads, so the expected value
  // sits under `expected_output` unless the spec names another path.
  optional string sample_case_json = 3;
}

message PreviewEvaluationScorerResponse {
  EvaluationScorerPreviewResultV1 result = 1;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

enum EvaluationScorerPreviewVerdictV1 {
  EVALUATION_SCORER_PREVIEW_VERDICT_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_PREVIEW_VERDICT_V1_PASS = 1;
  EVALUATION_SCORER_PREVIEW_VERDICT_V1_FAIL = 2;
  // The scorer could not produce a verdict; `reason_code` says why.
  EVALUATION_SCORER_PREVIEW_VERDICT_V1_ERROR = 3;
}

// What the scorer worker would record for this sample, and what decided it.
// The diagnostic is computed after the verdict and never changes it. Every
// offset counts UTF-16 code units into `subject_text`.
message EvaluationScorerPreviewResultV1 {
  EvaluationScorerPreviewVerdictV1 verdict = 1;
  // Absent on ERROR.
  optional double score = 2;
  // The code the worker records: on ERROR why there is no verdict, otherwise
  // its note on the input (`json_invalid`, `json_duplicate_keys`) or empty.
  string reason_code = 3;
  // The value at `subject_path`: a string as itself, any other value as JSON
  // text. Empty when the path resolves nothing.
  string subject_text = 4;
  // Absent when the evaluator did not get far enough to have one.
  oneof diagnostic {
    // REGEX: the first match.
    EvaluationScorerPreviewSpanV1 regex_match = 5;
    // PATTERN: where the expected substring is first found.
    EvaluationScorerPreviewSpanV1 contains_found = 6;
    EvaluationScorerPreviewExactV1 exact = 7;
    EvaluationScorerPreviewNumericV1 numeric = 8;
    EvaluationScorerPreviewJsonValidV1 json_valid = 9;
    EvaluationScorerPreviewJsonSchemaV1 json_schema = 10;
    EvaluationScorerPreviewNormalizedV1 normalized_string = 11;
    EvaluationScorerPreviewLevenshteinV1 levenshtein = 12;
  }
}

// A half-open range of UTF-16 code units into `subject_text`.
message EvaluationScorerPreviewSpanV1 {
  uint32 start = 1;
  uint32 end = 2;
}

message EvaluationScorerPreviewExactV1 {
  // RFC 6901 pointer to the first place subject and expected differ, `""` for
  // the whole value. Absent when they are equal.
  optional string first_difference_pointer = 1;
}

message EvaluationScorerPreviewNumericV1 {
  // Each absent when that operand is not a number.
  optional double subject = 1;
  optional double expected = 2;
}

message EvaluationScorerPreviewJsonValidV1 {
  // Where the parser stopped, present when the subject is not valid JSON.
  // Line and column are one-based; column and offset count UTF-16 code units.
  optional uint32 error_line = 1;
  optional uint32 error_column = 2;
  optional uint32 error_offset = 3;
  // Valid JSON that names one object key twice.
  bool duplicate_keys = 4;
}

message EvaluationScorerPreviewSchemaErrorV1 {
  // JSON pointer into the subject's JSON value, not an offset into `subject_text`.
  string instance_path = 1;
  string keyword = 2;
}

message EvaluationScorerPreviewJsonSchemaV1 {
  // The first `max_schema_errors` failures, as `evaluation_scorer_preview`
  // publishes it.
  repeated EvaluationScorerPreviewSchemaErrorV1 errors = 1;
  // The true count, always.
  uint32 error_count = 2;
}

message EvaluationScorerPreviewNormalizedV1 {
  string folded_subject = 1;
  string folded_expected = 2;
}

message EvaluationScorerPreviewLevenshteinV1 {
  // Absent when the operands are over `max_levenshtein_cells`.
  optional uint64 distance = 1;
  uint64 max_distance = 2;
}

// #709. A deterministic spec scored over a finished run's retained candidate
// outputs, one keyset page at a time, through the same compile and scoring as
// `PreviewEvaluationScorer`. Stores nothing.
//
// Only a recorded-output candidate keeps its output, in the case revision its
// `dataset_field` names. Nothing else is retained: live provider and endpoint
// responses are never stored, and an externally executed candidate's submission
// is a queue row that `discard_external_submissions` deletes once its cell is
// scored. Every other candidate's cells are counted as not scored, never
// re-run; do not add a read of the submission queue here.
//
// A recorded output is the same text on every trial and in every cohort, so a
// page scores each distinct (case revision, recorded candidate) once and
// counts outputs, not trials. A run that is still preparing or running is
// refused `run_not_finished`; one awaiting review is not, since its recorded
// outputs are complete.
message CheckEvaluationScorerAgainstRunRequest {
  string evaluation_run_id = 1;
  EvaluationScorerDeterministicSpecV1 spec = 2;
  // Absent starts at the run's first output. Only a token this verb issued.
  optional string page_token = 3;
}

// An output the spec failed or could not score. It is the same output on every
// trial and in every cohort, so it names neither.
message EvaluationScorerRunCheckFailureV1 {
  reserved 1, 4;
  reserved "cohort_key", "trial";
  string candidate_key = 2;
  string case_revision_id = 3;
  // FAIL or ERROR.
  EvaluationScorerPreviewVerdictV1 verdict = 5;
  string reason_code = 6;
}

// Cells this page could not score, for one reason:
// `candidate_output_not_retained` (the candidate keeps no output),
// `candidate_output_absent` (the cell did not succeed, or its recorded output
// is missing) or `recorded_case_missing`.
message EvaluationScorerRunCheckNotScoredV1 {
  string reason_code = 1;
  // Cells, not outputs.
  uint32 cell_count = 2;
}

message CheckEvaluationScorerAgainstRunResponse {
  // This page's distinct outputs by verdict. A client sums them across pages.
  uint32 pass_count = 1;
  uint32 fail_count = 2;
  uint32 error_count = 3;
  repeated EvaluationScorerRunCheckNotScoredV1 not_scored = 4;
  // This page's first `max_first_failures`, in (candidate, case) order.
  repeated EvaluationScorerRunCheckFailureV1 first_failures = 5;
  // The cells this page covered, scored or not.
  uint32 cells_checked = 6;
  // Every cell in the run, so a client can show progress across pages.
  uint32 total_cell_count = 7;
  // Absent on the last page.
  optional string next_page_token = 8;
  AgenticEvaluationCapabilitiesV1 capabilities = 9;
  // The distinct (case revision, recorded candidate) outputs this page scored:
  // pass + fail + error.
  uint32 scored_output_count = 10;
}

// ---- code scorer authoring (#611) ----

enum EvaluationScorerCodeLanguageV1 {
  EVALUATION_SCORER_CODE_LANGUAGE_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_CODE_LANGUAGE_V1_PYTHON = 1;
  // (#611) Where the deployment serves the `typescript-base` runtime (#764),
  // `scorer_runtimes` lists it and it is authored and run; elsewhere authoring
  // refuses it with `code_language_unsupported`.
  EVALUATION_SCORER_CODE_LANGUAGE_V1_TYPESCRIPT = 2;
}

// One file of a source bundle. There is no file-type field, so a bundle cannot
// carry a symlink.
message EvaluationScorerSourceFileV1 {
  // A relative path of identifiers ending in `.py` or `.ts`, as the language
  // says (the entry file is `score.py` or `score.ts`), at most 256 bytes.
  string path = 1;
  // UTF-8 text without NUL.
  bytes content = 2;
}

message EvaluationScorerRuntimeProfileRefV1 {
  // 1 to 64 bytes.
  string id = 1;
  uint32 version = 2;
}

// The sandbox's launch limit table, by its numbers.
enum EvaluationScorerLimitProfileV1 {
  EVALUATION_SCORER_LIMIT_PROFILE_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_LIMIT_PROFILE_V1_SMALL = 1;
  EVALUATION_SCORER_LIMIT_PROFILE_V1_STANDARD = 2;
  EVALUATION_SCORER_LIMIT_PROFILE_V1_LARGE = 3;
}

message EvaluationScorerLimitProfileRefV1 {
  EvaluationScorerLimitProfileV1 id = 1;
  uint32 version = 2;
}

// What a code scorer is authored with. The source is write-only through the
// authoring RPC; readable by members through GetEvaluationScorerSourceSnapshot.
// It is sealed under the organization's data key and stored outside the
// database, and every other read shows its digest instead.
message EvaluationScorerCodeSpecV1 {
  EvaluationScorerCodeLanguageV1 language = 1;
  // At most 32 files and 256 KiB of content, paths strictly ascending, so one
  // bundle has one encoding and one digest.
  repeated EvaluationScorerSourceFileV1 files = 2;
  // The bundle path of the module that defines `score(input, context)`.
  string entrypoint_path = 3;
  EvaluationScorerRuntimeProfileRefV1 runtime_profile = 4;
  EvaluationScorerLimitProfileRefV1 limit_profile = 5;
  // SEEDED_BEST_EFFORT or NONDETERMINISTIC. DETERMINISTIC belongs to the
  // built-in comparators and is refused here.
  EvaluationDeterminismClassV1 determinism_class = 6;
  // (#611) The case fields the scorer reads, distinct; empty reads the case
  // input, the candidate output and the reference output. The correction and
  // the original context enter the sandbox only when named here.
  repeated EvaluationScorerInputFieldV1 input_fields = 7;
}

// A code scorer as every read shows it: what will run, and never the source.
message EvaluationScorerCodeConfigV1 {
  EvaluationScorerCodeLanguageV1 language = 1;
  // SHA-256 of the encoded bundle, 32 bytes.
  bytes bundle_sha256 = 2;
  uint64 bundle_size_bytes = 3;
  string entrypoint_path = 4;
  EvaluationScorerRuntimeProfileRefV1 runtime_profile = 5;
  EvaluationScorerLimitProfileRefV1 limit_profile = 6;
  // (#611) NONDETERMINISTIC once a SEEDED_BEST_EFFORT version's repeatability
  // trials disagreed.
  EvaluationDeterminismClassV1 determinism_class = 7;
  // #611.
  repeated EvaluationScorerInputFieldV1 input_fields = 8;
  EvaluationScorerCodePublicationStateV1 publication_state = 9;
  // Why the last publication was rejected, or published NONDETERMINISTIC.
  optional string publication_reason_code = 10;
  // SHA-256 of the sandbox artifact manifest the conformance run ran on; empty
  // until published.
  bytes artifact_manifest_sha256 = 11;
  // (#611) True when the sandbox now boots other artifacts than this version
  // was published on, the check a launch refuses with
  // `code_scorer_artifacts_changed`. Present only on a PUBLISHED version while
  // the sandbox serves the organization; absent otherwise, which is unknown.
  // The fix is a new scorer key: a published version never changes.
  optional bool runtime_changed = 12;
  // #611, on GetEvaluationScorerConfig's read. The 1-based index into
  // the publication's `smoke_inputs` whose conformance run failed. Present
  // exactly when the version is REJECTED by the scorer's own failure; absent
  // for `sandbox_unavailable`.
  optional uint32 publication_failed_smoke_input = 13;
  // That conformance run's result: its stage, code, limit and log counts, the
  // streams for members and admins only.
  optional EvaluationCodeScorerResultV1 publication_failure = 14;
}

// (#611) A code scorer as the library and the builder list it: the same values
// as `EvaluationScorerCodeConfigV1`, read from the same row.
message EvaluationScorerCodeSummaryV1 {
  EvaluationScorerCodePublicationStateV1 publication_state = 1;
  // Why the last publication was rejected, or published NONDETERMINISTIC.
  optional string publication_reason_code = 2;
  EvaluationDeterminismClassV1 determinism_class = 3;
  // As `EvaluationScorerCodeConfigV1.runtime_changed`.
  optional bool runtime_changed = 4;
}

// ---- end of code scorer authoring ----

// ---- code scorer preview, publication and results (#611) ----

// The input fields a code scorer may be given.
enum EvaluationScorerInputFieldV1 {
  EVALUATION_SCORER_INPUT_FIELD_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_INPUT_FIELD_V1_CASE_INPUT = 1;
  EVALUATION_SCORER_INPUT_FIELD_V1_CANDIDATE_OUTPUT = 2;
  EVALUATION_SCORER_INPUT_FIELD_V1_REFERENCE_OUTPUT = 3;
  EVALUATION_SCORER_INPUT_FIELD_V1_CORRECTION = 4;
  EVALUATION_SCORER_INPUT_FIELD_V1_ORIGINAL_CONTEXT = 5;
}

// DRAFT -> PUBLISHING -> PUBLISHED | REJECTED. A published version is
// immutable, and only a published version joins a suite.
enum EvaluationScorerCodePublicationStateV1 {
  EVALUATION_SCORER_CODE_PUBLICATION_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_CODE_PUBLICATION_STATE_V1_DRAFT = 1;
  EVALUATION_SCORER_CODE_PUBLICATION_STATE_V1_PUBLISHING = 2;
  EVALUATION_SCORER_CODE_PUBLICATION_STATE_V1_PUBLISHED = 3;
  EVALUATION_SCORER_CODE_PUBLICATION_STATE_V1_REJECTED = 4;
}

// One case as a code scorer reads it. Each field is JSON text, given only for
// a field the scorer's input fields name.
message EvaluationScorerCodeInputV1 {
  optional string case_input_json = 1;
  optional string candidate_output_json = 2;
  optional string reference_output_json = 3;
  optional string correction_json = 4;
  optional string original_context_json = 5;
}

enum EvaluationCodeScorerJobStateV1 {
  EVALUATION_CODE_SCORER_JOB_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_CODE_SCORER_JOB_STATE_V1_QUEUED = 1;
  EVALUATION_CODE_SCORER_JOB_STATE_V1_RUNNING = 2;
  EVALUATION_CODE_SCORER_JOB_STATE_V1_FINISHED = 3;
}

// Where a code scorer's attempt failed: COMPILE, RUNTIME and LIMIT are the
// scorer's own, the rest the platform's.
enum EvaluationCodeScorerFailureStageV1 {
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_UNSPECIFIED = 0;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_COMPILE = 1;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_RUNTIME = 2;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_LIMIT = 3;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_SANDBOX = 4;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_HOST_LOSS = 5;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_CANCELLATION = 6;
  EVALUATION_CODE_SCORER_FAILURE_STAGE_V1_AMBIGUOUS = 7;
}

// The scorer's capped stdout and stderr, sealed under the organization's data
// key. The streams themselves are for members and admins; a viewer reads the
// counts, flags and digests only.
message EvaluationCodeScorerLogsV1 {
  uint32 stdout_bytes = 1;
  bool stdout_truncated = 2;
  bytes stdout_sha256 = 3;
  uint32 stderr_bytes = 4;
  bool stderr_truncated = 5;
  bytes stderr_sha256 = 6;
  optional bytes stdout = 7;
  optional bytes stderr = 8;
}

// One code scorer job: a cell's, a preview's or a publication's.
message EvaluationCodeScorerResultV1 {
  string job_id = 1;
  EvaluationCodeScorerJobStateV1 state = 2;
  // UNSPECIFIED until FINISHED.
  EvaluationVerdictV1 verdict = 3;
  optional double score = 4;
  // The canonical attempt's stage; absent on a success and on a job no
  // attempt ended.
  EvaluationCodeScorerFailureStageV1 failure_stage = 5;
  // The stable code the result settles as, e.g. `scorer_runtime_error` or
  // `sandbox_unavailable`. Never the scorer's own text.
  optional string failure_code = 6;
  // Absent until the attempt reported streams.
  optional EvaluationCodeScorerLogsV1 logs = 7;
  // (#611) The label `score` returned, at most 256 bytes: present on a FINISHED
  // job with a PASS or FAIL verdict whose scorer returned one. It is the
  // scorer's output, not a log, so every role reads it.
  optional string label = 8;
  // The canonical attempt's sandbox clock from ready to end, before billing
  // rounds it. A cell's `EvaluationScorerEvidenceV1.duration_micros` is the
  // same value.
  optional int64 duration_micros = 9;
  // The limit the scorer reached: `wall_time_exceeded`, `cpu_time_exceeded`,
  // `memory_limit_exceeded` or `pids_limit_exceeded`. Present exactly when
  // `failure_stage` is LIMIT; `failure_code` stays `scorer_resource_limit`.
  optional string limit_code = 10;
  // The sandbox blocked a system call the scorer made. Which call is never
  // said; `failure_code` stays `scorer_runtime_error` at stage RUNTIME.
  bool system_call_blocked = 11;
  // Where a preview's scorer failed to compile or raised: set on a preview's
  // job only, for members and admins only, at stage COMPILE or RUNTIME. Never
  // on a cell or a publication's trial.
  optional EvaluationCodeScorerErrorDetailV1 error_detail = 12;
  // The unit-seconds charged to the job's attempts: each attempt's ready-to-end
  // time rounded up to whole seconds, at least 1 and at most the profile's wall
  // limit, times the profile's units. 0 when only attempts the platform caused
  // ran. Present once FINISHED.
  optional int64 billed_unit_seconds = 13;
}

// A preview's compile or runtime error, as the scorer's code raised it.
message EvaluationCodeScorerErrorDetailV1 {
  // e.g. "ModuleNotFoundError"; empty when the scorer raised nothing of its
  // own, as for an output outside the scorer contract.
  string exception_type = 1;
  // Sanitized, at most 1 KiB. It may quote the preview's own input.
  string message = 2;
  // A bundle path, e.g. "score.py". Absent when the failing frame is outside
  // the bundle.
  optional string path = 3;
  optional uint32 line = 4;
}

message StartEvaluationScorerPreviewRequest {
  string score_config_id = 1;
  EvaluationScorerCodeInputV1 input = 2;
  string idempotency_key = 3;
}

message StartEvaluationScorerPreviewResponse {
  string preview_id = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message GetEvaluationScorerPreviewRequest {
  string preview_id = 1;
}

message GetEvaluationScorerPreviewResponse {
  string preview_id = 1;
  string score_config_id = 2;
  EvaluationCodeScorerResultV1 result = 3;
}

message PublishEvaluationScorerConfigRequest {
  string score_config_id = 1;
  // 1 to 3, each within the scorer's limit profile.
  repeated EvaluationScorerCodeInputV1 smoke_inputs = 2;
  string idempotency_key = 3;
}

message PublishEvaluationScorerConfigResponse {
  string score_config_id = 1;
  // PUBLISHING once a publication started; a replay reads it as it stands.
  EvaluationScorerCodeConfigV1 code = 2;
  bool idempotent_replay = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message GetEvaluationScorerSourceSnapshotRequest {
  string score_config_id = 1;
  // Absent: the current version.
  optional string version_discriminator = 2;
}

// One saved version of a code scorer, its source included. Every version is
// kept.
message GetEvaluationScorerSourceSnapshotResponse {
  string score_config_id = 1;
  string version_discriminator = 2;
  EvaluationScorerCodeLanguageV1 language = 3;
  bytes bundle_sha256 = 4;
  uint64 bundle_size_bytes = 5;
  string entrypoint_path = 6;
  // At most 32 files and 256 KiB of content, paths ascending.
  repeated EvaluationScorerSourceFileV1 files = 7;
}

// What a suite froze of a code member when it was authored.
message EvaluationScorerSuiteCodeMemberV1 {
  string score_config_id = 1;
  bytes bundle_sha256 = 2;
  EvaluationScorerRuntimeProfileRefV1 runtime_profile = 3;
  EvaluationScorerLimitProfileRefV1 limit_profile = 4;
  bytes artifact_manifest_sha256 = 5;
}

// ---- end of code scorer preview, publication and results ----

// ---- the organization's Loop spend cap (#611) ----

// The most a window's Loop sandbox overage may reach before new code-scorer
// work is refused with `loop_spend_cap_reached`; work already started finishes.
message LoopOverageCapV1 {
  // The cap in force, in cents: the organization's own, else its plan's.
  // Absent when neither caps it.
  optional int64 cap_cents = 1;
  // True when the organization set no cap of its own, so its plan's applies.
  bool plan_default = 2;
  // (#611) The plan's own default cap, whether or not the organization set one.
  // Absent when the plan has none.
  optional int64 plan_default_cap_cents = 3;
}

message SetLoopOverageCapRequest {
  // In cents, at least 0. Absent clears the organization's own cap, and its
  // plan's default applies again.
  optional int64 cap_cents = 1;
}

message SetLoopOverageCapResponse {
  LoopOverageCapV1 cap = 1;
}

message GetLoopOverageCapRequest {}

message GetLoopOverageCapResponse {
  LoopOverageCapV1 cap = 1;
}

// ---- end of the Loop spend cap ----

// What one ingested case declared about itself.
//
// The absence codes are the repo's own spellings, the same two the cell
// inspector emits: `case_carries_no_input_payload` and
// `case_carries_no_expected_output`. An empty list is a case that declared
// nothing absent, which is a fact and not a silence.
message EvaluationDatasetCaseAbsenceV1 {
  uint32 line_number = 1;
  repeated string absence_code = 2;
}

message EvaluationDatasetVersionV1 {
  string dataset_version_id = 1;
  string dataset_collection_id = 2;
  string collection_name = 3;
  uint32 version_number = 4;
  optional string label = 5;
  uint32 case_count = 6;
  MetricAvailabilityV1 case_count_availability = 7;
  // Absent until dataset schema revisions ship, exactly as on the builder's
  // own version option.
  optional string schema_fingerprint = 8;
  MetricAvailabilityV1 schema_fingerprint_availability = 9;
  google.protobuf.Timestamp created_at = 10;
  bool is_pinned = 11;
  // Set on a version that has rolled out of the picker. The version, its cases
  // and every run that pinned it are untouched: voided is not deleted.
  optional google.protobuf.Timestamp picker_retired_at = 12;
}

// What a rollover retired, and why. Present exactly when the create displaced
// a version from the picker.
message EvaluationDatasetRolloverV1 {
  string retired_dataset_version_id = 1;
  uint32 retired_version_number = 2;
  string reason_code = 3;
  google.protobuf.Timestamp retired_at = 4;
}

enum EvaluationDatasetVersionRejectionKindV1 {
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_UNSPECIFIED = 0;
  // The org already holds the maximum number of live collections.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_COLLECTION_CAP_EXCEEDED = 1;
  // The collection is at its picker cap and every version in it is pinned, so
  // there is nothing the rollover may retire. Refused rather than retiring a
  // held version.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_VERSION_CAP_ALL_PINNED = 2;
  // A line is not valid JSON, or is JSON but not an object. The version is not
  // created: a silently dropped line is a dataset whose count lies.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_MALFORMED_JSONL_LINE = 3;
  // The ingest carried no case at all.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_EMPTY_INGEST = 4;
  // RETAINED, NO LONGER EMITTED. "Too many bytes" and "too many cases" are the
  // two values below. This value is kept — not reserved, not renumbered — because bytes that already carry it
  // must keep decoding to a named variant rather than to an unknown integer,
  // and because a client switching on it still compiles. Nothing in this build
  // constructs it.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_INGEST_TOO_LARGE = 5;
  // The named draft is not open, is not readable in this scope, or its
  // optimistic-concurrency token moved since the caller read it.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_DRAFT_NOT_FINALIZABLE = 6;
  // The ingest body is over the byte bound. `observed_count` and `max_count`
  // are bytes. Refused, never truncated; the edit is to split the file.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_INGEST_BYTES_EXCEEDED = 7;
  // The ingest carries more cases than the bound. `observed_count` and
  // `max_count` are cases. Refused, never truncated; the edit is to trim cases.
  // A different edit from the one above, which is why it is a different value:
  // `RecoveryActionV1` says who can fix a refusal, `kind` says what to fix.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_INGEST_CASE_COUNT_EXCEEDED = 8;
  // The draft still holds cases no human approved, so the finalize is refused.
  //
  // A production rule's `_CREATE_DATASET_DRAFT` action writes proposed cases
  // with no human in the loop; this refusal keeps "a rule matched a span" from
  // becoming "this is now a golden case every future run is graded against"
  // without a human approving it.
  //
  // `observed_count` carries how many cases are waiting. Cases a reviewer
  // already REJECTED, merged, marked non-representative or superseded do NOT
  // block: they have left the proposed set, and blocking on them would mean a
  // reviewer's "no" deadlocks the version.
  EVALUATION_DATASET_VERSION_REJECTION_KIND_V1_DRAFT_HAS_UNAPPROVED_CASES = 9;
}

message EvaluationDatasetVersionRejectionV1 {
  EvaluationDatasetVersionRejectionKindV1 kind = 1;
  string reason_code = 2;
  // 1-based, and set only on MALFORMED_JSONL_LINE.
  optional uint32 line_number = 3;
  uint32 observed_count = 4;
  uint32 max_count = 5;
  // Server-authored and bounded: never longer than the `max_detail_bytes` this
  // surface publishes on `evaluation_dataset_version_ingest`.
  string detail = 6;
  // The one action that resolves this refusal. RE_PREVIEW on
  // DRAFT_NOT_FINALIZABLE — the caller must re-read the draft and finalize
  // against the version it now carries — and EDIT_DEFINITION on the rest.
  RecoveryActionV1 recovery = 7;
}

message CreateEvaluationDatasetVersionRequest {
  // Names an existing collection. Absent with `collection_name` present
  // creates one, which is what makes the empty-org journey a single call.
  optional string dataset_collection_id = 1;
  optional string collection_name = 2;
  optional string label = 3;
  // Where the cases come from. Exactly one.
  oneof ingest {
    // One JSON object per line. Recognised keys: `input_payload`,
    // `expected_output`, `correction_payload`, `original_context`, and
    // `verifier_inputs` (#1007): `{"files": [{"path", "content"}]}`, 1 to 32
    // UTF-8 files under unique relative paths, at most 256 KiB in all, which a
    // Loop rollout of the case hands its verifier at /verifier/case/<path>,
    // never its episode, and no read returns. A line whose inputs break a
    // bound refuses the version as MALFORMED_JSONL_LINE,
    // `verifier_inputs_invalid`. And `episode_files` (#1092), the same shape
    // and bounds under absolute paths, which a Loop rollout of the case writes
    // into its episode before the first step, never its verifier; a line
    // whose files break a bound refuses the version as MALFORMED_JSONL_LINE,
    // `episode_files_invalid`. A reset refuses the case,
    // `episode_files_invalid`, unless each file is at or beneath one of the
    // environment's `final_state_paths` and neither it nor a directory above
    // it matches a `protected_paths` glob; a base holding a directory or a
    // link where one goes fails the reset, unbilled,
    // `episode_files_unwritable`.
    bytes jsonl = 4;
    // Finalize a dataset-version draft the capture path filled. The draft's
    // proposed (never voided) cases become this version's cases, and the draft
    // is closed in the same transaction.
    string draft_id = 5;
  }
  // Dotted path to the recorded output inside each case, e.g.
  // `original_context.output`. Resolved by the same path reader the scorer
  // uses, so an ingest and a scorer cannot disagree about what it means.
  optional string recorded_output_field_path = 6;
  // Required on the draft path: the token the caller read off the draft. A
  // finalize that did not bind against it could publish cases the caller never
  // saw.
  optional uint64 expected_draft_version = 7;
  string idempotency_key = 8;
  // The typed shape this version declares.
  //
  // Present: the publish computes its fingerprint and either REUSES the
  // collection's existing revision with that fingerprint or mints
  // `revision_number + 1`. Absent: the version inherits the collection's active
  // revision unchanged. Absent with no active revision: the version publishes
  // with no schema, and every read reports
  // `NOT_SUPPORTED / dataset_collection_declares_no_schema` — which is a
  // DIFFERENT absence from the retired `dataset_schema_revisions_not_shipped`,
  // and the difference is the point.
  //
  // This is how a schema revision comes to exist. A schema inferred from the
  // cases would not be a contract: its fingerprint would move whenever a case
  // arrived with a new key.
  optional DatasetSchemaShapeV1 declared_schema = 9;
}

message CreateEvaluationDatasetVersionResponse {
  EvaluationDatasetVersionV1 version = 1;
  // One entry per ingested case that declared an absence. Cases that declared
  // none are absent from this list rather than present with an empty code set.
  repeated EvaluationDatasetCaseAbsenceV1 case_absences = 2;
  optional EvaluationDatasetRolloverV1 rollover = 3;
  bool idempotent_replay = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

// ===========================================================================
// The governance surfaces
//
// Two mutations, both `MUTATION_ACK`. Neither returns a page and neither
// touches secret material: the kill switch flips a flag on a credential whose
// key it cannot read, and its request has no field that could carry one.
// ===========================================================================

message SetEvaluationProviderCredentialEnabledRequest {
  string credential_id = 1;
  // The state to set, not a toggle. A toggle is not idempotent, and a retried
  // toggle after a network timeout is exactly how a key gets switched back on
  // by the call that was meant to kill it.
  bool enabled = 2;
  // Recorded on the switch event and read back. Accepted only when disabling —
  // an operator switching a key back on is not asked to justify it, and a field
  // that demanded a reason for that would collect the string "on" forever.
  optional string reason = 3;
  string idempotency_key = 4;
}

// What switching a credential OFF affects, stated by the server.
//
// Its own message rather than a reuse of `EvaluationBlastRadiusV1`: five of
// that one's six fields — cases, trials, external calls, worst posture,
// unattested candidates — have no meaning at a credential flip, and sending
// them as zeros would put five honest-looking numbers on the wire that mean
// nothing.
//
// **This message never promises that in-flight work stops.** The kill switch is
// published as `DEGRADED / planning_enforcement_only`: it holds at execution
// planning — preview, launch, cell retry — and not inside a run already
// dispatched, whose executor resolves the key its manifest froze. The two
// fields at the bottom restate that where the operator is actually looking.
message EvaluationCredentialBlastRadiusV1 {
  // Evaluator templates naming this credential. Planning will refuse each of
  // them from now on. Exact.
  uint32 evaluator_template_count = 1;
  // Scorer configurations bound to this credential, through their own provider
  // execution or through their template's. Exact.
  uint32 scorer_config_count = 2;
  // Judge-regrade jobs currently queued or running that hold one of those
  // scorers. Exact — and they **CONTINUE**. A worker resolves its secret at
  // execution time, so a job accepted before the flip runs to completion on the
  // key it pinned.
  uint32 live_judge_regrade_job_count = 3;
  // Absent, NEVER zero. A run's credential binding lives inside its frozen
  // manifest — a protobuf blob the storage layer does not decode — so this
  // plane has no evidence either way, and `0` would tell an operator that
  // nothing is running on the key they just killed.
  optional uint32 live_run_count = 4;
  MetricAvailabilityV1 live_run_availability = 5;
  // Absent for the same structural reason: a definition's scorers live inside
  // its encoded revision draft, not in queryable columns.
  optional uint32 evaluation_definition_count = 6;
  MetricAvailabilityV1 evaluation_definition_availability = 7;
  // The kill switch's published degradation reason, echoed here — the SAME slug
  // the capability set carries, so the ack and the posture cannot drift.
  string enforcement_posture_code = 8;
  // A constant this build ASSERTS, not a measurement — the same idiom as the
  // scorer retry's `external_calls_issued = 0`. There is no path from this flip
  // to a running executor. When that ever becomes false, it becomes false HERE,
  // and a client that rendered it never had to guess.
  bool stops_in_flight_work = 9;
}

message SetEvaluationProviderCredentialEnabledResponse {
  EvaluationProviderCredentialV1 credential = 1;
  bool idempotent_replay = 2;
  // False when the credential was already in the requested state. A flip that
  // changed nothing is a real outcome and is not an error: an operator killing
  // a key that a colleague killed a minute ago has succeeded.
  bool state_changed = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // Present on a DISABLE, including an idempotent replay of one; absent on an
  // enable. Enabling un-refuses things, and a "radius" attached to switching a
  // key back on would be a count of what the flip just fixed, rendered under a
  // heading that means harm.
  //
  // Read at flip time rather than frozen with the switch event: it answers
  // "what does this refuse NOW", which is the question an operator staring at
  // the ack is asking.
  optional EvaluationCredentialBlastRadiusV1 blast_radius = 5;
}

enum EvaluationScorerSuiteRejectionKindV1 {
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_UNSPECIFIED = 0;
  // The suite key is taken by a suite this org cannot revise through this verb.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_DUPLICATE_SUITE_KEY = 1;
  // One or more members name a scorer configuration this organisation cannot
  // read. The suite is refused WHOLE — a partial suite would combine over a
  // membership its author never wrote.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_MEMBER_NOT_FOUND = 2;
  // A suite with no members combines nothing and would report a verdict over an
  // empty set.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_EMPTY_MEMBERSHIP = 3;
  // The same `score_config_id` twice. Silently de-duplicating would halve a
  // weight the author wrote twice on purpose or by mistake, and there is no way
  // to tell which.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_DUPLICATE_MEMBER = 4;
  // More members than a run may freeze scorers. A suite no run can launch is
  // not a suite.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_MEMBER_CAP_EXCEEDED = 5;
  // The combine rule is unspecified, or names a rule this build does not
  // evaluate.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_COMBINE_RULE_NOT_SUPPORTED = 6;
  // A NON-GATE member whose evaluator can never produce a score, so it can
  // never reach the weighted mean's numerator.
  //
  // Structural incapacity, not a runtime absence. The combine rule's documented
  // rule — a member with no score is excluded from both sides, never
  // zero-filled — is about a scorer that DIDN'T score this time. This is about
  // one that cannot score at any coordinate, ever, which makes the weight its
  // author wrote a promise the arithmetic will never keep.
  //
  // Blocking gates are exempt: a gate is adjudicated, not averaged, and every
  // shipped evaluator kind produces a verdict.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_MEMBER_NOT_SCOREABLE = 7;
  // A NON-GATE member's weight cannot be a denominator.
  //
  // A zero-weighted member would contribute to neither side of the mean, so the
  // author would have written a member into a mean that never sees it. Zero,
  // not-finite, negative and over-bound weights are refused by name.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_MEMBER_WEIGHT_UNUSABLE = 8;
  // (#611) A CODE member that is not published. `offending_members` names each,
  // reason `code_member_not_published`.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_MEMBER_NOT_PUBLISHED = 9;
  // (#611) The suite's only blocking gate is a NONDETERMINISTIC code scorer.
  EVALUATION_SCORER_SUITE_REJECTION_KIND_V1_NONDETERMINISTIC_SOLE_GATE = 10;
}

// One member the suite was refused FOR, and why.
//
// Named individually rather than folded into a count, for the reason
// `unresolved_score_config_ids` exists: the author fixes the members they got
// wrong instead of bisecting their own request.
message EvaluationScorerSuiteMemberRefusalV1 {
  string score_config_id = 1;
  string config_key = 2;
  // Why THIS member cannot supply the combine rule's inputs. One of
  // `member_evaluator_comparison_unsupported`, `member_weight_is_zero`,
  // `member_weight_not_finite`, `member_weight_negative`,
  // `member_weight_above_stored_bound`.
  string reason_code = 3;
  // The kind the server read off the member's evaluator template, so the author
  // fixes the template rather than guessing which half is wrong.
  string evaluator_kind = 4;
  // The weight as AUTHORED — absent when the request carried none, which
  // combines as 1.0. Echoed so the author sees the number the server read
  // rather than the one they meant.
  optional double weight = 5;
}

message EvaluationScorerSuiteRejectionV1 {
  EvaluationScorerSuiteRejectionKindV1 kind = 1;
  string reason_code = 2;
  uint32 member_count = 3;
  uint32 max_member_count = 4;
  // Populated on MEMBER_NOT_FOUND, so the caller fixes the members it got wrong
  // rather than bisecting its own request.
  repeated string unresolved_score_config_ids = 5;
  string detail = 6;
  // Populated on MEMBER_NOT_SCOREABLE and MEMBER_WEIGHT_UNUSABLE. Every
  // offending member, not the first: a suite is refused whole, and reporting
  // one at a time would make fixing a five-member suite a five-round trip.
  repeated EvaluationScorerSuiteMemberRefusalV1 offending_members = 7;
}

message CreateEvaluationScorerSuiteRequest {
  string suite_key = 1;
  string name = 2;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 3;
  // Author order is preserved. A re-author of an existing `suite_key` REPLACES
  // the membership and mints `v{n+1}`; launched runs are unaffected, because
  // they froze theirs.
  repeated EvaluationScorerSuiteMemberV1 members = 4;
  string idempotency_key = 5;
}

// A re-grade coordinate that named a DERIVED suite row, and the coordinates
// that are not derived.
//
// A suite is COMPUTED, never executed: it writes no result row, it has no
// `score_config_id`, and its rollups and cells are derived at read time from
// the member rows. So "re-grade this suite" is a category error, not a missing
// object — and answering it with COORDINATE_UNKNOWN said "does not exist" about
// a thing that exists, which sends an operator looking for a deleted scorer.
//
// The members ARE re-gradable, so the refusal carries them rather than making
// the client re-derive a membership the server just read. They come from the
// RUN'S FROZEN MANIFEST, not from the live suite table: a re-grade re-grades
// what the run froze, and a suite re-authored since would name members this run
// never used.
message EvaluationDerivedSuiteCoordinateV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string version_discriminator = 3;
  // The member coordinates on the SAME cell, in author order. Each is a real
  // `(cell, scorer)` the re-grade planes resolve.
  repeated EvaluationScorerCoordinateV1 member_coordinates = 4;
  // The frozen membership's size. Equal to `member_coordinates.size` at every
  // shipped membership, and stated separately so a truncated list is visible as
  // truncated rather than as a smaller suite.
  uint32 member_coordinate_count = 5;
  uint32 omitted_member_coordinate_count = 6;
}

message CreateEvaluationScorerSuiteResponse {
  EvaluationScorerSuiteV1 scorer_suite = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ===========================================================================
// Async judge regrades
//
// Judge regrades are ASYNCHRONOUS, for two reasons:
//
//   * A unary handler that publishes `estimated_external_call_count: 0` must not quietly acquire fifty live provider
//     calls. So the accept verb below ACCEPTS — it writes a job and returns — and its `external_calls_issued` is `0`
//     for the same structural reason the scorer retry's is: there is no code path from the handler to a provider
//     client.
//   * A regrade's spend must reach the run's evaluator total. So every judge call a job makes is metered exactly as an
//     in-run judge's is, lands in an EVALUATOR_EXECUTION envelope, is recorded per cell on the job's own ledger, and is
//     ADDED to the run's `evaluator_*` totals.
//
// Verdict counts are CORRECTED (a cell graded twice has one verdict); spend is
// ACCUMULATED (a cell graded twice was billed twice). Those are different kinds
// of number and the completion statement treats them differently.
// ===========================================================================

// The job's lifecycle. Four states, and `FAILED` means the JOB could not run —
// a job whose cells failed individually is `COMPLETED` with a failed count,
// exactly as a run with failed cells is not itself a failed run.
enum EvaluationJudgeRegradeJobStateV1 {
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_QUEUED = 1;
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_RUNNING = 2;
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_COMPLETED = 3;
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_FAILED = 4;
  // The customer stopped it.
  //
  // DISTINCT from `FAILED` at 4, and the distinction is the point: `FAILED`
  // means the job could not run, and a job a customer cancelled ran perfectly
  // well. Collapsing the two would send an operator to look at a judge that
  // was working.
  //
  // Terminal. The cells it had already graded keep their verdicts AND their
  // spend: money spent is spent, and a cancel is not a credit note.
  EVALUATION_JUDGE_REGRADE_JOB_STATE_V1_CANCELLED = 5;
}

// One accepted cell's lifecycle. `LEASED` is a real state a reader sees, not an
// implementation detail: a customer watching a job needs "a worker has this
// one" to be distinguishable from "nothing has happened yet".
enum EvaluationJudgeRegradeCellStateV1 {
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_UNSPECIFIED = 0;
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_QUEUED = 1;
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_LEASED = 2;
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_SUCCEEDED = 3;
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_FAILED = 4;
  // A cancel reached this cell before a worker did.
  //
  // NOT `FAILED`: nothing failed. A cell stamped `FAILED` carries a typed
  // failure a client renders with a retry affordance, and offering a customer
  // a retry of the work they just stopped is the wrong answer twice over.
  //
  // A cell a worker was HOLDING when the cancel landed never reaches this
  // state — it finishes, is billed, and lands `SUCCEEDED` or `FAILED`. The
  // provider request had already been issued; taking its lease away would lose
  // the evidence and keep the charge.
  EVALUATION_JUDGE_REGRADE_CELL_STATE_V1_CANCELLED = 5;
}

// Why one `(cell, scorer)` coordinate cannot be regraded by a job.
//
// A NEW enum rather than a reuse of `EvaluationScorerRetryIneligibilityV1`,
// because the two policies are inverses: the scorer retry accepts deterministic
// scorers and declines judges, and this verb accepts judges and declines
// everything else. One enum meaning both would make each value's absence
// ambiguous.
enum EvaluationJudgeRegradeIneligibilityV1 {
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_UNSPECIFIED = 0;
  // The cell's candidate never produced output, so there is nothing to grade. A
  // CELL retry — which re-runs the candidate — is the action.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_CANDIDATE_OUTPUT_ABSENT = 1;
  // The scorer is not an `llm_judge`. Deterministic scorers, code scorers and
  // every future built-in answer HERE, by name — this verb does not widen what
  // the executor will route to the judge path, and the Phase-0 scorer-deferral
  // boundary is where it was.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_SCORER_NOT_A_JUDGE = 2;
  // The scorer needs a person. Dispatching it to a model would fabricate a
  // human answer.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_SCORER_REQUIRES_HUMAN = 3;
  // The scorer-attempt ceiling. A regrade loop that cannot terminate is a
  // defect.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_ATTEMPT_CEILING_REACHED = 4;
  // The coordinate, or that scorer on it, does not exist in this run. A typed
  // per-entry answer, never NOT_FOUND and never a silent skip.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_COORDINATE_UNKNOWN = 5;
  // The judge's template names no provider, no model or no credential, so there
  // is nothing to freeze and nothing to call. Refused at ACCEPT rather than
  // discovered by a worker, because a job that can only fail should not be
  // accepted.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_PROVIDER_UNCONFIGURED = 6;
  // Another live job on this run already holds this coordinate.
  //
  // Refused rather than queued twice, because two jobs grading one cell would
  // both write the same scorer attempt index — the identity index rejects the
  // second, so one of the two customers pays for a call whose verdict is
  // thrown away. Refusing at accept is the cheap end of that.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_COORDINATE_ALREADY_QUEUED = 7;
  // The coordinate names the run's scorer SUITE, which is derived and not
  // executed.
  //
  // Distinct from COORDINATE_UNKNOWN at 5 for the same reason its scorer-retry
  // twin is: "does not exist" is the wrong sentence about a row the customer
  // can see. A suite verdict follows its members with no re-derivation step, so
  // the action is to re-grade the members — which the status's `derived_suite`
  // names.
  EVALUATION_JUDGE_REGRADE_INELIGIBILITY_V1_SCORER_IS_A_DERIVED_SUITE = 8;
}

// One judge scorer, frozen at the moment the job was ACCEPTED.
//
// **The run manifest's message, carried whole.** `EvaluationFrozenEvaluatorRefV1`
// is the run's freeze-at-LAUNCH, and this is the same fact at a different
// boundary, so it is the same message. A job pins by COPYING the run's frozen ref where the run has one,
// and by synthesising one from the live template where it does not (a run
// launched before the freeze existed). Either way the worker reads the judge out
// of here and never out of a live row.
//
// The two extra fields complete the job's freeze: a regrade reads nothing live.
//
// **No key material.** `provider_execution_json` names a credential id, as the
// live column does; the worker resolves the secret at execution time, so a key
// rotated after accept is the key that gets used, and the credential kill switch
// still stops the job.
message EvaluationJudgeRegradeScorerPinV1 {
  EvaluationFrozenEvaluatorRefV1 evaluator = 1;
  string metric_name = 2;
  double pass_threshold = 3;
}

// Which field of the recorded case each candidate's output was frozen into.
//
// The executor resolves a candidate's output through the manifest's
// `dataset_field` and THEN applies the scorer's `subject_path` to that. A
// regrade that reproduced only the second hop would grade the whole case
// document where the first pass graded one field, and would disagree with
// itself — the one thing a regrade must never do. So the field is frozen here
// too, at accept, beside the evaluators.
message EvaluationJudgeRegradeCandidateFieldV1 {
  string candidate_key = 1;
  string dataset_field = 2;
}

message EvaluationJudgeRegradePinV1 {
  repeated EvaluationJudgeRegradeScorerPinV1 scorers = 1;
  repeated EvaluationJudgeRegradeCandidateFieldV1 candidate_fields = 2;
}

// One coordinate's acceptance decision, returned by the accept verb for every
// coordinate the request named — accepted or not.
message EvaluationJudgeRegradeCellStatusV1 {
  EvaluationScorerCoordinateV1 coordinate = 1;
  bool accepted = 2;
  // Present exactly when `accepted` is false.
  optional EvaluationJudgeRegradeIneligibilityV1 ineligibility = 3;
  // The scorer's frozen config key. Empty for an unknown coordinate, which is
  // the only case where the server has no scorer to name.
  string scorer_key = 4;
  // What this coordinate says today, before any regrade.
  EvaluationVerdictV1 current_verdict = 5;
  // The highest scorer attempt already recorded here. The regrade would land at
  // this + 1, and this one stays readable.
  uint32 prior_scorer_attempt = 6;
  // Present exactly when `ineligibility` is SCORER_IS_A_DERIVED_SUITE.
  optional EvaluationDerivedSuiteCoordinateV1 derived_suite = 7;
}

// One accepted cell's live state, and — once it has run — what its judge call
// actually cost.
message EvaluationJudgeRegradeCellProgressV1 {
  EvaluationScorerCoordinateV1 coordinate = 1;
  EvaluationJudgeRegradeCellStateV1 state = 2;
  string scorer_key = 3;
  // Attempts this worker loop has made on this cell, including the current one.
  // A cell whose worker died carries the attempt that died on it.
  uint32 attempt_count = 4;
  uint32 max_attempts = 5;
  // The verdict this regrade produced. Absent until the cell succeeds.
  optional EvaluationVerdictV1 verdict = 6;
  // Absent rather than zero when the regrade produced no score: an ERROR
  // verdict never carries one, and a failed grade is not a zero.
  optional double score = 7;
  // The scorer attempt this regrade landed at. Absent until it lands.
  optional uint32 scorer_attempt = 8;
  // What THIS cell's judge call cost, in the evaluator scope. Absent until the
  // call has been made — and absent, never zeroed, for a cell that failed
  // before reaching the network.
  optional ExecutionMetricsV1 evaluator_execution = 9;
  optional EvaluationFailureV1 failure = 10;
}

message EvaluationJudgeRegradeJobV1 {
  string regrade_job_id = 1;
  string evaluation_run_id = 2;
  EvaluationJudgeRegradeJobStateV1 state = 3;
  uint32 requested_cell_count = 4;
  uint32 accepted_cell_count = 5;
  uint32 completed_cell_count = 6;
  uint32 failed_cell_count = 7;
  // Instants, in the same `google.protobuf.Timestamp` spelling every other
  // instant on this surface uses. `started_at` is absent until a worker claims
  // the job's first cell and `finished_at` until its last is terminal — absent,
  // never a zero epoch, which a duration panel renders as 1970.
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp started_at = 9;
  optional google.protobuf.Timestamp finished_at = 10;
  // Present only when the JOB failed — not when its cells did.
  optional EvaluationFailureV1 failure = 11;
  // The evaluator references this job froze at accept, and the digest of the
  // encoded freeze. Published so a customer can see WHICH judge is going to
  // regrade their cells before any of it happens.
  repeated EvaluationJudgeRegradeScorerPinV1 evaluator_pins = 12;
  string evaluator_pin_digest = 13;
  // Cells a cancel stamped before a worker reached them.
  //
  // Its own count rather than a share of `failed_cell_count`, because the poll
  // has to be able to answer "what happened to the other thirty?" honestly: a
  // job that was stopped and a job whose judge broke are different answers.
  //
  // `completed + failed + cancelled` can still be less than `accepted` while a
  // cancelled job's in-flight cells are landing.
  uint32 cancelled_cell_count = 14;
  // When a cancel was ASKED for. Present from the moment the request lands,
  // including while in-flight cells drain and the job is not yet terminal —
  // which is the window `state` alone cannot describe.
  optional google.protobuf.Timestamp cancellation_requested_at = 15;
  // What the operator typed when they stopped it.
  //
  // Absent — never an empty string — when the cancel carried no reason, and
  // absent on every job nobody cancelled. This is operator intent, not a
  // failure: it lives in its own column and a cancelled cell still carries no
  // failure triple.
  optional string cancel_reason = 16;
}

// Why a whole regrade request was refused before any cell was written.
//
// Rides `Status.details` on the `INVALID_ARGUMENT` / `FAILED_PRECONDITION` the
// accept verb raises, exactly as `EvaluationScorerRetryRejectionV1` does for its
// pair. A cap stated only in prose is a cap a client has to parse English to
// respect.
message EvaluationJudgeRegradeRejectionV1 {
  string reason_code = 1;
  uint32 requested_cell_count = 2;
  uint32 max_cell_count = 3;
  uint32 live_job_count = 4;
  uint32 max_live_job_count = 5;
  string detail = 6;
}

message RequestEvaluationJudgeRegradeRequest {
  string evaluation_run_id = 1;
  // Explicit coordinates only, bounded. An over-large selection is refused by
  // name rather than truncated.
  repeated EvaluationScorerCoordinateV1 coordinates = 2;
  string idempotency_key = 3;
  // The freeze a PREVIEW quoted, echoed back.
  //
  // The binding half of the preview contract, in the only shape a shipped
  // request message can grow one: OPTIONAL. When present, this accept
  // re-resolves every input the preview bound, recomputes the digest, and
  // refuses `judge_regrade_evaluator_pin_moved` when they differ — before
  // writing a row. That is verification by RECONSTRUCTION, the same property
  // `preview_token` gives a launch, rather than an echo the server trusts.
  //
  // Absent means "quote me at today's judge", which is exactly what every
  // client built before this field did.
  optional string expected_evaluator_pin_digest = 4;
}

message RequestEvaluationJudgeRegradeResponse {
  EvaluationJudgeRegradeJobV1 job = 1;
  // One entry per requested coordinate, in request order, accepted or not. A
  // mixed selection is the normal case and a single aggregate verdict would
  // hide which half is which.
  repeated EvaluationJudgeRegradeCellStatusV1 coordinates = 2;
  uint32 accepted_cell_count = 3;
  // ZERO, always, and structural rather than counted: accepting a regrade
  // writes rows. There is no code path from this handler to a provider client —
  // the same property that makes the scorer retry's zero true.
  uint32 external_calls_issued = 4;
  // True when this key had already been accepted: the same job comes back and
  // nothing was appended.
  bool idempotent_replay = 5;
  // Why re-grading loses no evidence: the prior scorer attempt is STAMPED
  // superseded and stays readable, and the new attempt names the job that
  // produced it. A code once per response — it is a constant of the mechanism,
  // not a property of a coordinate.
  string superseded_evidence_code = 6;
  repeated AllowedActionV1 allowed_actions = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
}

message GetEvaluationJudgeRegradeJobRequest {
  // The same two-way selector `GetEvaluationOperation` carries, for the same
  // reason: a client that timed out on the accept has its idempotency key and
  // may never have seen the job id.
  oneof selector {
    string regrade_job_id = 1;
    string idempotency_key = 2;
  }
}

message GetEvaluationJudgeRegradeJobResponse {
  EvaluationJudgeRegradeJobV1 job = 1;
  repeated EvaluationJudgeRegradeCellProgressV1 cells = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // Where this job stands in the work the server can see. Counts, and a typed absence where there is
  // no position to report — never an ETA.
  EvaluationJudgeRegradeQueueDepthV1 queue_depth = 5;
  // How each frozen judge's rate compares with the row this build ships today. A
  // read: this job is billed
  // at the rate it froze whatever these say.
  repeated EvaluationJudgeRegradePinnedRateV1 pinned_rates = 6;
}

// ===========================================================================
// The regrade PREVIEW
//
// What will this cost, before I pay for it?
//
// Two properties make this preview worth having rather than decorative:
//
//   * It is the ACCEPT's own resolver, called a second time. Eligibility here and eligibility there are one kernel,
//     not two lists that agree today — the per-coordinate statuses below are the very message the accept returns,
//     built by the very function the accept builds them with.
//   * It quotes cost under the judge the job WOULD FREEZE, not under whatever the template says at execution time.
//     The evaluator's rate is frozen at launch; this reads the same frozen ref and prices the same way, so a regrade
//     quote and a launch quote for one judge are one number.
//
// And it mints a BINDING: the digest of the freeze it just described, which
// `RequestEvaluationJudgeRegradeRequest.expected_evaluator_pin_digest` lets a
// caller hold the accept to.
// ===========================================================================

// What a regrade job would spend, before any of it is spent.
//
// Calls and cost are separate numbers with separate availabilities, because
// they fail independently: a judge whose rate this build cannot resolve still
// makes a call, and reporting its cost as `0` would say grading is free.
message EvaluationJudgeRegradeEstimateV1 {
  // One judge call per eligible coordinate, and two for a TEXT_THEN_SYSTEM_ONE
  // judge (#1005). A NUMBER, not an availability posture: this is not unknown,
  // and it is not zero either — it is exactly what the worker loop will do.
  uint32 estimated_external_call_count = 1;
  // The grading cost under the rate this job would FREEZE. Absent — never a
  // zeroed amount — when no eligible coordinate's judge could be priced.
  optional CostAmountV1 evaluator_cost = 2;
  MetricAvailabilityV1 evaluator_cost_availability = 3;
  // What the number above assumed about tokens nobody has spent yet. The same
  // block a launch preview publishes, from the same constants.
  EvaluationCostAssumptionV1 cost_assumption = 4;
  // Coverage beside the total, for the reason every other estimate on this
  // surface carries one: an amount over three of fifty eligible coordinates is
  // not the selection's cost.
  uint32 priced_coordinate_count = 5;
  uint32 unpriced_coordinate_count = 6;
}

message PreviewEvaluationJudgeRegradeRequest {
  string evaluation_run_id = 1;
  // Explicit coordinates only, bounded at the SAME cap the accept binds. A cap
  // enforced on one half of a pair is a cap a client learns about by being
  // refused.
  repeated EvaluationScorerCoordinateV1 coordinates = 2;
}

message PreviewEvaluationJudgeRegradeResponse {
  string evaluation_run_id = 1;
  // One entry per requested coordinate, in request order, acceptable or not —
  // and it is `EvaluationJudgeRegradeCellStatusV1`, the accept's own message,
  // produced by the accept's own resolver. The preview cannot describe a
  // coordinate differently from the way the accept will treat it.
  repeated EvaluationJudgeRegradeCellStatusV1 coordinates = 2;
  uint32 acceptable_cell_count = 3;
  EvaluationJudgeRegradeEstimateV1 estimate = 4;
  bool regrade_allowed = 5;
  // Why the whole selection would be refused, when it would be: no coordinate
  // is acceptable, or the run is already at its live-job ceiling. Absent when
  // `regrade_allowed` is true.
  optional string blocked_reason_code = 6;
  // The freeze this preview would mint, and its digest — the BINDING. Echo the
  // digest on the accept and a judge edited in between is refused by name
  // instead of silently grading at a different price.
  repeated EvaluationJudgeRegradeScorerPinV1 evaluator_pins = 7;
  string evaluator_pin_digest = 8;
  // The ceiling the accept is checked against, and where this run stands
  // against it. Published so a client renders "you already have two jobs
  // running" rather than discovering it as a refusal.
  uint32 live_job_count = 9;
  uint32 max_live_job_count = 10;
  // ZERO, always, and structural rather than counted: previewing reads rows.
  // There is no code path from this handler to a provider client — the same
  // property that makes the accept's zero true.
  uint32 external_calls_issued = 11;
  // Why re-grading loses no evidence, on the same contract the accept states
  // it: the prior attempt is STAMPED superseded and stays readable, and the new
  // attempt names the job that produced it.
  string superseded_evidence_code = 12;
  repeated AllowedActionV1 allowed_actions = 13;
  AgenticEvaluationCapabilitiesV1 capabilities = 14;
  EvaluationFreshnessV1 freshness = 15;
  // Whether the ACCEPT will require the digest above.
  //
  // True exactly when this run's freeze is LIVE-DERIVED — synthesised from the
  // judge's live template row because the run predates the launch-time freeze —
  // which is the only case in which the judge can be edited between this quote
  // and the accept. Where every pin is copied from the run's own immutable
  // frozen manifest the value cannot move, so the accept still takes the
  // binding as an optional echo and an older client keeps working unchanged.
  //
  // Published HERE rather than discovered as a refusal: a rule a client learns
  // by being rejected is a rule the server kept to itself.
  bool evaluator_pin_binding_required = 16;
  // The reason code the accept would refuse with, when the field above is true
  // and the accept carries no digest: `judge_regrade_evaluator_pin_binding_required`.
  // Empty when no binding is required.
  string evaluator_pin_binding_code = 17;
  // How the rate each pin would freeze compares with the row this build ships
  // today.
  //
  // A READ, never a reprice: whatever this says, the job executes at the rate
  // its pin froze.
  repeated EvaluationJudgeRegradePinnedRateV1 pinned_rates = 18;
}

// How a pinned judge's FROZEN rate compares with the registry row this build
// ships today.
//
// Four values because there are four genuinely different answers, and the two
// absences are not one: a run that froze no rate at all and a model this build
// can no longer price are missing different halves of the comparison.
enum EvaluationJudgeRegradeRateComparisonV1 {
  EVALUATION_JUDGE_REGRADE_RATE_COMPARISON_V1_UNSPECIFIED = 0;
  // Same checked date and same price per call. Nothing to say.
  EVALUATION_JUDGE_REGRADE_RATE_COMPARISON_V1_UNCHANGED = 1;
  // The registry's row has moved since this pin froze — a different checked
  // date, a different price per call, or both.
  //
  // NOT a repricing signal. The pin still governs execution; this exists so a
  // customer reading a job accepted last month knows the number they will be
  // billed is not today's list price.
  EVALUATION_JUDGE_REGRADE_RATE_COMPARISON_V1_MOVED = 2;
  // The pin carries no rate: a run launched before the evaluator freeze
  // existed. There is nothing frozen to compare, and the worker reads the
  // registry live for exactly these runs.
  EVALUATION_JUDGE_REGRADE_RATE_COMPARISON_V1_PIN_CARRIES_NO_RATE = 3;
  // This build has no registry row for the pinned model, so there is no current
  // side to the comparison. Distinct from the value above, and the distinction
  // is which half is missing.
  EVALUATION_JUDGE_REGRADE_RATE_COMPARISON_V1_REGISTRY_HAS_NO_ROW = 4;
}

// One pinned judge's rate, beside the registry row this build ships today.
//
// Per SCORER rather than per job: a job that froze two judges can have one that
// moved and one that did not, and a job-level flag would make a customer diff
// the pins themselves to find out which.
//
// #1005. A TEXT_THEN_SYSTEM_ONE judge's costs per call are both of its calls',
// so a system-one step whose price moved reads MOVED; the model and the checked
// dates stay its text judge's.
message EvaluationJudgeRegradePinnedRateV1 {
  string score_config_id = 1;
  string config_key = 2;
  string model_id = 3;
  EvaluationJudgeRegradeRateComparisonV1 comparison = 4;
  // When the rate the pin FROZE was last read off the provider's page, and when
  // the row this build ships was. Absent — never an empty string — on whichever
  // side of the comparison does not exist.
  optional string pinned_rate_checked_date = 5;
  optional string current_rate_checked_date = 6;
  // The same comparison in money: what one judge call costs under the frozen
  // rate, and what it would cost under today's row. Absent rather than zeroed
  // where a side cannot be priced — a `$0.00` side would read as "free".
  optional CostAmountV1 pinned_cost_per_call = 7;
  optional CostAmountV1 current_cost_per_call = 8;
  // `pinned_rate_governs_execution`, always. The freeze doctrine restated where
  // a reader meets the drift: this message reports a difference and changes
  // nothing about what the job will be billed.
  string governance_code = 9;
}

// Where a job stands in the work the server can actually see.
//
// Counts, never a wait. The three inputs an ETA needs — the worker's timer, its
// claim batch, and what every other organisation has queued — are not measured
// by this build, and multiplying a depth by a guessed rate would be exactly the
// fabrication this message exists instead of.
message EvaluationJudgeRegradeQueueDepthV1 {
  // This job's own cells still waiting for a worker, and the ones a worker is
  // holding right now. Both are facts about rows this response already
  // describes.
  uint32 pending_cell_count = 1;
  uint32 leased_cell_count = 2;
  // Cells of OTHER live jobs in THIS ORGANISATION that sort ahead of this job's
  // earliest due cell, under the claim statement's own ordering.
  //
  // Scoped, and named for its scope: the worker claims across every
  // organisation, so the global number exists and is not this caller's to see.
  // Absent — never zero — when this job has no queued cell to be positioned
  // against, because `0` reads as "you are next".
  optional uint32 cells_ahead_in_org = 3;
  MetricAvailabilityV1 position_availability = 4;
  // What the count above is scoped to, as a code rather than as prose:
  // `cells_ahead_in_this_org_only`.
  string depth_scope_code = 5;
  // Why there is no estimated wait here:
  // `queue_wait_not_estimated_without_measured_throughput`. Stated as a field
  // rather than left as an omission, because an absent estimate and an estimate
  // nobody thought about look the same on the wire.
  string wait_estimate_reason_code = 6;
}

// ===========================================================================
// Job CANCEL
//
// A run's cancel-vs-claim semantics, at job grain:
//
//   * a cell nobody is holding is stamped `CANCELLED` — not `FAILED`;
//   * a cell a worker IS holding is left alone, finishes, and is billed, because its provider request has already
//     been issued and taking the lease away would lose the evidence while keeping the charge;
//   * everything already terminal, and every economics column on it, is untouched.
//
// Cancellation is not a refund. A cancelled job's completed cells keep their
// spend on the job's ledger AND in the run's evaluator totals, and the
// reconciliation identity holds across the cancel unchanged.
// ===========================================================================

message CancelEvaluationJudgeRegradeJobRequest {
  // The same two-way selector the poll carries, for the same reason: a client
  // that timed out on the accept has its idempotency key and may never have
  // seen the job id.
  oneof selector {
    string regrade_job_id = 1;
    string idempotency_key = 2;
  }
  // Why the operator stopped it.
  //
  // Stored as the job's cancel reason, NOT as a failure: a cancel is not a
  // failure, and a cancelled cell carries no failure at all, so nobody is
  // offered a retry of what they stopped.
  //
  // Optional, bounded at 512 bytes — the same bound the kill switch's reason and
  // a negotiated rate's void reason carry, because a third number would be a
  // third opinion about how long a sentence is. An over-long reason is REFUSED
  // by name rather than truncated: storing the first half of an operator's
  // sentence as though it were the whole is worse than refusing it.
  //
  // Absent and empty are the same input and produce the same stored fact:
  // absent. `""` on the wire would say "the operator wrote nothing down" where
  // absence says "the operator was not asked".
  //
  // Recorded only by the cancel that LANDS. A second cancel is a confirmation
  // and does not overwrite the first reason, because the first one describes the
  // act that actually happened.
  optional string reason = 3;
}

message CancelEvaluationJudgeRegradeJobResponse {
  EvaluationJudgeRegradeJobV1 job = 1;
  repeated EvaluationJudgeRegradeCellProgressV1 cells = 2;
  // True when this job was already cancelled or already draining towards it.
  // A second cancel is a CONFIRMATION: nothing is re-stamped, `finished_at`
  // does not move, and this is never an error — a client that retried a
  // timed-out cancel must not be told its job cannot be stopped.
  bool already_cancelled = 3;
  // Cells this call moved from queued to `CANCELLED`.
  uint32 cancelled_cell_count = 4;
  // Cells a worker was holding when this cancel landed. They finish and are
  // billed. Non-zero means the job is DRAINING: `state` is not terminal yet and
  // `cancellation_requested_at` is what says a stop was asked for.
  uint32 in_flight_cell_count = 5;
  // What this job had already spent, which cancelling does NOT remove. Stated
  // on the wire because "cancel" reads to a customer as "un-bill", and the
  // honest answer is that money spent is spent. Absent — never `$0.00` — when
  // the job had reached no provider at all.
  optional CostAmountV1 retained_evaluator_cost = 6;
  AgenticEvaluationCapabilitiesV1 capabilities = 7;
}

// ===========================================================================
// Run history
// ===========================================================================

// One row of a definition's run history.
//
// Deliberately NOT `EvaluationRunV1`: that message embeds the whole frozen
// manifest, and a page of fifty manifests would blow the payload budget on
// content a history row does not render. What a row needs to answer is "did
// this run finish, how much of it worked, and is it better than the one
// before?" — so the header identity, the state, the projection's counts, and
// the typed failure are here, and everything else is one `GetEvaluationRunOverview`
// away.
//
// The five availability postures are load-bearing. Cost, token, cache, latency
// and instrumentation deltas and deployment/release markers are not computed per
// run in this build, and aggregating them per row would hydrate every run. They are named as absent rather than omitted, because a client that
// saw no cost field could not tell "this build does not compute it" from "this
// run cost nothing".
message EvaluationRunSummaryV1 {
  string evaluation_run_id = 1;
  string definition_id = 2;
  string definition_revision_id = 3;
  EvaluationRunStateV1 state = 4;
  // Present from the moment a stop was ASKED FOR, which is before the run
  // reaches CANCELLED and is a different fact from reaching it. A history row
  // that showed only the terminal state could not distinguish a run somebody
  // stopped from one that failed on its own.
  //
  // The launch mode is deliberately NOT here: it lives in the frozen manifest,
  // and decoding fifty manifests to render fifty rows would hydrate every run.
  optional google.protobuf.Timestamp cancellation_requested_at = 5;
  PrincipalRefV1 launched_by = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp started_at = 8;
  optional google.protobuf.Timestamp finished_at = 9;
  string idempotency_key = 10;
  string accepted_preview_digest = 11;
  optional EvaluationFailureV1 failure = 12;

  // Header counts. Present for every run, because they are columns on the run
  // row itself and exist before any cell executes.
  uint32 expected_cell_count = 13;
  uint32 prepared_cell_count = 14;
  uint32 cancelled_cell_count = 15;

  // Projection counts. ABSENT as a group when the run has no projection row —
  // a run that has executed nothing has not "executed zero cells", it has not
  // been projected, and `projection_availability` says which.
  MetricAvailabilityV1 projection_availability = 16;
  uint64 projection_version = 17;
  uint32 executed_cell_count = 18;
  uint32 succeeded_cell_count = 19;
  uint32 failed_cell_count = 20;
  // Counted apart and never summed: a
  // run whose candidates all resolved and whose scorers all errored is a
  // different customer situation from the reverse.
  uint32 candidate_failure_count = 21;
  uint32 scorer_failure_count = 22;
  uint32 verdict_pass_count = 23;
  uint32 verdict_fail_count = 24;

  // What this build cannot serve from a list page. Each says why.
  MetricAvailabilityV1 cost_availability = 25;
  MetricAvailabilityV1 token_availability = 26;
  MetricAvailabilityV1 latency_availability = 27;
  MetricAvailabilityV1 instrumentation_availability = 28;
  MetricAvailabilityV1 release_marker_availability = 29;
}

message EvaluationRunListFilterV1 {
  // Empty means every state. A repeated enum rather than an optional scalar
  // because "the terminal ones" is one question, not four calls.
  repeated EvaluationRunStateV1 states = 1;
  // Half-open: [created_after, created_before). Adjacent windows neither
  // double-count a run nor drop one on the boundary, which is the rule
  // ListEvaluationScoreSeries already holds itself to.
  optional google.protobuf.Timestamp created_after = 2;
  optional google.protobuf.Timestamp created_before = 3;
  // Scratch runs are excluded from this list unless this is set, and are the
  // ONLY runs it returns when it is. There is no "both": a scratch run is not
  // evidence, so a history page that mixed the two would invite exactly the
  // comparison the mode exists to prevent. "Only scratch" is the builder's own
  // list of its in-flight iterations, which is why it needs no second RPC.
  bool only_scratch = 4;
}

message ListEvaluationRunsRequest {
  string definition_id = 1;
  o11y_one.common.v1.PageRequestV1 page = 2;
  // A page token already carries the filter it was minted under, so a request
  // sending both is answered with a typed resync rather than a silent
  // precedence rule.
  optional EvaluationRunListFilterV1 filter = 3;
}

message ListEvaluationRunsResponse {
  repeated EvaluationRunSummaryV1 runs = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // A cursor this build cannot honour returns a typed resync directive with an
  // empty page, never a transport error carrying prose.
  optional EvaluationCursorResyncV1 resync = 5;
}

// #616. A dataset a run's frozen cohorts drew from. `name` is the collection's
// CURRENT name, and is unset when the collection no longer exists.
message EvaluationRecentRunDatasetV1 {
  string dataset_collection_id = 1;
  optional string name = 2;
}

// #616. The run's latest ADOPTED decision revision, as recorded.
message EvaluationRecentRunVerdictV1 {
  EvaluationDecisionOutcomeV1 outcome = 1;
  // The method the revision was adopted under, never relabelled.
  string algorithm_version = 2;
  uint32 revision_ordinal = 3;
  optional string recommended_candidate_key = 4;
  optional string reference_candidate_key = 5;
  google.protobuf.Timestamp adopted_at = 6;
}

// #616. One row of the Loop overview's recent runs. Every field is read from
// stored data; an unset field is an absence its availability names.
message EvaluationRecentRunV1 {
  EvaluationRunSummaryV1 run = 1;
  string definition_display_name = 2;
  // From the frozen manifest. Unset only when the manifest cannot be read.
  optional uint32 case_count = 3;
  optional uint32 trials = 4;
  MetricAvailabilityV1 manifest_availability = 5;
  // One per frozen cohort. Empty, with NOT_SUPPORTED, for a live-trace run.
  repeated EvaluationRecentRunDatasetV1 datasets = 6;
  MetricAvailabilityV1 datasets_availability = 7;
  // The weakest class across the frozen scorers. Unset when any scorer was
  // frozen before the class existed: an unknown scorer is never read as
  // deterministic.
  optional EvaluationDeterminismClassV1 weakest_determinism_class = 8;
  MetricAvailabilityV1 determinism_availability = 9;
  // PENDING `no_decision_adopted` until somebody adopts one.
  optional EvaluationRecentRunVerdictV1 verdict = 10;
  MetricAvailabilityV1 verdict_availability = 11;
  // The decision's evidence, read from the run summary written when the run
  // finished (#637) and never derived per row. The headline is the recommended
  // candidate, else the sole challenger; with neither, these stay unset under
  // `no_single_headline`, and without a summary under
  // `run_summary_not_recorded`.
  optional string headline_candidate_key = 12;
  optional double p_value = 13;
  optional uint32 improved_case_count = 14;
  optional uint32 regressed_case_count = 15;
  optional double pass_at_k = 16;
  optional double pass_hat_k = 17;
  // Signed: the headline candidate's pass^k minus the reference's.
  optional double pass_hat_k_delta = 18;
  optional uint32 flaky_case_count = 19;
  MetricAvailabilityV1 decision_evidence_availability = 20;
  // #637. The evidence version the summary was computed over, and whether the
  // run's evidence has since moved past it. A stale summary is still served,
  // flagged, until the maintenance sweep refreshes it.
  optional uint64 summary_evidence_version = 21;
  bool summary_stale = 22;
  // #637. The method the summary was computed under, and whether it differs
  // from the adopted verdict's (`verdict.algorithm_version`): a run finished
  // before summaries existed is backfilled under today's method, and its
  // evidence must not read as the support for a verdict adopted under another.
  optional string summary_algorithm_version = 23;
  bool evidence_method_differs = 24;
  // #708. The headline's `CandidateTradeoffV1` figures and its decision's
  // alpha, copied from the summary and unset with the other headline fields.
  // `effect_size` is the signed net improved rate,
  // (improved - regressed) / aligned_pair_count, using this row's counts.
  optional double effect_size = 25;
  // Aligned pairs summed across the headline's scorers: pairs × scorers, not
  // cases.
  optional uint32 aligned_pair_count = 26;
  // Absent when `p_value` is: below a sample floor nothing was tested, which
  // is a different answer from NOT_SIGNIFICANT.
  optional EvaluationEffectDirectionV1 direction = 27;
  // The threshold `direction` was decided against, under the run's frozen
  // decision policy.
  optional double alpha = 28;
  // #694. The headline tradeoff's `quality_delta_interval`, copied from the
  // summary. Its availability says why it is unset: the headline fields' own
  // reasons, `pooled_across_scorers`, or `summary_predates_interval` for a
  // summary computed under a method before the interval existed, which is never
  // recomputed for that alone.
  optional ConfidenceIntervalV1 confidence_interval = 29;
  MetricAvailabilityV1 confidence_interval_availability = 30;
}

message ListRecentEvaluationRunsRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  // Empty means every state. UNSPECIFIED is refused, never a wildcard.
  repeated EvaluationRunStateV1 states = 2;
  // Matched against the latest adopted revision. Empty means every run,
  // including runs with no decision.
  repeated EvaluationDecisionOutcomeV1 decision_outcomes = 3;
}

message ListRecentEvaluationRunsResponse {
  repeated EvaluationRecentRunV1 runs = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  optional EvaluationCursorResyncV1 resync = 5;
}

// ===========================================================================
// Review task release and requeue
// ===========================================================================

// Why a task was put back into the queue.
//
// A requeue that said nothing would be a lease expiry with extra steps: the
// sweeper already returns abandoned work without a reason, and the whole
// difference an operator action makes is that somebody knows why.
enum EvaluationReviewRequeueReasonV1 {
  EVALUATION_REVIEW_REQUEUE_REASON_V1_UNSPECIFIED = 0;
  EVALUATION_REVIEW_REQUEUE_REASON_V1_REVIEWER_UNAVAILABLE = 1;
  EVALUATION_REVIEW_REQUEUE_REASON_V1_AMBIGUOUS_GUIDANCE = 2;
  EVALUATION_REVIEW_REQUEUE_REASON_V1_WRONG_REVIEWER_POOL = 3;
  EVALUATION_REVIEW_REQUEUE_REASON_V1_CONTENT_UNREADABLE = 4;
  EVALUATION_REVIEW_REQUEUE_REASON_V1_OPERATOR_REBALANCE = 5;
}

enum EvaluationReviewTaskRefusalKindV1 {
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  // The caller does not hold a live reservation on a named task.
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_NOT_HELD_BY_CALLER = 1;
  // A named task id is not on this run, or is outside the caller's scope.
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_TASK_NOT_FOUND = 2;
  // The reviewer already submitted; a submission is evidence and is not undone
  // by giving the task back.
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_ALREADY_SUBMITTED = 3;
  // Requeue only: the task still holds a live reservation, so returning it to
  // the pool would take work away from a reviewer mid-review.
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_STILL_RESERVED = 4;
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_BATCH_TOO_LARGE = 5;
  // Targeted claim only. The unit behind a named task is no
  // longer collecting reviews at all — its completion policy is met, it is in
  // adjudication, or it was waived.
  //
  // Its own arm rather than a reuse of the two that nearly fit.
  // `_ALREADY_SUBMITTED` is about the CALLER's own answer and would be a lie
  // when other people finished the unit; `_STILL_RESERVED` asserts a live
  // reservation that by then does not exist. A refusal a client cannot act on
  // correctly is worse than one it does not recognise.
  EVALUATION_REVIEW_TASK_REFUSAL_KIND_V1_UNIT_NO_LONGER_OPEN = 6;
}

// The typed refusal both verbs raise, in `Status::details`.
//
// Every offending task, not the first: these verbs refuse whole, and reporting
// one at a time would make fixing a ten-task batch a ten-round trip.
message EvaluationReviewTaskRefusalV1 {
  EvaluationReviewTaskRefusalKindV1 kind = 1;
  string reason_code = 2;
  repeated string offending_review_task_ids = 3;
  RecoveryActionV1 recovery = 4;
  string detail = 5;
}

message ReleaseEvaluationReviewTasksRequest {
  string evaluation_run_id = 1;
  // Bounded by the same cap the claim publishes: a reviewer cannot give back
  // more than they can hold.
  repeated string review_task_ids = 2;
  string idempotency_key = 3;
}

message ReleaseEvaluationReviewTasksResponse {
  // The tasks this call released. Empty when every named task was already
  // released, which is a confirmation and never an error.
  repeated string released_review_task_ids = 1;
  // Named tasks that were already released before this call. Separated from the
  // list above so a retried release is distinguishable from a fresh one.
  repeated string already_released_review_task_ids = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message RequeueEvaluationReviewTasksRequest {
  string evaluation_run_id = 1;
  repeated string review_task_ids = 2;
  EvaluationReviewRequeueReasonV1 reason = 3;
  string idempotency_key = 4;
}

message RequeueEvaluationReviewTasksResponse {
  repeated string requeued_review_task_ids = 1;
  // Named tasks already sitting in the open pool. A confirmation, not an error.
  repeated string already_pending_review_task_ids = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

// ===========================================================================
// Service
// ===========================================================================

service AgenticEvaluationService {
  rpc CreateEvaluationDefinition(CreateEvaluationDefinitionRequest) returns (CreateEvaluationDefinitionResponse);
  rpc UpdateEvaluationDefinition(UpdateEvaluationDefinitionRequest) returns (UpdateEvaluationDefinitionResponse);
  rpc GetEvaluationDefinition(GetEvaluationDefinitionRequest) returns (GetEvaluationDefinitionResponse);
  rpc ListEvaluationDefinitions(ListEvaluationDefinitionsRequest) returns (ListEvaluationDefinitionsResponse);
  rpc GetEvaluationBuilderContext(GetEvaluationBuilderContextRequest) returns (GetEvaluationBuilderContextResponse);
  rpc PreviewEvaluationRun(PreviewEvaluationRunRequest) returns (PreviewEvaluationRunResponse);
  rpc CreateEvaluationRun(CreateEvaluationRunRequest) returns (CreateEvaluationRunResponse);
  rpc GetEvaluationOperation(GetEvaluationOperationRequest) returns (GetEvaluationOperationResponse);
  rpc CancelEvaluationRun(CancelEvaluationRunRequest) returns (CancelEvaluationRunResponse);
  rpc GetEvaluationRunOverview(GetEvaluationRunOverviewRequest) returns (GetEvaluationRunOverviewResponse);
  rpc PreviewRetryEvaluationCells(PreviewRetryEvaluationCellsRequest) returns (PreviewRetryEvaluationCellsResponse);
  rpc RetryEvaluationCells(RetryEvaluationCellsRequest) returns (RetryEvaluationCellsResponse);
  rpc PreviewEvaluationDecision(PreviewEvaluationDecisionRequest) returns (PreviewEvaluationDecisionResponse);
  rpc AdoptEvaluationDecisionRevision(AdoptEvaluationDecisionRevisionRequest) returns (AdoptEvaluationDecisionRevisionResponse);
  // #710. Each aligned case's collapsed outcome against the reference,
  // regressions first.
  rpc ListEvaluationCaseMovements(ListEvaluationCaseMovementsRequest) returns (ListEvaluationCaseMovementsResponse);
  rpc ListEvaluationMatrixRows(ListEvaluationMatrixRowsRequest) returns (ListEvaluationMatrixRowsResponse);
  rpc BatchGetEvaluationCellDetails(BatchGetEvaluationCellDetailsRequest) returns (BatchGetEvaluationCellDetailsResponse);
  rpc ListEvaluationRunChanges(ListEvaluationRunChangesRequest) returns (ListEvaluationRunChangesResponse);

  // The same feed as `ListEvaluationRunChanges`, pushed instead of polled: same
  // request, same response message, same cursor semantics — it IS that verb, on
  // one RPC. The server re-reads the journal every poll interval and sends a
  // page whenever that read found changes. The first page is always sent, so
  // `run_terminal`, `allowed_actions` and `capabilities` arrive immediately
  // rather than after the first change. The stream ends, `OK`, once a page
  // reports `run_terminal` with no further page to drain.
  rpc WatchEvaluationRunChanges(ListEvaluationRunChangesRequest) returns (stream ListEvaluationRunChangesResponse);

  rpc GetExecutionArtifactContent(GetEvaluationArtifactContentRequest) returns (GetEvaluationArtifactContentResponse);
  rpc BatchGetExecutionArtifactContents(BatchGetEvaluationArtifactContentsRequest) returns (BatchGetEvaluationArtifactContentsResponse);
  rpc ListEvaluationReviewTasks(ListEvaluationReviewTasksRequest) returns (ListEvaluationReviewTasksResponse);
  rpc ClaimEvaluationReviewTasks(ClaimEvaluationReviewTasksRequest) returns (ClaimEvaluationReviewTasksResponse);
  rpc GetEvaluationReviewTask(GetEvaluationReviewTaskRequest) returns (GetEvaluationReviewTaskResponse);
  rpc SubmitEvaluationReview(SubmitEvaluationReviewRequest) returns (SubmitEvaluationReviewResponse);
  rpc CreateEvaluationExport(CreateEvaluationExportRequest) returns (CreateEvaluationExportResponse);
  rpc GetEvaluationExport(GetEvaluationExportRequest) returns (GetEvaluationExportResponse);
  rpc CreateEvaluationExportDownload(CreateEvaluationExportDownloadRequest) returns (CreateEvaluationExportDownloadResponse);
  // #636. Every export in the caller's organisation, newest first, keyset on
  // `(created_at DESC, id DESC)`. Empty for a tenant fenced for offboarding.
  rpc ListEvaluationExports(ListEvaluationExportsRequest) returns (ListEvaluationExportsResponse);
  rpc CreateEvaluationShare(CreateEvaluationShareRequest) returns (CreateEvaluationShareResponse);
  rpc GetEvaluationShare(GetEvaluationShareRequest) returns (GetEvaluationShareResponse);
  rpc RevokeEvaluationShare(RevokeEvaluationShareRequest) returns (RevokeEvaluationShareResponse);
  rpc GetEvaluationOperationBreakdown(GetEvaluationOperationBreakdownRequest) returns (GetEvaluationOperationBreakdownResponse);
  rpc ListEvaluationDefinitionRevisions(ListEvaluationDefinitionRevisionsRequest) returns (ListEvaluationDefinitionRevisionsResponse);
  rpc AdjudicateEvaluationReviewConflict(AdjudicateEvaluationReviewConflictRequest) returns (AdjudicateEvaluationReviewConflictResponse);
  rpc PreviewRetryEvaluationScorers(PreviewRetryEvaluationScorersRequest) returns (PreviewRetryEvaluationScorersResponse);
  rpc RetryEvaluationScorers(RetryEvaluationScorersRequest) returns (RetryEvaluationScorersResponse);
  rpc RecordEvaluationOrgNegotiatedRate(RecordEvaluationOrgNegotiatedRateRequest) returns (RecordEvaluationOrgNegotiatedRateResponse);
  rpc ListEvaluationOrgNegotiatedRates(ListEvaluationOrgNegotiatedRatesRequest) returns (ListEvaluationOrgNegotiatedRatesResponse);
  rpc EndEvaluationOrgNegotiatedRate(EndEvaluationOrgNegotiatedRateRequest) returns (EndEvaluationOrgNegotiatedRateResponse);
  rpc VoidEvaluationOrgNegotiatedRate(VoidEvaluationOrgNegotiatedRateRequest) returns (VoidEvaluationOrgNegotiatedRateResponse);
  // One series, read by this RPC and by dashboard panels and alerts.
  rpc ListEvaluationScoreSeries(ListEvaluationScoreSeriesRequest) returns (ListEvaluationScoreSeriesResponse);
  // A trace span or a matrix cell becomes a proposed case revision in a
  // dataset-version draft, stamped with where it came from.
  rpc CaptureEvaluationCase(CaptureEvaluationCaseRequest) returns (CaptureEvaluationCaseResponse);
  // The three authoring verbs behind the builder's three readiness findings: a
  // credential an org can register, a scorer it can author over the retained
  // comparators, and a dataset version it can upload or finalize from a capture
  // draft.
  rpc RegisterEvaluationProviderCredential(RegisterEvaluationProviderCredentialRequest) returns (RegisterEvaluationProviderCredentialResponse);
  rpc CreateEvaluationScorerConfig(CreateEvaluationScorerConfigRequest) returns (CreateEvaluationScorerConfigResponse);
  // #1110. A judge that asks 1 to 16 typed questions in one call, each its own
  // score configuration. Authoring an existing key revises it in one
  // transaction, refused whole when a run pinned any question; archiving it
  // archives every question.
  rpc CreateEvaluationJudge(CreateEvaluationJudgeRequest) returns (CreateEvaluationJudgeResponse);
  rpc GetEvaluationJudge(GetEvaluationJudgeRequest) returns (GetEvaluationJudgeResponse);
  rpc ArchiveEvaluationJudge(ArchiveEvaluationJudgeRequest) returns (ArchiveEvaluationJudgeResponse);
  // #618. A deterministic scorer spec run on one sample through the real
  // compile and scoring path. Stores nothing.
  rpc PreviewEvaluationScorer(PreviewEvaluationScorerRequest) returns (PreviewEvaluationScorerResponse);
  // #709. A deterministic scorer spec scored over a finished run's retained
  // candidate outputs, a page at a time. Stores nothing.
  rpc CheckEvaluationScorerAgainstRun(CheckEvaluationScorerAgainstRunRequest) returns (CheckEvaluationScorerAgainstRunResponse);
  rpc CreateEvaluationDatasetVersion(CreateEvaluationDatasetVersionRequest) returns (CreateEvaluationDatasetVersionResponse);
  // The per-credential kill switch, enforced at execution planning: a
  // switched-off key is refused by the preview, by the launch and by a cell
  // retry, through the EXISTING `no_provider_credential` code and a posture
  // that says which of the two situations it is.
  rpc SetEvaluationProviderCredentialEnabled(SetEvaluationProviderCredentialEnabledRequest) returns (SetEvaluationProviderCredentialEnabledResponse);
  // A scorer suite: members by score config id, one declarative combine rule,
  // frozen into the run manifest like any scorer.
  rpc CreateEvaluationScorerSuite(CreateEvaluationScorerSuiteRequest) returns (CreateEvaluationScorerSuiteResponse);
  // The async judge-regrade pair: one verb that ACCEPTS a regrade (writing
  // rows, calling nothing) and one that reads the job's progress. The provider
  // calls happen on a worker loop, metered through the same path an in-run
  // judge is, and added to the run's evaluator totals.
  rpc RequestEvaluationJudgeRegrade(RequestEvaluationJudgeRegradeRequest) returns (RequestEvaluationJudgeRegradeResponse);
  rpc GetEvaluationJudgeRegradeJob(GetEvaluationJudgeRegradeJobRequest) returns (GetEvaluationJudgeRegradeJobResponse);
  // What a regrade WOULD do and cost before any of it happens, quoted under the
  // judge the job would freeze; and a stop button with a run's cancel-vs-claim
  // semantics: a cell in flight finishes and is billed, the rest are stamped
  // `CANCELLED`, and the spend already incurred stays on the ledger.
  rpc PreviewEvaluationJudgeRegrade(PreviewEvaluationJudgeRegradeRequest) returns (PreviewEvaluationJudgeRegradeResponse);
  rpc CancelEvaluationJudgeRegradeJob(CancelEvaluationJudgeRegradeJobRequest) returns (CancelEvaluationJudgeRegradeJobResponse);
  // Run history for one definition, keyset-paged on `(created_at DESC, id
  // DESC)` — the id half is not decoration: run creation is not serialized by a
  // per-definition counter, so a cursor carrying only a timestamp would skip or
  // repeat two runs that shared a microsecond.
  rpc ListEvaluationRuns(ListEvaluationRunsRequest) returns (ListEvaluationRunsResponse);
  // #616. Every run in the caller's organisation, newest first, with the
  // summary the Loop overview's recent-runs table renders. Same keyset and
  // resync discipline as `ListEvaluationRuns`.
  rpc ListRecentEvaluationRuns(ListRecentEvaluationRunsRequest) returns (ListRecentEvaluationRunsResponse);
  // Release is a reviewer giving a task back; requeue is an operator returning one
  // to the pool WITH a typed reason. Both are bounded by the claim's own cap, and
  // both refuse whole.
  rpc ReleaseEvaluationReviewTasks(ReleaseEvaluationReviewTasksRequest) returns (ReleaseEvaluationReviewTasksResponse);
  rpc RequeueEvaluationReviewTasks(RequeueEvaluationReviewTasksRequest) returns (RequeueEvaluationReviewTasksResponse);
  // What a capture WOULD produce, before it produces it: the mapped fields as they
  // would land, the span-content references as they hydrated, and the digest that
  // binds this answer to the capture that follows. The preview and the capture
  // cannot disagree, and the preview writes nothing.
  rpc PreviewEvaluationCaseCapture(PreviewEvaluationCaseCaptureRequest) returns (PreviewEvaluationCaseCaptureResponse);

  // ==========================================================================
  // Production rules
  // ==========================================================================
  rpc ListProductionEvaluationRules(ListProductionEvaluationRulesRequest) returns (ListProductionEvaluationRulesResponse);
  rpc GetProductionEvaluationRule(GetProductionEvaluationRuleRequest) returns (GetProductionEvaluationRuleResponse);

  // Rule versions are immutable: a change is a new version.
  rpc CreateProductionEvaluationRule(CreateProductionEvaluationRuleRequest) returns (CreateProductionEvaluationRuleResponse);
  rpc CreateProductionEvaluationRuleVersion(CreateProductionEvaluationRuleVersionRequest) returns (CreateProductionEvaluationRuleVersionResponse);
  rpc SetProductionEvaluationRuleVersionState(SetProductionEvaluationRuleVersionStateRequest) returns (SetProductionEvaluationRuleVersionStateResponse);

  // A READ: a preview persists nothing.
  rpc PreviewProductionEvaluationRule(PreviewProductionEvaluationRuleRequest) returns (PreviewProductionEvaluationRuleResponse);

  // -------------------------------------------------------------------------
  // Production workflows
  // -------------------------------------------------------------------------
  rpc ListProductionEvaluationWorkflowExecutions(ListProductionEvaluationWorkflowExecutionsRequest) returns (ListProductionEvaluationWorkflowExecutionsResponse);
  rpc GetProductionEvaluationWorkflowExecution(GetProductionEvaluationWorkflowExecutionRequest) returns (GetProductionEvaluationWorkflowExecutionResponse);

  // The trigger. Called by whatever scored a production trace, carrying the
  // outcome it produced.
  //
  // Idempotent on `(tenant, org, rule_version_id, match_key)`: a re-delivered
  // production match is ONE execution, not two.
  rpc StartProductionEvaluationWorkflow(StartProductionEvaluationWorkflowRequest) returns (StartProductionEvaluationWorkflowResponse);

  // One step, a NEW attempt, and no re-dispatch of a delivery that already
  // landed.
  rpc RetryProductionEvaluationWorkflowStep(RetryProductionEvaluationWorkflowStepRequest) returns (RetryProductionEvaluationWorkflowStepResponse);

  // A block ledger the RELEASE GATE can read: durable policy evidence that
  // something other than the workflow that produced it can read.
  rpc ListProductionEvaluationReleaseBlocks(ListProductionEvaluationReleaseBlocksRequest) returns (ListProductionEvaluationReleaseBlocksResponse);
  rpc OverrideProductionEvaluationReleaseBlock(OverrideProductionEvaluationReleaseBlockRequest) returns (OverrideProductionEvaluationReleaseBlockResponse);

  // ---- releases ----
  //
  // The signed-webhook CALLBACK ingress is an HTTP integration route, not a gRPC
  // method.

  // Integration configuration. A release integration is NOT a
  // `ReleaseDestinationV1`: that is a notification channel. Responses never carry
  // secret material: a signing secret appears only as a key id and a reference.
  rpc CreateReleaseIntegration(CreateReleaseIntegrationRequest) returns (CreateReleaseIntegrationResponse);
  rpc GetReleaseIntegration(GetReleaseIntegrationRequest) returns (GetReleaseIntegrationResponse);
  rpc ListReleaseIntegrations(ListReleaseIntegrationsRequest) returns (ListReleaseIntegrationsResponse);
  rpc UpdateReleaseIntegration(UpdateReleaseIntegrationRequest) returns (UpdateReleaseIntegrationResponse);
  rpc ArchiveReleaseIntegration(ArchiveReleaseIntegrationRequest) returns (ArchiveReleaseIntegrationResponse);

  // Release creation and the reads. Both reads make ZERO external calls.
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse);
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);

  // Zero adapter calls and zero external mutation, asserted rather than
  // promised: the response carries the count it made.
  rpc PreviewRelease(PreviewReleaseRequest) returns (PreviewReleaseResponse);

  // The five action verbs. Each records a durable `_REQUESTED` action and
  // returns; nothing leaves the process inside the caller's timeout. Hold, abort
  // and rollback require a typed reason and an actor.
  rpc StartReleaseCanary(StartReleaseCanaryRequest) returns (StartReleaseCanaryResponse);
  rpc PromoteRelease(PromoteReleaseRequest) returns (PromoteReleaseResponse);
  rpc HoldRelease(HoldReleaseRequest) returns (HoldReleaseResponse);
  rpc AbortRelease(AbortReleaseRequest) returns (AbortReleaseResponse);
  rpc RollbackRelease(RollbackReleaseRequest) returns (RollbackReleaseResponse);

  // The action ledger. Four states and four timestamps are readable separately,
  // because collapsing accepted into observed would hide a canary's progress.
  rpc GetReleaseAction(GetReleaseActionRequest) returns (GetReleaseActionResponse);
  rpc ListReleaseActions(ListReleaseActionsRequest) returns (ListReleaseActionsResponse);
  // ---- end of releases ----

  // ---- datasets: schema, projections, reads ----
  //
  // `ListDatasetVersions` shares a name with a verb on the legacy
  // `AgenticObservabilityService`: a different service with different message
  // types. This one carries freshness, an availability posture and the draft
  // state.
  rpc GetDatasetSchemaRevision(GetDatasetSchemaRevisionRequest) returns (GetDatasetSchemaRevisionResponse);

  // `INITIAL_PAGE`/`PAGE`: at most 512 KiB and 50 rows, with no external call.
  // The recent-performance posture comes with the page, so the cost is constant
  // in page size.
  rpc ListDatasetCases(ListDatasetCasesRequest) returns (ListDatasetCasesResponse);

  // `SELECTED_DETAIL`. Carries the immutable revision, the retained lineage with
  // its anchor availability, the external-artifact posture, and the bounded
  // recent performance.
  rpc GetDatasetCase(GetDatasetCaseRequest) returns (GetDatasetCaseResponse);

  // `SUMMARY`, backed by the quality projection.
  rpc GetDatasetOverview(GetDatasetOverviewRequest) returns (GetDatasetOverviewResponse);
  rpc ListDatasetVersions(ListEvaluationDatasetVersionsRequest) returns (ListEvaluationDatasetVersionsResponse);
  // `PAGE`, bounded. Never a lineage scan.
  rpc ListDatasetUsage(ListDatasetUsageRequest) returns (ListDatasetUsageResponse);
  // ---- end of dataset reads ----

  // ---- datasets: draft review and publish ----
  //
  // The lifecycle between `CaptureEvaluationCase` / `PreviewEvaluationCaseCapture`
  // and `CreateEvaluationDatasetVersion`.

  // A draft in another organisation is `NOT_FOUND`, never `PERMISSION_DENIED`,
  // which would confirm it exists, and no source artifact crosses: the lineage
  // carries references and postures, never a body and never a storage
  // coordinate.
  rpc GetDatasetCaseDraft(GetDatasetCaseDraftRequest) returns (GetDatasetCaseDraftResponse);
  rpc ListDatasetCaseDrafts(ListDatasetCaseDraftsRequest) returns (ListDatasetCaseDraftsResponse);

  // A reviewer's outcomes, acting WITHOUT a review task.
  //
  // The review plane is the other entry point (`SubmitEvaluationReview` takes a
  // typed `dataset_case_outcome`). Both bind against `draft_version`, so they
  // cannot both win.
  rpc UpdateDatasetCaseDraft(UpdateDatasetCaseDraftRequest) returns (UpdateDatasetCaseDraftResponse);
  rpc ApproveDatasetCaseDraft(ApproveDatasetCaseDraftRequest) returns (ApproveDatasetCaseDraftResponse);
  rpc RejectDatasetCaseDraft(RejectDatasetCaseDraftRequest) returns (RejectDatasetCaseDraftResponse);
  rpc MergeDatasetCaseDraft(MergeDatasetCaseDraftRequest) returns (MergeDatasetCaseDraftResponse);

  // Preview-then-commit is TWO round trips by design. The preview issues a
  // digest; the publish echoes it and the server recomputes it from what it is
  // about to commit. A mismatch is `FAILED_PRECONDITION` and never a silent
  // rebase.
  rpc PreviewPublishDatasetChangeset(PreviewPublishDatasetChangesetRequest) returns (PreviewPublishDatasetChangesetResponse);

  // The new immutable version, the case identities, the new or reused case
  // revisions, the `_PUBLISHED` transitions and the outbox rows commit
  // TOGETHER; the linked evaluations dispatch from the outbox AFTER the commit,
  // through the one launch path. A downstream failure leaves the version
  // intact.
  rpc PublishDatasetCaseDrafts(PublishDatasetCaseDraftsRequest) returns (PublishDatasetCaseDraftsResponse);
  // ---- end of draft review and publish ----

  // ---- machine principals and credentials ----
  //
  // All five management verbs are USER-only. A machine principal cannot mint
  // principals or credentials and so cannot widen its own authority; only
  // `GetCallerPrincipal` is reachable by a machine credential.

  // Mint an org-scoped machine principal carrying a typed `ScopeSet`. An
  // unknown scope discriminant is `INVALID_ARGUMENT`, never a silently dropped
  // element — a principal that was created with fewer powers than the caller
  // asked for is a security surprise in the safe direction and a debugging
  // nightmare in every other one.
  rpc CreateMachinePrincipal(CreateMachinePrincipalRequest) returns (CreateMachinePrincipalResponse);

  // Management list. Carries no secret material and no credential secrets: the
  // credential summaries it embeds are the same `MachineCredentialV1` the rest
  // of the surface uses, which has no field material could travel in.
  rpc ListMachinePrincipals(ListMachinePrincipalsRequest) returns (ListMachinePrincipalsResponse);

  // The ONLY message in this contract that carries plaintext credential
  // material, in the field `plaintext_token_once`, exactly once, with no
  // read-back path anywhere. Losing it means rotating, which is why a principal
  // may hold several ACTIVE credentials at a time.
  rpc CreateMachineCredential(CreateMachineCredentialRequest) returns (CreateMachineCredentialResponse);

  // Revocation takes effect on the NEXT request, not on a cache-TTL boundary.
  rpc RevokeMachineCredential(RevokeMachineCredentialRequest) returns (RevokeMachineCredentialResponse);

  // Revokes the principal AND every credential it holds, each with its own
  // cache invalidation. A principal whose credentials outlived it would be a
  // revocation that did not revoke.
  rpc RevokeMachinePrincipal(RevokeMachinePrincipalRequest) returns (RevokeMachinePrincipalResponse);

  // "Is my token valid and what can it do?" — the first call an SDK makes.
  // Reachable by any valid machine credential with NO scope requirement,
  // because requiring a scope to ask which scopes you hold makes the question
  // unanswerable for exactly the token that needs to ask it. It introspects the
  // caller and only the caller; there is no principal id in the request.
  //
  // A browser session may also call it, and gets its own USER principal back —
  // which is what lets one SDK code path work in both modes without branching.
  rpc GetCallerPrincipal(GetCallerPrincipalRequest) returns (GetCallerPrincipalResponse);
  // ---- end of machine principals ----

  // ---- externally executed candidates ----
  //
  // A lease's fence is checked on every verb; a verb that matches no live lease
  // is the only proof the lease was lost.

  // The claim. Bounded batch, one statement, and a reclaim: a lease whose
  // holder vanished is retaken by the next claim rather than by a sweep, which
  // is the property that makes an abandoned runtime cost one TTL and not a run.
  rpc LeaseEvaluationCases(LeaseEvaluationCasesRequest) returns (LeaseEvaluationCasesResponse);

  // The heartbeat. Expiry-only and fenced, never a re-claim: a renewal that
  // could also claim would let a heartbeat silently grow its own batch.
  rpc RenewEvaluationCaseLease(RenewEvaluationCaseLeaseRequest) returns (RenewEvaluationCaseLeaseResponse);

  // The fenced submit. Idempotent by coordinate and generation, so a resubmitted
  // batch converges with no duplicate facts and no double-counted economics;
  // partial by construction, so one malformed case never fails its batch.
  // Scoring is NOT done here: the submission moves the cell to `QUEUED` and the
  // server's own executor scores it.
  rpc SubmitEvaluationCaseOutputs(SubmitEvaluationCaseOutputsRequest) returns (SubmitEvaluationCaseOutputsResponse);

  // The good citizen's exit. Without it, a runtime that fails cleanly must wait
  // out its whole TTL before anyone can retake its cases, and typed abandonment
  // would be the only way to give work back.
  rpc ReleaseEvaluationCaseLease(ReleaseEvaluationCaseLeaseRequest) returns (ReleaseEvaluationCaseLeaseResponse);
  // ---- end of externally executed candidates ----

  // ---- O11Y-633: record and replay, on the same lease fence ----
  // Stores a leased case's steps; acknowledged only once stored. Record, then
  // submit: a replay answers from the recording of the execution whose
  // submission is the case's verdict, so a case's steps are recorded, its last
  // chunk included, before its output is submitted. A chunk for a case this
  // lease already submitted is rejected `case_already_submitted`.
  rpc RecordEvaluationCaseSteps(RecordEvaluationCaseStepsRequest) returns (RecordEvaluationCaseStepsResponse);
  // Answers one step of a REPLAY candidate's case with its recorded response,
  // or records the divergence on the case. A lookup on a case that already has
  // its verdict is refused `CASE_ALREADY_SUBMITTED`, for that case alone.
  rpc LookupReplayStep(LookupReplayStepRequest) returns (LookupReplayStepResponse);
  // ---- #591: the replay read API ----
  // A run's replay cases, each with its outcome against the recording it
  // replays. NOT_FOUND for a run outside the caller's organisation.
  rpc ListEvaluationReplays(ListEvaluationReplaysRequest) returns (ListEvaluationReplaysResponse);
  // One replay case: its recorded steps a page at a time, and for a
  // divergence the recorded and replayed requests, each body capped at the
  // published limit.
  rpc GetEvaluationReplay(GetEvaluationReplayRequest) returns (GetEvaluationReplayResponse);
  // #639. The organisation's decided replays across every run, newest verdict
  // first. Empty for a tenant fenced for offboarding.
  rpc ListOrganizationReplays(ListOrganizationReplaysRequest) returns (ListOrganizationReplaysResponse);

  // ---- platform annotations ----
  //
  // Typed annotations, such as deploy markers, kept beyond the telemetry
  // lifecycle. Separate from the human-review annotation tasks: nothing here
  // reads or writes an annotation TASK.

  // `MUTATION_ACK`. Idempotency-keyed, machine-principal attributable, and
  // required-scope `PLATFORM_ANNOTATION_WRITE`.
  //
  // A deploy marker whose kind this build does not know is REFUSED, and the
  // refusal carries the capability envelope — so a newer runner learns which
  // kinds this server supports and can downgrade to `_MARKER` rather than
  // dropping the annotation on the floor.
  rpc RecordPlatformAnnotation(RecordPlatformAnnotationRequest) returns (RecordPlatformAnnotationResponse);

  // `INITIAL_PAGE`. A time window, an optional kind filter, keyset-paged,
  // newest-first. Constant in the page size and in the filter's cardinality.
  rpc ListPlatformAnnotations(ListPlatformAnnotationsRequest) returns (ListPlatformAnnotationsResponse);
  // ---- end of platform annotations ----

  // ---- capture (O11Y-366) ----
  //
  // Machine callers are refused.
  rpc CaptureScore(CaptureScoreRequest) returns (CaptureScoreResponse);
  rpc CaptureFeedback(CaptureFeedbackRequest) returns (CaptureFeedbackResponse);
  rpc CaptureOutcome(CaptureOutcomeRequest) returns (CaptureOutcomeResponse);
  rpc CaptureContentManifest(CaptureContentManifestRequest) returns (CaptureContentManifestResponse);
  // ---- end O11Y-366 ----

  // ---- prompt templates (O11Y-367) ----
  //
  // `MUTATION_ACK` and `INITIAL_PAGE`.
  rpc UpsertEvaluationPromptTemplate(UpsertEvaluationPromptTemplateRequest) returns (UpsertEvaluationPromptTemplateResponse);
  rpc ListEvaluationPromptTemplates(ListEvaluationPromptTemplatesRequest) returns (ListEvaluationPromptTemplatesResponse);
  // ---- end O11Y-367 ----

  // =========================================================================
  // The scorer LIBRARY: its reads, and the two archive verbs.
  // =========================================================================

  // `INITIAL_PAGE`. The library page, keyset-paged on `config_key`.
  //
  // EVERY score configuration in the organisation, including archived ones, and
  // with no picker ceiling. `authored_on_this_surface` says how a row was
  // authored; `kind = UNSPECIFIED` is a real answer and means a scorer authored
  // outside `CreateEvaluationScorerConfig`.
  rpc ListEvaluationScorerConfigs(ListEvaluationScorerConfigsRequest) returns (ListEvaluationScorerConfigsResponse);

  // `SELECTED_DETAIL`. The WHOLE authored spec: a judge's `instructions`,
  // `verdict_mappings` and `subject_path`, plus the resolved provider execution,
  // plus the deterministic spec and the review policy for the other two kinds.
  // Optional `version_discriminator` addresses a superseded version.
  rpc GetEvaluationScorerConfig(GetEvaluationScorerConfigRequest) returns (GetEvaluationScorerConfigResponse);

  // `PAGE`. The version history. A revision makes a new version rather than
  // mutating the old one, and those versions ARE the history.
  rpc ListEvaluationScorerConfigVersions(ListEvaluationScorerConfigVersionsRequest) returns (ListEvaluationScorerConfigVersionsResponse);

  // `INITIAL_PAGE` / `SELECTED_DETAIL`. The suite reads.
  //
  // The detail's members carry their OWN posture (archived, kind, version), so a
  // suite page can say "this member is archived" before the customer meets it
  // at launch as a `MISSING_DEPENDENCY` / `scorer_archived` blocker.
  rpc ListEvaluationScorerSuites(ListEvaluationScorerSuitesRequest) returns (ListEvaluationScorerSuitesResponse);
  rpc GetEvaluationScorerSuite(GetEvaluationScorerSuiteRequest) returns (GetEvaluationScorerSuiteResponse);

  // `MUTATION_ACK`. Retirement, and it is UNCONDITIONAL.
  //
  // Launch already refuses an archived scorer by name (`scorer_archived`), for
  // an explicit selection and for a suite member alike, and a production rule
  // version that depends on one is disabled with `dependency_archived`. So
  // archiving is never refused for a suite membership, a definition reference, a
  // production rule or a run pin: it mutates no template and no manifest.
  // Instead the response returns the STANDING REFERENCES, so an operator sees
  // the blast radius at the one moment it changes a decision.
  //
  // There is no unarchive verb and no idempotency key: a monotone state flip is
  // replayable by construction, and `already_archived` rides back on the
  // response rather than being an error.
  //
  // #1110: the one refusal is a question its judge still asks,
  // KIND_SPEC_MISMATCH `scorer_config_belongs_to_judge`, since the judge would
  // revive it on its next revision; ArchiveEvaluationJudge archives every
  // question. One a revision dropped is already archived and answers so.
  rpc ArchiveEvaluationScorerConfig(ArchiveEvaluationScorerConfigRequest) returns (ArchiveEvaluationScorerConfigResponse);

  // `MUTATION_ACK`. Same semantics, and NO launched-run refusal: a launched run
  // froze its suite, so archiving cannot change it.
  rpc ArchiveEvaluationScorerSuite(ArchiveEvaluationScorerSuiteRequest) returns (ArchiveEvaluationScorerSuiteResponse);
  // ---- end of the scorer library ----

  // ---- datasets: collections and changesets ----
  //
  // `ListDatasetCollections`, like `ListDatasetVersions`, shares its verb name
  // with the legacy `AgenticObservabilityService`; its messages carry the
  // `Evaluation` infix. This one carries an availability posture, freshness and
  // the changeset state.
  //
  // `PAGE`. The per-collection counts come with the page, so the cost is
  // constant in the page size.
  rpc ListDatasetCollections(ListEvaluationDatasetCollectionsRequest) returns (ListEvaluationDatasetCollectionsResponse);

  // The changeset reads.
  //
  // A changeset is written by capture, moved by `PreviewPublishDatasetChangeset`
  // and committed by `PublishDatasetCaseDrafts`. These reads tell a reviewer
  // coming back later whether a changeset is open on a collection, what state it
  // is in, and whether its base version has moved under it.
  //
  // `SELECTED_DETAIL`: the changeset and the collection's ACTIVE version, because
  // "has my base moved?" is a question the server answers.
  rpc GetDatasetChangeset(GetDatasetChangesetRequest) returns (GetDatasetChangesetResponse);

  // `PAGE`. Offset-paged and state-filtered, matching `ListDatasetCaseDrafts`. An
  // EMPTY `states` means the LIVE set and never "all": a queue whose default
  // included committed and abandoned changesets would bury the work under its
  // own history.
  rpc ListDatasetChangesets(ListDatasetChangesetsRequest) returns (ListDatasetChangesetsResponse);
  // ---- end of collections and changesets ----

  // The Production Attention inbox. One read over what is already computed;
  // every item kind has a typed source, and the kinds that have none are
  // reported as typed absences rather than omitted. See the block at the end of
  // this file.
  rpc ListProductionAttentionItems(ListProductionAttentionItemsRequest) returns (ListProductionAttentionItemsResponse);

  // The capability set, served once instead of ridden on every response.
  //
  // Every response on this surface and on `AgenticTraceViewService` embeds an
  // `AgenticEvaluationCapabilitiesV1`; from version 51 that embedded copy is a
  // STAMP (version and instant, no postures), and this is where the postures
  // live. One RPC serves both services.
  //
  // `SUMMARY`. Scope-free for a machine principal: a machine that must discover
  // what it may do before it plans cannot be asked for a scope in order to ask.
  rpc GetAgenticEvaluationCapabilities(GetAgenticEvaluationCapabilitiesRequest) returns (GetAgenticEvaluationCapabilitiesResponse);
  // (#611) A member runs a code scorer on one input it supplies, as one PREVIEW
  // sandbox job: no score and no dataset row is written, and it bills. The
  // start returns at once; the read answers the job's status and result.
  rpc StartEvaluationScorerPreview(StartEvaluationScorerPreviewRequest) returns (StartEvaluationScorerPreviewResponse);
  rpc GetEvaluationScorerPreview(GetEvaluationScorerPreviewRequest) returns (GetEvaluationScorerPreviewResponse);
  // (#611) An admin publishes a code scorer's draft: a conformance run on each
  // declared smoke input, then the repeatability trials its determinism class
  // asks for, all asynchronous. `GetEvaluationScorerConfig` reads the
  // publication's state.
  rpc PublishEvaluationScorerConfig(PublishEvaluationScorerConfigRequest) returns (PublishEvaluationScorerConfigResponse);
  // (#611) An owner or admin sets or clears the organization's own Loop spend
  // cap, audited; any member reads the cap in force.
  rpc SetLoopOverageCap(SetLoopOverageCapRequest) returns (SetLoopOverageCapResponse);
  rpc GetLoopOverageCap(GetLoopOverageCapRequest) returns (GetLoopOverageCapResponse);
  // (#611) A saved version's source, unsealed for this read, for members and
  // admins; a viewer is refused PERMISSION_DENIED.
  rpc GetEvaluationScorerSourceSnapshot(GetEvaluationScorerSourceSnapshotRequest)
      returns (GetEvaluationScorerSourceSnapshotResponse);
  // #1123. The rate registry's rows and its freshness, for a picker's prices
  // and a scorer's per-call estimate. Reads the build's registry and stores
  // nothing.
  rpc ListEvaluationModelRates(ListEvaluationModelRatesRequest) returns (ListEvaluationModelRatesResponse);
}

// ===========================================================================
// Continuous evaluation: production rules
// ===========================================================================
//
// The legacy scorer automation rules keep behaving exactly as before; nothing
// here references them.

enum ProductionRuleVersionStateV1 {
  PRODUCTION_RULE_VERSION_STATE_V1_UNSPECIFIED = 0;
  // Authored, previewable, never executes.
  PRODUCTION_RULE_VERSION_STATE_V1_DRAFT = 1;
  // The version the rule currently dispatches.
  PRODUCTION_RULE_VERSION_STATE_V1_ACTIVE = 2;
  // Operator-paused; no new matches consumed, in-flight completes.
  PRODUCTION_RULE_VERSION_STATE_V1_PAUSED = 3;
  // A newer version became ACTIVE; historical executions still resolve it.
  PRODUCTION_RULE_VERSION_STATE_V1_SUPERSEDED = 4;
  // Dependency validation failed on enable/update. Distinct from PAUSED on
  // purpose: pausing is a human decision, disabling is the system refusing to run
  // a version whose dependency vanished, and "why did this stop?" must stay
  // answerable.
  PRODUCTION_RULE_VERSION_STATE_V1_DISABLED = 5;
  PRODUCTION_RULE_VERSION_STATE_V1_ARCHIVED = 6;
}

// Only `_SCORE` has an executor in this build; the other five are authorable,
// validated and stored, and the production workflow runs them. The capability
// set says which execution half is unavailable.
enum ProductionRuleActionKindV1 {
  PRODUCTION_RULE_ACTION_KIND_V1_UNSPECIFIED = 0;
  // The existing behaviour; always first.
  PRODUCTION_RULE_ACTION_KIND_V1_SCORE = 1;
  PRODUCTION_RULE_ACTION_KIND_V1_CREATE_DATASET_DRAFT = 2;
  PRODUCTION_RULE_ACTION_KIND_V1_REQUEST_REVIEW = 3;
  PRODUCTION_RULE_ACTION_KIND_V1_RUN_LINKED_EVALUATION = 4;
  PRODUCTION_RULE_ACTION_KIND_V1_NOTIFY = 5;
  PRODUCTION_RULE_ACTION_KIND_V1_BLOCK_RELEASE = 6;
}

enum ProductionRuleHealthStateV1 {
  PRODUCTION_RULE_HEALTH_STATE_V1_UNSPECIFIED = 0;
  // Running, no degradation signal.
  PRODUCTION_RULE_HEALTH_STATE_V1_ENABLED = 1;
  PRODUCTION_RULE_HEALTH_STATE_V1_PAUSED = 2;
  // Succeeding but with lag, partial evidence, or budget pressure.
  PRODUCTION_RULE_HEALTH_STATE_V1_DEGRADED = 3;
  // Recent executions failing or dead-lettering. A version the system DISABLED
  // reads here: it is not producing what it was enabled to produce, and the
  // enum has no member for "the system refused to run this". `_DEGRADED` would
  // claim it is succeeding with lag, which is false.
  PRODUCTION_RULE_HEALTH_STATE_V1_FAILING = 4;
  // Health itself cannot be computed (stale projection, missing dependency).
  // NOT the same as INDETERMINATE release evidence: this one says "we cannot
  // currently tell you how this rule is doing"; that one says "a release gate
  // cannot be evaluated". Both fail visibly; only that one blocks a release.
  PRODUCTION_RULE_HEALTH_STATE_V1_INDETERMINATE = 5;
}

// `_SPAN` is declared so a caller's intent is representable and therefore
// refusable with a typed precondition; it is never accepted. Omitting the value
// would make the refusal untypeable.
enum ProductionRuleRuntimeScopeV1 {
  PRODUCTION_RULE_RUNTIME_SCOPE_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_RUNTIME_SCOPE_V1_AGENT_RUN = 1;
  PRODUCTION_RULE_RUNTIME_SCOPE_V1_SPAN = 2;
}

// A typed predicate over the score result and match metadata.
enum ProductionRuleActionConditionKindV1 {
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_ALWAYS = 1;
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_SCORE_BELOW = 2;
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_SCORE_AT_OR_ABOVE = 3;
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_SCORER_FAILED = 4;
  PRODUCTION_RULE_ACTION_CONDITION_KIND_V1_VERDICT_IS = 5;
}

// A rule's linked references, typed so validation knows what kind of thing to
// look for. Typed rather than a bare id list because "this id no longer
// resolves" and "this id was never a dataset" are different answers.
enum ProductionRuleDependencyKindV1 {
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_DATASET_COLLECTION = 1;
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_DATASET_VERSION = 2;
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_EVALUATION_DEFINITION = 3;
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_SCORE_CONFIG = 4;
  PRODUCTION_RULE_DEPENDENCY_KIND_V1_SCORER_SUITE = 5;
}

// Separate from the health state: a rule can be `_PAUSED` with perfectly
// satisfied dependencies, and `_FAILING` with dependencies nobody has been able
// to check. One enum could not say both.
enum ProductionRuleDependencyHealthV1 {
  PRODUCTION_RULE_DEPENDENCY_HEALTH_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_DEPENDENCY_HEALTH_V1_SATISFIED = 1;
  PRODUCTION_RULE_DEPENDENCY_HEALTH_V1_UNSATISFIED = 2;
  PRODUCTION_RULE_DEPENDENCY_HEALTH_V1_UNKNOWN = 3;
}

// The scorer a rule version targets.
message EvaluationScorerTargetRefV1 {
  oneof target {
    string score_config_id = 1;
    string scorer_suite_id = 2;
  }
}

message ProductionRuleActionConditionV1 {
  ProductionRuleActionConditionKindV1 kind = 1;
  // Required for _SCORE_BELOW, _SCORE_AT_OR_ABOVE, _SCORER_FAILED, _VERDICT_IS.
  optional string scorer_key = 2;
  // Required for the two score comparisons, forbidden elsewhere. Validated at
  // authoring time rather than at dispatch, so the author finds the defect.
  optional double threshold = 3;
  // Required for _VERDICT_IS.
  optional string verdict = 4;
}

message ProductionRuleActionV1 {
  // 0-based and dense. `_SCORE` is required at ordinal 0.
  uint32 ordinal = 1;
  ProductionRuleActionKindV1 action_kind = 2;
  ProductionRuleActionConditionV1 condition = 3;
  // Each action carries its own idempotency key. Capped at the launch path's
  // own `MAX_IDEMPOTENCY_KEY_LEN`, because a template that cannot render into a
  // legal key is a defect deferred to dispatch time.
  string idempotency_key_template = 4;
  // Explicit dependency edges on prior actions. Every element must be strictly
  // less than `ordinal`: the graph is a DAG by construction, and a skipped or
  // failed prerequisite makes dependents `_SKIPPED`.
  repeated uint32 depends_on_ordinals = 5;
  // WHICH resource this action acts on. Required for the four kinds that reach
  // another resource and refused on the two that do not, at authoring time.
  optional ProductionRuleActionTargetV1 target = 6;
}

// THREE ceilings, never one. An evaluator cost never reaches a candidate budget
// (as on `EvaluationBudgetV1`, whose `budget_ceiling` is "never the
// evaluator's").
message ProductionRuleBudgetPolicyV1 {
  optional int64 candidate_budget_micros = 1;
  optional int64 evaluator_budget_micros = 2;
  optional int64 daily_budget_micros = 3;
}

message ProductionRuleDependencyRefV1 {
  ProductionRuleDependencyKindV1 kind = 1;
  string dependency_id = 2;
}

// What an author submits. Everything here is content: re-submitting a
// byte-identical draft returns the existing version rather than minting a
// second one no reader could tell from it.
message ProductionRuleVersionDraftV1 {
  ProductionRuleRuntimeScopeV1 runtime_scope = 1;
  EvaluationScorerTargetRefV1 scorer_target = 2;
  optional double sampling_rate_percent = 3;
  optional uint32 idle_timeout_seconds = 4;
  repeated ProductionRuleActionV1 actions = 5;
  repeated ProductionRuleDependencyRefV1 dependencies = 6;
  ProductionRuleBudgetPolicyV1 budget = 7;
  optional string change_summary = 8;
}

message ProductionRuleVersionV1 {
  string version_id = 1;
  string rule_id = 2;
  // Monotone per rule.
  uint64 version_number = 3;
  ProductionRuleVersionStateV1 state = 4;
  ProductionRuleVersionDraftV1 content = 5;
  // sha256 hex over the canonical encoding of `content`. The idempotency seam,
  // and the reason a version can be re-submitted without inflating history.
  string content_digest = 6;
  // Present exactly when `state` is `_DISABLED`. A disabled version without a
  // reason is the silent stop this phase exists to prevent.
  optional string disabled_reason_code = 7;
  PrincipalRefV1 created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp activated_at = 10;
  optional google.protobuf.Timestamp paused_at = 11;
  optional google.protobuf.Timestamp superseded_at = 12;
  optional google.protobuf.Timestamp disabled_at = 13;
  optional google.protobuf.Timestamp archived_at = 14;

  // The CURRENT answer to "who moved this, and why".
  //
  // Deliberately NOT an audit record: these three overwrite. Labelled so they are
  // never mistaken for a trail.
  optional PrincipalRefV1 last_state_changed_by = 15;
  optional string last_state_change_reason = 16;
  optional google.protobuf.Timestamp last_state_changed_at = 17;
}

// One materialized projection per rule version, so a rule list never scans
// workflow executions per row.
message ProductionRuleHealthV1 {
  string rule_id = 1;
  string version_id = 2;
  ProductionRuleHealthStateV1 state = 3;
  ProductionRuleDependencyHealthV1 dependency_health = 4;
  // The answer to "why did this stop?", carried beside the state rather than
  // left for the reader to infer from it.
  optional string latest_actionable_error_code = 5;
  optional google.protobuf.Timestamp latest_actionable_error_at = 6;
  google.protobuf.Timestamp evaluated_at = 7;

  // Eligible/matched/sampled/scored/promoted/reviewed/downstream-eval counts, last
  // attempt/success/failure, next eligible work, queue lag, dead-letter count,
  // daily spend.
  //
  // The plane exists, so this is no longer the whole group's answer. It now
  // covers the four counts in `ProductionRuleExecutionCountsV1` that are real,
  // and reads `_AVAILABLE`. The three downstream families that still have no
  // effect adapter carry their own availability on that message, because a
  // reason that is true of three members and false of four is not one reason.
  MetricAvailabilityV1 execution_counts_availability = 8;

  EvaluationFreshnessV1 freshness = 9;

  // Four real counters and three declared absent — see the message.
  ProductionRuleExecutionCountsV1 execution_counts = 10;
  // Last attempt/success/failure, next eligible work, queue lag, dead-letter
  // count, daily spend.
  ProductionRuleWorkflowTimingsV1 timings = 11;
}

// Rule counters, split by what this build can actually count.
//
// The four counters are incremented by the write that causes them (admission
// for the first three, the score step's terminal write for the fourth) rather
// than recomputed on read.
message ProductionRuleExecutionCountsV1 {
  // Every production match this rule version was offered, including the ones
  // sampling declined. Without it, a rule that is sampling at 1% and a rule that
  // nothing ever matched look identical.
  uint64 eligible = 1;
  // Offered AND the version was dispatching.
  uint64 matched = 2;
  // Matched AND admitted past the sampling rate — the executions that exist.
  uint64 sampled = 3;
  // Executions whose `_SCORE` step reached `_SUCCEEDED`.
  uint64 scored = 4;

  // `_CREATE_DATASET_DRAFT`, `_REQUEST_REVIEW` and `_RUN_LINKED_EVALUATION`
  // effects. NOT_SUPPORTED, not zero: this build has no effect adapter for
  // those three kinds, and a zero here would tell a gate the actions ran and
  // produced nothing.
  ProductionRuleDownstreamCountsV1 downstream = 5;
}

message ProductionRuleDownstreamCountsV1 {
  MetricAvailabilityV1 availability = 1;
  // Present only when `availability.state` is `_AVAILABLE`.
  optional uint64 promoted = 2;
  optional uint64 reviewed = 3;
  optional uint64 downstream_eval = 4;
}

message ProductionRuleWorkflowTimingsV1 {
  optional google.protobuf.Timestamp last_attempt_at = 1;
  optional google.protobuf.Timestamp last_success_at = 2;
  optional google.protobuf.Timestamp last_failure_at = 3;
  // The earliest `next_attempt_at` on an undispatched outbox row for this
  // version. Absent means nothing is waiting, which is different from "we did
  // not look".
  optional google.protobuf.Timestamp next_eligible_work_at = 4;
  optional uint64 queue_lag_seconds = 5;
  uint64 dead_letter_count = 6;
  // Resets when the server's date moves, so "daily" means a day rather than
  // "since the beginning".
  int64 daily_spend_micros = 7;
  // Queue lag and next-eligible-work are refreshed by the maintenance sweep
  // rather than counted at the causing transaction, because they are
  // aggregates over the outbox rather than counters. Their staleness is a
  // different fact from the counters', so they carry their own availability.
  MetricAvailabilityV1 queue_availability = 8;
}

message ProductionRuleV1 {
  string rule_id = 1;
  string rule_key = 2;
  string name = 3;
  optional string description = 4;
  // List and detail reads both identify the stable rule id AND the active
  // version id.
  //
  // This is the version the rule has SELECTED (enabling or editing selects a
  // version), which is NOT the same as the version that is currently
  // dispatching. A version the system disabled because its dependency vanished
  // stays selected, and its state and health say why. Absent only while nothing
  // has been selected: every version still a draft, or all of them archived.
  optional string active_version_id = 5;
  optional uint64 active_version_number = 6;
  PrincipalRefV1 created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// One row of the rule table. At most 50 rows and 512 KiB a page. Nothing
// per-row is hydrated.
message ProductionRuleListItemV1 {
  ProductionRuleV1 rule = 1;
  // Absent exactly when `rule.active_version_id` is absent: no active version,
  // no projection to read.
  optional ProductionRuleHealthV1 health = 2;
}

message CreateProductionEvaluationRuleRequest {
  string rule_key = 1;
  string name = 2;
  optional string description = 3;
  // The rule and its first version are minted together. A rule with no version
  // is a row that can never be enabled, and making the two-call sequence the
  // only path would let one exist.
  ProductionRuleVersionDraftV1 version = 4;
  // Activate the first version immediately rather than leaving it `_DRAFT`.
  // Dependency validation still runs, and a failed validation lands `_DISABLED`
  // rather than refusing the create: the rule is authored correctly and its
  // dependency is not there, which are different problems with different fixes.
  optional bool activate = 5;
}

message CreateProductionEvaluationRuleResponse {
  ProductionRuleV1 rule = 1;
  ProductionRuleVersionV1 version = 2;
  // True when this call found an existing rule under the same key rather than
  // minting one. A confirmation, never an error: a client that retried a
  // timed-out create must not be told its rule cannot be made.
  bool idempotent_replay = 3;
}

message CreateProductionEvaluationRuleVersionRequest {
  string rule_id = 1;
  ProductionRuleVersionDraftV1 version = 2;
  optional bool activate = 3;
}

message CreateProductionEvaluationRuleVersionResponse {
  ProductionRuleVersionV1 version = 1;
  // True when byte-identical content already existed on this rule. Two
  // submissions of one shape are one version submitted twice, not two versions;
  // minting the second would put two rows on the rule that no execution pin
  // could tell apart.
  bool idempotent_replay = 2;
}

// The transition to request. Only the operator-initiated ones are here:
// `_SUPERSEDED` is a consequence of activating another version and `_DRAFT` is
// where a version starts, so neither is a move a caller may name.
enum ProductionRuleVersionTransitionV1 {
  PRODUCTION_RULE_VERSION_TRANSITION_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_VERSION_TRANSITION_V1_ACTIVATE = 1;
  PRODUCTION_RULE_VERSION_TRANSITION_V1_PAUSE = 2;
  PRODUCTION_RULE_VERSION_TRANSITION_V1_RESUME = 3;
  PRODUCTION_RULE_VERSION_TRANSITION_V1_ARCHIVE = 4;
}

message SetProductionEvaluationRuleVersionStateRequest {
  string version_id = 1;
  ProductionRuleVersionTransitionV1 transition = 2;
  // Recorded on the version. Optional, because the honest default for a pause
  // is that the operator did not say.
  optional string reason = 3;
}

message SetProductionEvaluationRuleVersionStateResponse {
  ProductionRuleVersionV1 version = 1;
  ProductionRuleHealthV1 health = 2;
  // True when the version was already in the requested state. A retried pause
  // is a confirmation, not a conflict.
  bool already_in_state = 3;
}

message ListProductionEvaluationRulesRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  // Filter by the active version's health state. Absent means every rule.
  optional ProductionRuleHealthStateV1 health_state = 3;
}

message ListProductionEvaluationRulesResponse {
  repeated ProductionRuleListItemV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  EvaluationFreshnessV1 freshness = 5;
}

message GetProductionEvaluationRuleRequest {
  string rule_id = 1;
}

message GetProductionEvaluationRuleResponse {
  ProductionRuleV1 rule = 1;
  // Absent when no version is active.
  optional ProductionRuleVersionV1 active_version = 2;
  optional ProductionRuleHealthV1 health = 3;
  // Capped page of the version history, newest first: a rule edited four hundred
  // times renders in the same payload budget as one authored once.
  repeated ProductionRuleVersionV1 version_history = 4;
  bool version_history_has_more = 5;
  EvaluationFreshnessV1 freshness = 6;
}

// ===========================================================================
// Continuous evaluation: production workflows
// ===========================================================================

// Derived from the step states; never set directly.
enum ProductionWorkflowExecutionStateV1 {
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_UNSPECIFIED = 0;
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_PENDING = 1;
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_RUNNING = 2;
  // Every step terminal-successful or legitimately skipped.
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_SUCCEEDED = 3;
  // Scoring succeeded, at least one downstream action failed. Never a
  // retro-failed score.
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_PARTIALLY_SUCCEEDED = 4;
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_FAILED = 5;
  // Retries exhausted on the score step; requires operator action.
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_DEAD_LETTERED = 6;
  // Reached by archiving the rule version this execution pinned. Pausing a rule
  // lets in-flight work complete and archiving is terminal, so an archive is the
  // one operator act that strands a pending execution.
  PRODUCTION_WORKFLOW_EXECUTION_STATE_V1_CANCELLED = 7;
}

enum ProductionWorkflowStepStateV1 {
  PRODUCTION_WORKFLOW_STEP_STATE_V1_UNSPECIFIED = 0;
  PRODUCTION_WORKFLOW_STEP_STATE_V1_PENDING = 1;
  PRODUCTION_WORKFLOW_STEP_STATE_V1_RUNNING = 2;
  PRODUCTION_WORKFLOW_STEP_STATE_V1_SUCCEEDED = 3;
  // Failed, attempts remain, `next_attempt_at` set.
  PRODUCTION_WORKFLOW_STEP_STATE_V1_RETRYABLE = 4;
  // Failed terminally within this execution — a non-retryable error, such as an
  // action kind this build has no effect adapter for.
  PRODUCTION_WORKFLOW_STEP_STATE_V1_FAILED = 5;
  // Retryable error, attempts exhausted.
  PRODUCTION_WORKFLOW_STEP_STATE_V1_DEAD_LETTER = 6;
  // Condition false, prerequisite not satisfied, budget exhausted, or the
  // execution was cancelled. The cause is on `skip_reason`, typed.
  PRODUCTION_WORKFLOW_STEP_STATE_V1_SKIPPED = 7;
}

// Why a step was skipped. `_EXECUTION_CANCELLED` is a cause of skipping rather
// than a state.
enum ProductionWorkflowStepSkipReasonV1 {
  PRODUCTION_WORKFLOW_STEP_SKIP_REASON_V1_UNSPECIFIED = 0;
  PRODUCTION_WORKFLOW_STEP_SKIP_REASON_V1_CONDITION_NOT_MET = 1;
  PRODUCTION_WORKFLOW_STEP_SKIP_REASON_V1_PREREQUISITE_NOT_SATISFIED = 2;
  PRODUCTION_WORKFLOW_STEP_SKIP_REASON_V1_BUDGET_EXHAUSTED = 3;
  PRODUCTION_WORKFLOW_STEP_SKIP_REASON_V1_EXECUTION_CANCELLED = 4;
}

// What the trigger verb decided, so a caller can tell "this rule is not
// running" from "this match was sampled out" from "one execution now exists"
// without inferring it from an absent id.
enum ProductionWorkflowAdmissionV1 {
  PRODUCTION_WORKFLOW_ADMISSION_V1_UNSPECIFIED = 0;
  PRODUCTION_WORKFLOW_ADMISSION_V1_STARTED = 1;
  // The version already had an execution under this match key. A confirmation,
  // never an error: a re-delivered production match must not be told its
  // workflow cannot be made.
  PRODUCTION_WORKFLOW_ADMISSION_V1_IDEMPOTENT_REPLAY = 2;
  PRODUCTION_WORKFLOW_ADMISSION_V1_SKIPPED_SAMPLED_OUT = 3;
  // The version is `_DRAFT`, `_PAUSED`, `_DISABLED`, `_SUPERSEDED` or
  // `_ARCHIVED`. The version's own state says which.
  PRODUCTION_WORKFLOW_ADMISSION_V1_SKIPPED_RULE_NOT_DISPATCHING = 4;
  // Budget is evaluated BEFORE dispatch, and exhaustion is a resumable
  // condition rather than a failure.
  PRODUCTION_WORKFLOW_ADMISSION_V1_SKIPPED_BUDGET_EXHAUSTED = 5;
}

enum ReleaseBlockStateV1 {
  RELEASE_BLOCK_STATE_V1_UNSPECIFIED = 0;
  // Blocking; linked to the rule execution and its evidence.
  RELEASE_BLOCK_STATE_V1_ACTIVE = 1;
  // Required evidence unavailable, stale, partial or uncomputable. Fails
  // closed: the release stays blocked.
  RELEASE_BLOCK_STATE_V1_INDETERMINATE = 2;
  RELEASE_BLOCK_STATE_V1_CLEARED = 3;
  RELEASE_BLOCK_STATE_V1_EXPIRED = 4;
  // Audited override; actor, reason and scope recorded. An override NEVER
  // deletes the block — it records a decision over it.
  RELEASE_BLOCK_STATE_V1_OVERRIDDEN = 5;
}

// Links the exact rule execution, scores and dataset/eval evidence. Typed so
// "this id no longer resolves" and "this id was never a score" stay different
// answers.
enum ProductionReleaseBlockEvidenceKindV1 {
  PRODUCTION_RELEASE_BLOCK_EVIDENCE_KIND_V1_UNSPECIFIED = 0;
  PRODUCTION_RELEASE_BLOCK_EVIDENCE_KIND_V1_PRODUCTION_SCORE = 1;
  PRODUCTION_RELEASE_BLOCK_EVIDENCE_KIND_V1_DATASET_VERSION = 2;
  PRODUCTION_RELEASE_BLOCK_EVIDENCE_KIND_V1_EVALUATION_RUN = 3;
  PRODUCTION_RELEASE_BLOCK_EVIDENCE_KIND_V1_WORKFLOW_EXECUTION = 4;
}

// The block's expiry or clear condition, as a closed vocabulary so a client
// renders a fixed explanation rather than a free-text string.
enum ProductionReleaseBlockClearConditionV1 {
  PRODUCTION_RELEASE_BLOCK_CLEAR_CONDITION_V1_UNSPECIFIED = 0;
  // A later execution of the same rule version against the same release whose
  // score satisfied the condition that raised this block.
  PRODUCTION_RELEASE_BLOCK_CLEAR_CONDITION_V1_RULE_PASSES_AGAIN = 1;
  // Only `expires_at` or an audited override can end it.
  PRODUCTION_RELEASE_BLOCK_CLEAR_CONDITION_V1_EXPIRY_ONLY = 2;
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------

// The score that already happened, carried in by the caller.
//
// The `_SCORE` step RECORDS this; it does not compute it. The score is durable
// before any dependent step is scheduled.
message ProductionWorkflowScoreOutcomeV1 {
  string scorer_key = 1;
  // Absent when the scorer failed — an absent score and a score of zero are
  // different facts and a client must not have to guess which it has.
  optional double score = 2;
  optional string verdict = 3;
  bool scorer_failed = 4;
  optional string failure_code = 5;
  // What the scoring cost. The daily ceiling is only meaningful if something
  // reports spend, and the caller is the only party that knows.
  optional int64 cost_micros = 6;
}

// Carried onto every step, attempt and outbox row so a
// `production.rule.execute` span tree resolves from any of them.
message ProductionWorkflowCorrelationV1 {
  string correlation_id = 1;
  optional string trace_id = 2;
  optional string agent_run_id = 3;
  optional string root_span_id = 4;
}

// Retry creates a NEW attempt row and never mutates the prior one.
message ProductionWorkflowStepAttemptV1 {
  uint32 attempt_number = 1;
  ProductionWorkflowStepStateV1 state = 2;
  google.protobuf.Timestamp started_at = 3;
  optional google.protobuf.Timestamp finished_at = 4;
  optional string error_code = 5;
  optional string error_message = 6;
  // The rendered idempotency key this attempt's outbox row carries. Two
  // attempts of one step share it, which is exactly why at most one of them can
  // reach `dispatched`.
  string delivery_key = 7;
  bool dispatched = 8;
}

// What a successfully dispatched step produced. A `oneof` rather than a pair of
// nullable id strings, so a step cannot claim to have produced both.
message ProductionWorkflowStepEffectV1 {
  oneof effect {
    string production_score_id = 1;
    string release_block_id = 2;
    // Three arms, three ids a reader can follow to the effect. `_NOTIFY` gets no
    // arm: this build does not deliver.
    string dataset_proposed_case_id = 3;
    string review_task_id = 4;
    string linked_evaluation_run_id = 5;
    // The DURABLE DELIVERY, not the HTTP call. `_NOTIFY` succeeds when the
    // notification is enqueued in a fenced outbox that will keep trying, which
    // is the only thing a step can honestly claim inside its own transaction —
    // whether the destination answered is a fact about later, and it is carried
    // on the delivery row and counted separately (`notified_count` moves on a
    // 2xx, never on an enqueue).
    string notification_delivery_id = 6;
  }
}

message ProductionWorkflowStepV1 {
  string step_id = 1;
  uint32 ordinal = 2;
  ProductionRuleActionKindV1 action_kind = 3;
  ProductionWorkflowStepStateV1 state = 4;
  // Present exactly when `state` is `_SKIPPED`.
  optional ProductionWorkflowStepSkipReasonV1 skip_reason = 5;
  // The action's configuration AS IT WAS when this execution started, stored on
  // the step row — not read back through the version. A later version edit
  // cannot change how a historical execution reads.
  ProductionRuleActionV1 configuration_snapshot = 6;
  string idempotency_key = 7;
  uint32 attempt_count = 8;
  uint32 max_attempts = 9;
  optional google.protobuf.Timestamp next_attempt_at = 10;
  optional string latest_error_code = 11;
  optional string latest_error_message = 12;
  // Capped, newest first. A step that retried four hundred times renders in the
  // same payload as one that ran once.
  repeated ProductionWorkflowStepAttemptV1 attempts = 13;
  bool attempts_capped = 14;
  optional ProductionWorkflowStepEffectV1 effect = 15;
  google.protobuf.Timestamp created_at = 16;
  optional google.protobuf.Timestamp terminal_at = 17;
}

message ProductionWorkflowExecutionV1 {
  string execution_id = 1;
  string rule_id = 2;
  // THE PIN. Not the rule's currently-selected version: the version this
  // execution actually ran.
  string rule_version_id = 3;
  uint64 rule_version_number = 4;
  ProductionWorkflowExecutionStateV1 state = 5;
  ProductionWorkflowCorrelationV1 correlation = 6;
  // A machine-principal trigger is attributable.
  PrincipalRefV1 triggered_by = 7;
  ProductionWorkflowScoreOutcomeV1 score_outcome = 8;
  // The caller's own key for this production match. Two deliveries of one match
  // are one execution.
  string match_key = 9;
  google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp started_at = 11;
  optional google.protobuf.Timestamp terminal_at = 12;
  // Present exactly when `state` is `_CANCELLED`.
  optional string cancellation_reason_code = 13;
  int64 spend_micros = 14;
  uint32 step_count = 15;
  uint32 steps_succeeded = 16;
  uint32 steps_failed = 17;
  uint32 steps_skipped = 18;
}

message ProductionReleaseBlockEvidenceRefV1 {
  ProductionReleaseBlockEvidenceKindV1 kind = 1;
  string evidence_id = 2;
}

// Durable policy evidence, not a transient frontend flag.
message ProductionReleaseBlockV1 {
  string block_id = 1;
  // The affected release scope. A caller-supplied key, NOT a
  // `ReleaseDestinationV1`: a notification destination is not a deployment
  // integration.
  string release_key = 2;
  ReleaseBlockStateV1 state = 3;
  string rule_id = 4;
  string rule_version_id = 5;
  // The EXACT rule execution.
  string workflow_execution_id = 6;
  string workflow_step_id = 7;
  string block_reason_code = 8;
  // Present exactly when `state` is `_INDETERMINATE`. A typed resource state,
  // never a transport error.
  optional string indeterminate_reason_code = 9;
  // Capped at `max_evidence_refs`.
  repeated ProductionReleaseBlockEvidenceRefV1 evidence = 10;
  ProductionReleaseBlockClearConditionV1 clear_condition = 11;
  optional google.protobuf.Timestamp expires_at = 12;
  google.protobuf.Timestamp created_at = 13;
  optional google.protobuf.Timestamp cleared_at = 14;
  optional google.protobuf.Timestamp expired_at = 15;
  // The audited path: actor, reason, scope, instant. The block keeps its
  // evidence: an override records a decision over a block, it does not remove
  // one.
  optional PrincipalRefV1 overridden_by = 16;
  optional string override_reason = 17;
  optional string override_scope = 18;
  optional google.protobuf.Timestamp overridden_at = 19;
}

// ---------------------------------------------------------------------------
// Requests and responses
// ---------------------------------------------------------------------------

message StartProductionEvaluationWorkflowRequest {
  // The rule to run. The version is resolved from the rule's selected version
  // at admission and PINNED on the execution; a caller naming a version could
  // pin a superseded one.
  string rule_id = 1;
  // The caller's key for this production match, at most
  // `match_key_max_bytes`. Typically the trace id.
  string match_key = 2;
  ProductionWorkflowScoreOutcomeV1 score_outcome = 3;
  ProductionWorkflowCorrelationV1 correlation = 4;
  // The release this match is evidence about. Required when the rule's action
  // graph contains `_BLOCK_RELEASE`; refused as `INVALID_ARGUMENT` otherwise,
  // because a block with no release scope blocks nothing.
  optional string release_key = 5;
}

message StartProductionEvaluationWorkflowResponse {
  ProductionWorkflowAdmissionV1 admission = 1;
  // Absent for the three `_SKIPPED_*` admissions: nothing was written, and an
  // id for a row that does not exist is worse than no id.
  optional ProductionWorkflowExecutionV1 execution = 2;
  // The rule version state that produced `_SKIPPED_RULE_NOT_DISPATCHING`.
  optional ProductionRuleVersionStateV1 version_state = 3;
}

message ProductionWorkflowExecutionListFilterV1 {
  optional string rule_id = 1;
  optional string rule_version_id = 2;
  optional ProductionWorkflowExecutionStateV1 state = 3;
}

message ListProductionEvaluationWorkflowExecutionsRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  optional ProductionWorkflowExecutionListFilterV1 filter = 3;
}

// Lightweight but complete. Headers only: no steps, no attempts, nothing
// hydrated per row.
message ListProductionEvaluationWorkflowExecutionsResponse {
  repeated ProductionWorkflowExecutionV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  EvaluationFreshnessV1 freshness = 5;
}

message GetProductionEvaluationWorkflowExecutionRequest {
  string execution_id = 1;
}

// All steps, linked resources, attempts and actionable errors in ONE bounded
// response. Every nested list carries a cap flag.
message GetProductionEvaluationWorkflowExecutionResponse {
  ProductionWorkflowExecutionV1 execution = 1;
  repeated ProductionWorkflowStepV1 steps = 2;
  repeated ProductionReleaseBlockV1 release_blocks = 3;
  EvaluationFreshnessV1 freshness = 4;
}

message RetryProductionEvaluationWorkflowStepRequest {
  string step_id = 1;
}

message RetryProductionEvaluationWorkflowStepResponse {
  ProductionWorkflowStepV1 step = 1;
  ProductionWorkflowExecutionV1 execution = 2;
}

message ProductionReleaseBlockListFilterV1 {
  optional string release_key = 1;
  optional ReleaseBlockStateV1 state = 2;
  optional string rule_id = 3;
}

message ListProductionEvaluationReleaseBlocksRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  optional ProductionReleaseBlockListFilterV1 filter = 3;
}

message ListProductionEvaluationReleaseBlocksResponse {
  repeated ProductionReleaseBlockV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  // True when any block in the FULL filtered set — not only this page — is
  // `_ACTIVE` or `_INDETERMINATE`. A release gate must not have to page to
  // learn it is blocked, and paging to a conclusion is how a gate fails open.
  bool release_is_blocked = 5;
  EvaluationFreshnessV1 freshness = 6;
}

message OverrideProductionEvaluationReleaseBlockRequest {
  string block_id = 1;
  // A reason is required. Not optional, unlike the pause reason on a rule
  // version: overriding a block is a decision somebody will be asked about.
  string reason = 2;
  // "This release only" is the one scope; the field exists so a wider scope is
  // representable and therefore refusable rather than assumed.
  string scope = 3;
}

message OverrideProductionEvaluationReleaseBlockResponse {
  ProductionReleaseBlockV1 block = 1;
  // True when the block was already `_OVERRIDDEN`. A retried override is a
  // confirmation, not a conflict, and it does not restamp the original actor.
  bool already_overridden = 2;
}

// ===========================================================================
// Releases
//
// Release integrations, releases, the action state machine and the posture the
// two reads render from.
//
// Not the legacy release governance: `ReleaseGateV1`, `ReleaseDestinationV1`
// and `ReleaseAlertDeliveryV1` live on `AgenticObservabilityService`. A
// notification destination is not a deployment integration, and nothing here
// reads a legacy gate evaluation as evidence.
// ===========================================================================

// The integration kinds.
//
// Only `_SIGNED_DEPLOYMENT_WEBHOOK` is executable in this iteration. The other
// four are on the wire so that capability discovery can report them DEFERRED
// with a reason. A create naming one of them is refused with
// `release_adapter_kind_not_shipped`.
enum ReleaseIntegrationKindV1 {
  RELEASE_INTEGRATION_KIND_V1_UNSPECIFIED = 0;
  RELEASE_INTEGRATION_KIND_V1_SIGNED_DEPLOYMENT_WEBHOOK = 1;
  RELEASE_INTEGRATION_KIND_V1_GITHUB_ACTIONS = 2;
  RELEASE_INTEGRATION_KIND_V1_ARGO_CD = 3;
  RELEASE_INTEGRATION_KIND_V1_KUBERNETES = 4;
  RELEASE_INTEGRATION_KIND_V1_PROMPT_REGISTRY_LABEL = 5;
}

// Health is a PROJECTION, never a synchronous probe from a read:
// `GetReleaseIntegration` reports the last observed health with its age, and
// every value here is written by something other than the read that returns it.
enum ReleaseIntegrationHealthV1 {
  RELEASE_INTEGRATION_HEALTH_V1_UNSPECIFIED = 0;
  RELEASE_INTEGRATION_HEALTH_V1_HEALTHY = 1;
  // Recent failures below the unhealthy threshold.
  RELEASE_INTEGRATION_HEALTH_V1_DEGRADED = 2;
  // Destination not reachable at last check.
  RELEASE_INTEGRATION_HEALTH_V1_UNREACHABLE = 3;
  // Destination fails validation now (allowlist, scheme, resolution).
  RELEASE_INTEGRATION_HEALTH_V1_MISCONFIGURED = 4;
  // Signing secret reference cannot be resolved.
  RELEASE_INTEGRATION_HEALTH_V1_SECRET_UNAVAILABLE = 5;
  RELEASE_INTEGRATION_HEALTH_V1_ARCHIVED = 6;
}

// The state of one signing key inside a rotation window.
//
// Two keys may be valid at once during a rotation window, and the key id in the
// canonical bytes tells the receiver which to verify with. That is three
// states and not two: the key this server SIGNS with, the key it will still
// ACCEPT on a callback, and the keys it no longer honours.
enum ReleaseSigningKeyStateV1 {
  RELEASE_SIGNING_KEY_STATE_V1_UNSPECIFIED = 0;
  // The key outbound requests are signed with. Exactly one per integration.
  RELEASE_SIGNING_KEY_STATE_V1_ACTIVE = 1;
  // Superseded but still accepted until `not_after`. Never signs.
  RELEASE_SIGNING_KEY_STATE_V1_ROTATING = 2;
  RELEASE_SIGNING_KEY_STATE_V1_REVOKED = 3;
}

enum ReleaseStageV1 {
  RELEASE_STAGE_V1_UNSPECIFIED = 0;
  RELEASE_STAGE_V1_PRE_RELEASE = 1;
  RELEASE_STAGE_V1_CANARY = 2;
  RELEASE_STAGE_V1_RAMP = 3;
  RELEASE_STAGE_V1_PRODUCTION = 4;
  RELEASE_STAGE_V1_HELD = 5;
  RELEASE_STAGE_V1_ABORTING = 6;
  RELEASE_STAGE_V1_ABORTED = 7;
  RELEASE_STAGE_V1_ROLLING_BACK = 8;
  RELEASE_STAGE_V1_ROLLED_BACK = 9;
  RELEASE_STAGE_V1_FAILED = 10;
  // External state unknown; blocks conflicting actions. A STAGE and not a flag
  // on an action — modelling ambiguity only on the action would let a second
  // action be requested against a release whose real state is unknown.
  RELEASE_STAGE_V1_VERIFICATION_REQUIRED = 11;
}

enum ReleaseActionStateV1 {
  RELEASE_ACTION_STATE_V1_UNSPECIFIED = 0;
  // Durably recorded; nothing has left the process.
  RELEASE_ACTION_STATE_V1_REQUESTED = 1;
  // Handed to the adapter; the request MAY have reached the destination.
  RELEASE_ACTION_STATE_V1_DISPATCHED = 2;
  // Destination acknowledged the signed request.
  RELEASE_ACTION_STATE_V1_ACCEPTED = 3;
  // A callback or poll reported an external outcome.
  RELEASE_ACTION_STATE_V1_OBSERVED = 4;
  // The observation satisfied the verification policy.
  RELEASE_ACTION_STATE_V1_VERIFIED = 5;
  // Terminal refusal at or before acceptance.
  RELEASE_ACTION_STATE_V1_FAILED = 6;
  // Dispatched, outcome unknown; reconcile required. Never resent blindly.
  RELEASE_ACTION_STATE_V1_AMBIGUOUS = 7;
  // Reconciliation resolved this action into another.
  RELEASE_ACTION_STATE_V1_SUPERSEDED = 8;
}

// The five product verbs plus `_RECONCILE`.
//
// `_RECONCILE` is never user-requested. It is enqueued when external state is
// unknown and read back through `ListReleaseActions`/`GetReleaseAction`.
enum ReleaseActionTypeV1 {
  RELEASE_ACTION_TYPE_V1_UNSPECIFIED = 0;
  RELEASE_ACTION_TYPE_V1_START_CANARY = 1;
  RELEASE_ACTION_TYPE_V1_PROMOTE = 2;
  RELEASE_ACTION_TYPE_V1_HOLD = 3;
  RELEASE_ACTION_TYPE_V1_ABORT = 4;
  RELEASE_ACTION_TYPE_V1_ROLLBACK = 5;
  RELEASE_ACTION_TYPE_V1_RECONCILE = 6;
}

// The seven frozen adapter operations.
//
// Capability discovery publishes which operations an adapter implements.
// `_PREVIEW` is NOT reachable from `PreviewRelease`, which makes zero adapter
// calls; it exists for an explicit operator-initiated integration test.
enum ReleaseAdapterOperationV1 {
  RELEASE_ADAPTER_OPERATION_V1_UNSPECIFIED = 0;
  RELEASE_ADAPTER_OPERATION_V1_PREVIEW = 1;
  RELEASE_ADAPTER_OPERATION_V1_START_CANARY = 2;
  RELEASE_ADAPTER_OPERATION_V1_PROMOTE = 3;
  RELEASE_ADAPTER_OPERATION_V1_HOLD = 4;
  RELEASE_ADAPTER_OPERATION_V1_ABORT = 5;
  RELEASE_ADAPTER_OPERATION_V1_ROLLBACK = 6;
  RELEASE_ADAPTER_OPERATION_V1_OBSERVE = 7;
}

// The six release validations, as an enum rather than six booleans.
//
// Each returns its own typed verdict: a single boolean `ready` could not name
// the remediation for stale evidence.
enum ReleaseValidationKindV1 {
  RELEASE_VALIDATION_KIND_V1_UNSPECIFIED = 0;
  RELEASE_VALIDATION_KIND_V1_COMPARABILITY = 1;
  RELEASE_VALIDATION_KIND_V1_COMPLETENESS = 2;
  RELEASE_VALIDATION_KIND_V1_FRESHNESS = 3;
  RELEASE_VALIDATION_KIND_V1_GATE_STATUS = 4;
  RELEASE_VALIDATION_KIND_V1_INTEGRATION_HEALTH = 5;
  RELEASE_VALIDATION_KIND_V1_ROLLBACK_TARGET = 6;
}

// `_INDETERMINATE` is separate from `_FAIL` on purpose: "the gate could not be
// computed" and "the gate says no" have different remediations, and both
// block. `_NOT_APPLICABLE` is the honest answer for the rollback-target verdict
// on a release that names no last-known-good: an absence, never a pass.
enum ReleaseValidationStateV1 {
  RELEASE_VALIDATION_STATE_V1_UNSPECIFIED = 0;
  RELEASE_VALIDATION_STATE_V1_PASS = 1;
  RELEASE_VALIDATION_STATE_V1_WARN = 2;
  RELEASE_VALIDATION_STATE_V1_FAIL = 3;
  RELEASE_VALIDATION_STATE_V1_INDETERMINATE = 4;
  RELEASE_VALIDATION_STATE_V1_NOT_APPLICABLE = 5;
}

// The reason is a bounded typed structure, not free text only.
enum ReleaseActionReasonV1 {
  RELEASE_ACTION_REASON_V1_UNSPECIFIED = 0;
  RELEASE_ACTION_REASON_V1_QUALITY_REGRESSION = 1;
  RELEASE_ACTION_REASON_V1_ERROR_RATE_REGRESSION = 2;
  RELEASE_ACTION_REASON_V1_LATENCY_REGRESSION = 3;
  RELEASE_ACTION_REASON_V1_COST_REGRESSION = 4;
  RELEASE_ACTION_REASON_V1_EVIDENCE_STALE = 5;
  RELEASE_ACTION_REASON_V1_EXTERNAL_DRIFT = 6;
  RELEASE_ACTION_REASON_V1_OPERATOR_REQUEST = 7;
  // Automatic rollback. A system principal issues the action through the same
  // path a person does, so it is audited identically.
  RELEASE_ACTION_REASON_V1_AUTOMATIC_HEALTH_POLICY = 8;
  RELEASE_ACTION_REASON_V1_INTEGRATION_UNHEALTHY = 9;
}

// The audited override that lets a release leave `_VERIFICATION_REQUIRED`.
//
// The override rides the action verbs it authorises. An override NEVER deletes
// anything: it records a decision over an unknown state.
enum ReleaseVerificationOverrideReasonV1 {
  RELEASE_VERIFICATION_OVERRIDE_REASON_V1_UNSPECIFIED = 0;
  // A human checked the destination out of band and states what it found.
  RELEASE_VERIFICATION_OVERRIDE_REASON_V1_EXTERNAL_STATE_CONFIRMED_MANUALLY = 1;
  // The integration will not answer again; proceeding is a deliberate choice.
  RELEASE_VERIFICATION_OVERRIDE_REASON_V1_INTEGRATION_PERMANENTLY_UNAVAILABLE = 2;
  RELEASE_VERIFICATION_OVERRIDE_REASON_V1_OPERATOR_ACCEPTS_RISK = 3;
}

message ReleaseVerificationOverrideV1 {
  ReleaseVerificationOverrideReasonV1 reason = 1;
  // Bounded. At most RELEASE_REASON_NOTE_MAX_BYTES (512).
  string reason_note = 2;
  // Present on responses; ignored on requests, where the server takes the
  // authenticated caller rather than a claimed identity.
  optional PrincipalRefV1 actor = 3;
  optional google.protobuf.Timestamp overridden_at = 4;
}

// What a release integration points at.
//
// A target and an environment rather than one opaque string, so a release gate
// can say WHICH environment a canary is in.
message ReleaseTargetV1 {
  string target_key = 1;
  string environment = 2;
}

// A signing key, as a reference. NEVER the material.
message ReleaseSigningKeyRefV1 {
  // Carried in the canonical bytes so the receiver knows which key verifies
  // this request.
  string key_id = 1;
  // An opaque handle the deployment resolves at execution time. It is not a
  // secret and it is not enough to sign with.
  string secret_ref = 2;
  ReleaseSigningKeyStateV1 state = 3;
  google.protobuf.Timestamp activated_at = 4;
  // When a `_ROTATING` key stops being accepted.
  optional google.protobuf.Timestamp not_after = 5;
}

message ReleaseIntegrationV1 {
  string integration_id = 1;
  string display_name = 2;
  ReleaseIntegrationKindV1 kind = 3;
  ReleaseTargetV1 target = 4;
  // HTTPS only, validated at create/update AND at execution.
  string destination_url = 5;
  // The explicit domain allowlist. A host matches when it equals an entry or is a
  // subdomain of one. Empty is not "allow everything": a create with no entry is
  // refused.
  repeated string allowed_domains = 6;
  // Non-secret configuration only. Typed fields, never a payload blob.
  optional string callback_url_template = 7;
  bool supports_callbacks = 8;
  bool supports_polling = 9;
  uint32 request_timeout_ms = 10;
  // Key REFERENCES with their rotation state. At most
  // `signing_key_max_versions` entries; never any material.
  repeated ReleaseSigningKeyRefV1 signing_keys = 11;
  // Health, with its own age. `health_observed_at` is absent exactly when nothing
  // has ever observed this integration, which is not the same as healthy.
  ReleaseIntegrationHealthV1 health = 12;
  optional google.protobuf.Timestamp health_observed_at = 13;
  optional string health_reason_code = 14;
  bool archived = 15;
  optional google.protobuf.Timestamp archived_at = 16;
  PrincipalRefV1 created_by = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  // Which of the seven operations this integration's adapter implements. An
  // integration of a deferred kind cannot be created, so today this is always
  // the full seven — the field exists so that a client reads the answer
  // rather than assuming it.
  repeated ReleaseAdapterOperationV1 supported_operations = 20;

  // ---- the adapter credential ----
  // A REFERENCE, never material. Absent for a kind that authenticates by
  // signature rather than by token.
  optional ReleaseIntegrationCredentialRefV1 credential = 21;
  // ---- end of the adapter credential ----
}

// ---- the adapter credential ----

// One adapter credential, as a reference.
message ReleaseIntegrationCredentialRefV1 {
  string credential_id = 1;
  // An opaque handle (`ref:` for platform-held, `env:` for operator-held).
  // An `env:` handle names a variable that begins with `O11Y_RELEASE_SECRET_`.
  // NEVER the token and never a fingerprint of one.
  string secret_ref = 2;
  ReleaseIntegrationCredentialStateV1 state = 3;
  google.protobuf.Timestamp activated_at = 4;
}

// Two values, not the signing key's three.
//
// There is deliberately no `ROTATING`: a bearer token is PRESENTED, never
// verified against, so there is no window during which two are simultaneously
// correct.
enum ReleaseIntegrationCredentialStateV1 {
  RELEASE_INTEGRATION_CREDENTIAL_STATE_V1_UNSPECIFIED = 0;
  RELEASE_INTEGRATION_CREDENTIAL_STATE_V1_ACTIVE = 1;
  RELEASE_INTEGRATION_CREDENTIAL_STATE_V1_REVOKED = 2;
}

// ---- end of the adapter credential ----

// The frozen evidence a release pins.
//
// Every field here is a REFERENCE or a digest. Nothing is a copy, and a later
// revision never retro-changes a created release.
message ReleaseEvidenceSnapshotV1 {
  string evaluation_run_id = 1;
  string definition_revision_id = 2;
  // sha256 hex of the definition revision the run froze.
  string definition_content_digest = 3;
  // The candidate inside that run's frozen manifest. A key, because the
  // manifest addresses candidates by key and there is no per-candidate row.
  string candidate_key = 4;
  // THE PIN. An explicitly adopted revision id — never "latest".
  string decision_revision_id = 5;
  uint32 decision_revision_ordinal = 6;
  uint64 evidence_projection_version = 7;
  string decision_policy_version = 8;
  string algorithm_version = 9;
  // The decision outcome as adopted, snapshotted so a release row states what
  // it shipped on without re-reading a ledger that may have grown.
  EvaluationDecisionOutcomeV1 decision_outcome = 10;
  optional string recommended_candidate_key = 11;
  optional string reference_candidate_key = 12;
  // The fact watermark, rendered as
  // `snapshot={id};complete_through=<RFC 3339>`. Absent when the release
  // performed no fact read: an empty string would be indistinguishable from
  // "read it and got nothing".
  optional string facts_watermark = 13;
  google.protobuf.Timestamp snapshotted_at = 14;
}

// The release's policy, and the automatic opt-ins it governs.
//
// A policy a release was CREATED under is snapshotted at creation like
// everything else it pins.
message ReleasePolicyV1 {
  // Automatic rollback defaults OFF. A default-on safety automation is a safety
  // automation nobody opted into.
  bool automatic_rollback_enabled = 1;
  // No automated decision below this many observations.
  uint32 minimum_sample_size = 2;
  // At least two independent failing conditions unless product explicitly
  // changes the safety policy; the field carries the number so a change is a
  // recorded configuration rather than an edit to a constant.
  uint32 minimum_failing_conditions = 3;
  // How long a `_DISPATCHED` action may go unobserved before it is ambiguous.
  uint32 verification_timeout_seconds = 4;
  // Health thresholds, each with its own value so each can be absent
  // independently. Absent means "not evaluated", never zero.
  optional double max_error_rate = 5;
  optional double min_quality_score = 6;
  optional uint64 max_latency_p95_ms = 7;
  optional int64 max_cost_micros_per_request = 8;
  optional uint32 max_evidence_age_seconds = 9;
}

// One typed verdict out of the six.
message ReleaseValidationV1 {
  ReleaseValidationKindV1 kind = 1;
  ReleaseValidationStateV1 state = 2;
  // Stable machine code. Present on everything that is not `_PASS`.
  optional string reason_code = 3;
  // What to DO about it. Stale evidence blocks with a named remediation: a
  // verdict that only says no is half a verdict.
  optional string remediation = 4;
  // Populated for `_GATE_STATUS`: the release blocks keyed by this release's
  // release key, capped at `preview_max_gate_blocks`.
  repeated ProductionReleaseBlockV1 gate_blocks = 5;
  bool gate_blocks_capped = 6;
}

// The release-posture PROJECTION.
//
// This is the read model. List and detail render from it and make no external
// call and no per-release evidence hydration.
message ReleasePostureV1 {
  ReleaseStageV1 stage = 1;
  optional string latest_action_id = 2;
  optional ReleaseActionTypeV1 latest_action_type = 3;
  optional ReleaseActionStateV1 latest_action_state = 4;
  optional google.protobuf.Timestamp latest_action_at = 5;
  // The integration's last OBSERVED health, carried onto the release so a
  // list row does not join the integration table per row.
  ReleaseIntegrationHealthV1 observed_integration_health = 6;
  optional google.protobuf.Timestamp integration_health_observed_at = 7;
  // Evidence freshness for the pinned revision, with its own availability.
  EvaluationFreshnessV1 evidence_freshness = 8;
  // True when observation disagrees with recorded state.
  bool external_drift = 9;
  optional string external_drift_reason_code = 10;
  // SERVER-computed. The client never infers lifecycle safety.
  repeated ReleaseActionTypeV1 allowed_actions = 11;
  // Why an action a caller might expect is absent. One entry per refused
  // action type, so "why can't I promote?" is answerable from the projection.
  repeated ReleaseBlockedActionV1 blocked_actions = 12;
  // True when the release-block ledger blocks this release's key.
  bool release_blocked_by_policy = 13;
  uint64 projection_version = 14;
  google.protobuf.Timestamp refreshed_at = 15;
}

message ReleaseBlockedActionV1 {
  ReleaseActionTypeV1 action_type = 1;
  string reason_code = 2;
}

message ReleaseV1 {
  string release_id = 1;
  string display_name = 2;
  // The opaque scope the release-block ledger is keyed by, so a release and the
  // production rules that can block it agree on one name.
  string release_key = 3;
  string integration_id = 4;
  ReleaseTargetV1 target = 5;
  ReleaseEvidenceSnapshotV1 evidence = 6;
  ReleasePolicyV1 policy = 7;
  // The target a rollback returns to. A reference to a PRIOR release on the same
  // target, whose health is validated BEFORE a rollback dispatches.
  optional string last_known_good_release_id = 8;
  ReleaseStageV1 stage = 9;
  PrincipalRefV1 created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  ReleasePostureV1 posture = 13;
}

// Four states and four timestamps, never collapsed.
message ReleaseActionV1 {
  string action_id = 1;
  string release_id = 2;
  ReleaseActionTypeV1 action_type = 3;
  ReleaseActionStateV1 state = 4;
  // The caller's key. `(tenant, org, release_id, action_type, client_key)` is
  // the idempotency identity.
  string idempotency_key = 5;
  // The destination's own handle for this request, recorded the moment the
  // destination acknowledges. This is what makes reconciliation possible.
  optional string external_request_ref = 6;
  // Required for hold, abort and rollback.
  optional ReleaseActionReasonV1 reason = 7;
  optional string reason_note = 8;
  PrincipalRefV1 actor = 9;
  // Compact typed failure. A code and a sanitized message, never a provider
  // body.
  optional string error_code = 10;
  optional string error_message = 11;
  // The four instants.
  google.protobuf.Timestamp requested_at = 12;
  optional google.protobuf.Timestamp dispatched_at = 13;
  optional google.protobuf.Timestamp accepted_at = 14;
  optional google.protobuf.Timestamp observed_at = 15;
  optional google.protobuf.Timestamp verified_at = 16;
  // The stage this action moves the release to on acceptance.
  ReleaseStageV1 target_stage = 17;
  uint32 attempt_count = 18;
  // Present when the action carried an audited verification override.
  optional ReleaseVerificationOverrideV1 verification_override = 19;
  // Present when reconciliation resolved this action into another
  // (`_SUPERSEDED`).
  optional string superseded_by_action_id = 20;
}

// The activity audit. Append-only, never the same row as the resource it
  // describes.
message ReleaseActivityEntryV1 {
  string entry_id = 1;
  string release_id = 2;
  // Stable machine code: `release.created`, `release.action.requested`,
  // `release.action.accepted`, `release.stage.changed`,
  // `release.verification.overridden`,...
  string activity_kind = 3;
  optional string action_id = 4;
  optional ReleaseStageV1 from_stage = 5;
  optional ReleaseStageV1 to_stage = 6;
  optional string reason_code = 7;
  PrincipalRefV1 actor = 8;
  string correlation_id = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

// One stage transition.
message ReleaseStageHistoryEntryV1 {
  optional ReleaseStageV1 from_stage = 1;
  ReleaseStageV1 to_stage = 2;
  optional string action_id = 3;
  string cause_code = 4;
  google.protobuf.Timestamp entered_at = 5;
}

// ---------------------------------------------------------------------------
// Integration configuration verbs
// ---------------------------------------------------------------------------

message ReleaseIntegrationDraftV1 {
  string display_name = 1;
  ReleaseIntegrationKindV1 kind = 2;
  ReleaseTargetV1 target = 3;
  string destination_url = 4;
  repeated string allowed_domains = 5;
  optional string callback_url_template = 6;
  bool supports_callbacks = 7;
  bool supports_polling = 8;
  // Clamped to the deployment's `[100 ms, 60 s]` window by `webhook_guard`.
  // Tenant-settable within that window only: an unbounded tenant timeout is a
  // tenant-settable stall.
  optional uint32 request_timeout_ms = 9;
  // The signing key to install as `_ACTIVE`.
  string signing_key_id = 10;
  // An EXTERNAL reference the deployment already knows how to resolve
  // (`env:NAME`). Present for the operator-provisioned case; absent when the
  // caller supplies material below and lets the platform mint the reference.
  // `NAME` must begin with `O11Y_RELEASE_SECRET_` and use only `A-Z`, `0-9`
  // and `_`; any other `env:` reference is refused.
  optional string signing_secret_ref = 11;
  // The signing secret itself, WRITE-ONLY.
  //
  // Sealed under the platform's key and stored as an envelope; the response
  // carries a `ref:` reference and a key id and never this value in any form.
  //
  // Exactly one of `signing_secret_ref` and `signing_secret_material`.
  optional string signing_secret_material = 12;

  // ---- the adapter credential ----
  //
  // A SECOND secret role, beside the signing key and never merged with it. The
  // signing key is what a receiver VERIFIES this service's requests with; the
  // credential is what this service PRESENTS to an external control plane
  // (`Authorization: Bearer …`). Argo CD and GitHub Actions need the second and
  // have no use for the first.
  //
  // They are two roles rather than one field with a meaning that depends on the
  // kind, because a value whose meaning depends on a sibling field is a value
  // somebody eventually reads with the wrong meaning — and reading a signing
  // secret as a bearer token would put HMAC material in an Authorization
  // header.
  //
  // Required for `ARGO_CD` and `GITHUB_ACTIONS`; refused for
  // `SIGNED_DEPLOYMENT_WEBHOOK`, which authenticates by signature.
  optional string credential_id = 13;
  // An EXTERNAL reference the deployment already resolves (`env:NAME`).
  // `NAME` must begin with `O11Y_RELEASE_SECRET_` and use only `A-Z`, `0-9`
  // and `_`; any other `env:` reference is refused.
  optional string credential_secret_ref = 14;
  // The token itself, WRITE-ONLY, never echoed in any form.
  //
  // Exactly one of `credential_secret_ref` and `credential_secret_material`.
  optional string credential_secret_material = 15;
  // ---- end of the adapter credential ----
}

message CreateReleaseIntegrationRequest {
  ReleaseIntegrationDraftV1 draft = 1;
  string idempotency_key = 2;
}

message CreateReleaseIntegrationResponse {
  ReleaseIntegrationV1 integration = 1;
  bool idempotent_replay = 2;
}

message GetReleaseIntegrationRequest {
  string integration_id = 1;
}

message GetReleaseIntegrationResponse {
  ReleaseIntegrationV1 integration = 1;
  // How many releases currently point at this integration. One statement, not
  // a per-release hydration.
  uint32 active_release_count = 2;
  EvaluationFreshnessV1 freshness = 3;
}

message ReleaseIntegrationListFilterV1 {
  optional ReleaseIntegrationKindV1 kind = 1;
  optional string environment = 2;
  optional bool include_archived = 3;
  optional ReleaseIntegrationHealthV1 health = 4;
}

message ListReleaseIntegrationsRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  optional ReleaseIntegrationListFilterV1 filter = 3;
}

message ListReleaseIntegrationsResponse {
  repeated ReleaseIntegrationV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  EvaluationFreshnessV1 freshness = 5;
}

// Every field is optional: an update names what it changes. The kind and the
// target are absent on purpose — changing either would make historical
// releases point at an integration that is no longer the one they used.
message ReleaseIntegrationPatchV1 {
  optional string display_name = 1;
  optional string destination_url = 2;
  // Replaces the allowlist wholesale when present. A merge would make
  // "remove a domain" unexpressible.
  repeated string allowed_domains = 3;
  optional string callback_url_template = 4;
  optional bool supports_callbacks = 5;
  optional bool supports_polling = 6;
  optional uint32 request_timeout_ms = 7;
  // Installs a new `_ACTIVE` key and moves the current one to `_ROTATING` for
  // `rotation_window_seconds`. Both are valid during the window; the key id in
  // the canonical bytes says which signed a request.
  optional string rotate_to_signing_key_id = 8;
  // The same reference forms as `signing_secret_ref`, including the
  // `O11Y_RELEASE_SECRET_` rule for an `env:` reference.
  optional string rotate_to_signing_secret_ref = 9;
  optional uint32 rotation_window_seconds = 10;
  // The new key's material, WRITE-ONLY and never echoed. Exactly one of
  // `rotate_to_signing_secret_ref` and `rotate_to_signing_secret_material`.
  optional string rotate_to_signing_secret_material = 11;
  // Ends a `_ROTATING` key's window immediately: the key row becomes
  // `_REVOKED` and its envelope keeps its ciphertext for the retention window
  // rather than being deleted, so "which key signed that request last month?"
  // stays answerable after the key stops being usable.
  optional string revoke_signing_key_id = 12;

  // ---- the adapter credential ----
  // Replaces the ACTIVE credential. No rotation WINDOW, unlike the signing
  // side: the previous token is revoked in the same transaction and kept for
  // its retention window, because a presented token has no interval during
  // which the old one still has to work.
  //
  // Exactly one of `rotate_to_credential_secret_ref` and
  // `rotate_to_credential_secret_material`.
  optional string rotate_to_credential_id = 13;
  // The reference form: names material this deployment already holds. Absent
  // means "not rotating by reference" — never "rotate to an empty secret".
  // An `env:` reference names a variable that begins with
  // `O11Y_RELEASE_SECRET_`, as on `credential_secret_ref`.
  optional string rotate_to_credential_secret_ref = 14;
  // The inline form: the tenant supplies the material, which is sealed on
  // arrival and never comes back on any read. Absent means "not rotating by
  // material". Both absent, with `rotate_to_credential_id` present, is a
  // refusal rather than a rotation to nothing.
  optional string rotate_to_credential_secret_material = 15;
  // ---- end of the adapter credential ----
}

message UpdateReleaseIntegrationRequest {
  string integration_id = 1;
  ReleaseIntegrationPatchV1 patch = 2;
}

message UpdateReleaseIntegrationResponse {
  ReleaseIntegrationV1 integration = 1;
}

message ArchiveReleaseIntegrationRequest {
  string integration_id = 1;
}

message ArchiveReleaseIntegrationResponse {
  ReleaseIntegrationV1 integration = 1;
  bool already_archived = 2;
  // Archiving never cascades to a release: historical evidence stays resolvable,
  // and a release that shipped is not undone by retiring the pipe it shipped
  // through.
  uint32 releases_referencing = 3;
}

// ---------------------------------------------------------------------------
// Release creation, preview and the two reads
// ---------------------------------------------------------------------------

// What a release is created FROM.
//
// There is no "latest" field and there will not be one: a release pins an
// explicit decision revision id, and a caller who does not have one has not
// adopted a decision yet.
message ReleaseCandidateRefV1 {
  string evaluation_run_id = 1;
  string candidate_key = 2;
  // THE PIN: the explicitly adopted evidence/decision revision.
  string decision_revision_id = 3;
}

message ReleaseDraftV1 {
  string display_name = 1;
  string release_key = 2;
  string integration_id = 3;
  ReleaseCandidateRefV1 candidate = 4;
  optional ReleasePolicyV1 policy = 5;
  optional string last_known_good_release_id = 6;
}

message CreateReleaseRequest {
  ReleaseDraftV1 draft = 1;
  string idempotency_key = 2;
}

message CreateReleaseResponse {
  ReleaseV1 release = 1;
  bool idempotent_replay = 2;
  // The same six verdicts `PreviewRelease` returns, evaluated at creation. A
  // creation whose gate status FAILS still creates the release in
  // `_PRE_RELEASE` — the block is on the ACTION, not on writing down what you
  // intend to ship. That is what makes "why is this release blocked?"
  // answerable at all.
  repeated ReleaseValidationV1 validations = 3;
}

message PreviewReleaseRequest {
  // Preview an existing release...
  optional string release_id = 1;
  // ...or a draft that has not been created. Exactly one of the two.
  optional ReleaseDraftV1 draft = 2;
}

message PreviewReleaseResponse {
  repeated ReleaseValidationV1 validations = 1;
  ReleaseEvidenceSnapshotV1 evidence = 2;
  // What the release WOULD allow if it were created now. Server-computed, on
  // the same evaluator the posture uses, so a preview and a posture cannot
  // disagree.
  repeated ReleaseActionTypeV1 would_allow_actions = 3;
  // Asserted on the wire rather than promised in a comment: the number of
  // adapter calls this preview made. It is zero, always.
  uint32 external_calls_made = 4;
  EvaluationFreshnessV1 freshness = 5;
}

message GetReleaseRequest {
  string release_id = 1;
}

message GetReleaseResponse {
  ReleaseV1 release = 1;
  // Bounded. Capped, never paged into the detail: a release that ran two
  // hundred actions renders in the same payload as one that ran two.
  repeated ReleaseActionV1 recent_actions = 2;
  bool recent_actions_capped = 3;
  repeated ReleaseStageHistoryEntryV1 stage_history = 4;
  bool stage_history_capped = 5;
  repeated ReleaseActivityEntryV1 recent_activity = 6;
  bool recent_activity_capped = 7;
  optional string activity_next_cursor = 8;
  // The six verdicts, from the projection.
  repeated ReleaseValidationV1 validations = 9;
  // The integration, without a second round trip.
  ReleaseIntegrationV1 integration = 10;
  optional ReleaseV1 last_known_good = 11;
  EvaluationFreshnessV1 freshness = 12;
  // Live-health snapshots, capped at `detail_health_snapshot_cap` (10).
  repeated ReleaseHealthSnapshotV1 recent_health_snapshots = 13;
  ReleaseDriftPostureV1 drift_posture = 14;
  // Audited overrides recorded against this release, capped at 10.
  repeated ReleaseVerificationOverrideV1 verification_overrides = 15;
}

message ReleaseListFilterV1 {
  optional string integration_id = 1;
  optional ReleaseStageV1 stage = 2;
  optional string environment = 3;
  optional string release_key = 4;
}

message ListReleasesRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  optional ReleaseListFilterV1 filter = 3;
}

message ListReleasesResponse {
  // Projection-backed. Each item carries its posture; none carries its actions,
  // its activity or its evidence hydration.
  repeated ReleaseV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  // Asserted on the wire: zero, always.
  uint32 external_calls_made = 5;
  EvaluationFreshnessV1 freshness = 6;
}

// ---------------------------------------------------------------------------
// The five action verbs
// ---------------------------------------------------------------------------

message StartReleaseCanaryRequest {
  string release_id = 1;
  string idempotency_key = 2;
  // Optional here: starting a canary is not a destructive act. Hold, abort and
  // rollback make it required.
  optional ReleaseActionReasonV1 reason = 3;
  optional string reason_note = 4;
  // Required only when the release is in `_VERIFICATION_REQUIRED`. Absent then,
  // the verb is refused `FAILED_PRECONDITION` with `verification_required`.
  optional ReleaseVerificationOverrideV1 verification_override = 5;
}

message StartReleaseCanaryResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  // True when the idempotency key matched an existing action with the same
  // normalized digest. A different digest is `ALREADY_EXISTS` and no response.
  bool idempotent_replay = 3;
}

message PromoteReleaseRequest {
  string release_id = 1;
  string idempotency_key = 2;
  optional ReleaseActionReasonV1 reason = 3;
  optional string reason_note = 4;
  optional ReleaseVerificationOverrideV1 verification_override = 5;
}

message PromoteReleaseResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  bool idempotent_replay = 3;
}

message HoldReleaseRequest {
  string release_id = 1;
  string idempotency_key = 2;
  // REQUIRED. Typed, so "why was this held?" is answerable by a machine and not
  // only by reading prose.
  ReleaseActionReasonV1 reason = 3;
  optional string reason_note = 4;
  optional ReleaseVerificationOverrideV1 verification_override = 5;
}

message HoldReleaseResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  bool idempotent_replay = 3;
}

message AbortReleaseRequest {
  string release_id = 1;
  string idempotency_key = 2;
  ReleaseActionReasonV1 reason = 3;
  optional string reason_note = 4;
  optional ReleaseVerificationOverrideV1 verification_override = 5;
}

message AbortReleaseResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  bool idempotent_replay = 3;
}

message RollbackReleaseRequest {
  string release_id = 1;
  string idempotency_key = 2;
  ReleaseActionReasonV1 reason = 3;
  optional string reason_note = 4;
  optional ReleaseVerificationOverrideV1 verification_override = 5;
}

message RollbackReleaseResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  bool idempotent_replay = 3;
  // The last-known-good this rollback targets, and the verdict on its health. A
  // rollback whose target is unhealthy is refused BEFORE the action row is
  // written, and the verdict says which check refused it.
  optional string rollback_target_release_id = 4;
  ReleaseValidationV1 rollback_target_verdict = 5;
}

// ---------------------------------------------------------------------------
// The action ledger
// ---------------------------------------------------------------------------

message GetReleaseActionRequest {
  string action_id = 1;
}

message GetReleaseActionResponse {
  ReleaseActionV1 action = 1;
  ReleaseV1 release = 2;
  // Normalized observations for this action, capped at 20 and cursored.
  repeated ReleaseObservationV1 observations = 3;
  optional string observations_next_cursor = 4;
}

message ReleaseActionListFilterV1 {
  optional string release_id = 1;
  optional ReleaseActionTypeV1 action_type = 2;
  optional ReleaseActionStateV1 state = 3;
}

message ListReleaseActionsRequest {
  optional uint32 limit = 1;
  optional string page_token = 2;
  optional ReleaseActionListFilterV1 filter = 3;
}

message ListReleaseActionsResponse {
  repeated ReleaseActionV1 items = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  uint32 effective_page_size = 4;
  EvaluationFreshnessV1 freshness = 5;
}

// ---------------------------------------------------------------------------
// Release observations, health and drift
// ---------------------------------------------------------------------------
//
// Observations, health snapshots and drift, readable through detail under a
// cap.

// The live-health evaluation behind a progression decision. Each condition
// carries its OWN availability, because a threshold that could not be
// evaluated is not a threshold that passed.
message ReleaseHealthConditionV1 {
  // `quality`, `error_rate`, `latency_p95`, `cost_per_request`,
  // `sample_size`, `freshness`.
  string condition_key = 1;
  MetricAvailabilityV1 availability = 2;
  optional double observed_value = 3;
  optional double threshold_value = 4;
  bool failing = 5;
  optional string reason_code = 6;
}

message ReleaseHealthSnapshotV1 {
  string snapshot_id = 1;
  string release_id = 2;
  ReleaseStageV1 stage = 3;
  google.protobuf.Timestamp window_start = 4;
  google.protobuf.Timestamp window_end = 5;
  uint32 sample_size = 6;
  // Below the policy's minimum sample no automated decision is taken, and the
  // snapshot says so rather than deciding on thin evidence.
  bool minimum_sample_met = 7;
  repeated ReleaseHealthConditionV1 conditions = 8;
  uint32 failing_condition_count = 9;
  // Exactly which evidence triggered or PREVENTED progression. The preventing
  // half is what makes "why is this release blocked?" answerable.
  repeated string triggering_condition_keys = 10;
  repeated string preventing_condition_keys = 11;
  optional string automatic_action_id = 12;
  google.protobuf.Timestamp observed_at = 13;
  // ---- observation, recovery, live health ----
  // `failing_condition_count` and the two key lists say what the EVIDENCE was;
  // this says why the evidence did or did not act. The four ways a snapshot with
  // two failing conditions declines to roll back are the policy being off, no
  // rollback target, a target whose own health does not verify, and the count
  // falling short.
  //
  // One of: `no_decision_insufficient_sample`, `no_decision_stale_evidence`,
  // `no_decision_no_available_inputs`, `healthy`, `degraded_below_policy`,
  // `rollback_suppressed_policy_disabled`,
  // `rollback_suppressed_no_last_known_good`,
  // `rollback_suppressed_last_known_good_unverified`, `rollback_triggered`.
  string decision_code = 14;
  // `absent`, `unverified` or `verified`: what was known about the rollback
  // target BEFORE any rollback. Recorded for every snapshot, not just the ones
  // that rolled back.
  string last_known_good_posture = 15;
  // Why the posture is what it is, present only when the posture is not
  // `verified`. Absent on a `verified` posture is the normal case and carries
  // no meaning; a client must not read absence as "reason unknown" on the other
  // two postures — it does not occur.
  optional string last_known_good_reason_code = 16;
  // The policy as it stood when this snapshot was taken. Snapshotted rather
  // than joined: a policy that changes later must not retro-change what this
  // snapshot says was decided.
  bool automatic_rollback_enabled = 17;
  // How many required conditions were failing when this snapshot was taken.
  // Zero is a real value and the healthy one, so a client cached before this
  // field existed reads the correct answer for a healthy snapshot and an
  // UNDERSTATED one for an unhealthy snapshot; read it beside
  // `decision_code`, which does not have that ambiguity.
  uint32 required_failing_condition_count = 18;
  // ---- end of observation, recovery, live health ----
}

// External state that disagrees with recorded release state.
message ReleaseDriftPostureV1 {
  bool drift_detected = 1;
  optional string drift_reason_code = 2;
  // What the destination says it is doing, when it says anything.
  optional ReleaseStageV1 externally_observed_stage = 3;
  optional string external_state_label = 4;
  optional google.protobuf.Timestamp detected_at = 5;
  // Absent posture is not "no drift": a release nothing has observed has an
  // unavailable drift verdict, not a clean one.
  MetricAvailabilityV1 availability = 6;
  // ---- observation, recovery, live health ----
  // `drift_detected` is a bool, and a release is blocked only on MATERIAL drift.
  // This says which: a destination that contradicts us about what is live is
  // not one that contradicts us about an action settled last week.
  //
  // `immaterial` or `material`; absent when no drift is detected.
  optional string drift_materiality = 7;
  // The observation that established the current posture, so a reader can go
  // from "this is drifting" to the evidence in one hop.
  optional string drift_observation_id = 8;
  // ---- end of observation, recovery, live health ----
}

// One normalized observation. Callbacks and polls both land here.
message ReleaseObservationV1 {
  string observation_id = 1;
  string action_id = 2;
  // `callback` or `poll`.
  string source = 3;
  // The destination's own event identity, which is what dedupe is keyed by.
  string external_event_id = 4;
  optional int64 provider_sequence = 5;
  optional google.protobuf.Timestamp provider_observed_at = 6;
  optional ReleaseActionStateV1 reported_action_state = 7;
  optional ReleaseStageV1 reported_stage = 8;
  // False when the observation was recorded but NOT applied: an older
  // observation, a duplicate, or one implying an illegal transition. Such an
  // observation is recorded and flagged as drift, never applied, and never
  // silently dropped.
  bool applied = 9;
  optional string not_applied_reason_code = 10;
  google.protobuf.Timestamp received_at = 11;
  // ---- observation, recovery, live health ----
  // `applied` is a bool, and the four ways an observation can fail to apply are
  // not one thing. `ignored_duplicate` (a replay), `superseded_stale` (older
  // than what is applied), `ignored_unorderable` (the provider gave nothing to
  // order by) and `drift_recorded` (the transition is not reachable) send an
  // operator to four different places, and only the last one can block a
  // release. Collapsing them into `applied = false` would make "your provider
  // is retrying" and "your provider disagrees with us about what is live" the
  // same row.
  //
  // One of: `applied`, `ignored_duplicate`, `superseded_stale`,
  // `ignored_unorderable`, `drift_recorded`.
  string disposition = 12;
  // `immaterial` or `material`, and present only on a `drift_recorded` row.
  // Material drift moves the release to `_VERIFICATION_REQUIRED`; immaterial
  // drift (a destination contradicting us about an action that is already
  // terminal) is recorded and flagged without blocking anything.
  optional string drift_materiality = 13;
  // ---- end of observation, recovery, live health ----
  // ---- correlation confidence ----
  // HOW this observation was matched to its action — not how much the service
  // believes it.
  //
  // A poll asks a destination "what happened", and the answer has to be tied
  // back to the action that caused it. Sometimes that tie is an identity the
  // destination echoed back (`_EXACT`); sometimes it is only "this is the one
  // thing that ran in the window after we dispatched" (`_WINDOW`). Those are
  // different evidentiary claims and a human reading a drift investigation has
  // to be able to tell them apart, which is why the service already refuses to
  // backfill a discovered request handle from a `_WINDOW` match.
  //
  // **Absent (`_UNSPECIFIED`) is the honest answer for a callback**, and the
  // common case: a signed callback is bound to its action by the receipt it
  // arrived on, so it was never correlated at all and "exact" would be a
  // category error. Absent also covers every observation recorded before this
  // field shipped. A client MUST read `_UNSPECIFIED` as "this row states no
  // correlation confidence", never as a weak match.
  optional ReleaseObservationConfidenceV1 correlation_confidence = 14;
  // ---- end of correlation confidence ----
}
// ---- end of releases ----

// ---- action-effect adapters ----
//
// Production-rule action targets and effects.

// Which resource an action acts ON.
//
// WHICH collection a draft lands in, WHICH evaluation a linked run launches,
// WHO is asked to review, or WHICH destination is notified.
//
// A `oneof` rather than four optional id strings, for the reason
// `ProductionWorkflowStepEffectV1` gives about effects: an action cannot claim
// two targets, and a seventh action kind has to declare its target shape rather
// than inheriting an absence. `_SCORE` and `_BLOCK_RELEASE` carry no target at
// all, and one on them is refused at authoring.
message ProductionRuleActionTargetV1 {
  oneof target {
    ProductionRuleDatasetDraftTargetV1 dataset_draft = 1;
    ProductionRuleReviewTargetV1 review = 2;
    ProductionRuleLinkedEvaluationTargetV1 linked_evaluation = 3;
    ProductionRuleNotifyTargetV1 notify = 4;
  }
}

// `_CREATE_DATASET_DRAFT`. The collection whose one OPEN draft the proposed
// case joins: the same lifecycle `CaptureEvaluationCase` uses.
message ProductionRuleDatasetDraftTargetV1 {
  string dataset_collection_id = 1;
  // The selectors that turn the matched span into a case, in the SAME selector
  // language `CaptureEvaluationCase` takes — `DatasetFieldMappingV1`, reused
  // rather than a second spelling (canonical-type rule R5). Without them a
  // promotion could only ever store provenance; with them a rule promotion runs
  // the same mapping kernel and produces the same digest a human capture of
  // that span would.
  repeated DatasetFieldMappingV1 field_mappings = 2;
  optional string recorded_output_field_path = 3;
}

// `_REQUEST_REVIEW`. The reviewer this rule assigns.
//
// It is required: a created review task is always assigned to a reviewer.
// The rule IS the assignment policy.
message ProductionRuleReviewTargetV1 {
  string reviewer_principal_id = 1;
}

// `_RUN_LINKED_EVALUATION`. What to launch, through the same resolver and the
// same frozen manifest every other launch uses.
message ProductionRuleLinkedEvaluationTargetV1 {
  string evaluation_definition_id = 1;
  // Absent means "whatever revision is current at dispatch", which is the
  // launch path's own default and the only one that keeps a long-lived rule
  // useful as its definition is edited. Present pins one revision for good.
  optional string evaluation_definition_revision_id = 2;
}

// `_NOTIFY`. The destination, named at authoring even though this build cannot
// deliver to it.
//
// **This build does not dispatch `_NOTIFY`**: see
// `production_rule_action_dispatch` on the capability set. The target is
// declared anyway, so a rule authored today records WHICH destination it
// meant.
message ProductionRuleNotifyTargetV1 {
  string alert_destination_id = 1;
}

// Which subject a review unit names.
//
// Review has three LEVELS (unit, task, submission), and a unit's identity is
// (run, cell coordinate, human scorer). A unit may also point at the dataset
// case a production rule proposed. Every older unit is `_EVALUATION_CELL`.
enum EvaluationReviewSubjectKindV1 {
  EVALUATION_REVIEW_SUBJECT_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_REVIEW_SUBJECT_KIND_V1_EVALUATION_CELL = 1;
  EVALUATION_REVIEW_SUBJECT_KIND_V1_DATASET_PROPOSED_CASE = 2;
}
// ---- end of action-effect adapters ----

// ---- dataset quality signals ----
//
// Four sections, computed from the materialized payload the extraction preview
// already renders, and computed again at changeset scope: "is this case
// contaminated" and "is this changeset contaminated" are different questions.
//
// The rule every message here obeys: a verdict this build did not compute must
// be impossible to spell as a verdict this build computed. That is why each
// section carries its own `MetricAvailabilityV1`, its own `method_name` /
// `method_version`, and its own caps, and why `_NOT_COMPARABLE` and
// `_INDETERMINATE` are values rather than absences.

// A detector this build can decide DETERMINISTICALLY, with a version.
//
// No ML, no entropy heuristic, no external call. Each of these is a byte scan
// over one field's canonical rendering whose result depends only on that value —
// which is what makes the golden vectors in the suite a determinism proof.
enum DatasetRedactionDetectorKindV1 {
  DATASET_REDACTION_DETECTOR_KIND_V1_UNSPECIFIED = 0;
  DATASET_REDACTION_DETECTOR_KIND_V1_EMAIL = 1;
  DATASET_REDACTION_DETECTOR_KIND_V1_PHONE_E164 = 2;
  // A 13-19 digit run that PASSES LUHN. The check is arithmetic rather than a
  // guess, which is why the kind is `CREDIT_CARD` and not `LONG_NUMBER`.
  DATASET_REDACTION_DETECTOR_KIND_V1_CREDIT_CARD = 3;
  // Published, fixed key prefixes only.
  DATASET_REDACTION_DETECTOR_KIND_V1_API_KEY = 4;
  // Three base64url segments whose FIRST decodes to JSON carrying "alg".
  // Decoded, not pattern-guessed.
  DATASET_REDACTION_DETECTOR_KIND_V1_JWT = 5;
  // The configured field-path pattern matched. Configuration, not inference.
  DATASET_REDACTION_DETECTOR_KIND_V1_DENY_PATH = 6;
}

// What happened to one field. The order below is the refusal precedence: each
// earlier answer is a stronger statement than the one after.
enum DatasetRedactionOutcomeKindV1 {
  DATASET_REDACTION_OUTCOME_KIND_V1_UNSPECIFIED = 0;
  // Scanned, nothing matched.
  DATASET_REDACTION_OUTCOME_KIND_V1_CLEAN = 1;
  // A `redact` rule matched and the SAFE SNAPSHOT carries the masked form. The
  // raw value never reaches storage.
  DATASET_REDACTION_OUTCOME_KIND_V1_REDACTED = 2;
  // A `block` rule or a deny-path matched. Draft creation is refused.
  DATASET_REDACTION_OUTCOME_KIND_V1_BLOCKED = 3;
  // The value could not be scanned at all: it is over the scan bound, or the
  // policy could not be loaded. NOT "clean": a field we declined to scan is not
  // a field we found clean, and this fails closed.
  DATASET_REDACTION_OUTCOME_KIND_V1_INDETERMINATE = 4;
}

// One field's outcome. Carries WHICH detectors fired and HOW MANY times, and
// never the matched text: a finding that quoted the credit-card number it found
// would be the leak it exists to prevent.
message DatasetRedactionOutcomeV1 {
  string target_path = 1;
  DatasetRedactionOutcomeKindV1 outcome = 2;
  repeated DatasetRedactionDetectorKindV1 detector_kinds = 3;
  uint32 match_count = 4;
  optional string reason_code = 5;
}

message DatasetRedactionSectionV1 {
  // `builtin/default` when the org has registered no policy. There is no such
  // thing as an unchecked capture on this surface: a build in which "no policy
  // configured" and "the policy ran and found nothing" rendered identically
  // would re-create the exact defect this section exists to remove.
  string policy_id = 1;
  uint32 policy_version = 2;
  // The DETECTOR implementation's version, deliberately separate from the
  // policy's: the policy is the customer's rule set, the method is this build's
  // code. A detector fix moves one and not the other.
  string method_name = 3;
  string method_version = 4;
  repeated DatasetRedactionOutcomeV1 outcomes = 5;
  // The case-level roll-up, by the precedence above.
  DatasetRedactionOutcomeKindV1 verdict = 6;
  bool blocks_draft_creation = 7;
  uint64 max_scan_bytes = 8;
  MetricAvailabilityV1 availability = 9;
}

enum DatasetDedupeSubjectKindV1 {
  DATASET_DEDUPE_SUBJECT_KIND_V1_UNSPECIFIED = 0;
  DATASET_DEDUPE_SUBJECT_KIND_V1_DATASET_ITEM = 1;
  DATASET_DEDUPE_SUBJECT_KIND_V1_PROPOSED_CASE = 2;
}

enum DatasetDuplicationVerdictV1 {
  DATASET_DUPLICATION_VERDICT_V1_UNSPECIFIED = 0;
  DATASET_DUPLICATION_VERDICT_V1_NO_MATCH = 1;
  DATASET_DUPLICATION_VERDICT_V1_EXACT_MATCH = 2;
  DATASET_DUPLICATION_VERDICT_V1_NEAR_MATCH = 3;
  // Same input fingerprint, DIFFERENT expected fingerprint. This blocks automatic
  // merge and requires an explicit reviewer resolution.
  DATASET_DUPLICATION_VERDICT_V1_CONFLICT = 4;
  // The fingerprint engine could not answer. Draft creation is still allowed;
  // publication is not.
  DATASET_DUPLICATION_VERDICT_V1_UNAVAILABLE = 5;
}

message DatasetDuplicationCandidateV1 {
  string subject_id = 1;
  DatasetDedupeSubjectKindV1 subject_kind = 2;
  DatasetDuplicationVerdictV1 verdict = 3;
  // `1 - hamming/64`. Absent on an exact match: 1.0 there would be a claim about
  // similarity when what was established was equality of the canonical form.
  optional double similarity = 4;
  uint32 hamming_distance = 5;
  bool expected_output_conflicts = 6;
  optional string dataset_version_id = 7;
}

message DatasetDuplicationSectionV1 {
  DatasetDuplicationVerdictV1 verdict = 1;
  // sha256 over the canonical form of the input with declared volatile paths
  // stripped. NOT the shipped `content_digest`, which binds source ids and
  // selector order and would report zero duplicates on a corpus that was mostly
  // duplicates.
  string input_fingerprint = 2;
  string expected_fingerprint = 3;
  string method_name = 4;
  string method_version = 5;
  // The NEAR tier is a different method from the exact tier and says so, so a
  // reader can tell which computation produced a verdict.
  string near_method_name = 17;
  // The threshold in force, on the wire and in the stored resolution, so a
  // later threshold change cannot make a past keep-separate look wrong.
  uint32 near_duplicate_max_hamming = 6;
  // Four 16-bit bands. By pigeonhole two signatures within Hamming 3 must agree
  // exactly on at least one band, so the four indexed probes return a SUPERSET
  // of every near duplicate at the threshold — the bounded lookup is complete,
  // not approximate.
  uint32 simhash_bands = 7;
  repeated DatasetDuplicationCandidateV1 candidates = 8;
  uint32 truncated_candidate_count = 9;
  // The coverage denominator. When these two differ the index does not yet cover
  // the version, the availability says so, and the section is DEGRADED rather
  // than reporting a clean sheet it did not earn.
  uint32 indexed_subject_count = 10;
  uint32 version_case_count = 11;
  bool permits_publish = 12;
  string caveat_code = 13;
  uint32 max_candidates_returned = 14;
  uint32 max_candidates_scanned = 15;
  MetricAvailabilityV1 availability = 16;
}

// A decision procedure's result, recorded.
enum DatasetDedupeResolutionKindV1 {
  DATASET_DEDUPE_RESOLUTION_KIND_V1_UNSPECIFIED = 0;
  // Exact match resolved to the existing case revision, with no reviewer. The
  // only kind that may carry no `resolved_by_user_id`.
  DATASET_DEDUPE_RESOLUTION_KIND_V1_AUTO_EXACT = 1;
  DATASET_DEDUPE_RESOLUTION_KIND_V1_MERGE_INTO = 2;
  DATASET_DEDUPE_RESOLUTION_KIND_V1_KEEP_SEPARATE = 3;
  DATASET_DEDUPE_RESOLUTION_KIND_V1_CONFLICT_BLOCKED = 4;
  DATASET_DEDUPE_RESOLUTION_KIND_V1_AUDITED_OVERRIDE_SEPARATE = 5;
}

message DedupeResolutionV1 {
  string proposed_case_id = 1;
  DatasetDedupeResolutionKindV1 resolution = 2;
  optional string matched_case_revision_id = 3;
  string method_name = 4;
  string method_version = 5;
  optional double similarity = 6;
  uint32 threshold_in_force = 7;
  // Absent EXACTLY when the resolution is `_AUTO_EXACT`: an automatic resolution
  // never names a reviewer, and a reviewer resolution always names one.
  optional string resolved_by_user_id = 8;
  optional string audited_override_reason = 9;
  google.protobuf.Timestamp resolved_at = 10;
}

enum DatasetLeakageSourceKindV1 {
  DATASET_LEAKAGE_SOURCE_KIND_V1_UNSPECIFIED = 0;
  // Dataset case revisions this org has already evaluated. NOT prior output
  // TEXT: `evaluation_prepared_cases` and `evaluation_cell_results` carry no
  // payload and no output column by deliberate design, so a build claiming to
  // compare output text would be lying. Case REUSE is the real, computable and
  // operationally meaningful signal.
  DATASET_LEAKAGE_SOURCE_KIND_V1_PRIOR_EVALUATION_CASES = 1;
  // The same, narrowed to runs an adopted `evaluation_releases` row references.
  DATASET_LEAKAGE_SOURCE_KIND_V1_ADOPTED_RELEASE_EVIDENCE = 2;
  DATASET_LEAKAGE_SOURCE_KIND_V1_CONFIGURED_REFERENCE_SET = 3;
}

enum DatasetLeakageVerdictV1 {
  DATASET_LEAKAGE_VERDICT_V1_UNSPECIFIED = 0;
  DATASET_LEAKAGE_VERDICT_V1_NO_SIGNAL = 1;
  DATASET_LEAKAGE_VERDICT_V1_EXACT_OVERLAP = 2;
  DATASET_LEAKAGE_VERDICT_V1_NEAR_OVERLAP = 3;
  // The source is unauthorized or incomparable. Never silently "clean". A
  // corpus indexed under one fingerprint method version is genuinely not
  // comparable to a subject fingerprinted under another, and this is what the
  // build says instead of reporting zero matches.
  DATASET_LEAKAGE_VERDICT_V1_NOT_COMPARABLE = 4;
}

message DatasetLeakageSourceSignalV1 {
  DatasetLeakageSourceKindV1 source = 1;
  DatasetLeakageVerdictV1 verdict = 2;
  uint32 matched_count = 3;
  // "12 duplicates" without "of 100" is not a finding — `DataQualityFindingV1`'s
  // own rule, applied here.
  //
  // **It counts a different population per source, on purpose**, because the
  // three sources answer different questions:
  //
  //   `_PRIOR_EVALUATION_CASES` / `_ADOPTED_RELEASE_EVIDENCE`
  //       the duplicate CANDIDATES this case has — "3 of the 7 cases you
  //       already have that match this one were evaluated".
  //   `_CONFIGURED_REFERENCE_SET`
  //       the size of the registered fingerprint CORPUS — "not among the 12,000
  //       fingerprints you registered".
  //
  // Forcing one meaning across all three would make the reference row read
  // "0 of 2 keys checked", which answers a question nobody asked. Read the
  // denominator with its `source`.
  uint32 denominator = 4;
  repeated string affected_case_ids = 5;
  string method_name = 6;
  string method_version = 7;
  // ABSENT on every signal this build emits, and deliberately so. No false
  // positive rate has been MEASURED for either method, and a number nobody
  // measured is worse than absence, because a client will plot it. The caveat
  // travels as `caveat_code` instead.
  optional double false_positive_rate = 8;
  string caveat_code = 9;
  MetricAvailabilityV1 availability = 10;
}

message DatasetLeakageSectionV1 {
  // Always one entry per source kind, in enum order. A source that could not
  // answer is present with `_NOT_COMPARABLE`, never omitted: an omitted source
  // and a clean source are the same pixel.
  repeated DatasetLeakageSourceSignalV1 sources = 1;
  DatasetLeakageVerdictV1 verdict = 2;
  uint32 max_sources_scanned = 3;
  MetricAvailabilityV1 availability = 4;
}

// Where the compared slice dimensions came from.
//
// `EvaluationSliceDimensionV1::_COHORT` is deliberately NOT reused for a case:
// `EvaluationCohortSpecV1` binds a cohort to a (collection, version) pair, so a
// cohort is a property of a RUN and every case in a version shares one. Slicing
// cases by cohort would be a distribution with one bucket — a section that
// renders, satisfies a reviewer, and means nothing.
enum DatasetSliceDimensionSourceV1 {
  DATASET_SLICE_DIMENSION_SOURCE_V1_UNSPECIFIED = 0;
  // The dataset's immutable `DatasetSchemaRevisionV1` declared them, and the section
  // pins the revision id and fingerprint it compared against.
  DATASET_SLICE_DIMENSION_SOURCE_V1_SCHEMA_REVISION = 1;
  // The collection has no schema revision at all. Only the shipped `_COHORT`
  // dimension exists, which is not a case property — so nothing is comparable
  // and the section says so rather than inventing a normalization.
  DATASET_SLICE_DIMENSION_SOURCE_V1_SHIPPED_COHORT_ONLY = 2;
}

enum DatasetSliceFlagV1 {
  DATASET_SLICE_FLAG_V1_UNSPECIFIED = 0;
  DATASET_SLICE_FLAG_V1_WITHIN_BAND = 1;
  DATASET_SLICE_FLAG_V1_OVERREPRESENTED = 2;
  DATASET_SLICE_FLAG_V1_UNDERREPRESENTED = 3;
  // The case carries no value on an approved dimension, so it joins no slice.
  DATASET_SLICE_FLAG_V1_MISSING = 4;
  // `NO_COMPATIBLE_DISTRIBUTION`, per dimension.
  DATASET_SLICE_FLAG_V1_NOT_COMPARABLE = 5;
}

message DatasetSliceObservationV1 {
  string dimension_key = 1;
  optional string slice_value = 2;
  DatasetSliceFlagV1 flag = 3;
  uint32 dataset_count = 4;
  uint32 dataset_denominator = 5;
  optional double dataset_share = 6;
  // ALWAYS `NO_COMPATIBLE_DISTRIBUTION / no_maintained_production_distribution`
  // in this build. Not a missing query — a missing plane. Reported per row
  // rather than as one caveat, so a client cannot render the dataset comparison
  // and quietly imply the production one happened too.
  MetricAvailabilityV1 production_availability = 7;
  MetricAvailabilityV1 availability = 8;
}

message DatasetSliceSectionV1 {
  DatasetSliceDimensionSourceV1 dimension_source = 1;
  optional string schema_revision_id = 2;
  optional string schema_fingerprint = 3;
  repeated DatasetSliceObservationV1 observations = 4;
  // How many DIMENSIONS hit `max_slice_values_per_dimension`, not how many
  // values were dropped. The read uses the cap+1 device, which detects
  // truncation without counting it, so the number of dropped values is not
  // known — and a field that reported `1` while thousands were dropped would be
  // exactly the un-earned precision this surface's denominators exist to
  // prevent. A dimension counted here has an INCOMPLETE distribution behind it.
  uint32 truncated_slice_value_count = 5;
  // The thresholds are a VERSIONED policy value.
  uint32 slice_policy_version = 6;
  double underrepresented_below = 7;
  double overrepresented_above = 8;
  uint32 max_slice_values_per_dimension = 9;
  MetricAvailabilityV1 availability = 10;
}

// The four sections, as one field on the preview response.
//
// One field and not four: the sections share one availability story, and a
// client handed four independent optionals has four chances to render three of
// them.
message DatasetCaseQualitySignalsV1 {
  DatasetRedactionSectionV1 redaction = 1;
  DatasetDuplicationSectionV1 duplication = 2;
  DatasetLeakageSectionV1 leakage = 3;
  DatasetSliceSectionV1 slices = 4;
}

// The same four at CHANGESET scope.
//
// "Is this case contaminated" and "is this changeset contaminated" are different
// questions: a changeset of forty cases can be internally duplicated while every
// case is individually novel.
message ChangesetQualitySignalsV1 {
  DatasetRedactionSectionV1 redaction = 1;
  DatasetDuplicationSectionV1 duplication = 2;
  DatasetLeakageSectionV1 leakage = 3;
  DatasetSliceSectionV1 slices = 4;
  uint32 case_count = 5;
  uint32 conflicted_case_count = 6;
  uint32 blocked_case_count = 7;
  uint32 duplicate_case_count = 8;
  // Reusing the frozen finding shape rather than minting a parallel one.
  repeated DataQualityFindingV1 findings = 9;
  bool permits_publish = 10;
}
// ---- end of dataset quality signals ----

// ---- dataset schema, projections and reads ----
//
// `DatasetSchemaRevisionV1` is the immutable typed shape a dataset version is
// published against. A collection that declares none answers
// `dataset_collection_declares_no_schema`; one that does has a real
// fingerprint.
//
// A case has a stable identity, separate from its immutable case-revision
// content, and two bounded projections.
//
// Payloads cross this wire as CANONICAL JSON STRINGS, not
// `google.protobuf.Value`, produced by the same canonicaliser the content
// digest hashes, so what a reviewer reads and what the digest binds are the
// same bytes by construction.

// The value domain of a typed field, slice dimension or metadata key.
enum DatasetSchemaValueKindV1 {
  DATASET_SCHEMA_VALUE_KIND_V1_UNSPECIFIED = 0;
  DATASET_SCHEMA_VALUE_KIND_V1_STRING = 1;
  DATASET_SCHEMA_VALUE_KIND_V1_INTEGER = 2;
  DATASET_SCHEMA_VALUE_KIND_V1_DOUBLE = 3;
  DATASET_SCHEMA_VALUE_KIND_V1_BOOLEAN = 4;
  DATASET_SCHEMA_VALUE_KIND_V1_TIMESTAMP = 5;
  DATASET_SCHEMA_VALUE_KIND_V1_JSON = 6;
}

// What a LATER revision of a collection's schema may change.
//
// The verdict applies the TARGET revision's policy, not the base's: a collection
// tightening to `_STRICT` should have its new rule apply to the next publish,
// and applying the old one would make the tightening take effect one version
// late.
enum DatasetSchemaCompatibilityPolicyV1 {
  DATASET_SCHEMA_COMPATIBILITY_POLICY_V1_UNSPECIFIED = 0;
  // Fields and dimensions may be ADDED. Nothing may be removed, retyped, made
  // more required, or have its vocabulary narrowed.
  DATASET_SCHEMA_COMPATIBILITY_POLICY_V1_ADDITIVE_ONLY = 1;
  // Byte-equal typed shape, or nothing.
  DATASET_SCHEMA_COMPATIBILITY_POLICY_V1_STRICT = 2;
}

enum DatasetSchemaCompatibilityVerdictKindV1 {
  DATASET_SCHEMA_COMPATIBILITY_VERDICT_KIND_V1_UNSPECIFIED = 0;
  // The fingerprints are equal.
  DATASET_SCHEMA_COMPATIBILITY_VERDICT_KIND_V1_IDENTICAL = 1;
  // They differ, and every difference is permitted by the target's policy.
  DATASET_SCHEMA_COMPATIBILITY_VERDICT_KIND_V1_COMPATIBLE_ADDITIVE = 2;
  // They differ in a way the target's policy forbids. A changeset preview
  // BLOCKS on this rather than warning.
  DATASET_SCHEMA_COMPATIBILITY_VERDICT_KIND_V1_INCOMPATIBLE = 3;
  // One side has no revision. Never "compatible": an absent schema is not a
  // permissive schema.
  DATASET_SCHEMA_COMPATIBILITY_VERDICT_KIND_V1_NOT_COMPARABLE = 4;
}

enum DatasetSchemaChangeKindV1 {
  DATASET_SCHEMA_CHANGE_KIND_V1_UNSPECIFIED = 0;
  DATASET_SCHEMA_CHANGE_KIND_V1_INPUT_FIELD_ADDED = 1;
  DATASET_SCHEMA_CHANGE_KIND_V1_INPUT_FIELD_REMOVED = 2;
  DATASET_SCHEMA_CHANGE_KIND_V1_EXPECTED_FIELD_ADDED = 3;
  DATASET_SCHEMA_CHANGE_KIND_V1_EXPECTED_FIELD_REMOVED = 4;
  DATASET_SCHEMA_CHANGE_KIND_V1_FIELD_TYPE_CHANGED = 5;
  DATASET_SCHEMA_CHANGE_KIND_V1_FIELD_MADE_REQUIRED = 6;
  DATASET_SCHEMA_CHANGE_KIND_V1_FIELD_MADE_OPTIONAL = 7;
  DATASET_SCHEMA_CHANGE_KIND_V1_SLICE_DIMENSION_ADDED = 8;
  DATASET_SCHEMA_CHANGE_KIND_V1_SLICE_DIMENSION_REMOVED = 9;
  DATASET_SCHEMA_CHANGE_KIND_V1_SLICE_VOCABULARY_NARROWED = 10;
  DATASET_SCHEMA_CHANGE_KIND_V1_METADATA_KEY_ADDED = 11;
  DATASET_SCHEMA_CHANGE_KIND_V1_METADATA_KEY_REMOVED = 12;
  DATASET_SCHEMA_CHANGE_KIND_V1_MAPPING_RULE_CHANGED = 13;
  DATASET_SCHEMA_CHANGE_KIND_V1_POLICY_CHANGED = 14;
}

// The regression posture.
//
// `_UNKNOWN` is a real verdict and not a gap: one observation is not a trend,
// and a projection that reported `_UNCHANGED` from a single point would be
// inventing a comparison.
enum DatasetCaseRegressionPostureV1 {
  DATASET_CASE_REGRESSION_POSTURE_V1_UNSPECIFIED = 0;
  DATASET_CASE_REGRESSION_POSTURE_V1_IMPROVED = 1;
  DATASET_CASE_REGRESSION_POSTURE_V1_UNCHANGED = 2;
  DATASET_CASE_REGRESSION_POSTURE_V1_REGRESSED = 3;
  DATASET_CASE_REGRESSION_POSTURE_V1_UNKNOWN = 4;
}

// The most recent run's verdict for a case revision, folded from the cell
// results' own verdicts rather than from a score threshold this plane invented.
enum DatasetCaseResultPostureV1 {
  DATASET_CASE_RESULT_POSTURE_V1_UNSPECIFIED = 0;
  DATASET_CASE_RESULT_POSTURE_V1_PASSED = 1;
  DATASET_CASE_RESULT_POSTURE_V1_FAILED = 2;
  // Cells exist; none of them carries a score.
  DATASET_CASE_RESULT_POSTURE_V1_UNSCORED = 3;
  DATASET_CASE_RESULT_POSTURE_V1_UNKNOWN = 4;
}

// Completeness, decided at publish: a row cannot claim to be complete while
// missing a payload.
enum DatasetCaseCompletenessStateV1 {
  DATASET_CASE_COMPLETENESS_STATE_V1_UNSPECIFIED = 0;
  DATASET_CASE_COMPLETENESS_STATE_V1_COMPLETE = 1;
  DATASET_CASE_COMPLETENESS_STATE_V1_MISSING_INPUT = 2;
  DATASET_CASE_COMPLETENESS_STATE_V1_MISSING_EXPECTED_OUTPUT = 3;
  DATASET_CASE_COMPLETENESS_STATE_V1_MISSING_BOTH = 4;
}

// How a case's stable identity was decided.
enum DatasetCaseIdentitySourceV1 {
  DATASET_CASE_IDENTITY_SOURCE_V1_UNSPECIFIED = 0;
  DATASET_CASE_IDENTITY_SOURCE_V1_DERIVED_FROM_LINEAGE = 1;
  // The case has no lineage, so its content is its identity.
  DATASET_CASE_IDENTITY_SOURCE_V1_CONTENT_ONLY = 2;
  // A reviewer chose to merge into an existing case.
  DATASET_CASE_IDENTITY_SOURCE_V1_REVIEWER_MERGE = 3;
  // Minted one per row for cases stored before case identities existed. Those
  // recorded no identity, so none could be recovered, and they are not
  // deduplicated by content.
  DATASET_CASE_IDENTITY_SOURCE_V1_BACKFILLED_FROM_DATASET_ITEM = 4;
}

// A case revision RETAINS its lineage anchor when the anchor's target expires;
// only the availability flips. It never loses the record.
enum DatasetLineageAnchorAvailabilityV1 {
  DATASET_LINEAGE_ANCHOR_AVAILABILITY_V1_UNSPECIFIED = 0;
  DATASET_LINEAGE_ANCHOR_AVAILABILITY_V1_AVAILABLE = 1;
  // The target aged past the trace plane's 336-hour retention. The approved
  // snapshot is intact; only the source is gone.
  DATASET_LINEAGE_ANCHOR_AVAILABILITY_V1_ANCHOR_TARGET_EXPIRED = 2;
  DATASET_LINEAGE_ANCHOR_AVAILABILITY_V1_ANCHOR_TARGET_DELETED = 3;
  // The case has no anchor to begin with: an import, a manual entry, or a
  // machine-principal append.
  DATASET_LINEAGE_ANCHOR_AVAILABILITY_V1_NOT_APPLICABLE = 4;
}

// One typed input or expected-output field.
message DatasetSchemaFieldV1 {
  // Dotted path into the payload this field describes.
  string path = 1;
  DatasetSchemaValueKindV1 value_kind = 2;
  bool required = 3;
  // Excluded from the fingerprint: renaming a field's label is not a shape
  // change, and treating it as one would mint a revision because somebody fixed
  // a typo.
  optional string display_name = 4;
}

// One filterable slice dimension.
message DatasetSliceDimensionV1 {
  string dimension_key = 1;
  optional string display_name = 2;
  DatasetSchemaValueKindV1 value_kind = 3;
  // The key inside a case's slice metadata this dimension reads. Never a payload
  // path: a slice that read a payload field would move when a payload was
  // corrected, and the slice a run was analysed by must not change under it.
  string source_metadata_key = 4;
  // `false` means declared-but-not-filterable: a dimension a client may display
  // and may not filter on.
  bool filterable = 5;
  bool required = 6;
  // Closed vocabulary. EMPTY means OPEN — not "no value is allowed".
  repeated string allowed_values = 7;
}

message DatasetSchemaMetadataKeyV1 {
  string key = 1;
  DatasetSchemaValueKindV1 value_kind = 2;
  bool required = 3;
}

// Which source selector fills which target path — the same selector language
// `CaptureEvaluationCase` takes, reused rather than re-spelled.
message DatasetSchemaMappingRuleV1 {
  string target_path = 1;
  string source_selector = 2;
}

// The typed shape a revision describes.
//
// This is also the DECLARATION a publish carries:
// `CreateEvaluationDatasetVersion` takes one of these, and the publish either
// reuses the collection's revision with the same fingerprint or mints the next
// one. There is no `CreateDatasetSchemaRevision` verb, because a schema
// INFERRED from the cases would not be a contract: its fingerprint would move
// every time a case arrived with a new key.
message DatasetSchemaShapeV1 {
  DatasetSchemaCompatibilityPolicyV1 compatibility_policy = 1;
  repeated DatasetSchemaFieldV1 input_fields = 2;
  repeated DatasetSchemaFieldV1 expected_output_fields = 3;
  repeated DatasetSliceDimensionV1 slice_dimensions = 4;
  repeated DatasetSchemaMetadataKeyV1 metadata_keys = 5;
  repeated DatasetSchemaMappingRuleV1 mapping_rules = 6;
  optional string display_name = 7;
  optional string description = 8;
}

// One immutable schema revision.
message DatasetSchemaRevisionV1 {
  string schema_revision_id = 1;
  string dataset_collection_id = 2;
  // 1-based, monotone within the collection. A change mints `revision_number + 1`;
  // there is no code path that updates a revision row, and the storage refuses
  // one.
  uint32 revision_number = 3;
  // Hex sha256 over a length-prefixed, field-labelled canonicalisation of the
  // TYPED SHAPE only. Excludes the revision id, the revision number, timestamps,
  // the actor and both display strings, so two revisions describing one shape
  // fingerprint identically.
  string schema_fingerprint = 4;
  // Carried beside the value so a future algorithm cannot silently re-label an
  // old row — the same discipline `DataQualityFindingV1.method_version` enforces
  // on the other side of this plane.
  string fingerprint_algorithm = 5;
  DatasetSchemaShapeV1 shape = 6;
  // Whether this is the revision a version with no declared shape inherits.
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
}

// One typed difference between two revisions.
message DatasetSchemaChangeV1 {
  DatasetSchemaChangeKindV1 kind = 1;
  // The field path or dimension key this change is about.
  string path = 2;
  optional DatasetSchemaValueKindV1 from_value_kind = 3;
  optional DatasetSchemaValueKindV1 to_value_kind = 4;
  // Populated for `_SLICE_VOCABULARY_NARROWED`: the values the target no longer
  // admits.
  repeated string removed_values = 5;
}

// The verdict a changeset preview carries.
message DatasetSchemaCompatibilityVerdictV1 {
  DatasetSchemaCompatibilityVerdictKindV1 verdict = 1;
  // Absent when the verdict is `_NOT_COMPARABLE` — there is no policy to apply
  // when one side has no revision.
  optional DatasetSchemaCompatibilityPolicyV1 policy_applied = 2;
  optional string base_schema_revision_id = 3;
  optional string target_schema_revision_id = 4;
  optional string base_schema_fingerprint = 5;
  optional string target_schema_fingerprint = 6;
  repeated DatasetSchemaChangeV1 changes = 7;
  // Populated only for `_INCOMPATIBLE` and `_NOT_COMPARABLE`. Machine-groupable
  // slugs a preview renders verbatim.
  repeated string blocking_reason_codes = 8;
}

// The bounded per-case-revision recent-performance projection.
//
// `availability` describes the REGRESSION POSTURE, which is what the row exists
// to serve. A case revision with exactly one observation therefore reports
// `UNAVAILABLE / regression_needs_two_observations` while still carrying its
// latest score and result posture: the projection says what it knows and names
// what it cannot compute, rather than reporting a zero.
message DatasetCaseRecentPerformanceV1 {
  MetricAvailabilityV1 availability = 1;
  uint32 runs_observed = 2;
  optional string latest_run_id = 3;
  optional google.protobuf.Timestamp latest_run_at = 4;
  optional double latest_score = 5;
  optional double previous_score = 6;
  DatasetCaseResultPostureV1 latest_result = 7;
  DatasetCaseRegressionPostureV1 regression = 8;
  EvaluationFreshnessV1 freshness = 9;
}

// One content reference a capture hydrated from, as it rides the case revision.
// References and postures only, never a body.
message DatasetCaseContentRefV1 {
  string content_class = 1;
  string storage_uri = 2;
  // Bytes served. Absent when no body was read — never 0, which would read as
  // "the body was empty".
  optional uint64 byte_size = 3;
  MetricAvailabilityV1 availability = 4;
}

// Which evidence a case revision's lineage anchor points at.
//
// The anchor's TARGET KIND, with its identifiers carried beside it (the shape
// `EvidenceAnchorV1` carries elsewhere).
enum DatasetCaseLineageAnchorKindV1 {
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_UNSPECIFIED = 0;
  // The case has no anchor: an import, a manual entry, or a machine-principal
  // append.
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_NONE = 1;
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_TELEMETRY = 2;
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_AGENT_RUN = 3;
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_EVALUATION_CELL = 4;
  DATASET_CASE_LINEAGE_ANCHOR_KIND_V1_RULE_WORKFLOW_STEP = 5;
}

// A case's lineage, as a case revision carries it.
message DatasetCaseLineageV1 {
  // The anchor is RETAINED even when its target has expired. It is never cleared.
  DatasetCaseLineageAnchorKindV1 anchor_kind = 1;
  DatasetLineageAnchorAvailabilityV1 anchor_availability = 2;
  // The reason the availability is not `_AVAILABLE`, as the constant the content
  // plane publishes — imported, never re-spelled, so two renderings of one
  // absence cannot disagree about whether a fact exists.
  optional string anchor_reason_code = 3;
  optional string source_proposed_case_id = 4;
  optional string source_draft_id = 5;
  repeated DatasetCaseContentRefV1 content_refs = 6;
  // The anchor's target, by identifier. Exactly the subset the anchor kind
  // names is populated; the rest are absent rather than empty.
  optional string anchor_trace_id = 7;
  optional string anchor_span_id = 8;
  optional string anchor_evaluation_run_id = 9;
  optional string anchor_rule_version_id = 10;
  optional string anchor_workflow_step_id = 11;
}

// The external-artifact posture on a case.
//
// Read from the artifact links, never re-derived. Three of the five source
// kinds have no source in this build and are reported as typed absences by
// `source_coverage`, so a client can tell "this case has no artifacts" from
// "this build could not have seen one".
//
// This appears on `GetDatasetCase` only, never on a case LIST; the boundary is
// published as the capability limit `artifact_posture_on_detail_only`.
//
// Which of the five artifact source kinds this build can receive a link
// from.
//
// `source_kind` is the `ArtifactLinkSourceKindV1` value's name, so one source
// kind is never spelled two ways. Same for every slug on the summary below.
message DatasetCaseArtifactSourceCoverageV1 {
  string source_kind = 1;
  MetricAvailabilityV1 availability = 2;
}

// One external artifact linked to the case's source span.
//
// The fields of `AgentRunArtifactSummaryV1`, as they apply to a case.
message DatasetCaseArtifactSummaryV1 {
  bytes link_id = 1;
  string artifact_id = 2;
  string artifact_type = 3;
  string role = 4;
  string relation = 5;
  // The CURRENT status: the write-time status overlaid with the append-only
  // correction ledger. `_CORRECTED` and `_REVOKED` arrive here and nowhere else.
  string lifecycle_status = 6;
  string conflict_posture = 7;
  // `_BACKFILL` is the "RPC-backfilled" posture.
  string source_kind = 8;
  optional string media_type = 9;
  optional string filename = 10;
  optional string storage_system = 11;
  google.protobuf.Timestamp observed_at = 12;
}

message DatasetCaseArtifactPostureV1 {
  repeated DatasetCaseArtifactSourceCoverageV1 source_coverage = 1;
  repeated DatasetCaseArtifactSummaryV1 artifacts = 2;
  // Posture and never resolution: a case read never resolves, and this says
  // whether a resolution is possible without a byte having been fetched.
  string resolver_posture = 3;
  // How many links were suppressed by the per-case cap, so a truncation is
  // stated rather than inferred from a suspiciously round count.
  uint32 truncated_artifact_count = 4;
}

// One row of `ListDatasetCases`.
//
// Payloads are deliberately absent: a fifty-row page carrying fifty payloads is
// a `SELECTED_DETAIL` wearing a list's name.
message DatasetCaseSummaryV1 {
  // The STABLE identity. Equal across versions for the same case.
  string case_id = 1;
  // The IMMUTABLE content this version pinned.
  string case_revision_id = 2;
  uint32 revision_number = 3;
  // Position within the version this page is of.
  uint32 ordinal = 4;
  EvaluationCaptureSourceKindV1 source_kind = 5;
  DatasetCaseCompletenessStateV1 completeness = 6;
  string content_digest = 7;
  optional string schema_revision_id = 8;
  // Canonical JSON object of this case's slice values.
  string slice_metadata_json = 9;
  repeated string tags = 10;
  // The typed absences, if any. A case missing its expected output is a named
  // line, not a blank row and not an error.
  repeated EvaluationDatasetCaseAbsenceV1 absences = 11;
  // The case's draft state, as its stable slug. Absent for a case that never had
  // a draft.
  optional string review_state_code = 12;
  MetricAvailabilityV1 review_availability = 13;
  DatasetCaseRecentPerformanceV1 recent_performance = 14;
  DatasetLineageAnchorAvailabilityV1 anchor_availability = 15;
  google.protobuf.Timestamp created_at = 16;
}

// Which version contains a case revision, and where.
message DatasetCaseMembershipV1 {
  string dataset_version_id = 1;
  uint32 ordinal = 2;
  google.protobuf.Timestamp created_at = 3;
}

// One case revision, whole: immutable case revision, lineage, review/source
// posture, and bounded recent performance.
message DatasetCaseV1 {
  DatasetCaseSummaryV1 summary = 1;
  string dataset_collection_id = 2;
  // The deterministic key the identity was derived from. Published so a
  // reviewer can see WHY two rows are one case rather than being asked to trust
  // it.
  string identity_key = 3;
  DatasetCaseIdentitySourceV1 identity_source = 4;
  // How many revisions this case has had. `1` is a case that has never changed.
  uint32 revision_count = 5;
  // Canonical JSON, produced by the same canonicaliser the content digest
  // hashes, so what a reviewer reads and what the digest binds are the same
  // bytes.
  optional string input_payload_json = 6;
  optional string expected_output_json = 7;
  optional string correction_payload_json = 8;
  optional string original_context_json = 9;
  optional string recorded_output_field_path = 10;
  // The mapping selectors that produced each field, in order.
  repeated DatasetFieldMappingV1 mapping = 11;
  DatasetCaseLineageV1 lineage = 12;
  DatasetCaseArtifactPostureV1 artifact_posture = 13;
  // The versions that contain this revision, newest first, bounded.
  repeated DatasetCaseMembershipV1 memberships = 14;
  DatasetSchemaRevisionV1 schema_revision = 15;
  MetricAvailabilityV1 schema_availability = 16;
}

// One dimension's coverage over a version's cases.
message DatasetQualitySliceCoverageV1 {
  string dimension_key = 1;
  uint32 covered_cases = 2;
  uint32 missing_cases = 3;
  uint32 distinct_values = 4;
}

// The bounded collection/version quality projection.
//
// SIX ARMS, EACH WITH ITS OWN AVAILABILITY. One projection-wide flag would make
// "we computed slice coverage and cannot compute production drift" unsayable,
// and that sentence is the true state of this build: three arms ship computed,
// two wait on the quality-signal plane, and production drift waits on a
// maintained production distribution that does not exist. Every unavailable arm
// names its reason. None of them reports zero.
message DatasetQualityProjectionV1 {
  string dataset_collection_id = 1;
  string dataset_version_id = 2;
  optional string schema_revision_id = 3;
  uint32 case_count = 4;

  repeated DatasetQualitySliceCoverageV1 slice_coverage = 5;
  MetricAvailabilityV1 slice_coverage_availability = 6;

  uint32 missing_ground_truth_count = 7;
  MetricAvailabilityV1 missing_ground_truth_availability = 8;

  uint32 duplicate_case_count = 9;
  uint32 conflict_case_count = 10;
  MetricAvailabilityV1 duplicate_density_availability = 11;

  optional double production_drift_score = 12;
  MetricAvailabilityV1 production_drift_availability = 13;

  uint32 leakage_finding_count = 14;
  MetricAvailabilityV1 leakage_availability = 15;

  uint32 source_complete_count = 16;
  uint32 source_incomplete_count = 17;
  MetricAvailabilityV1 source_completeness_availability = 18;

  EvaluationFreshnessV1 freshness = 19;
}

// One row of `ListDatasetVersions`.
message DatasetVersionSummaryV1 {
  string dataset_version_id = 1;
  uint32 version_number = 2;
  optional string label = 3;
  // Rows in the shipped item table.
  uint32 case_count = 4;
  // Member rows. The two differ for older versions published before case
  // identities existed, and publishing both is how a client can tell. A
  // trajectory version's are its rollouts (#726).
  uint32 member_count = 5;
  bool is_pinned = 6;
  optional google.protobuf.Timestamp picker_retired_at = 7;
  optional string picker_retired_reason = 8;
  optional string schema_revision_id = 9;
  google.protobuf.Timestamp created_at = 10;
}

// One row of `ListDatasetUsage`.
//
// Read from the prepared-case ledger a run's own preparation writes — aggregated
// per (run, version, cohort) in one statement and paged. It never walks the item
// table and never follows lineage, which is how "never a lineage scan" is held
// structurally rather than by a bound on one.
message DatasetUsageRowV1 {
  string evaluation_run_id = 1;
  string dataset_version_id = 2;
  string cohort_key = 3;
  uint32 prepared_case_count = 4;
  google.protobuf.Timestamp first_prepared_at = 5;
}

message GetDatasetSchemaRevisionRequest {
  string schema_revision_id = 1;
}

message GetDatasetSchemaRevisionResponse {
  DatasetSchemaRevisionV1 revision = 1;
  // Whether a changeset written against THIS revision may publish against the
  // collection's ACTIVE one.
  //
  // A client holding a pinned revision asks exactly this question, and asking it
  // any other way means fetching two revisions and reimplementing the policy on
  // the client — which is how two implementations of one compatibility rule come
  // to disagree. `_IDENTICAL` when the requested revision IS the active one.
  // Absent only when the collection has no active revision, which cannot happen
  // while this revision exists.
  optional DatasetSchemaCompatibilityVerdictV1 compatibility_with_active = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

message ListDatasetCasesRequest {
  string dataset_version_id = 1;
  // Keyset cursor: the ordinal of the last row of the previous page. Ordinals
  // are unique within a version, so a continuation cannot skip or repeat a case.
  optional uint32 after_ordinal = 2;
  optional uint32 limit = 3;
}

message ListDatasetCasesResponse {
  repeated DatasetCaseSummaryV1 cases = 1;
  // Exact. The page is bounded and the count is a set-based aggregate over the
  // membership table, so there is no approximation to label.
  uint32 total_count = 2;
  optional uint32 next_after_ordinal = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

message GetDatasetCaseRequest {
  string case_revision_id = 1;
}

message GetDatasetCaseResponse {
  DatasetCaseV1 dataset_case = 1;
  EvaluationFreshnessV1 freshness = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message GetDatasetOverviewRequest {
  string dataset_collection_id = 1;
  // (#726) The kinds it may be. Empty means cases alone, as before this field,
  // so another kind's collection is NOT_FOUND. UNSPECIFIED is refused.
  repeated DatasetContentKindV1 content_kinds = 2;
}

// A dataset's overview.
message GetDatasetOverviewResponse {
  string dataset_collection_id = 1;
  // The newest version, which is what the Overview calls "active".
  DatasetVersionSummaryV1 active_version = 2;
  MetricAvailabilityV1 active_version_availability = 3;
  DatasetSchemaRevisionV1 schema_revision = 4;
  // `NOT_SUPPORTED / dataset_collection_declares_no_schema` when the collection
  // declares none.
  MetricAvailabilityV1 schema_availability = 5;
  DatasetQualityProjectionV1 quality = 6;
  MetricAvailabilityV1 quality_availability = 7;
  EvaluationFreshnessV1 freshness = 8;
  AgenticEvaluationCapabilitiesV1 capabilities = 9;

  // ---- the identity a deep link needs ----
  //
  // The dataset's own identity, so an overview can render its NAME.
  //
  // `NOT_FOUND` for a collection id that does not resolve in the caller's
  // scope, like every other dataset read.
  string name = 10;
  // Absent means the collection carries no description — not that the server
  // could not read one. An old client that reads the empty string here renders
  // a dataset with no subtitle, which is what it had before this field existed.
  optional string description = 11;
  // Always present. An old client that reads the zero timestamp is reading a
  // field it does not know about; nothing it renders today depends on it.
  google.protobuf.Timestamp created_at = 12;
  // Archived collections are absent from `ListDatasetCollections` by default
  // and are still readable by id, so a pinned run's dataset never becomes
  // unreadable because someone tidied the list. `false` for every collection an
  // old client has ever seen, because nothing in this build archives one.
  bool is_archived = 13;
  // ---- end of the identity a deep link needs ----
}

// The RPC is `ListDatasetVersions`; its messages carry the `Evaluation` infix
// because the legacy `AgenticObservabilityService` already declares
// `ListDatasetVersionsRequest`/`Response` in this package.
message ListEvaluationDatasetVersionsRequest {
  string dataset_collection_id = 1;
  // Keyset cursor on the descending version number.
  optional uint32 before_version_number = 2;
  optional uint32 limit = 3;
}

message ListEvaluationDatasetVersionsResponse {
  repeated DatasetVersionSummaryV1 versions = 1;
  uint32 total_count = 2;
  optional uint32 next_before_version_number = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

message ListDatasetUsageRequest {
  string dataset_collection_id = 1;
  optional string after_evaluation_run_id = 2;
  optional uint32 limit = 3;
}

message ListDatasetUsageResponse {
  repeated DatasetUsageRowV1 usage = 1;
  uint32 total_count = 2;
  optional string next_after_evaluation_run_id = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}
// ---- end of dataset schema, projections and reads ----

// ---- dataset draft review and publish ----
//
// The lifecycle between `CaptureEvaluationCase`, which writes proposed cases,
// and a published dataset version: ten draft states, nine changeset states,
// preview-then-commit publication whose digest binding makes a silent rebase
// unrepresentable, and the linked evaluation dispatched AFTER the commit.

// The legacy `AnnotationTaskStateV1` is deliberately NOT reused: it has no
// reservation expiry, no merge outcome, no needs-ground-truth outcome, no
// non-representative outcome and no published terminal.
enum DatasetCaseDraftStateV1 {
  DATASET_CASE_DRAFT_STATE_V1_UNSPECIFIED = 0;
  // Created; redaction passed; not yet queued for review.
  DATASET_CASE_DRAFT_STATE_V1_EXTRACTED = 1;
  // Expected output missing and required by the schema.
  DATASET_CASE_DRAFT_STATE_V1_NEEDS_GROUND_TRUTH = 2;
  // A reviewer holds it under a reservation.
  DATASET_CASE_DRAFT_STATE_V1_IN_REVIEW = 3;
  // A reviewer returned it for correction.
  DATASET_CASE_DRAFT_STATE_V1_CHANGES_REQUESTED = 4;
  // Approved for inclusion in a changeset. Approval is NOT publication: the two
  // are separated by a base-version race.
  DATASET_CASE_DRAFT_STATE_V1_APPROVED = 5;
  DATASET_CASE_DRAFT_STATE_V1_REJECTED = 6;
  // Resolved into an existing case revision.
  DATASET_CASE_DRAFT_STATE_V1_MERGED = 7;
  DATASET_CASE_DRAFT_STATE_V1_NON_REPRESENTATIVE = 8;
  DATASET_CASE_DRAFT_STATE_V1_PUBLISHED = 9;
  // A newer draft for the same promotion key won.
  DATASET_CASE_DRAFT_STATE_V1_SUPERSEDED = 10;
}

enum DatasetChangesetStateV1 {
  DATASET_CHANGESET_STATE_V1_UNSPECIFIED = 0;
  DATASET_CHANGESET_STATE_V1_OPEN = 1;
  DATASET_CHANGESET_STATE_V1_PREVIEWED = 2;
  DATASET_CHANGESET_STATE_V1_REBASE_REQUIRED = 3;
  DATASET_CHANGESET_STATE_V1_CONFLICTED = 4;
  DATASET_CHANGESET_STATE_V1_COMMITTING = 5;
  DATASET_CHANGESET_STATE_V1_COMMITTED = 6;
  DATASET_CHANGESET_STATE_V1_ABANDONED = 7;
  // No partial dataset version exists: a failed commit returns every draft to
  // `_APPROVED` and records a typed failure.
  DATASET_CHANGESET_STATE_V1_FAILED = 8;
}

// The four review outcomes, plus the two a reviewer needs to finish.
//
// Four values rather than a boolean and a note, because each has a different
// next actor: a correction is the reviewer's own edit, a merge needs a resolved
// dedupe decision, non-representative closes the case, and needs-ground-truth
// sends it back to whoever can supply the answer.
enum DatasetCaseReviewOutcomeV1 {
  DATASET_CASE_REVIEW_OUTCOME_V1_UNSPECIFIED = 0;
  DATASET_CASE_REVIEW_OUTCOME_V1_CORRECTION = 1;
  DATASET_CASE_REVIEW_OUTCOME_V1_MERGE_WITH_EXISTING = 2;
  DATASET_CASE_REVIEW_OUTCOME_V1_NON_REPRESENTATIVE = 3;
  DATASET_CASE_REVIEW_OUTCOME_V1_NEEDS_GROUND_TRUTH = 4;
  DATASET_CASE_REVIEW_OUTCOME_V1_APPROVE = 5;
  DATASET_CASE_REVIEW_OUTCOME_V1_REJECT = 6;
}

// A CLOSED vocabulary, so a client renders a fixed picker rather than a
// free-text box and learns the vocabulary is closed rather than probing it one
// refusal at a time.
enum DatasetCaseDraftRejectionReasonV1 {
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_UNSPECIFIED = 0;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_NON_REPRESENTATIVE = 1;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_INCORRECT_EXPECTED_OUTPUT = 2;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_SENSITIVE_CONTENT = 3;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_DUPLICATE_OF_EXISTING_CASE = 4;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_INSUFFICIENT_CONTEXT = 5;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_OUT_OF_SCOPE = 6;
  DATASET_CASE_DRAFT_REJECTION_REASON_V1_SUPERSEDED_BY_OVERRIDE = 7;
}

// Why a draft mutation or a publish was refused. Each value has a distinct
// remediation; a caller told only "invalid argument" cannot act.
enum DatasetDraftRefusalKindV1 {
  DATASET_DRAFT_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  // The from/to pair is not a legal draft-state transition.
  DATASET_DRAFT_REFUSAL_KIND_V1_ILLEGAL_TRANSITION = 1;
  // The caller's `draft_version` is stale. gRPC `ABORTED`.
  DATASET_DRAFT_REFUSAL_KIND_V1_VERSION_CONFLICT = 2;
  // The draft is reserved by another reviewer.
  DATASET_DRAFT_REFUSAL_KIND_V1_RESERVED_BY_ANOTHER_REVIEWER = 3;
  // A merge needs a resolved dedupe decision naming the target revision.
  DATASET_DRAFT_REFUSAL_KIND_V1_UNRESOLVED_DEDUPE_DECISION = 4;
  // The draft is terminal and admits no further change.
  DATASET_DRAFT_REFUSAL_KIND_V1_DRAFT_TERMINAL = 5;
  // The active version moved past the changeset's pinned base.
  DATASET_DRAFT_REFUSAL_KIND_V1_BASE_VERSION_MOVED = 6;
  // The digest the caller sent is not the digest of what would be committed.
  // NEVER a silent rebase.
  DATASET_DRAFT_REFUSAL_KIND_V1_PREVIEW_DIGEST_MISMATCH = 7;
  // The changeset holds cases no reviewer approved.
  DATASET_DRAFT_REFUSAL_KIND_V1_UNAPPROVED_CASE_PRESENT = 8;
  // The schema compatibility verdict says the target schema is incompatible with the base's
  // declared policy.
  DATASET_DRAFT_REFUSAL_KIND_V1_SCHEMA_INCOMPATIBLE = 9;
  // The changeset-scope quality signals refuse publication: a fingerprint engine
  // that could not run ALLOWS draft creation and REFUSES publish.
  DATASET_DRAFT_REFUSAL_KIND_V1_QUALITY_SIGNALS_BLOCK_PUBLISH = 10;
  // The changeset is not in a state that publishes.
  DATASET_DRAFT_REFUSAL_KIND_V1_CHANGESET_NOT_PUBLISHABLE = 11;
}

// The conflict detail: the fields that MOVED under a stale caller.
//
// Named rather than counted, because a caller told only "you are stale" can do
// nothing but retry and lose again. `current_draft_version` is what to bind
// against next.
message DatasetCaseDraftConflictV1 {
  uint64 current_draft_version = 1;
  repeated string changed_fields = 2;
  DatasetCaseDraftStateV1 current_state = 3;
}

message DatasetDraftRefusalV1 {
  DatasetDraftRefusalKindV1 kind = 1;
  string reason_code = 2;
  string detail = 3;
  RecoveryActionV1 recovery = 4;
  // Set on VERSION_CONFLICT.
  optional DatasetCaseDraftConflictV1 conflict = 5;
  // Set on ILLEGAL_TRANSITION so the client can grey the affordance instead of
  // offering an action that cannot succeed.
  DatasetCaseDraftStateV1 from_state = 6;
  DatasetCaseDraftStateV1 to_state = 7;
}

// Where a draft came from, and whether that source is still there.
//
// Lineage rides the draft AND survives into the published case revision. A
// draft whose anchor target has been deleted or expired RETAINS the anchor and
// reports the availability — it never loses its lineage record.
message DatasetCaseDraftLineageV1 {
  EvaluationCaptureProvenanceV1 provenance = 1;
  // The normalised promotion reference: `span:<trace>/<span>`,
  // `cell:<run>/<cohort>/<candidate>/<revision>/<trial>`, `rule_step:<step>`.
  // Absent for an authored case, which has no source to reference; absent is not
  // empty.
  optional string promotion_source_reference = 2;
  // Whether the SOURCE is still readable. `NOT_SUPPORTED / anchor_target_expired`
  // when retention has taken it; the snapshot below is unaffected.
  MetricAvailabilityV1 source_availability = 3;
  // The immutable extraction snapshot: which content references the payloads
  // were hydrated from, and what became of each.
  //
  // REFERENCES AND POSTURES ONLY. No body, no fragment of one, and no storage
  // coordinate a caller could dereference.
  repeated EvaluationSpanContentHydrationV1 source_content_refs = 4;
  // Which selectors resolved, in request order.
  repeated EvaluationCaptureFieldSelectionV1 selections = 5;
  // The digest the capture bound against. Carried through publication unchanged
  // — two spellings of one digest is how two readers come to disagree about
  // whether content changed.
  string content_digest = 6;
  optional string draft_id = 7;
}

// A first-class, strictly typed draft.
//
// An annotation task may REFERENCE it for assignment (`review_task_id`) and
// does not replace its domain contract: every field a reviewer decides on is
// here, and none of it is reachable only by joining a generic annotation RPC.
message DatasetCaseDraftV1 {
  string proposed_case_id = 1;
  string dataset_collection_id = 2;
  string changeset_id = 3;
  uint32 ordinal = 4;
  DatasetCaseDraftStateV1 state = 5;
  // Bind every mutation against this.
  uint64 draft_version = 6;
  EvaluationCaptureSourceKindV1 source_kind = 7;
  DatasetCaseDraftLineageV1 lineage = 8;

  // The safe snapshot — never the source document.
  MetricAvailabilityV1 input_availability = 9;
  MetricAvailabilityV1 expected_output_availability = 10;
  MetricAvailabilityV1 recorded_output_availability = 11;
  optional string recorded_output_field_path = 12;
  // Canonical JSON, produced by the same canonicaliser the digest hashes, so what
  // a reviewer reads and what the digest binds are the same bytes.
  optional string input_payload_json = 13;
  optional string expected_output_json = 14;
  optional string correction_payload_json = 15;
  optional string original_context_json = 16;

  // Review posture.
  optional PrincipalRefV1 reviewer = 17;
  optional string review_task_id = 18;
  optional google.protobuf.Timestamp reservation_expires_at = 19;
  DatasetCaseReviewOutcomeV1 review_outcome = 20;
  DatasetCaseDraftRejectionReasonV1 rejection_reason = 21;
  optional string changes_requested_note = 22;
  optional string merged_into_case_revision_id = 23;
  optional string superseded_by_proposed_case_id = 24;
  optional string published_dataset_version_id = 25;
  optional string published_case_revision_id = 26;

  // Per-case quality signals. ABSENT means no check ran — never "clean".
  optional DatasetCaseQualitySignalsV1 quality = 27;

  optional google.protobuf.Timestamp reviewed_at = 28;
  optional google.protobuf.Timestamp published_at = 29;
  google.protobuf.Timestamp state_changed_at = 30;
  google.protobuf.Timestamp created_at = 31;
}

// A changeset, as a client reads it.
message DatasetChangesetV1 {
  string changeset_id = 1;
  string dataset_collection_id = 2;
  DatasetChangesetStateV1 state = 3;
  // The PINNED base. Absent on a collection's first changeset.
  optional string base_dataset_version_id = 4;
  uint64 changeset_version = 5;
  uint32 proposed_case_count = 6;
  uint32 voided_case_count = 7;
  // Present EXACTLY in `_PREVIEWED`. A `_REBASE_REQUIRED` or `_CONFLICTED`
  // changeset carries none at all, so a client holding a digest from before the
  // drift cannot publish through it.
  optional string preview_digest = 8;
  optional google.protobuf.Timestamp preview_computed_at = 9;
  optional string schema_revision_id = 10;
  // Set in `_FAILED`.
  optional string failure_reason_code = 11;
  optional string failure_detail = 12;
  optional string committed_dataset_version_id = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// What a linked evaluation WOULD be, before the publish.
//
// Returned by the preview so an operator sees the downstream work before
// approving it, not after it has been billed. An empty list is
// `NO_LINKED_EVALUATION_CONFIGURED`, never an absent field.
message DatasetPublishLinkedEvaluationV1 {
  string evaluation_definition_id = 1;
  optional string evaluation_definition_revision_id = 2;
  string definition_name = 3;
  // The key the launch will be made under. Published so a client can correlate
  // the eventual run without polling for it.
  string dispatch_idempotency_key = 4;
}

// The publish preview: base, schema verdict, dedupe, conflicts, leakage, and the
// linked evaluation plan.
message DatasetChangesetPreviewV1 {
  DatasetChangesetV1 changeset = 1;
  // The version that is ACTIVE right now. When this differs from the
  // changeset's pinned base, the changeset is `_REBASE_REQUIRED` and NO digest
  // is issued.
  optional string active_dataset_version_id = 2;
  bool base_version_moved = 3;
  // The pure compatibility verdict over the two schema revisions.
  optional DatasetSchemaCompatibilityVerdictV1 schema_compatibility = 4;
  // The drafts this changeset would publish, in order.
  repeated string approved_proposed_case_ids = 5;
  // Cases that are neither approved nor terminal — the ones blocking publish.
  repeated string unapproved_proposed_case_ids = 6;
  // Dedupe resolutions, as recorded.
  repeated DedupeResolutionV1 dedupe_resolutions = 7;
  repeated DataQualityFindingV1 conflicts = 8;
  repeated DatasetPublishLinkedEvaluationV1 linked_evaluation_plan = 9;
  // The digest `PublishDatasetCaseDrafts` must echo. Absent exactly when the
  // preview did not produce a publishable state.
  optional string preview_digest = 10;
  bool publishable = 11;
  // Changeset-scope quality signals.
  optional ChangesetQualitySignalsV1 quality = 12;
}

message DatasetPublishResultV1 {
  EvaluationDatasetVersionV1 version = 1;
  DatasetChangesetV1 changeset = 2;
  uint32 published_case_count = 3;
  // How many of the published revisions were REUSED rather than newly minted. A
  // republish of unchanged content mints no revision.
  uint32 reused_revision_count = 4;
  // The outbox rows this commit wrote. The linked evaluations dispatch AFTER
  // the commit, from these rows, through the ONE launch path — so this list is
  // an obligation the server has taken on, not a set of runs that already
  // exist.
  repeated DatasetPublishLinkedEvaluationV1 dispatch_obligations = 5;
  optional EvaluationDatasetRolloverV1 rollover = 6;
}

// -------------------------- the eight verbs ------------------------------

message GetDatasetCaseDraftRequest {
  string proposed_case_id = 1;
}

message GetDatasetCaseDraftResponse {
  DatasetCaseDraftV1 draft = 1;
  EvaluationFreshnessV1 freshness = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message ListDatasetCaseDraftsRequest {
  // Absent lists the whole organisation's queue.
  optional string dataset_collection_id = 1;
  optional string changeset_id = 2;
  // Empty means the LIVE set, never "all": a queue whose default included
  // published and rejected cases would bury the work under its own history.
  repeated DatasetCaseDraftStateV1 states = 3;
  optional string reviewer_principal_id = 4;
  uint32 page_size = 5;
  uint32 offset = 6;
}

message ListDatasetCaseDraftsResponse {
  repeated DatasetCaseDraftV1 drafts = 1;
  uint64 total_count = 2;
  optional uint32 next_offset = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}

// The correction outcome.
//
// Only the reviewer-editable payload moves. The provenance stamp, the content
// digest and the extraction snapshot are NOT touched: they record what the
// SOURCE said, and a correction is a statement about what the case should
// ASSERT — conflating the two would make the lineage a record of the reviewer's
// opinion.
message UpdateDatasetCaseDraftRequest {
  string proposed_case_id = 1;
  uint64 expected_draft_version = 2;
  // Canonical JSON. Setting this clears the absence; clearing it requires a
  // typed reason.
  optional string expected_output_json = 3;
  optional string expected_output_absence_reason = 4;
  optional string correction_payload_json = 5;
  // Marks the draft `_NEEDS_GROUND_TRUTH` rather than editing it — the outcome
  // whose next actor is someone else.
  bool needs_ground_truth = 6;
  string idempotency_key = 7;
}

message UpdateDatasetCaseDraftResponse {
  DatasetCaseDraftV1 draft = 1;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

message ApproveDatasetCaseDraftRequest {
  string proposed_case_id = 1;
  uint64 expected_draft_version = 2;
  optional string note = 3;
  string idempotency_key = 4;
}

message ApproveDatasetCaseDraftResponse {
  DatasetCaseDraftV1 draft = 1;
  // Approval is not publication. A client that rendered "published" here would
  // be lying to the operator.
  DatasetChangesetV1 changeset = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message RejectDatasetCaseDraftRequest {
  string proposed_case_id = 1;
  uint64 expected_draft_version = 2;
  // Required. A rejection without a typed reason is a deletion with extra steps,
  // and is refused.
  DatasetCaseDraftRejectionReasonV1 reason = 3;
  optional string note = 4;
  string idempotency_key = 5;
}

message RejectDatasetCaseDraftResponse {
  DatasetCaseDraftV1 draft = 1;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

// A merge. Requires a RESOLVED dedupe decision naming the target revision.
//
// What decides "these two look alike" (a heuristic with a versioned threshold)
// and what decides "therefore this merges" (here, a reviewer's act) are
// deliberately not the same.
message MergeDatasetCaseDraftRequest {
  string proposed_case_id = 1;
  uint64 expected_draft_version = 2;
  // The existing case revision this draft resolves into.
  string target_case_revision_id = 3;
  optional string note = 4;
  string idempotency_key = 5;
}

message MergeDatasetCaseDraftResponse {
  DatasetCaseDraftV1 draft = 1;
  AgenticEvaluationCapabilitiesV1 capabilities = 2;
}

message PreviewPublishDatasetChangesetRequest {
  string changeset_id = 1;
}

message PreviewPublishDatasetChangesetResponse {
  DatasetChangesetPreviewV1 preview = 1;
  EvaluationFreshnessV1 freshness = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// One transaction, then the outbox.
message PublishDatasetCaseDraftsRequest {
  string changeset_id = 1;
  // The digest the preview issued. The publish RECOMPUTES it from the rows it
  // is about to commit rather than comparing against the stored copy —
  // comparing stored-to-sent is true after any concurrent change, because both
  // are stale. A mismatch is `FAILED_PRECONDITION`, never a silent rebase.
  string preview_digest = 2;
  optional string label = 3;
  string idempotency_key = 4;
}

message PublishDatasetCaseDraftsResponse {
  DatasetPublishResultV1 result = 1;
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}
// ---- end of dataset draft review and publish ----

// ---- production-rule preview ----
//
// What a production rule WOULD do over a recent window, without doing it. The
// legacy `PreviewScorerAutomationRule` previews the legacy automation rules;
// this previews immutable production-rule versions and their typed actions.

// Which rule shape to simulate.
//
// Two shapes because they answer two different questions: a stored version
// answers "if I resume this, what happens", and an author writing a NEW
// version has no version id to name, and minting one would be a write.
message PreviewProductionEvaluationRuleRequest {
  oneof subject {
    // A stored version, by id. Its rule scopes the read and supplies the
    // observed offer stream.
    string version_id = 1;
    // A draft, replayed against an existing rule's observed offer stream.
    ProductionRulePreviewDraftSubjectV1 draft = 2;
  }
  // How far back to read the rule's observed offers. Absent means the
  // published default. Above the published ceiling is a typed refusal rather
  // than a silent clamp: a window an operator did not get is a number they
  // would otherwise read as the one they asked for.
  optional uint32 sample_window_seconds = 3;
  // How many offer rows to return and to compute the buckets over. Absent
  // means the published default; above the ceiling is a typed refusal.
  optional uint32 max_candidates = 4;
}

message ProductionRulePreviewDraftSubjectV1 {
  // The rule whose observed offer stream this draft is replayed against. A
  // draft with no rule has no traffic to be previewed against, so this is
  // required rather than optional.
  string rule_id = 1;
  // Validated by the SAME validator `CreateProductionEvaluationRuleVersion`
  // uses. A draft this verb accepts is a draft that verb accepts, and the
  // reverse; a second validator would let an author preview a version they
  // cannot then create.
  ProductionRuleVersionDraftV1 version = 2;
  // Which state to simulate the draft in. Absent means `_ACTIVE`, because the
  // question an author is asking is "what happens when I turn this on".
  optional ProductionRuleVersionStateV1 assumed_state = 3;
}

// Where the eligible population came from.
//
// v2 has NO trace matcher — an execution is created by
// `StartProductionEvaluationWorkflow`, called by whatever scored the trace —
// so there is no selector-over-traffic to simulate. The honest population is
// the rule's own observed offer stream, and this enum says so on the wire
// rather than in a comment nobody reads.
enum ProductionRulePreviewObservationBasisV1 {
  PRODUCTION_RULE_PREVIEW_OBSERVATION_BASIS_V1_UNSPECIFIED = 0;
  // Every execution row this RULE (any version) received inside the window.
  // One row per production match the rule was offered AND admitted.
  PRODUCTION_RULE_PREVIEW_OBSERVATION_BASIS_V1_ADMITTED_EXECUTIONS_IN_WINDOW = 1;
}

// The window the buckets were computed over, and how complete it is.
message ProductionRulePreviewWindowV1 {
  // Resolved by the server's clock when the window is read.
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end = 2;
  uint32 sample_window_seconds = 3;
  uint32 effective_max_candidates = 4;
  ProductionRulePreviewObservationBasisV1 observation_basis = 5;
  // `_INCOMPLETE` whenever the rule's lifetime `eligible_count` exceeds its
  // lifetime `sampled_count` — which is exactly the condition "this rule has
  // refused offers that left no row", because a state-, sampling- or
  // budget-refused offer bumps a counter and writes nothing.
  CompletenessStateV1 population_completeness = 6;
  optional string population_incomplete_reason_code = 7;
  // The rule version's LIFETIME counters, beside the windowed ones, so the
  // size of the gap is visible rather than inferred.
  ProductionRulePreviewCumulativeCountsV1 cumulative_counts = 8;
  // True when more offers exist in the window than `effective_max_candidates`.
  // Read with `LIMIT n + 1`, so this is a fact rather than a guess.
  bool truncated = 9;
  uint64 observed_offer_count = 10;
}

// The rule version's lifetime admission counters, from the health projection.
message ProductionRulePreviewCumulativeCountsV1 {
  uint64 eligible = 1;
  uint64 matched = 2;
  uint64 sampled = 3;
}

// One funnel bucket, with reasons on BOTH sides.
//
// Inclusion AND exclusion reasons: "12 matched" answers nothing, "12 matched
// because the version is dispatching; 40 did not because it is paused" answers
// the question the operator came with.
message ProductionRulePreviewBucketV1 {
  uint64 count = 1;
  // Why the members of this bucket are in it.
  repeated string inclusion_reason_codes = 2;
  // Why the offers that are NOT in it were kept out.
  repeated string exclusion_reason_codes = 3;
}

// The idle bucket, which on v2 is NOT_SUPPORTED rather than zero.
//
// `idle_timeout_seconds` is authored and validated on a v2 rule version and is
// read by nothing: the v2 admission ladder has no idle gate, because the
// caller supplies the match rather than the system waiting for a trace to go
// quiet. A zero here would tell a gate the idle rung ran and declined nobody.
message ProductionRulePreviewIdleBucketV1 {
  MetricAvailabilityV1 availability = 1;
  // Present only when `availability.state` is `_AVAILABLE`.
  optional uint64 count = 2;
  // Echoed from the version because it is authored, so a client can render
  // "configured but not enforced on this plane" rather than hiding it.
  optional uint32 configured_idle_timeout_seconds = 3;
}

message ProductionRulePreviewBucketsV1 {
  // Every offer in the window.
  ProductionRulePreviewBucketV1 eligible = 1;
  // Eligible AND the previewed version's state dispatches.
  ProductionRulePreviewBucketV1 matched = 2;
  // Matched AND admitted past sampling, budget and replay — the executions
  // that would exist.
  ProductionRulePreviewBucketV1 sampled = 3;
  // Matched AND declined by the sampling rate.
  ProductionRulePreviewBucketV1 sampled_out = 4;
  // Matched, sampled in, AND declined by today's ceiling. The rung is
  // version-wide rather than per-offer — the shipped ladder evaluates it once
  // against the stored spend — so it is all-or-nothing.
  ProductionRulePreviewBucketV1 budget_blocked = 5;
  // Offers that ALREADY have an execution on the previewed version, so a
  // re-delivery would resolve to the same execution rather than a second one.
  // Zero by construction when previewing a draft, which is the case an author
  // cares about.
  ProductionRulePreviewBucketV1 already_executed = 6;
  ProductionRulePreviewIdleBucketV1 idle = 7;
}

// Estimated scorer executions and cost.
//
// Priced the same way the launch preview and the judge-regrade preview price, at
// a call count that is admitted-offers-per-scorer rather than a cross product.
// Micros with an availability, never USD and never a zero standing in for an
// absence.
message ProductionRulePreviewEstimateV1 {
  // Admitted offers x the scorers the version's target resolves to.
  uint64 estimated_scorer_executions = 1;
  uint32 scorer_count = 2;
  // This is the EVALUATOR slice and nothing sums it into a candidate one.
  optional CostAmountV1 evaluator_cost = 3;
  MetricAvailabilityV1 evaluator_cost_availability = 4;
  optional EvaluationCostAssumptionV1 cost_assumption = 5;
  uint32 priced_scorer_count = 6;
  uint32 unpriced_scorer_count = 7;
  // What the rule ACTUALLY charged over the window's offers, summed from the
  // executions' own `spend_micros`. A different fact from the estimate, and
  // published beside it because comparing the two is the cheapest available
  // sanity check on the estimate.
  optional int64 observed_cost_micros_in_window = 8;
}

// The daily ceiling, as the preview sees it.
//
// `spend_is_today` is decided by the server's clock, and the posture is decided
// by the same rule the real admission gate applies.
message ProductionRulePreviewBudgetPostureV1 {
  // Would today's ceiling admit one more execution right now?
  bool admits_today = 1;
  optional int64 daily_budget_micros = 2;
  // Zero when the stored spend is not today's — a stale date means a new day
  // and a fresh ceiling, which is what makes "daily" mean a day.
  int64 daily_spend_micros_today = 3;
  bool spend_date_is_today = 4;
  optional int64 remaining_micros_today = 5;
  // `no_ceiling` | `admits` | `exhausted`.
  string posture_code = 6;
}

enum ProductionRulePreviewTargetResolutionV1 {
  PRODUCTION_RULE_PREVIEW_TARGET_RESOLUTION_V1_UNSPECIFIED = 0;
  // The action kind takes no target (`_SCORE`, `_BLOCK_RELEASE`).
  PRODUCTION_RULE_PREVIEW_TARGET_RESOLUTION_V1_NOT_APPLICABLE = 1;
  PRODUCTION_RULE_PREVIEW_TARGET_RESOLUTION_V1_RESOLVED = 2;
  // A target is named and does not resolve in this scope right now — the same
  // check the driver re-runs at dispatch, run early.
  PRODUCTION_RULE_PREVIEW_TARGET_RESOLUTION_V1_UNRESOLVED = 3;
  // No target is named at all: a version authored before action targets
  // shipped. The driver fails this terminally at dispatch.
  PRODUCTION_RULE_PREVIEW_TARGET_RESOLUTION_V1_ABSENT = 4;
}

// Redaction, at estimate fidelity.
enum ProductionRulePreviewRedactionPostureV1 {
  PRODUCTION_RULE_PREVIEW_REDACTION_POSTURE_V1_UNSPECIFIED = 0;
  // The preview does not hydrate span content. What a promotion WOULD land with
  // is described, not produced.
  PRODUCTION_RULE_PREVIEW_REDACTION_POSTURE_V1_HYDRATION_UNAVAILABLE_IN_PREVIEW = 1;
}

// Dedupe, redaction and review implications for any dataset promotion, at
// estimate fidelity.
message ProductionRulePreviewPromotionImplicationV1 {
  string dataset_collection_id = 1;
  bool collection_resolves = 2;
  uint32 field_mapping_count = 3;
  // Dedupe. Capture idempotency keys on the AUTHOR's rendered key, verbatim;
  // this is the TEMPLATE, because rendering it needs a match that has not
  // happened.
  string dedupe_key_template = 4;
  // `capture_idempotency_ledger`.
  string dedupe_seam_code = 5;
  ProductionRulePreviewRedactionPostureV1 redaction_posture = 6;
  // What a case lands with when this process cannot hydrate:
  // `promotion_awaits_extraction`.
  string redaction_absence_reason_code = 7;
  // Review. `lands_in_open_draft_awaiting_review`: a promoted case joins the
  // collection's one OPEN draft and nothing publishes it without a review path.
  string review_implication_code = 8;
}

message ProductionRulePreviewReviewImplicationV1 {
  string reviewer_principal_id = 1;
  // A review task nobody in scope can open is a request that would never be
  // answered, and the driver refuses it terminally. Answered here instead.
  bool reviewer_is_member = 2;
  // `sibling_create_dataset_draft_step` — the subject is the case the draft
  // step PRODUCED, never a second capture.
  string subject_source_code = 3;
  // False when the graph carries no `_CREATE_DATASET_DRAFT`, which is the
  // terminal `review_subject_unresolved` an operator would otherwise meet at
  // dispatch.
  bool subject_available = 4;
}

enum ProductionRulePreviewRevisionPinV1 {
  PRODUCTION_RULE_PREVIEW_REVISION_PIN_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_PREVIEW_REVISION_PIN_V1_PINNED = 1;
  PRODUCTION_RULE_PREVIEW_REVISION_PIN_V1_CURRENT_AT_DISPATCH = 2;
}

message ProductionRulePreviewLinkedEvaluationImplicationV1 {
  string evaluation_definition_id = 1;
  bool definition_resolves = 2;
  ProductionRulePreviewRevisionPinV1 revision_pin = 3;
  optional string evaluation_definition_revision_id = 4;
  // `frozen_candidate_reservation` — a launched run charges the daily ceiling
  // its FROZEN upper-bound reservation, not its metered actual, so a rule
  // stops early rather than late.
  string charge_basis_code = 5;
  // NOT_SUPPORTED in this build: the real charge is the launch preview's
  // `candidate_cost_micros`, which costs a full second preview of that
  // definition inside this one. Named and refused rather than quietly zeroed.
  MetricAvailabilityV1 candidate_cost_availability = 6;
  optional CostAmountV1 candidate_cost = 7;
}

message ProductionRulePreviewNotifyImplicationV1 {
  string alert_destination_id = 1;
  bool destination_resolves = 2;
  // `durable_outbox_enqueue_not_delivery` — the step succeeds when the
  // delivery is DURABLE, not when it lands, and a preview that blurred the two
  // would promise a delivery this plane never claims.
  string delivery_semantics_code = 3;
}

// Release-block conditions and the affected release scope.
message ProductionRulePreviewReleaseBlockImplicationV1 {
  // `score_below_threshold`.
  string block_reason_code = 1;
  ProductionReleaseBlockClearConditionV1 clear_condition = 2;
  uint32 ttl_days = 3;
  // The three shapes that raise a durable INDETERMINATE block rather than none,
  // so a preview reader knows a block can be raised on evidence that does not
  // exist: `indeterminate_scorer_failed`, `indeterminate_no_score`,
  // `indeterminate_score_missing_upstream`.
  repeated string indeterminate_reason_codes = 4;
  // A graph carrying `_BLOCK_RELEASE` REFUSES admission without a release key,
  // so every offer in the window names one; these are the distinct keys
  // observed, bounded, and they are the affected scope.
  repeated string affected_release_keys = 5;
  bool affected_release_keys_truncated = 6;
  // `required_on_every_admission`.
  string release_key_source_code = 7;
}

// One downstream action, dry-run. NOTHING here is persisted.
message ProductionRulePreviewActionCandidateV1 {
  uint32 ordinal = 1;
  ProductionRuleActionKindV1 action_kind = 2;
  ProductionRuleActionConditionV1 condition = 3;
  // Identity refs only. The same message the version already publishes.
  optional ProductionRuleActionTargetV1 target = 4;
  ProductionRulePreviewTargetResolutionV1 target_resolution = 5;
  optional string target_resolution_reason_code = 6;
  // How many of the admitted offers this step would be dispatched for, judged
  // by the SAME condition predicate the step scheduler uses against the score
  // each offer actually recorded.
  MetricAvailabilityV1 dispatch_count_availability = 7;
  optional uint64 estimated_dispatch_count = 8;
  // Exactly one is populated, chosen by `action_kind`. `_SCORE` populates
  // none: it makes a score that already happened durable.
  ProductionRulePreviewPromotionImplicationV1 promotion = 9;
  ProductionRulePreviewReviewImplicationV1 review = 10;
  ProductionRulePreviewLinkedEvaluationImplicationV1 linked_evaluation = 11;
  ProductionRulePreviewNotifyImplicationV1 notify = 12;
  ProductionRulePreviewReleaseBlockImplicationV1 release_block = 13;
}

// Why a rule would fire on nothing.
//
// Zero matches is a required message with its own typed reason rather than an
// empty list: these are six operator situations with six different fixes.
enum ProductionRulePreviewZeroMatchReasonV1 {
  // The only legal value when `is_zero_match` is false.
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_UNSPECIFIED = 0;
  // Nothing reached this rule at all. Widen the window, or find out why the
  // caller is not calling.
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_NO_OFFERS_IN_WINDOW = 1;
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_VERSION_NOT_DISPATCHING = 2;
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_ALL_SAMPLED_OUT = 3;
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_ALL_BUDGET_BLOCKED = 4;
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_ALL_ALREADY_EXECUTED = 5;
  PRODUCTION_RULE_PREVIEW_ZERO_MATCH_REASON_V1_MIXED_EXCLUSIONS = 6;
}

message ProductionRulePreviewZeroMatchV1 {
  bool is_zero_match = 1;
  ProductionRulePreviewZeroMatchReasonV1 reason = 2;
  string detail = 3;
}

// A named problem that does not refuse the preview.
//
// An action kind this build cannot dispatch is NAMED here, never dropped. Today
// that is a version authored before action targets existed: its target is
// absent and it fails terminally at dispatch.
message ProductionRulePreviewWarningV1 {
  // `action_kind_not_dispatchable` | `action_target_absent` |
  // `action_target_unresolved` | `window_truncated` |
  // `population_partial` | `scorer_target_unresolved` |
  // `draft_budget_ledger_starts_empty`.
  //
  // Seven, not six: `draft_budget_ledger_starts_empty` is emitted only for an
  // inline-draft subject, whose budget ledger has no history to spend against.
  // Branch on `reason_code`, never on the count of codes a comment happens to
  // list.
  string reason_code = 1;
  string detail = 2;
  optional uint32 action_ordinal = 3;
  optional ProductionRuleActionKindV1 action_kind = 4;
}

// Which shape was simulated, echoed so a response can be read without the
// request beside it.
message ProductionRulePreviewSubjectV1 {
  string rule_id = 1;
  // Absent exactly when the subject was an inline draft.
  optional string version_id = 2;
  optional uint64 version_number = 3;
  // The state the ladder's first rung was evaluated against: the stored state
  // for a version subject, the assumed state for a draft.
  ProductionRuleVersionStateV1 evaluated_state = 4;
  bool is_draft = 5;
  // sha256 over the canonical encoding of a draft's content — the same digest
  // the create verb computes, so an author can tell whether the version they
  // later created is the one they previewed.
  optional string draft_content_digest = 6;
  // The rate rung 2 was evaluated at. Absent means 100%. Echoed because a
  // draft's rate exists only in the request, and `buckets.sampled_out` is
  // unreadable without it.
  optional double effective_sampling_rate_percent = 7;
}

// One observed offer and what the previewed version would do with it.
//
// Identity, decision, reason and the sampling arithmetic. No payload body, no
// trace row, no turns.
message ProductionRulePreviewOfferV1 {
  string match_key = 1;
  ProductionWorkflowAdmissionV1 predicted_admission = 2;
  string reason_code = 3;
  // Where this key falls in [0, 100). Deterministic, FNV-1a, and the same
  // function the real ladder uses — published so an operator can check the
  // decision rather than trust it.
  double sampling_bucket_percent = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message PreviewProductionEvaluationRuleResponse {
  ProductionRulePreviewSubjectV1 subject = 1;
  ProductionRulePreviewWindowV1 window = 2;
  ProductionRulePreviewBucketsV1 buckets = 3;
  ProductionRulePreviewEstimateV1 estimate = 4;
  ProductionRulePreviewBudgetPostureV1 budget_posture = 5;
  // In ordinal order. At most one per action, and no action is dispatched.
  repeated ProductionRulePreviewActionCandidateV1 action_candidates = 6;
  // Always present. `is_zero_match` false carries reason `_UNSPECIFIED`.
  ProductionRulePreviewZeroMatchV1 zero_match = 7;
  repeated ProductionRulePreviewWarningV1 warnings = 8;
  // Bounded by `max_candidates`; `window.truncated` says when there were more.
  repeated ProductionRulePreviewOfferV1 offers = 9;
  EvaluationFreshnessV1 freshness = 10;
  AgenticEvaluationCapabilitiesV1 capabilities = 11;
}

// The typed detail this verb refuses with, in the standard error envelope.
//
// Every kind below is decided by the SAME checks the create path uses, so a
// preview that accepts a draft and a create that refuses it is not
// representable.
enum ProductionRulePreviewRefusalKindV1 {
  PRODUCTION_RULE_PREVIEW_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  PRODUCTION_RULE_PREVIEW_REFUSAL_KIND_V1_SAMPLE_WINDOW_TOO_LARGE = 1;
  PRODUCTION_RULE_PREVIEW_REFUSAL_KIND_V1_SAMPLING_RATE_INVALID = 2;
  PRODUCTION_RULE_PREVIEW_REFUSAL_KIND_V1_ACTION_KIND_UNKNOWN = 3;
  PRODUCTION_RULE_PREVIEW_REFUSAL_KIND_V1_SELECTOR_MALFORMED = 4;
}

message ProductionRulePreviewRefusalV1 {
  ProductionRulePreviewRefusalKindV1 kind = 1;
  string reason_code = 2;
  RecoveryActionV1 recovery = 3;
  string detail = 4;
  // Present when the refusal is about one action.
  optional uint32 action_ordinal = 5;
  // Present on `_SAMPLE_WINDOW_TOO_LARGE` and `_SAMPLING_RATE_INVALID`: the
  // bound that was exceeded, so a client can correct without a round trip.
  optional int64 limit_value = 6;
}
// ---- end of production-rule preview ----

// ---- compatibility and security ----

// How an observation was correlated to the action it reports on.
//
// Carried on `ReleaseObservationV1.correlation_confidence`. GitHub Actions
// correlates by workflow-name match against the correlation token, Argo CD by
// whether the operation predates dispatch or the revision moved on.
//
// `_UNSPECIFIED` is a real state here, not a placeholder: see the field's own
// comment. It means "no correlation was performed", which is the truth for
// every callback and for every row written before this field existed.
enum ReleaseObservationConfidenceV1 {
  RELEASE_OBSERVATION_CONFIDENCE_V1_UNSPECIFIED = 0;
  // The destination echoed an identity this service supplied, and the match is
  // on that identity. Only an `_EXACT` match is allowed to backfill the
  // discovered external request handle.
  RELEASE_OBSERVATION_CONFIDENCE_V1_EXACT = 1;
  // The match is by dispatch window alone: this was the one candidate that ran
  // after this service dispatched. Correct to act on, and correct to show a
  // human as weaker evidence than an identity match.
  RELEASE_OBSERVATION_CONFIDENCE_V1_WINDOW = 2;
}
// ---- end of compatibility and security ----

// ---- machine principals and credentials ----
//
// Machine attribution uses `PrincipalKindV1` / `PrincipalRefV1`, defined at the
// head of this file.

// Scopes are ADDITIVE AND NEVER IMPLIED: `RUN_EXECUTE` does not grant
// `EVAL_READ`, so a CI job that launches a run and then reads the diff holds
// both. An unknown discriminant on a write is `INVALID_ARGUMENT`; a request
// outside scope is `PERMISSION_DENIED` naming the missing scope; an absent,
// malformed, expired or revoked credential is `UNAUTHENTICATED`. The two
// codes keep "your token is wrong" distinct from "that feature is not built
// yet".
enum MachinePrincipalScopeV1 {
  MACHINE_PRINCIPAL_SCOPE_V1_UNSPECIFIED = 0;
  // Definitions, runs, matrix, comparison reads — the CI diff.
  MACHINE_PRINCIPAL_SCOPE_V1_EVAL_READ = 1;
  // Create, launch and cancel runs; scratch runs.
  MACHINE_PRINCIPAL_SCOPE_V1_RUN_EXECUTE = 2;
  // Case draft create, append and publish.
  MACHINE_PRINCIPAL_SCOPE_V1_DATASET_WRITE = 3;
  // Externally executed lease and submit.
  MACHINE_PRINCIPAL_SCOPE_V1_LEASE_SUBMIT = 4;
  // Platform annotations, such as the deployment markers and time-range
  // highlights a CI runner emits. Write-only: there is no annotation READ scope.
  // It grants nothing over human-review annotation tasks.
  MACHINE_PRINCIPAL_SCOPE_V1_PLATFORM_ANNOTATION_WRITE = 5;
  // (O11Y-448) `StartReleaseCanary`, so a CI runner can start the canary for the
  // build it just cut. A canary is the one reversible step on a release; PROMOTE,
  // HOLD, ABORT and ROLLBACK are accountable decisions a person makes and are
  // never reachable by a machine.
  MACHINE_PRINCIPAL_SCOPE_V1_RELEASE_CANARY = 6;
  // A trainer drives Loop rollouts with the organization's machine key:
  // reset, step, close and fork, and the reads of its own run and rollouts
  // (`rollout.proto`). It grants nothing on this service, and nothing on a
  // run's limits, its cap or its stop, which stay a person's.
  MACHINE_PRINCIPAL_SCOPE_V1_ROLLOUT_DRIVE = 7;
}

enum MachinePrincipalStateV1 {
  MACHINE_PRINCIPAL_STATE_V1_UNSPECIFIED = 0;
  MACHINE_PRINCIPAL_STATE_V1_ACTIVE = 1;
  // Temporarily refused. Credentials survive, so re-enabling does not force a
  // re-mint — the difference from REVOKED, which is terminal.
  MACHINE_PRINCIPAL_STATE_V1_DISABLED = 2;
  MACHINE_PRINCIPAL_STATE_V1_REVOKED = 3;
}

enum MachineCredentialStateV1 {
  MACHINE_CREDENTIAL_STATE_V1_UNSPECIFIED = 0;
  MACHINE_CREDENTIAL_STATE_V1_ACTIVE = 1;
  // Reserved for a rotation window in which an old credential is still accepted.
  // No RPC produces it yet: rotation is create-then-revoke against a principal
  // that may hold several ACTIVE credentials. Handle it anyway.
  MACHINE_CREDENTIAL_STATE_V1_ROTATING = 2;
  MACHINE_CREDENTIAL_STATE_V1_REVOKED = 3;
}

// Org-scoped, and `scopes` lives HERE rather than on the credential: two
// credentials of one principal must not be able to disagree about what that
// principal may do.
message MachinePrincipalV1 {
  string machine_principal_id = 1;
  string tenant_id = 2;
  string org_id = 3;
  string display_name = 4;
  optional string description = 5;
  // Set semantics: deduplicated, order-insignificant, unknown-value-rejecting.
  repeated MachinePrincipalScopeV1 scopes = 6;
  MachinePrincipalStateV1 state = 7;
  PrincipalRefV1 created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // COARSE, and deliberately so: written only on a cold credential
  // verification, never on a cache hit, so authentication does no database work
  // it would not otherwise do. The capability cell publishes
  // `last_used_is_per_request: 0` rather than letting a reader assume precision
  // this field does not have.
  optional google.protobuf.Timestamp last_used_at = 11;
}

// One principal may hold SEVERAL, which is what makes zero-downtime rotation
// possible: create the new credential, then revoke the old one.
//
// There is no field on this message that credential material COULD travel in:
// structural absence enforced by the type, not a redaction filter applied to a
// type that could have leaked.
message MachineCredentialV1 {
  string credential_id = 1;
  string machine_principal_id = 2;
  string tenant_id = 3;
  string org_id = 4;
  // A pointer, NEVER material. It is an indirection of the form
  // `api_token:<uuid>` — not the selector, not the selector hash, not anything
  // derived from the secret.
  string secret_ref = 5;
  // Non-secret display fragment, so an operator can tell two credentials apart
  // in a list: the type prefix plus a short head of the SELECTOR. Never any
  // part of the secret.
  string token_prefix = 6;
  uint32 version_number = 7;
  MachineCredentialStateV1 state = 8;
  optional google.protobuf.Timestamp expires_at = 9;
  PrincipalRefV1 created_by = 10;
  google.protobuf.Timestamp created_at = 11;
  optional PrincipalRefV1 revoked_by = 12;
  optional google.protobuf.Timestamp revoked_at = 13;
  optional string revoke_reason = 14;
}

message CreateMachinePrincipalRequest {
  string display_name = 1;
  optional string description = 2;
  // An unknown discriminant here is `INVALID_ARGUMENT`. An empty set is legal
  // and produces a principal that can authenticate and introspect itself and do
  // nothing else — useful, and the honest default.
  repeated MachinePrincipalScopeV1 scopes = 3;
}

message CreateMachinePrincipalResponse {
  MachinePrincipalV1 principal = 1;
}

message ListMachinePrincipalsRequest {
  optional uint32 page_size = 1;
  optional string page_token = 2;
}

message MachinePrincipalWithCredentialsV1 {
  MachinePrincipalV1 principal = 1;
  // Metadata only. See `MachineCredentialV1`: there is no field here material
  // could reach.
  repeated MachineCredentialV1 credentials = 2;
}

message ListMachinePrincipalsResponse {
  repeated MachinePrincipalWithCredentialsV1 principals = 1;
  optional string next_page_token = 2;
}

message CreateMachineCredentialRequest {
  string machine_principal_id = 1;
  optional string description = 2;
  // Absent means the platform default. Clamped server-side by the same rule the
  // existing token surface uses.
  optional google.protobuf.Timestamp expires_at = 3;
}

message CreateMachineCredentialResponse {
  MachineCredentialV1 credential = 1;
  // THE ONLY PLACE RAW CREDENTIAL MATERIAL APPEARS IN THIS CONTRACT. Returned
  // exactly once, on this response, with no read-back RPC and no recovery path.
  // It is not on `MachineCredentialV1`, so it cannot ride along on a list, a
  // get, an introspection, a fact, a log or an audit row — the field simply
  // does not exist on the resource.
  string plaintext_token_once = 2;
}

message RevokeMachineCredentialRequest {
  string credential_id = 1;
  optional string revoke_reason = 2;
}

message RevokeMachineCredentialResponse {
  MachineCredentialV1 credential = 1;
}

message RevokeMachinePrincipalRequest {
  string machine_principal_id = 1;
  optional string revoke_reason = 2;
}

message RevokeMachinePrincipalResponse {
  MachinePrincipalV1 principal = 1;
  // Every credential the principal held, each now REVOKED. Returned so a caller
  // can report exactly what it just invalidated rather than inferring it.
  repeated MachineCredentialV1 revoked_credentials = 2;
}

message GetCallerPrincipalRequest {}

// "Is my token valid and what can it do?" Shaped so ONE SDK code path serves
// both caller classes: `caller` is always present and always says which kind
// it is, and the machine-only detail hangs off `machine_principal`, absent for
// a browser session rather than zero-valued.
message GetCallerPrincipalResponse {
  PrincipalRefV1 caller = 1;
  string tenant_id = 2;
  string org_id = 3;
  // Absent for a browser session. Present for a machine credential, carrying
  // the ScopeSet the SDK needs in order to say "this token lacks
  // `dataset:write`" BEFORE the run rather than after a failed one.
  optional MachinePrincipalV1 machine_principal = 4;
  // Which credential authorized THIS request. Absent for a browser session.
  // This is what makes a revocation post-mortem possible: it answers "which key
  // did the thing", not merely "which principal".
  optional MachineCredentialV1 credential = 5;
}
// ---- end of machine principals and credentials ----

// ---- externally executed candidates ----
//
// A customer runtime executes the cases of an `ExternallyExecutedCandidateV1`:
// it leases prepared cases, renews the lease, submits outputs and releases
// what it will not finish. The cells move through `AWAITING_SUBMISSION`,
// `LEASE_EXPIRED` and `TIMED_OUT`.
//
// Case inputs and submitted outputs travel as canonical JSON strings, the same
// representation `DatasetCaseV1` uses for `input_payload_json` and
// `expected_output_json`.

// A customer runtime's fenced hold on a bounded set of prepared cases.
//
// `lease_id` names the lease and `lease_token` is its fence. A lease covers the
// cells it holds and has one expiry.
message ExternalCaseLeaseV1 {
  string lease_id = 1;
  // Opaque to the client and repeated on every renew, submit and release. A
  // request carrying a stale token writes nothing.
  string lease_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint32 renewals_used = 4;
  uint32 renewals_remaining = 5;
  uint32 case_count = 6;
}

// One prepared cell handed to a customer runtime to execute.
message LeasedEvaluationCaseV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  // Repeated back on submission. A retry mints a new generation, and an output
  // produced for the previous one is not evidence for this one.
  int32 attempt_generation = 5;
  // Canonical JSON, the same bytes the content digest binds.
  optional string input_payload_json = 6;
  optional string expected_output_json = 7;
  // The runtime's own deadline for this cell. Past it, with no live lease, the
  // cell reaches `EVALUATION_EXECUTION_STATE_V1_TIMED_OUT` — the frozen name
  // whose comment reads "whose deadline was the work's".
  google.protobuf.Timestamp submission_deadline_at = 8;
}

// What a runtime tried and could not do. A failure is evidence too: it is the
// difference between "this candidate cannot answer this case" and silence.
message ExternalCaseFailureV1 {
  string code = 1;
  string sanitized_message = 2;
}

// A submitter's own account of what its runtime spent.
//
// Tokens, latency and retries are folded into the run's ledger exactly as a
// provider candidate's are. `reported_cost_micros` is CARRIED AND NEVER SUMMED:
// this build did not buy the call and has no rate to price it with, and a
// caller-declared figure entering the org's spend would let a caller write
// their own bill. The capability cell publishes this as
// `submitted_cost_is_priced = 0` rather than leaving a client to discover it.
message ExternalCaseUsageV1 {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
  optional int64 total_tokens = 3;
  optional int64 latency_micros = 4;
  optional int32 retry_count = 5;
  optional int64 reported_cost_micros = 6;
}

message ExternalCaseOutputV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  int32 attempt_generation = 5;
  oneof result {
    // Canonical JSON. Bounded by `max_output_bytes`; refused above it with a
    // typed per-case rejection, never truncated.
    string output_payload_json = 6;
    ExternalCaseFailureV1 failure = 7;
  }
  optional ExternalCaseUsageV1 usage = 8;
}

enum ExternalSubmissionAckKindV1 {
  EXTERNAL_SUBMISSION_ACK_KIND_V1_UNSPECIFIED = 0;
  EXTERNAL_SUBMISSION_ACK_KIND_V1_ACCEPTED = 1;
  // The identical coordinate and generation was already submitted under a lease
  // this caller holds. Convergence, not an error: a retried batch says this.
  EXTERNAL_SUBMISSION_ACK_KIND_V1_ALREADY_SUBMITTED = 2;
  EXTERNAL_SUBMISSION_ACK_KIND_V1_REJECTED = 3;
}

// One case's answer inside a batch. A malformed case never fails its batch:
// the other forty-nine land.
message ExternalCaseOutputAckV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  ExternalSubmissionAckKindV1 kind = 5;
  // The FROZEN execution state this coordinate is in as the server sees it.
  // A submission whose lease died reads
  // `EVALUATION_EXECUTION_STATE_V1_LEASE_EXPIRED` here — "reclaimable", which
  // is exactly what the client should do next.
  EvaluationExecutionStateV1 observed_state = 6;
  // Present on `_REJECTED`. `stage` is always
  // `EVALUATION_FAILURE_STAGE_V1_EXTERNAL_LEASE`.
  optional EvaluationFailureV1 rejection = 7;
}

enum ExternalLeaseRefusalKindV1 {
  EXTERNAL_LEASE_REFUSAL_KIND_V1_UNSPECIFIED = 0;
  // The run is not in a state that can hand out work: not found, terminal, or
  // cancellation requested.
  EXTERNAL_LEASE_REFUSAL_KIND_V1_RUN_NOT_EXECUTABLE = 1;
  // The named candidate exists but is not an externally executed one, or its
  // frozen `runtime_key` is not the one this caller claims.
  EXTERNAL_LEASE_REFUSAL_KIND_V1_CANDIDATE_NOT_EXTERNALLY_EXECUTED = 2;
  // The fence is gone: unknown lease, or another holder has it now.
  EXTERNAL_LEASE_REFUSAL_KIND_V1_LEASE_NOT_HELD = 3;
  EXTERNAL_LEASE_REFUSAL_KIND_V1_LEASE_EXPIRED = 4;
  EXTERNAL_LEASE_REFUSAL_KIND_V1_RENEWAL_BUDGET_EXHAUSTED = 5;
  // A bound published on the capability cell was exceeded.
  EXTERNAL_LEASE_REFUSAL_KIND_V1_BOUNDS_EXCEEDED = 6;
  // The caller's principal lacks the scope this verb requires.
  EXTERNAL_LEASE_REFUSAL_KIND_V1_SCOPE_MISSING = 7;
  // Recording and replay are unavailable on this deployment (O11Y-633).
  EXTERNAL_LEASE_REFUSAL_KIND_V1_RECORDING_UNAVAILABLE = 8;
  // This case already has its verdict under this lease: its runtime submitted
  // it, or a replay divergence was recorded on it. The lease's other cases are
  // unaffected. Stop executing this case; never retried (O11Y-633).
  EXTERNAL_LEASE_REFUSAL_KIND_V1_CASE_ALREADY_SUBMITTED = 9;
}

message ExternalLeaseRefusalV1 {
  ExternalLeaseRefusalKindV1 kind = 1;
  string message = 2;
  // Names the missing scope, never the scopes the caller has.
  optional string missing_scope = 3;
  optional RecoveryActionV1 recovery = 4;
}

message LeaseEvaluationCasesRequest {
  string evaluation_run_id = 1;
  string candidate_key = 2;
  // Must equal the `runtime_key` the launch froze on this candidate. A runtime
  // answering for a candidate it does not implement is a configuration error
  // the server can see and the customer cannot.
  string runtime_key = 3;
  // 0 means the server default. Clamped to `max_cases_per_lease`.
  uint32 max_cases = 4;
  // 0 means the candidate's own `lease_policy.lease_ttl_seconds`. Clamped to
  // [`min_lease_seconds`, `max_lease_seconds`].
  uint32 lease_seconds = 5;
}

message LeaseEvaluationCasesResponse {
  // ABSENT means nothing was claimable. That is the "you are done" answer and
  // it is not an error: `remaining_unleased_case_count` says whether the work
  // is finished or merely held by another runtime.
  optional ExternalCaseLeaseV1 lease = 1;
  repeated LeasedEvaluationCaseV1 cases = 2;
  uint32 remaining_unleased_case_count = 3;
  optional ExternalLeaseRefusalV1 refusal = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
  EvaluationFreshnessV1 freshness = 6;
}

message RenewEvaluationCaseLeaseRequest {
  string evaluation_run_id = 1;
  string lease_id = 2;
  string lease_token = 3;
  uint32 lease_seconds = 4;
}

message RenewEvaluationCaseLeaseResponse {
  optional ExternalCaseLeaseV1 lease = 1;
  optional ExternalLeaseRefusalV1 refusal = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message SubmitEvaluationCaseOutputsRequest {
  string evaluation_run_id = 1;
  string lease_id = 2;
  string lease_token = 3;
  repeated ExternalCaseOutputV1 outputs = 4;
  // Convergence is fenced by lease identity and keyed by coordinate, so this is
  // audit provenance rather than the dedupe key. Bounded like every other
  // idempotency key on this surface.
  string idempotency_key = 5;
}

message SubmitEvaluationCaseOutputsResponse {
  repeated ExternalCaseOutputAckV1 acks = 1;
  uint32 accepted_count = 2;
  uint32 already_submitted_count = 3;
  uint32 rejected_count = 4;
  // The lease as it stands after this batch — remaining life and how many cases
  // it still holds. Absent when the batch emptied it.
  optional ExternalCaseLeaseV1 lease = 5;
  uint32 remaining_leased_case_count = 6;
  // A WHOLE-REQUEST refusal: the fence was lost, so no per-case answer is
  // meaningful. Never set alongside acks.
  optional ExternalLeaseRefusalV1 refusal = 7;
  AgenticEvaluationCapabilitiesV1 capabilities = 8;
}

message ReleaseEvaluationCaseLeaseRequest {
  string evaluation_run_id = 1;
  string lease_id = 2;
  string lease_token = 3;
}

message ReleaseEvaluationCaseLeaseResponse {
  uint32 released_case_count = 1;
  optional ExternalLeaseRefusalV1 refusal = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}
// ---- end of externally executed candidates ----

// ---- O11Y-633: record and replay on the lease plane ----
//
// A runtime records each model and tool call its agent made for a leased
// case, and a REPLAY candidate's runtime asks, call by call, for the response
// that recording holds. Every call is redacted server-side before it is
// digested or stored, whatever the runtime sent.

enum RecordedCallKindV1 {
  RECORDED_CALL_KIND_V1_UNSPECIFIED = 0;
  RECORDED_CALL_KIND_V1_MODEL = 1;
  RECORDED_CALL_KIND_V1_TOOL = 2;
}

// One step of a trajectory. There is deliberately no field for headers, call
// ids or timestamps: what is not on the wire is neither stored nor matched.
message RecordedCallV1 {
  RecordedCallKindV1 kind = 1;
  // Required for a TOOL call, empty for a MODEL call.
  string tool_name = 2;
  // JSON. What a replay matches on, after redaction.
  string request_json = 3;
  // JSON. What a replay answers with. Ignored on a lookup.
  string response_json = 4;
}

// Consecutive steps of one leased case's trajectory, starting at `first_step`.
message RecordedTrajectoryChunkV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  int32 attempt_generation = 5;
  // The trajectory's next unrecorded step, so a retried chunk converges and a
  // gap is refused. A chunk at step 0 under a new lease starts the trajectory
  // over, since a reclaimed case is executed again.
  uint32 first_step = 6;
  repeated RecordedCallV1 calls = 7;
  // The trajectory is complete once this chunk is stored. A trajectory never
  // completed replays as `REPLAY_DIVERGENCE_KIND_V1_RECORDING_INCOMPLETE`.
  // A runtime whose final call went out without `last` closes the trajectory
  // with a chunk of no calls, `last` set, at its next unrecorded step, under
  // the lease that recorded it; it stores nothing. An empty chunk without
  // `last`, or anywhere else, is malformed.
  bool last = 8;
}

message RecordEvaluationCaseStepsRequest {
  string evaluation_run_id = 1;
  string lease_id = 2;
  string lease_token = 3;
  repeated RecordedTrajectoryChunkV1 chunks = 4;
}

// `ACCEPTED` once stored, `ALREADY_SUBMITTED` for steps already recorded,
// `REJECTED` with a typed reason otherwise.
message RecordedChunkAckV1 {
  string cohort_key = 1;
  string candidate_key = 2;
  string case_revision_id = 3;
  uint32 trial = 4;
  ExternalSubmissionAckKindV1 kind = 5;
  uint32 next_step = 6;
  bool complete = 7;
  optional EvaluationFailureV1 rejection = 8;
}

message RecordEvaluationCaseStepsResponse {
  repeated RecordedChunkAckV1 acks = 1;
  // A WHOLE-REQUEST refusal; never set alongside acks.
  optional ExternalLeaseRefusalV1 refusal = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message LookupReplayStepRequest {
  string evaluation_run_id = 1;
  string lease_id = 2;
  string lease_token = 3;
  string cohort_key = 4;
  string candidate_key = 5;
  string case_revision_id = 6;
  uint32 trial = 7;
  int32 attempt_generation = 8;
  // The runtime numbers its calls from 0.
  uint32 step = 9;
  RecordedCallV1 observed = 10;
}

enum ReplayDivergenceKindV1 {
  REPLAY_DIVERGENCE_KIND_V1_UNSPECIFIED = 0;
  REPLAY_DIVERGENCE_KIND_V1_MODEL_REQUEST_DIFFERS = 1;
  REPLAY_DIVERGENCE_KIND_V1_TOOL_REQUEST_DIFFERS = 2;
  // The agent made more calls than the recording holds.
  REPLAY_DIVERGENCE_KIND_V1_RECORDING_EXHAUSTED = 3;
  // The source case has no complete recording.
  REPLAY_DIVERGENCE_KIND_V1_RECORDING_INCOMPLETE = 4;
}

// The first step at which the replayed agent left its recording. Recorded on
// the case as its verdict; the runtime stops executing that case.
message ReplayDivergenceV1 {
  uint32 step = 1;
  ReplayDivergenceKindV1 kind = 2;
  // sha256 hex. Empty when the recording holds no such step.
  string expected_request_digest = 3;
  string observed_request_digest = 4;
}

message LookupReplayStepResponse {
  oneof outcome {
    // JSON: the recorded response, redacted as it was stored.
    string response_json = 1;
    ReplayDivergenceV1 divergence = 2;
  }
  optional ExternalLeaseRefusalV1 refusal = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}
// ---- end O11Y-633 ----

// ---- #591: the replay read API ----
//
// What a person reads of a replay candidate's cases: each case's outcome
// against the recording it replays, and for a divergence, the recorded and the
// replayed requests side by side. Every body is shown as the server stored it,
// redacted.

enum ReplayStatusV1 {
  REPLAY_STATUS_V1_UNSPECIFIED = 0;
  // No verdict yet.
  REPLAY_STATUS_V1_PENDING = 1;
  // No call left the recording, and the runtime submitted the case's output.
  REPLAY_STATUS_V1_MATCHED = 2;
  // A request differed from the recorded one, or the agent made more calls
  // than were recorded. A failed trial of the agent.
  REPLAY_STATUS_V1_DIVERGED = 3;
  // The source has no complete recording of the case. Not a failed trial.
  REPLAY_STATUS_V1_INCOMPLETE = 4;
  // Any other verdict; `failure_code` names it.
  REPLAY_STATUS_V1_FAILED = 5;
}

// UNSPECIFIED lists every replay case, PENDING and FAILED included.
enum ReplayListFilterV1 {
  REPLAY_LIST_FILTER_V1_UNSPECIFIED = 0;
  REPLAY_LIST_FILTER_V1_MATCHED = 1;
  REPLAY_LIST_FILTER_V1_DIVERGED = 2;
  REPLAY_LIST_FILTER_V1_INCOMPLETE = 3;
}

message ReplaySummaryV1 {
  EvaluationCellRefV1 cell = 1;
  int32 attempt_generation = 2;
  ReplayStatusV1 status = 3;
  optional string failure_code = 4;
  // Set for DIVERGED and INCOMPLETE.
  optional ReplayDivergenceKindV1 divergence_kind = 5;
  optional uint32 divergence_step = 6;
  // Steps answered from the recording, set only when known: those before the
  // divergence. Unset for a MATCHED or PENDING replay, whose lookups are not
  // counted.
  optional uint32 replayed_steps = 7;
  // Steps in the recording of the source's verdict execution; unset when it
  // has none.
  optional uint32 recorded_steps = 8;
  bool source_complete = 9;
  string source_evaluation_run_id = 10;
  string source_candidate_key = 11;
  // When the case's verdict was reached.
  optional google.protobuf.Timestamp verdict_at = 12;
  // #639. The source's recording this case replays, and when its last step was
  // stored; unset when the source has none.
  optional string recording_id = 13;
  optional google.protobuf.Timestamp recorded_at = 14;
}

// #639. How many cases each filter lists for the request's run and candidate,
// whatever its own filter and page: what that filter pages through.
message ReplayListTotalsV1 {
  uint32 all = 1;
  uint32 matched = 2;
  uint32 diverged = 3;
  uint32 incomplete = 4;
}

message ListEvaluationReplaysRequest {
  string evaluation_run_id = 1;
  // One replay candidate of the run; absent means every one.
  optional string candidate_key = 2;
  ReplayListFilterV1 filter = 3;
  // 1 to 100; absent means 50.
  optional uint32 page_size = 4;
  // The previous page's `next_page_token`.
  optional string page_token = 5;
}

// In cell-coordinate order. An empty run or filter is an empty list.
message ListEvaluationReplaysResponse {
  repeated ReplaySummaryV1 replays = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  ReplayListTotalsV1 totals = 5;
}

message GetEvaluationReplayRequest {
  string evaluation_run_id = 1;
  EvaluationCellRefV1 cell = 2;
  // The previous response's `next_steps_page_token`.
  optional string steps_page_token = 3;
}

enum ReplayStepResultV1 {
  REPLAY_STEP_RESULT_V1_UNSPECIFIED = 0;
  // Before the divergence: answered from the recording.
  REPLAY_STEP_RESULT_V1_MATCHED = 1;
  REPLAY_STEP_RESULT_V1_DIVERGED = 2;
  // After the divergence: the case stopped before it.
  REPLAY_STEP_RESULT_V1_NOT_REPLAYED = 3;
  // A replay with no divergence: lookups are not counted, so whether the
  // agent reached this step is not known.
  REPLAY_STEP_RESULT_V1_UNCOUNTED = 4;
}

// One recorded step, from the recording's index: no body.
message ReplayStepV1 {
  uint32 step = 1;
  RecordedCallKindV1 kind = 2;
  string tool_name = 3;
  ReplayStepResultV1 result = 4;
}

// Why a body is not shown. UNSPECIFIED means it is.
enum ReplayPayloadOmissionV1 {
  REPLAY_PAYLOAD_OMISSION_V1_UNSPECIFIED = 0;
  // Over the published per-body limit; `byte_length` says by how much.
  REPLAY_PAYLOAD_OMISSION_V1_TOO_LARGE = 1;
  // This deployment cannot read stored bodies.
  REPLAY_PAYLOAD_OMISSION_V1_UNAVAILABLE = 2;
}

message ReplayPayloadV1 {
  // JSON, redacted as stored.
  optional string body_json = 1;
  uint64 byte_length = 2;
  ReplayPayloadOmissionV1 omitted = 3;
}

// A candidate's tool definitions as frozen at launch.
message ReplayToolSchemaV1 {
  repeated string tool_definitions_json = 1;
  optional string tool_schema_digest = 2;
  uint64 byte_length = 3;
  ReplayPayloadOmissionV1 omitted = 4;
}

message GetEvaluationReplayResponse {
  ReplaySummaryV1 replay = 1;
  bool counts_as_task_failure = 2;
  // A shown body holds the redaction marker.
  bool redaction_applied = 3;
  repeated ReplayStepV1 steps = 4;
  optional string next_steps_page_token = 5;
  bool steps_has_more = 6;
  // The diverging step's, unset where the recording holds no such step.
  optional ReplayPayloadV1 recorded_request = 7;
  optional ReplayPayloadV1 recorded_response = 8;
  // What the replayed agent sent at the diverging step, redacted as a
  // recorded request is.
  optional ReplayPayloadV1 observed_request = 9;
  // The source candidate's, and the replay candidate's.
  optional ReplayToolSchemaV1 recorded_tool_schema = 10;
  optional ReplayToolSchemaV1 replayed_tool_schema = 11;
  // The two frozen tool-schema digests differ.
  bool tool_schema_drift = 12;
  AgenticEvaluationCapabilitiesV1 capabilities = 13;
  // #639. The trace the case was recorded from; unset for a case not taken
  // from a trace. Not the replay's own execution, which records no trace.
  optional string case_trace_id = 14;
  // #639. The evaluation definition of the run this case replays; unset once
  // that run is gone.
  optional string source_definition_id = 15;
}

// #639. A replay's run and its labels, for a list that spans runs.
message OrganizationReplayV1 {
  string evaluation_run_id = 1;
  string definition_id = 2;
  string definition_name = 3;
  string candidate_display_label = 4;
  ReplaySummaryV1 replay = 5;
}

message ListOrganizationReplaysRequest {
  ReplayListFilterV1 filter = 1;
  // 1 to 100; absent means 50.
  optional uint32 page_size = 2;
  // The previous page's `next_page_token`, for the same filter.
  optional string page_token = 3;
}

// Replays with a verdict, the runtime's or the server's, newest first. A
// pending replay, or one its runtime abandoned, lists only in its run.
message ListOrganizationReplaysResponse {
  repeated OrganizationReplayV1 replays = 1;
  optional string next_page_token = 2;
  bool has_more = 3;
  // Over the newest `replay_views.org_totals_cap` replays.
  ReplayListTotalsV1 totals = 4;
  // More replays exist than the totals count.
  bool totals_capped = 5;
  AgenticEvaluationCapabilitiesV1 capabilities = 6;
}
// ---- end #591 ----
// ---- platform annotations ----
//
// Platform annotations outlive the telemetry they point at:
//
//   * they have their OWN retention (730 days by default), not the telemetry
//     window; see `platform_annotations_retention_days`;
//   * links to releases, evaluation runs, agent runs and traces are validated
//     for SHAPE and never for EXISTENCE, because a marker outliving the trace it
//     points at is the NORMAL end state, not an error;
//   * an annotation stores identities, refs, a bounded title and bounded
//     attributes. Never a payload body.

// What an annotation IS. Three kinds and no fourth; a fourth is a wire change
// and a capability bump, which is the point of a closed enum here.
enum PlatformAnnotationKindV1 {
  // NOT a real state, and the contrast with `ReleaseObservationConfidenceV1` is
  // deliberate: there, `_UNSPECIFIED` means "no correlation was performed",
  // which is the truth for every row written before the field existed. Here
  // there is no such truth. An annotation with no kind was never recorded,
  // because the write refuses it. This value exists only because proto3
  // requires a zero, and a write carrying it is answered identically to a
  // discriminant this build has never heard of.
  PLATFORM_ANNOTATION_KIND_V1_UNSPECIFIED = 0;
  // A deployment happened. The reason the plane exists.
  PLATFORM_ANNOTATION_KIND_V1_DEPLOYMENT = 1;
  // A point in time worth remembering that is not a deployment.
  PLATFORM_ANNOTATION_KIND_V1_MARKER = 2;
  // A window worth remembering — an incident, an experiment, a regression.
  // Typically the only kind that carries an `end_at`, though nothing forces it.
  PLATFORM_ANNOTATION_KIND_V1_HIGHLIGHT = 3;
}

// What an annotation may point AT. Closed, because an open link kind is an
// untyped string and an untyped string is where payloads start arriving.
enum PlatformAnnotationLinkKindV1 {
  PLATFORM_ANNOTATION_LINK_KIND_V1_UNSPECIFIED = 0;
  PLATFORM_ANNOTATION_LINK_KIND_V1_RELEASE = 1;
  PLATFORM_ANNOTATION_LINK_KIND_V1_EVALUATION_RUN = 2;
  PLATFORM_ANNOTATION_LINK_KIND_V1_AGENT_RUN = 3;
  PLATFORM_ANNOTATION_LINK_KIND_V1_TRACE = 4;
}

// One typed reference.
//
// NOT RESOLVED AT WRITE, by design: an annotation keeps its rows for 730 days
// while a trace keeps its for thirty, so a link that was valid when written and
// dangling when read is the expected end state.
//
// A reader resolves it and renders a typed absence. The capability cell says so
// out loud with `link_existence_validated = 0`, so an SDK does not report a
// data-integrity bug when it meets one.
message PlatformAnnotationLinkV1 {
  PlatformAnnotationLinkKindV1 kind = 1;
  // An identity. Never a URL, never a body, byte-capped.
  string ref = 2;
}

// One bounded key/value. Both halves are byte-capped, the count is capped, and
// the whole map is capped again. Short strings, not a place to put a request
// body.
message PlatformAnnotationAttributeV1 {
  string key = 1;
  string value = 2;
}

message PlatformAnnotationV1 {
  string annotation_id = 1;
  string org_id = 2;
  PlatformAnnotationKindV1 kind = 3;
  string title = 4;
  google.protobuf.Timestamp start_at = 5;
  // ABSENT MEANS AN INSTANT. This is a `start` plus an optional `end` and not a
  // `oneof{instant, range}` on purpose. An instant IS a range whose end is
  // absent; a `oneof` would assert they are different kinds of thing and then
  // make every consumer write the same two-arm switch to conclude that they are
  // not. It also keeps the window-overlap read to ONE predicate, which is what
  // lets the list publish a constant statement budget.
  //
  // A renderer draws a line when this is absent and a band when it is present —
  // the same discriminator a `oneof` would have given it, at no schema cost.
  //
  // `end_at < start_at` is refused by the database, not by a handler rule.
  optional google.protobuf.Timestamp end_at = 6;
  repeated PlatformAnnotationAttributeV1 attributes = 7;
  repeated PlatformAnnotationLinkV1 links = 8;
  // Machine or user. Read attribution from HERE and never from a legacy
  // `created_by_user_id`: a marker written by a CI runner has no user.
  PrincipalRefV1 recorded_by = 9;
  google.protobuf.Timestamp recorded_at = 10;
  // Echoed so a retrying CI job can match the response to the request it
  // replayed without holding state across the retry.
  string idempotency_key = 11;
}

// Why a write was refused.
//
// `_IDEMPOTENCY_KEY_REUSED` is the one worth reading twice: a key alone cannot
// tell a retry from a DIFFERENT request wearing the same key, so a key
// presented with different content is refused rather than silently answered
// with the row that is already there.
enum PlatformAnnotationRejectionReasonV1 {
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_UNSPECIFIED = 0;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_KIND_UNKNOWN = 1;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_TITLE_TOO_LARGE = 2;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_ATTRIBUTE_TOO_LARGE = 3;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_TOO_MANY_ATTRIBUTES = 4;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_TOO_MANY_LINKS = 5;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_LINK_REF_TOO_LARGE = 6;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_RANGE_INVERTED = 7;
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_IDEMPOTENCY_KEY_REUSED = 8;
  // 9 is UNUSED, and deliberately left unused rather than filled.
  //
  // A missing scope is refused before this check, as a bare `PERMISSION_DENIED`
  // whose message names the missing scope.
  PLATFORM_ANNOTATION_REJECTION_REASON_V1_WINDOW_INVALID = 10;
}

// The typed detail, carried on the `grpc-status-details-bin` envelope, the same
// shape the other `...RejectionV1` types use.
message PlatformAnnotationRejectionV1 {
  PlatformAnnotationRejectionReasonV1 reason = 1;
  // The field that was refused, so a robot need not parse prose.
  optional string field = 2;
  // The bound that was exceeded, so a caller corrects without a round trip.
  optional int64 limit_value = 3;
  // 4 is UNUSED.
  //
  // On `_KIND_UNKNOWN`: the kinds this build DOES support, so a newer runner
  // downgrades to `_MARKER` instead of dropping the annotation. The capability
  // envelope on the response carries the count; this carries the names.
  repeated PlatformAnnotationKindV1 supported_kinds = 5;
}

// `MUTATION_ACK`.
message RecordPlatformAnnotationRequest {
  PlatformAnnotationKindV1 kind = 1;
  string title = 2;
  google.protobuf.Timestamp start_at = 3;
  // Absent for an instant. See `PlatformAnnotationV1.end_at`.
  optional google.protobuf.Timestamp end_at = 4;
  repeated PlatformAnnotationAttributeV1 attributes = 5;
  repeated PlatformAnnotationLinkV1 links = 6;
  // Required. A CI job that retries must not create a second marker.
  string idempotency_key = 7;
}

message RecordPlatformAnnotationResponse {
  PlatformAnnotationV1 annotation = 1;
  // True when this call matched an existing key AND digest. A retry is a
  // success, and it is a success the caller can tell apart from a first write.
  bool idempotent_replay = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// `INITIAL_PAGE`.
message ListPlatformAnnotationsRequest {
  // Inclusive. An annotation OVERLAPPING the window is returned, which for a
  // range means it may have started before `window_start`.
  google.protobuf.Timestamp window_start = 1;
  // Exclusive.
  google.protobuf.Timestamp window_end = 2;
  // Empty means every kind. `_UNSPECIFIED` INSIDE it is refused rather than
  // ignored: a filter that silently drops a term returns a page the caller
  // believes is filtered one way and is filtered another.
  repeated PlatformAnnotationKindV1 kinds = 3;
  o11y_one.common.v1.PageRequestV1 page = 4;
}

message ListPlatformAnnotationsResponse {
  // Newest first, by `start_at` then by id.
  repeated PlatformAnnotationV1 annotations = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
  // A cursor this build cannot honour returns a typed resync directive with an
  // empty page, never a transport error carrying prose.
  optional EvaluationCursorResyncV1 resync = 4;
  // There is deliberately NO `EvaluationFreshnessV1` here, unlike the other list
  // responses on this service: this read has no freshness to report, and an
  // absent block is the honest answer.
}
// ---- end of platform annotations ----

// ===========================================================================
// The scorer library
//
// List, read, version history, usage and archive for scorers and suites,
// including the full read-back of an authored judge.
//
// NOTHING here changes execution, the launch freeze, pricing or a published
// refusal. The full read-back lives on its OWN message, so
// `CreateEvaluationScorerConfigResponse` keeps its documented narrowing.
// ===========================================================================

// Which archived posture a library page wants.
//
// `UNSPECIFIED` behaves as `ACTIVE_ONLY`, which is the picker's own default and
// therefore what a client that sends nothing already expects. It is stated
// rather than left to be discovered, because a filter whose zero value silently
// hides rows is how an inventory page becomes a sample.
enum EvaluationScorerArchivedFilterV1 {
  EVALUATION_SCORER_ARCHIVED_FILTER_V1_UNSPECIFIED = 0;
  EVALUATION_SCORER_ARCHIVED_FILTER_V1_ACTIVE_ONLY = 1;
  EVALUATION_SCORER_ARCHIVED_FILTER_V1_ARCHIVED_ONLY = 2;
  EVALUATION_SCORER_ARCHIVED_FILTER_V1_ALL = 3;
}

// One library row.
//
// Identity, state, counts, timestamps and references. **No rubric.** A judge's
// instruction text is bounded at 8 KiB and a fifty-row page carrying fifty of
// them is a payload on a list, which is the shape
// `EvaluationDefinitionRevisionSummaryV1` avoids by carrying `draft_byte_size`
// instead of the draft. The rubric is on the DETAIL read and nowhere else.
message EvaluationScorerConfigSummaryV1 {
  string score_config_id = 1;
  string config_key = 2;
  string name = 3;
  optional string description = 4;
  string metric_name = 5;
  // Authored on a configuration created through `CreateEvaluationScorerConfig`;
  // absent on one that predates it, because that row has no such column and
  // deriving it from the metric name here would invent an authorship.
  optional string success_dimension = 6;
  // `UNSPECIFIED` is a REAL ANSWER and means a scorer authored outside
  // `CreateEvaluationScorerConfig` — the same meaning it carries on
  // `EvaluationBuilderScorerChoiceV1.kind`. It is not "unknown".
  EvaluationScorerKindV1 kind = 7;
  // Absent for the same reason `success_dimension` is: only the v2 authoring
  // record carries a discriminator in the `v{n}` vocabulary. A legacy row's
  // `updated_at` micros are not a version and are not published as one.
  optional string version_discriminator = 8;
  // `v{n}` implies `n + 1` versions, because versions are dense: `v0` on first
  // authorship and `v{n+1}` on each revision.
  uint32 version_count = 9;
  // `NOT_SUPPORTED` with `scorer_version_discriminator_unparsed` when the
  // discriminator is absent or does not read as `v{n}` — which is exactly what
  // a not-v2-authored scorer looks like. Missing is not zero.
  MetricAvailabilityV1 version_count_availability = 10;
  optional double weight = 11;
  bool is_blocking_gate = 12;
  bool is_archived = 13;
  optional google.protobuf.Timestamp archived_at = 14;
  // TRUE when the scorer was authored on this surface. FALSE means the scorer is
  // real, runnable and freezable, and was authored on the legacy surface;
  // dropping it from this list would hide a scorer a run can perfectly well pin.
  bool authored_on_this_surface = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  // Present exactly when the row records a user. `CreateEvaluationScorerConfig`
  // is NOT on the machine surface, so a recorded creator here is a user. ABSENT,
  // never `UNSPECIFIED` with a bare uuid.
  optional PrincipalRefV1 created_by = 18;
  // (#611) Present exactly when `kind` is CODE, read from the same row, so the
  // library shows a publication with no read per scorer.
  optional EvaluationScorerCodeSummaryV1 code = 19;
  // #1106. A judge's mode, read from the authoring record. UNSPECIFIED exactly
  // when `kind` is not LLM_JUDGE.
  JudgeModeV1 judge_mode = 20;
  // #1110. Present exactly when the scorer is a question of a judge: read from
  // the authoring record, so a library can group a judge's questions.
  optional EvaluationJudgeQuestionRefV1 judge_question = 21;
  // NOTE — there is deliberately no `updated_by`. The authoring record carries
  // `updated_at` and no updater column, and inventing one from `created_by`
  // would attribute a revision to whoever authored `v0`.
}

message ListEvaluationScorerConfigsRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  // Empty admits every kind. A list containing `UNSPECIFIED` selects exactly the
  // scorers authored outside this surface, which is a question an operator
  // migrating off the legacy plane actually asks — and it is why the filter is
  // repeated rather than a single optional field whose zero value would have to
  // mean both "no filter" and "that kind".
  repeated EvaluationScorerKindV1 kind_filter = 2;
  optional EvaluationScorerArchivedFilterV1 archived_filter = 3;
}

message ListEvaluationScorerConfigsResponse {
  repeated EvaluationScorerConfigSummaryV1 scorer_configs = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  // A cursor this build cannot honour returns a typed resync with an empty page,
  // never a transport error carrying prose.
  optional EvaluationCursorResyncV1 resync = 5;
}

// Exactly the four request settings that reach a provider.
//
// NOT `ProviderRequestSettingsV1`. That message has twenty-eight fields and a
// judge stores four of them; a four-field message named *effective* says what
// is true: these are what the judge will be called with.
//
// #1110: O11Y-592's `seed` is stored too, so it is the fifth.
message EvaluationScorerJudgeEffectiveSettingsV1 {
  optional uint32 max_output_tokens = 1;
  optional double temperature = 2;
  optional double top_p = 3;
  optional string anthropic_version = 4;
  // #1110. Sent only by the adapters that take one, as on
  // `ProviderRequestSettingsV1.seed`; served so a revision does not drop it.
  optional uint32 seed = 5;
}

// What will actually execute, resolved.
//
// NOT `EvaluationScorerJudgeProviderExecutionV1`, which carries the typed
// `ProviderModelRefV1` the caller SENT. This is the provider execution the run
// will use, as resolved at attempt time.
//
// A TEXT_THEN_SYSTEM_ONE judge (#1005) shows its text judge in fields 1-6 and
// the system-one step it also calls in `system_one` (#1106).
message EvaluationScorerJudgeResolvedExecutionV1 {
  ProviderNameV1 provider = 1;
  // The resolved catalog model id, as the executor reads it.
  string model_id = 2;
  // BY REFERENCE. Key material never appears on this surface. Unverified at
  // authoring time, and still unverified here.
  string credential_ref = 3;
  optional string provider_endpoint_ref = 4;
  // ONE BIT, and not `ProviderReasoningEffortV1`. The five-arm enum the create
  // accepts is rendered to `reasoning_enabled` or `disabled` at authoring time
  // and the executor has only ever compared that one string. Publishing five
  // steps here would invent four states no row ever held.
  bool reasoning_enabled = 5;
  optional EvaluationScorerJudgeEffectiveSettingsV1 effective_request_settings = 6;
  // #1106. The mode the judge names. TEXT for a judge authored before #1106,
  // which names none; UNSPECIFIED only for a mode this build does not run.
  JudgeModeV1 judge_mode = 7;
  // #1106. Present exactly when `judge_mode` is TEXT_THEN_SYSTEM_ONE.
  optional EvaluationScorerJudgeResolvedStepV1 system_one = 8;
}

// #1106. A chain's system-one step as it will execute, resolved as the
// executor resolves it.
message EvaluationScorerJudgeResolvedStepV1 {
  ProviderNameV1 provider = 1;
  string model_id = 2;
  // BY REFERENCE, as on the judge.
  string credential_ref = 3;
  optional string provider_endpoint_ref = 4;
}

// A judge's authored content, WHOLE.
//
// The authored `instructions`, `verdict_mappings` and `subject_path`.
//
// Note what an EMPTY `verdict_mappings` means on THIS message: none were
// authored. On `EvaluationScorerConfigV1.judge` the same emptiness means "not
// echoed", which is why that message is not reused. A configured mapping wins
// outright, so a mapping table beside a rubric that never names the labels is a
// run where every cell errors at full cost.
message EvaluationScorerJudgeDetailV1 {
  EvaluationScorerJudgeRubricV1 rubric_content = 1;
  // Absent only on an older judge authored before this block was recorded; every
  // judge authored on this surface carries it.
  optional EvaluationScorerJudgeResolvedExecutionV1 provider_execution = 2;
  // Absent on a HISTORIC version. The threshold lives on `score_configs` and the
  // revision path updates it in place, so only the current version's is
  // knowable. See `EvaluationScorerConfigVersionV1`.
  optional double pass_threshold = 3;
  // #1110. What this version's question asks, read from its template's
  // `question`. Absent for a judge that is no judge's question.
  optional EvaluationJudgeQuestionV1 question = 4;
}

// One authored scorer, whole.
//
// Its OWN message rather than a reuse of `EvaluationScorerConfigV1`, for the
// reason `EvaluationScorerSuiteSnapshotV1` is its own message. The
// acknowledgement message is documented to NARROW a judge to `rubric` and
// `pass_threshold`, so a client reading an empty `verdict_mappings` off it has
// learned "not echoed". Reading the same emptiness off a full read must mean
// "none authored". One message cannot carry both meanings without the meaning
// depending on which verb produced it.
message EvaluationScorerConfigDetailV1 {
  string score_config_id = 1;
  string config_key = 2;
  // PER-VERSION. `insert_evaluator_template` writes the authored name onto the
  // evaluator-template row at mint, so a superseded version's name is its own
  // and this field is present at every version.
  string name = 3;
  // ABSENT on a HISTORIC version, and so are `metric_name` and
  // `pass_threshold`. All three live on `score_configs`, which the revision path
  // UPDATES IN PLACE, so the values a superseded version was authored with are
  // stored nowhere. An empty string here would be indistinguishable from a
  // scorer that was authored without one.
  optional string description = 4;
  optional string metric_name = 5;
  optional string success_dimension = 6;
  EvaluationScorerKindV1 kind = 7;
  optional string version_discriminator = 8;
  optional double weight = 9;
  bool is_blocking_gate = 10;
  bool is_archived = 11;
  optional google.protobuf.Timestamp archived_at = 12;
  // Present exactly when `kind` is DETERMINISTIC.
  optional EvaluationScorerDeterministicSpecV1 deterministic = 13;
  // Present exactly when `kind` is HUMAN. Recorded and read back; per-scorer
  // ENFORCEMENT is still run-scoped in this build, and reading it back does not
  // change that.
  optional EvaluationScorerReviewPolicySpecV1 review_policy = 14;
  // Present exactly when `kind` is LLM_JUDGE.
  optional EvaluationScorerJudgeDetailV1 judge = 15;
  // Absent on a HISTORIC version, present on the current one. See field 8 of
  // `EvaluationScorerConfigVersionV1` for why.
  optional double pass_threshold = 16;
  bool authored_on_this_surface = 17;
  uint32 version_count = 18;
  MetricAvailabilityV1 version_count_availability = 19;
  // The evaluator template this version reads. The id `EvaluationScorerJudgeTemplateRefV1`
  // would name if another scorer copied from it.
  string evaluator_template_id = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  optional PrincipalRefV1 created_by = 23;
  // THE CONFLICT IDENTITY, and the same one the edit path guards on.
  //
  // `CreateEvaluationScorerConfig` on this `config_key` refuses `PINNED_BY_RUN`
  // when this count is non-zero. Publishing it here lets a revise form predict
  // the refusal instead of meeting it. `pinned_run_count` is the true count;
  // `pinned_run_id` is bounded by the same `max_named_pinned_runs` the authoring
  // cell publishes and may be shorter.
  uint32 pinned_run_count = 24;
  repeated string pinned_run_id = 25;
  // (#611) Present on the CURRENT version of a CODE scorer: only the current
  // one can run. A historic version's source reads through
  // GetEvaluationScorerSourceSnapshot, and its digest through the version list.
  optional EvaluationScorerCodeConfigV1 code = 26;
  // #1106. The mode THIS version's template names, as
  // `judge.provider_execution.judge_mode` does. UNSPECIFIED when that template
  // is no judge; a judge authored outside `CreateEvaluationScorerConfig` reads
  // TEXT here while its `kind` and its summary's `judge_mode` are UNSPECIFIED.
  JudgeModeV1 judge_mode = 27;
  // #1110. Which question of which judge THIS version's template asks, as
  // `judge_mode` is read. Absent when that template is no judge's question.
  optional EvaluationJudgeQuestionRefV1 judge_question = 28;
}

// Who depends on this scorer.
//
// TWO halves are derived and TWO are not, and the two that are not say so by
// name rather than returning an empty list: missing is not zero, and "nothing
// uses this scorer" is the one wrong answer that gets a scorer deleted.
message EvaluationScorerConfigUsageV1 {
  // DERIVED.
  repeated EvaluationScorerSuiteRefV1 suite = 1;
  uint32 suite_count = 2;
  MetricAvailabilityV1 suite_availability = 3;

  // DERIVED. The true count, with the ids bounded exactly as the pin refusal
  // bounds them.
  uint32 pinned_run_count = 4;
  repeated string pinned_run_id = 5;
  MetricAvailabilityV1 pinned_run_availability = 6;

  // NOT DERIVABLE: `NOT_SUPPORTED` / `definition_scorecard_not_projected`. The
  // count beside it is 0 and the availability is what says why.
  uint32 definition_count = 7;
  MetricAvailabilityV1 definition_availability = 8;

  // NOT DERIVABLE: `NOT_SUPPORTED` /
  // `production_rule_scorer_reference_not_indexed`. Production rules do NOT need
  // this read to stay correct: a dependent rule version is disabled with
  // `dependency_archived` on its own.
  uint32 production_rule_count = 9;
  MetricAvailabilityV1 production_rule_availability = 10;
}

message EvaluationScorerSuiteRefV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  bool is_archived = 3;
  // The posture THIS suite gives the scorer, which is per-suite and not read off
  // the configuration.
  bool is_blocking_gate = 4;
  optional double weight = 5;
}

message GetEvaluationScorerConfigRequest {
  // Exactly one. A key is what an author remembers; an id is what a list row
  // carries.
  oneof identity {
    string score_config_id = 1;
    string config_key = 2;
  }
  // Absent reads the CURRENT version. Present reads that version's evaluator
  // template row, which no writer on this surface ever rewrites: a revision
  // mints a fresh template rather than mutating the old one, precisely so a
  // pinned run's snapshot keeps quoting what it measured.
  optional string version_discriminator = 3;
}

message GetEvaluationScorerConfigResponse {
  EvaluationScorerConfigDetailV1 scorer_config = 1;
  // Absent when a historic version was addressed: the usage halves answer "what
  // depends on this scorer", which is a fact about the configuration and not
  // about one of its versions.
  optional EvaluationScorerConfigUsageV1 usage = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

// One version of a scorer.
//
// Each authorship and each revision makes a new version, UNIQUE per tenant; a
// revision never mutates an older version.
message EvaluationScorerConfigVersionV1 {
  string evaluator_template_id = 1;
  string version_discriminator = 2;
  // PER-VERSION, because `insert_evaluator_template` writes the authored name
  // onto the template row at mint.
  string name = 3;
  string evaluator_kind = 4;
  string execution_mode = 5;
  bool is_current = 6;
  // The authored rubric's size, not the rubric. A version list is a list, and a
  // byte count answers "did the rubric change between v2 and v3" without moving
  // 8 KiB per row. Zero on a non-judge version.
  uint32 rubric_bytes = 7;
  uint32 verdict_mapping_count = 8;
  google.protobuf.Timestamp created_at = 9;
  optional PrincipalRefV1 created_by = 10;
  // (#611) A code version's bundle digest, where its source was kept, so two
  // versions with the same digest need no comparing.
  optional bytes code_bundle_sha256 = 11;
  // NOTE — `pass_threshold`, `metric_name` and `description` are deliberately
  // ABSENT from this message at every version. All three live on
  // `score_configs`, which the revision path UPDATES IN PLACE, so the values a
  // superseded version was authored with are not stored anywhere. The threshold
  // a RUN measured against is in that run's frozen manifest. Publishing the
  // current row's value beside a historic version would be the one lie a
  // version history must not tell.
}

message ListEvaluationScorerConfigVersionsRequest {
  oneof identity {
    string score_config_id = 1;
    string config_key = 2;
  }
  o11y_one.common.v1.PageRequestV1 page = 3;
}

message ListEvaluationScorerConfigVersionsResponse {
  // Newest first.
  repeated EvaluationScorerConfigVersionV1 versions = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  // `NOT_SUPPORTED` / `scorer_version_discriminator_unparsed` when the current
  // discriminator does not read as `v{n}` — the shape a not-v2-authored scorer
  // has. The list then carries the current version alone rather than guessing a
  // range.
  MetricAvailabilityV1 history_availability = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
  optional EvaluationCursorResyncV1 resync = 6;
}

message EvaluationScorerSuiteSummaryV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string name = 3;
  string version_discriminator = 4;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 5;
  uint32 member_count = 6;
  uint32 blocking_gate_count = 7;
  // How many members are themselves archived. A suite whose gate is retired
  // still launches — and then blocks on `scorer_archived`, one dependency at a
  // time. This count is what lets a list say so before that happens.
  uint32 archived_member_count = 8;
  bool is_archived = 9;
  optional google.protobuf.Timestamp archived_at = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional PrincipalRefV1 created_by = 13;
}

// A suite member WITH its own posture.
//
// A new message beside `EvaluationScorerSuiteMemberV1` and not a widening of it:
// that one is embedded in `EvaluationScorerSuiteSnapshotV1`, which "must never
// gain a field that moves", and `is_archived` is exactly a field that moves.
message EvaluationScorerSuiteMemberDetailV1 {
  string score_config_id = 1;
  string config_key = 2;
  string name = 3;
  // `UNSPECIFIED` means a member authored outside this surface, which is
  // admissible and freezable.
  EvaluationScorerKindV1 kind = 4;
  optional string version_discriminator = 5;
  // The weight and gate posture THIS suite gives it. Absent weight is 1.0 at
  // combine time; ignored entirely for a blocking gate, which is adjudicated
  // rather than averaged.
  optional double weight = 6;
  bool is_blocking_gate = 7;
  // The MEMBER's own posture, not the suite's. A launch that resolves this suite
  // will raise `MISSING_DEPENDENCY` / `scorer_archived` for it.
  bool is_archived = 8;
  bool authored_on_this_surface = 9;
}

message EvaluationScorerSuiteDetailV1 {
  string scorer_suite_id = 1;
  string suite_key = 2;
  string name = 3;
  string version_discriminator = 4;
  EvaluationScorerSuiteCombineRuleV1 combine_rule = 5;
  // In AUTHOR order, which is the order the suite was written in and not the
  // order a uuid sorts.
  repeated EvaluationScorerSuiteMemberDetailV1 members = 6;
  bool is_archived = 7;
  optional google.protobuf.Timestamp archived_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional PrincipalRefV1 created_by = 11;
  // `NOT_SUPPORTED` / `suite_revisions_are_not_retained`, always, in this build.
  //
  // Unlike a scorer configuration, whose every version is kept, a suite re-author
  // UPDATES the suite in place and REPLACES the membership. `version_discriminator`
  // is therefore a monotone counter with no history behind it, and "show me v2 of
  // this suite" has no answer.
  MetricAvailabilityV1 revision_history_availability = 12;
}

message ListEvaluationScorerSuitesRequest {
  o11y_one.common.v1.PageRequestV1 page = 1;
  optional EvaluationScorerArchivedFilterV1 archived_filter = 2;
}

message ListEvaluationScorerSuitesResponse {
  repeated EvaluationScorerSuiteSummaryV1 scorer_suites = 1;
  o11y_one.common.v1.PageResponseV1 page = 2;
  EvaluationFreshnessV1 freshness = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
  optional EvaluationCursorResyncV1 resync = 5;
}

message GetEvaluationScorerSuiteRequest {
  oneof identity {
    string scorer_suite_id = 1;
    string suite_key = 2;
  }
}

message GetEvaluationScorerSuiteResponse {
  EvaluationScorerSuiteDetailV1 scorer_suite = 1;
  EvaluationFreshnessV1 freshness = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message ArchiveEvaluationScorerConfigRequest {
  oneof identity {
    string score_config_id = 1;
    string config_key = 2;
  }
}

message ArchiveEvaluationScorerConfigResponse {
  EvaluationScorerConfigSummaryV1 scorer_config = 1;
  // TRUE when this call did not move it: it was already archived. NOT an error.
  // An append-only state flip is replayable by construction, which is also why
  // this request carries no idempotency key.
  bool already_archived = 2;
  // What still references it, at the moment of archiving.
  //
  // Archiving is UNCONDITIONAL on this plane (see the RPC's own comment), so
  // this is not a refusal's evidence — it is the blast radius, returned at the
  // one moment it can still change a decision. The two `NOT_SUPPORTED` halves
  // are honest here for the same reason they are on the detail read: an empty
  // definition list would read as "no evaluation uses this", which is precisely
  // the wrong thing to believe while archiving.
  EvaluationScorerConfigUsageV1 standing_references = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message ArchiveEvaluationScorerSuiteRequest {
  oneof identity {
    string scorer_suite_id = 1;
    string suite_key = 2;
  }
}

message ArchiveEvaluationScorerSuiteResponse {
  EvaluationScorerSuiteSummaryV1 scorer_suite = 1;
  bool already_archived = 2;
  // How many production rules target this suite: `NOT_SUPPORTED` /
  // `production_rule_suite_reference_resolves_on_the_legacy_plane`, always.
  //
  // This build cannot report which production rules depend on a suite, and an
  // empty list would read as "no rule depends on this" rather than "this build
  // cannot tell".
  uint32 production_rule_count = 3;
  MetricAvailabilityV1 production_rule_availability = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}
// ---- end of the scorer library ----

// ===========================================================================
// Dataset collections and changesets
// ===========================================================================

// (#726) What a dataset collection holds.
enum DatasetContentKindV1 {
  // Never a filter: a request naming it is refused.
  DATASET_CONTENT_KIND_V1_UNSPECIFIED = 0;
  // Evaluation cases.
  DATASET_CONTENT_KIND_V1_CASES = 1;
  // Loop rollouts' trajectories, kept for training.
  DATASET_CONTENT_KIND_V1_TRAJECTORIES = 2;
}

// One row of `ListDatasetCollections`.
//
// A summary, not a detail: it carries what a nav list renders and what a client
// needs to decide which collection to open. A collection's quality is per
// VERSION and lives on `GetDatasetOverview`.
message DatasetCollectionSummaryV1 {
  string dataset_collection_id = 1;
  string name = 2;
  optional string description = 3;
  bool is_archived = 4;
  google.protobuf.Timestamp created_at = 5;
  // `COALESCE(updated_at, created_at)`, which is also the sort key. A
  // collection that has never been updated sorts by when it was made rather
  // than falling to the bottom of every page forever.
  google.protobuf.Timestamp updated_at = 6;

  // The newest version, which is what the Overview calls "active". Absent when
  // the collection has none.
  DatasetVersionSummaryV1 active_version = 7;
  // `NOT_OBSERVED / dataset_collection_has_no_version` when there is no
  // version. Never `_ERROR`, and never an absent block.
  MetricAvailabilityV1 active_version_availability = 8;

  // How many versions this collection holds. Always known; a collection with
  // none has zero.
  uint32 version_count = 9;

  // There is deliberately NO `case_count` here, and the absence is the
  // contract rather than an oversight.
  //
  // `DatasetVersionSummaryV1` publishes TWO counts, `case_count` and
  // `member_count`, and they can DIVERGE for older versions. A single number here
  // would have to pick one. Both stay on `active_version`, and this row says only
  // whether there IS an active version to read them from.
  //
  // `active_version_availability` above: a collection with no version reports
  // `NOT_OBSERVED / dataset_collection_has_no_version`.

  // Changesets on this collection that are not in a terminal state — the "N
  // waiting for review" a nav row wants. Always known, same argument as
  // `version_count`.
  uint32 open_changeset_count = 10;

  // (#726) What it holds. A client from before this field sees only cases.
  DatasetContentKindV1 content_kind = 11;
}

// Org-scoped, keyset-paged, filtered.
message ListEvaluationDatasetCollectionsRequest {
  // The opaque cursor from the previous page's `next_page_token`. It binds the
  // organisation AND the filter it was minted under, so a token replayed against
  // a different filter is refused with a typed resync rather than silently paging
  // a different query.
  optional string page_token = 1;
  optional uint32 limit = 2;
  // Archived collections are excluded unless this is set. Live-only is the
  // default because "the datasets I work with" is what a nav item means.
  bool include_archived = 3;
  // Case-insensitive substring match on the name. `%` and `_` are matched
  // LITERALLY — a customer whose collection is named `100%` searches for it by
  // typing it.
  optional string name_filter = 4;
  // (#726) The kinds listed and counted. Empty means cases alone, as before
  // this field. UNSPECIFIED is refused, never a wildcard.
  repeated DatasetContentKindV1 content_kinds = 5;
}

message ListEvaluationDatasetCollectionsResponse {
  repeated DatasetCollectionSummaryV1 collections = 1;
  // Exact. The page is bounded and the count is a set-based aggregate under the
  // same predicate as the page, so there is no approximation to label.
  uint32 total_count = 2;
  // Emitted only when the page was FULL. A short page is the last page, and
  // handing a client a cursor for it costs them a round trip to learn what the
  // page already told them.
  optional string next_page_token = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
  // Present exactly when the request's `page_token` could not be honoured. The
  // page is empty in that case — never a first page wearing a resync, which
  // would leave a client unable to tell a restart from a continuation.
  optional EvaluationCursorResyncV1 resync = 6;
}

// One changeset by id.
message GetDatasetChangesetRequest {
  string changeset_id = 1;
}

message GetDatasetChangesetResponse {
  DatasetChangesetV1 changeset = 1;
  // The collection's ACTIVE version right now, which is what the changeset's
  // pinned base is compared against.
  optional string active_dataset_version_id = 2;
  // The base-version drift, decided by the server, so a client never recomputes
  // whether a publish is safe.
  bool base_version_moved = 3;
  // `NOT_OBSERVED / changeset_has_no_base_version` when the changeset pinned no
  // base — a first publish into an empty collection. Never `false`, which would
  // read as "checked, and it has not moved".
  MetricAvailabilityV1 base_version_moved_availability = 4;
  EvaluationFreshnessV1 freshness = 5;
  AgenticEvaluationCapabilitiesV1 capabilities = 6;
}

// The changeset queue.
message ListDatasetChangesetsRequest {
  // Absent lists the whole organisation's changesets.
  optional string dataset_collection_id = 1;
  // Empty means the LIVE set, never "all" — `_COMMITTED`, `_ABANDONED` and
  // `_FAILED` are history, and a queue that opened on its own history would
  // bury the work.
  repeated DatasetChangesetStateV1 states = 2;
  uint32 page_size = 3;
  uint32 offset = 4;
}

message ListDatasetChangesetsResponse {
  repeated DatasetChangesetV1 changesets = 1;
  uint64 total_count = 2;
  optional uint32 next_offset = 3;
  EvaluationFreshnessV1 freshness = 4;
  AgenticEvaluationCapabilitiesV1 capabilities = 5;
}
// ---- end of collections and changesets ----

// ===========================================================================
// Capture (O11Y-366)
// ===========================================================================
//
// Scores, feedback, outcomes and content manifests, the same records OTLP
// ingest writes. Field for field and number for number the v1 `SubmitScore` /
// `SubmitFeedback` / `SubmitOutcome` / `CreateContentManifest` requests, with
// ONE difference: where a v1 request carries a `google.protobuf.Struct`, these
// carry the same document as a JSON `string` on the same field number. This
// surface accepts no `Struct` at all. The stored document is the same either
// way.

message CaptureScoreRequest {
  string metric_name = 1;
  double score_value = 2;
  optional string score_label = 3;
  optional string explanation = 4;
  ScoreSourceV1 source = 5;
  optional string evaluator_name = 6;
  optional string evaluator_version = 7;
  optional string evaluator_kind = 8;
  optional string execution_trace_id = 9;
  CorrelationContextV1 correlation = 10;
  string metadata_json = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message CaptureScoreResponse {
  string score_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message CaptureFeedbackRequest {
  string feedback_key = 1;
  optional double rating_value = 2;
  optional string rating_label = 3;
  optional string comment = 4;
  string correction_payload_json = 5;
  FeedbackSourceTypeV1 source_type = 6;
  optional string reviewer_identity = 7;
  FeedbackApprovalStatusV1 approval_status = 8;
  // A score in the caller's own scope. One in another organisation's is
  // `NOT_FOUND`, indistinguishable from one that does not exist: confirming it
  // exists to somebody who may not read it is itself a disclosure.
  optional string linked_score_id = 9;
  CorrelationContextV1 correlation = 10;
  string metadata_json = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message CaptureFeedbackResponse {
  string feedback_event_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message CaptureOutcomeRequest {
  string outcome_type = 1;
  optional string status = 2;
  optional double numeric_value = 3;
  string payload_json = 4;
  CorrelationContextV1 correlation = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message CaptureOutcomeResponse {
  string outcome_event_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

message CaptureContentManifestRequest {
  string content_class = 1;
  string storage_uri = 2;
  optional string storage_backend = 3;
  optional string checksum_sha256 = 4;
  optional int64 size_bytes = 5;
  optional string encryption_key_ref = 6;
  optional string sensitivity = 7;
  optional string retention_class = 8;
  optional string redaction_status = 9;
  string metadata_json = 10;
  CorrelationContextV1 correlation = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message CaptureContentManifestResponse {
  string content_manifest_id = 1;
  google.protobuf.Timestamp recorded_at = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ===========================================================================
// O11Y-367 — prompt templates
// ===========================================================================
//
// The v1 `prompt_templates` / `prompt_versions` tables, on this surface. A
// template is a named, versioned prompt; a provider candidate pins one by id
// and renders it with the case's own fields.
//
// No `environments` field, unlike `PromptTemplateV1`. The legacy promotion
// vocabulary (draft / prod / candidate / experiment) belongs to a plane this
// one does not have: a v2 candidate pins a VERSION ID, frozen into the run
// manifest at launch, so "which version is live in staging" is a question
// nothing here asks. Adding the enum would be publishing a knob no verb reads.

message EvaluationPromptVersionV1 {
  string prompt_version_id = 1;
  string prompt_template_id = 2;
  uint32 version_number = 3;
  optional string version_label = 4;
  // `<template_key>@v<n>`, minted by the store.
  string version_ref = 5;
  string prompt_text = 6;
  optional string system_prompt = 7;
  bool is_archived = 8;
  google.protobuf.Timestamp created_at = 9;
}

message EvaluationPromptTemplateV1 {
  string prompt_template_id = 1;
  string template_key = 2;
  string name = 3;
  optional string description = 4;
  string labels_json = 5;
  bool is_archived = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // The newest non-archived version. Absent on a template whose every version
  // is archived — which is a real state, and not the same as a new template.
  optional EvaluationPromptVersionV1 latest_version = 9;
  // Every version, archived ones included.
  uint32 version_count = 10;
}

// Creates the template when `template_key` is new in this scope, and ALWAYS
// appends a version. A prompt is never edited in place: a run pins a version
// id, and a version whose text could move would make a pinned run
// unreproducible.
message UpsertEvaluationPromptTemplateRequest {
  string template_key = 1;
  string name = 2;
  optional string description = 3;
  string prompt_text = 4;
  optional string system_prompt = 5;
  string labels_json = 6;
  optional string version_label = 7;
}

message UpsertEvaluationPromptTemplateResponse {
  EvaluationPromptTemplateV1 template = 1;
  EvaluationPromptVersionV1 version = 2;
  // True when the template row was minted by this call.
  bool created = 3;
  AgenticEvaluationCapabilitiesV1 capabilities = 4;
}

message ListEvaluationPromptTemplatesRequest {
  bool include_archived = 1;
  uint32 page_size = 2;
  uint32 offset = 3;
}

message ListEvaluationPromptTemplatesResponse {
  repeated EvaluationPromptTemplateV1 templates = 1;
  optional uint32 next_offset = 2;
  AgenticEvaluationCapabilitiesV1 capabilities = 3;
}

// ===========================================================================
// The Production Attention inbox
// ===========================================================================
//
// Six item kinds. Four have a typed source (the release-block ledger, the
// per-rule-version health projection, the review backlog and the
// instrumentation signal); the other two need a ranking this build does not
// compute, and are reported as `NOT_SUPPORTED` with their own reason codes
// rather than ranked by a substitute.
//
// Every field is read from a record another verb already serves, so the whole
// inbox fits inside `INITIAL_PAGE`: fifty rows.

enum ProductionAttentionItemKindV1 {
  PRODUCTION_ATTENTION_ITEM_KIND_V1_UNSPECIFIED = 0;
  // A release carrying at least one block in `_ACTIVE` or `_INDETERMINATE`.
  // `_INDETERMINATE` counts because it fails closed.
  PRODUCTION_ATTENTION_ITEM_KIND_V1_RELEASE_BLOCKING_REGRESSION = 1;
  // No ranking. Declared so a client can render the absence; never emitted in
  // `items`.
  PRODUCTION_ATTENTION_ITEM_KIND_V1_REPEATED_CUSTOMER_IMPACTING_FAILURE = 2;
  // An active rule version whose window saw eligible work and matched none of
  // it.
  PRODUCTION_ATTENTION_ITEM_KIND_V1_RULE_ZERO_COVERAGE = 3;
  PRODUCTION_ATTENTION_ITEM_KIND_V1_RULE_LAG = 4;
  PRODUCTION_ATTENTION_ITEM_KIND_V1_RULE_DEAD_LETTER = 5;
  PRODUCTION_ATTENTION_ITEM_KIND_V1_REVIEW_BACKLOG = 6;
  // Completeness only: cells that RAN against cells that reported economics,
  // both counted on the run projection. There is no blocking-gap flag on that
  // row and this surface does not invent one — see the posture limit
  // `instrumentation_gap_blocking_flag`.
  PRODUCTION_ATTENTION_ITEM_KIND_V1_INSTRUMENTATION_GAP = 7;
  // No baseline projection. Declared, never emitted — see the enum comment on
  // `_REPEATED_CUSTOMER_IMPACTING_FAILURE`.
  PRODUCTION_ATTENTION_ITEM_KIND_V1_COST_LATENCY_SHIFT = 8;
}

// Three bands, ordered by the number: the server ranks on this field ascending,
// so a client that sorts by the enum reproduces the server's order rather than
// inventing a second one.
enum ProductionAttentionSeverityV1 {
  PRODUCTION_ATTENTION_SEVERITY_V1_UNSPECIFIED = 0;
  // Something cannot ship until a human acts.
  PRODUCTION_ATTENTION_SEVERITY_V1_BLOCKING = 1;
  // Running, but not producing the evidence it was configured to produce.
  PRODUCTION_ATTENTION_SEVERITY_V1_DEGRADED = 2;
  // Work is queued for a human, or evidence is incomplete. Nothing is broken
  // and nothing is known to have changed a decision.
  PRODUCTION_ATTENTION_SEVERITY_V1_WATCH = 3;
}

// The ONE action a caller may take that cannot make the situation worse. Typed
// rather than a URL: a deep link is a rendering decision and this is a policy
  // one.
enum ProductionAttentionNextActionV1 {
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_UNSPECIFIED = 0;
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_INVESTIGATE_RELEASE_BLOCK = 1;
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_RESUME_OR_FIX_RULE = 2;
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_INSPECT_DEAD_LETTERS = 3;
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_CLAIM_REVIEW_TASKS = 4;
  PRODUCTION_ATTENTION_NEXT_ACTION_V1_FIX_INSTRUMENTATION = 5;
}

message ProductionAttentionItemV1 {
  // `<kind>:<subject id>`, server-composed and stable across pages, so a client
  // paging the inbox can dedupe without joining internal ids.
  string item_id = 1;
  ProductionAttentionItemKindV1 kind = 2;
  ProductionAttentionSeverityV1 severity = 3;
  // One sentence, composed by the server FROM THE COUNTS ON THE SOURCE ROW.
  // There is no stored free-text field behind it, and there deliberately is
  // not: an inbox whose explanation came from storage would render whatever
  // some earlier write put there.
  string why_it_matters = 4;
  oneof subject {
    string release_id = 5;
    string production_rule_version_id = 6;
    string evaluation_run_id = 7;
  }
  // The SOURCE PROJECTION's own freshness instant, not the time this response
  // was composed. Evidence age is the thing the operator is triaging on.
  google.protobuf.Timestamp evidence_observed_at = 8;
  // Present exactly when the source row carries a principal — the rule's
  // `created_by`, the release's creating actor, the run's launching actor.
  // Never inferred and never defaulted to the caller.
  optional PrincipalRefV1 owner = 9;
  ProductionAttentionNextActionV1 next_safe_action = 10;
}

// Per-kind availability, so "this kind produced no items" and "this build
// cannot answer this kind" are different answers. Keyed by kind rather than
// reusing a bare `MetricAvailabilityV1` because the absence is per ROW CLASS
// here, not per metric.
message ProductionAttentionKindAvailabilityV1 {
  ProductionAttentionItemKindV1 kind = 1;
  MetricAvailabilityV1 availability = 2;
}

message ListProductionAttentionItemsRequest {
  // 0 means the published default. The ceiling equals the default: a client that
  // asks for more is clamped and `effective_page_size` says so.
  uint32 page_size = 1;
  string page_token = 2;
  // Empty means every kind. Naming a kind with no source is not an error — the
  // response carries its availability row and an empty page.
  repeated ProductionAttentionItemKindV1 kinds = 3;
}

message ListProductionAttentionItemsResponse {
  repeated ProductionAttentionItemV1 items = 1;
  optional string next_page_token = 2;
  // One row per named kind, on EVERY response including an empty one. A client
  // learns which kinds this build can answer without a second call.
  repeated ProductionAttentionKindAvailabilityV1 kind_availability = 3;
  bool has_more = 4;
  uint32 effective_page_size = 5;
  EvaluationFreshnessV1 freshness = 6;
}
