  optional string customer_id = 7;
  optional string feature_id = 8;
  optional string deployment_id = 9;
  optional string prompt_version = 10;
  optional string model_version = 11;
  optional string tool_version = 12;
  optional string release_id = 13;
  optional string source_turn_id = 14;
}

