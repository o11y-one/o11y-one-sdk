// What KIND of thing a provider is,
// published beside every provider cell's availability.
//
// Three of this build's facts are properties of a LAB and are NOT properties of
// a ROUTER: the token-accounting sign (a router's cache inclusivity is whatever
// the upstream it chose reports), the price (a router's price is its
// own, plus its fee, not the lab's), and the observability attribution (apps
// point the OpenAI SDK at the router, so the emitted provider name is the
// lab's). A client that cannot tell the two kinds apart cannot know which of
// its numbers carry those caveats.
//
// UNSPECIFIED is a real answer: it means this build did not declare a kind,
// which is what an older build's response decodes to. It never means LAB.
enum ProviderKindV1 {
  PROVIDER_KIND_V1_UNSPECIFIED = 0;
  // Serves its own models from its own inference.
  PROVIDER_KIND_V1_LAB = 1;
  // Chooses an upstream per call. The upstream is part of the unit of
  // measurement and is not pinned by the model id alone.
  PROVIDER_KIND_V1_ROUTER = 2;
}

// The six providers under study. Extended additively: no existing value moves.
// Every exhaustive match over this enum is a compile-time obligation on purpose
// -- a provider that arrives without its accounting convention, its credential
// mapping or its adapter must not compile, because each of those silently
// defaulted is a wrong number rather than a missing one.
//
// The four added by E1-1 are DEGRADED, not AVAILABLE: their adapters are E1-4.
enum ProviderNameV1 {
  PROVIDER_NAME_V1_UNSPECIFIED = 0;
  PROVIDER_NAME_V1_OPENAI = 1;
  PROVIDER_NAME_V1_ANTHROPIC = 2;
  PROVIDER_NAME_V1_GOOGLE = 3;
  PROVIDER_NAME_V1_XAI = 4;
  // Moonshot AI hosts the Kimi model family. This enum names providers, so the
  // host is the value and the family appears in MoonshotTextModelV1.
  PROVIDER_NAME_V1_MOONSHOT = 5;
  PROVIDER_NAME_V1_DEEPSEEK = 6;
  // A ROUTER, not a lab. It is in this enum because it is addressed the same
  // way, by a credential and a model id. What makes it different travels as a
  // fact instead: ProviderKindV1.
  PROVIDER_NAME_V1_OPENROUTER = 7;
  // O11Y-538: a lab that speaks the OpenAI Responses wire at its own host.
  PROVIDER_NAME_V1_META = 8;
  // #1003: decision-only labs. Their models answer typed questions with
  // probabilities and generate no text, so neither can be a candidate or a
  // text judge.
  PROVIDER_NAME_V1_TYPESAFE = 9;
  // Workers AI is per account, so a Cloudflare model is called through an
  // account-scoped provider_endpoint_ref and has no default host.
  PROVIDER_NAME_V1_CLOUDFLARE = 10;
}

