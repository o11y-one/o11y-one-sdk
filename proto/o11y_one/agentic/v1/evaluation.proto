message ProviderPromptCandidateV1 {
  ProviderModelRefV1 model = 1;
  // A template in this scope (`O11Y-367`). Absent means the prompt is built
  // from the case through `request_mapping`, which is what every candidate did
  // before this verb existed.
  //
  // When BOTH a template and a `prompt` request mapping are present the
  // TEMPLATE wins and the mapping feeds variables: the mapped target names
  // become `{{names}}` the template may interpolate. A template that
  // interpolates none of them still renders, and the mapping is then simply
  // unused rather than an error.
  optional string prompt_template_id = 2;
  // A specific version of that template. Absent means the newest non-archived
  // one AT THE MOMENT THE CANDIDATE IS RESOLVED. A launched run freezes the
  // resolved text into its manifest either way.
  optional string prompt_version_id = 3;
  optional ProviderRequestSettingsV1 request_settings = 4;
  // Base URL of the provider gateway this candidate is proxied through. Absent
  // means the provider's own public base. Same name and same semantics as
  // ProviderExecutionConfigV1.provider_endpoint_ref, because it is the same
  // knob: a tenant fronting a provider behind their own gateway, and the
  // suite's mock provider, are the identical case and must not need two
  // vocabularies.
  optional string provider_endpoint_ref = 5;
