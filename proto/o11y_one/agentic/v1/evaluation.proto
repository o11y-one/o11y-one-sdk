// One enum per provider rather than one model-ref string list: every model
// the builder offers is one the rate registry can price.
message ProviderModelRefV1 {
  oneof model {
    OpenAiTextModelV1 openai = 1;
    AnthropicTextModelV1 anthropic = 2;
    GoogleTextModelV1 google = 3;
    XaiTextModelV1 xai = 4;
    MoonshotTextModelV1 moonshot = 5;
    DeepSeekTextModelV1 deepseek = 6;
    OpenRouterTextModelV1 openrouter = 7;
    MetaTextModelV1 meta = 8;
    TypeSafeDecisionModelV1 typesafe = 9;
    CloudflareDecisionModelV1 cloudflare = 10;
  }
}

message ProviderRequestSettingsV1 {
  optional uint32 max_output_tokens = 1;
  optional double fixed_cost_usd = 2;
  optional double input_token_rate_usd = 3;
  optional double output_token_rate_usd = 4;
  optional double budget_limit_usd = 5;
  optional string anthropic_version = 6;
  // Legacy string form. Prefer reasoning_effort_mode for new clients.
  optional string reasoning_effort = 7;
  optional uint32 reasoning_budget_tokens = 8;
  optional double temperature = 9;
  optional double top_p = 10;
  optional double frequency_penalty = 11;
  optional double presence_penalty = 12;
  repeated string stop_sequences = 13;
  optional ProviderToolChoiceV1 tool_choice = 14;
  optional ProviderReasoningEffortV1 reasoning_effort_mode = 15;
  optional ProviderVerbosityV1 verbosity = 16;
  optional uint32 max_tool_calls = 17;
  optional bool parallel_tool_calls = 18;
  optional ProviderTruncationV1 truncation = 19;
  optional string prompt_cache_key = 20;
  optional ProviderPromptCacheRetentionV1 prompt_cache_retention = 21;
  optional string safety_identifier = 22;
  optional ProviderServiceTierV1 service_tier = 23;
  optional uint32 top_logprobs = 24;
  optional uint32 top_k = 25;
  optional string anthropic_metadata_user_id = 26;
  map<string, string> provider_metadata = 27;
  optional string tool_choice_name = 28;
  // O11Y-592. Sent only by the adapters that take one (Gemini, xAI,
  // OpenRouter), and best effort even there; absent means none was asked for.
  // Values above 2^31-1 are refused, because Gemini's seed is an int32.
  optional uint32 seed = 29;
}

// ===========================================================================
// Shared value objects and enums
// ===========================================================================

message StringListV1 {
  repeated string values = 1;
}

message Int64ListV1 {
  repeated int64 values = 1;
}

message DoubleListV1 {
  repeated double values = 1;
}

// Bounded typed metadata. A value can never contain an entry: nesting is the
// exact affordance that turns typed metadata back into an arbitrary document.
message MetadataValueV1 {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    google.protobuf.Timestamp timestamp_value = 5;
    StringListV1 string_list = 6;
    Int64ListV1 int_list = 7;
    DoubleListV1 double_list = 8;
  }
}

message MetadataEntryV1 {
  string key = 1;
  MetadataValueV1 value = 2;
}

enum PrincipalKindV1 {
  PRINCIPAL_KIND_V1_UNSPECIFIED = 0;
  PRINCIPAL_KIND_V1_USER = 1;
  PRINCIPAL_KIND_V1_MACHINE = 2;
  PRINCIPAL_KIND_V1_SYSTEM = 3;
}

// Replaces `optional string created_by_user_id` on the v2 surface: that field
// cannot represent a machine caller, and CI is a first-class caller here.
message PrincipalRefV1 {
  PrincipalKindV1 kind = 1;
  string principal_id = 2;
  optional string display_name = 3;
  optional string credential_id = 4;
  optional string on_behalf_of_user_id = 5;
}

enum CompletenessStateV1 {
  COMPLETENESS_STATE_V1_UNSPECIFIED = 0;
  COMPLETENESS_STATE_V1_COMPLETE = 1;
  COMPLETENESS_STATE_V1_INCOMPLETE = 2;
  COMPLETENESS_STATE_V1_STALE = 3;
  COMPLETENESS_STATE_V1_UNAVAILABLE = 4;
}

// Carried by every changing or analytical response, and repeated per section
// on multi-section responses, because the UI must report differing per-section
// freshness rather than implying one coherent instant.
message EvaluationFreshnessV1 {
  uint64 projection_version = 1;
  // Absent when the response performed no fact-plane read. An empty string
  // would be indistinguishable from "read the fact plane and got nothing",
  // which is the shape of every instrumentation lie this surface exists to
  // prevent.
  optional string facts_watermark = 2;
  optional google.protobuf.Timestamp complete_through = 3;
  google.protobuf.Timestamp updated_at = 4;
  CompletenessStateV1 completeness = 5;
  optional string stale_reason_code = 6;
}

// The one availability enum for the whole v2 surface. Missing is not zero.
enum MetricAvailabilityStateV1 {
  METRIC_AVAILABILITY_STATE_V1_UNSPECIFIED = 0;
  METRIC_AVAILABILITY_STATE_V1_AVAILABLE = 1;
  METRIC_AVAILABILITY_STATE_V1_NOT_SUPPORTED = 2;
  METRIC_AVAILABILITY_STATE_V1_NOT_OBSERVED = 3;
  METRIC_AVAILABILITY_STATE_V1_REDACTED = 4;
  METRIC_AVAILABILITY_STATE_V1_SAMPLED_OUT = 5;
  METRIC_AVAILABILITY_STATE_V1_NOT_SAMPLED = 6;
  METRIC_AVAILABILITY_STATE_V1_PENDING = 7;
  METRIC_AVAILABILITY_STATE_V1_ERROR = 8;
}

message MetricAvailabilityV1 {
  MetricAvailabilityStateV1 state = 1;
  optional string reason_code = 2;
  // Which semantic convention produced (or failed to produce) the value. A
  // metric read through a vendor alias and one read through the standard key
  // are not the same evidence, and a comparison across the two has to be able
  // to say so.
  optional SemanticConventionProvenanceV1 provenance = 3;
}

// Where a metric's key came from. Present on availability rather than on the
// metric so that an ABSENCE can also be attributed: "the convention has no key
// for this" and "the key exists and was empty" are different answers.
message SemanticConventionProvenanceV1 {
  string convention_source = 1;
  optional string convention_version = 2;
  // The vendor-prefixed key an aliased read actually used.
  optional string alias_key = 3;
}

enum EvaluationActionKindV1 {
  EVALUATION_ACTION_KIND_V1_UNSPECIFIED = 0;
  EVALUATION_ACTION_KIND_V1_VIEW = 1;
  EVALUATION_ACTION_KIND_V1_EDIT = 2;
  EVALUATION_ACTION_KIND_V1_DUPLICATE = 3;
  EVALUATION_ACTION_KIND_V1_ARCHIVE = 4;
  EVALUATION_ACTION_KIND_V1_UNARCHIVE = 5;
  EVALUATION_ACTION_KIND_V1_LAUNCH_RUN = 6;
  EVALUATION_ACTION_KIND_V1_CANCEL_RUN = 7;
  // An action vocabulary, not a run-identity state: the candidate oneof, the
  // execution states and the manifest semantics are frozen, and this value
  // touches none of them. A client that has never seen it renders an
  // unknown action rather than mis-rendering a known one.
  EVALUATION_ACTION_KIND_V1_RETRY_CELLS = 8;
  // A SEPARATE value from RETRY_CELLS: re-running a candidate and re-grading its
  // recorded output are different actions with different bills, and one action
  // kind meaning both would put the expensive one behind the cheap one's
  // affordance.
  EVALUATION_ACTION_KIND_V1_RETRY_SCORERS = 9;
}

enum ActionBlockedReasonV1 {
  ACTION_BLOCKED_REASON_V1_UNSPECIFIED = 0;
  ACTION_BLOCKED_REASON_V1_PERMISSION_DENIED = 1;
  ACTION_BLOCKED_REASON_V1_INVALID_LIFECYCLE_STATE = 2;
  ACTION_BLOCKED_REASON_V1_CAPABILITY_UNAVAILABLE = 3;
  ACTION_BLOCKED_REASON_V1_DEPENDENCY_ARCHIVED = 4;
  ACTION_BLOCKED_REASON_V1_EVIDENCE_INCOMPLETE = 5;
}

// The client never infers permission, lifecycle validity, or capability; the
// server states each action and, when blocked, why in typed form.
message AllowedActionV1 {
  EvaluationActionKindV1 kind = 1;
  bool allowed = 2;
  optional ActionBlockedReasonV1 blocked_reason = 3;
  optional string blocked_detail = 4;
}

enum CapabilityStateV1 {
  CAPABILITY_STATE_V1_UNSPECIFIED = 0;
  CAPABILITY_STATE_V1_AVAILABLE = 1;
  CAPABILITY_STATE_V1_UNAVAILABLE = 2;
  CAPABILITY_STATE_V1_DEGRADED = 3;
  CAPABILITY_STATE_V1_NOT_LICENSED = 4;
}

message CapabilityLimitV1 {
  string limit_key = 1;
  int64 limit_value = 2;
}

// Typed posture rather than a bare bool, so "capability not shipped" stays
// distinguishable from "credential invalid".
message CapabilityPostureV1 {
  string capability_key = 1;
  CapabilityStateV1 state = 2;
  repeated CapabilityLimitV1 limits = 3;
  optional string unavailable_reason_code = 4;
}

// From capability set version 51, a copy of this message EMBEDDED in a response
// carries `capability_set_version` and `checked_at` only, with `postures`
// EMPTY. The full set — every posture, every limit — is served by
// `GetAgenticEvaluationCapabilities`, fetched once and cached against the
// version. The embedded copy is the refetch trigger: when its stamped version
// stops matching the cached set, fetch again.
//
// The field stays on every response that carries it, keeps its number and keeps
// this type, so a client cached at 50 still parses everything it already
// understood. What it stops paying is ~15 KB of postures on every list page,
// repeated on a set it could only ever have cached.
message AgenticEvaluationCapabilitiesV1 {
  uint64 capability_set_version = 1;
  repeated CapabilityPostureV1 postures = 2;
  google.protobuf.Timestamp checked_at = 3;
  // (#611) The runtimes a code scorer is authored against, in the full set
  // only, as `postures` are: an embedded copy carries none.
  repeated EvaluationScorerRuntimeV1 scorer_runtimes = 4;
  // #1122. Whether each provider trains on what a call sends it, in the full
  // set only, as `scorer_runtimes` is.
  repeated EvaluationProviderDataUseV1 provider_data_use = 5;
}

// #1122. Whether a provider may train on a call's inputs, as its own terms say.
enum ProviderTrainsOnInputsV1 {
  PROVIDER_TRAINS_ON_INPUTS_V1_UNSPECIFIED = 0;
